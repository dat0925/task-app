<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task ID Check</title>
<style>
body{font-family:monospace;padding:16px;background:#f5f5f5;font-size:13px}
.ok{color:green}.ng{color:red}.warn{color:orange}
table{border-collapse:collapse;width:100%;margin-top:16px}
td,th{border:1px solid #ccc;padding:6px 8px;text-align:left;word-break:break-all}
th{background:#ddd}
</style>
</head>
<body>
<h2>Task ID チェック</h2>
<div id="out">読み込み中...</div>
<script>
const req = indexedDB.open('focus-db', 1);
req.onsuccess = e => {
  const db = e.target.result;
  const tx = db.transaction('tasks', 'readonly');
  const store = tx.objectStore('tasks');
  const all = store.getAll();
  all.onsuccess = () => {
    const tasks = all.result;
    let html = `<p>タスク数: ${tasks.length}</p><table>
    <tr><th>#</th><th>title</th><th>id</th><th>id長さ</th><th>異常文字</th></tr>`;
    tasks.forEach((t,i) => {
      const id = t.id || '';
      const bad = /[^a-zA-Z0-9_\-]/.test(id);
      const inHtml = id.includes('"') || id.includes("'") || id.includes('<') || id.includes('>') || id.includes(' ');
      const cls = inHtml ? 'ng' : bad ? 'warn' : 'ok';
      html += `<tr class="${cls}">
        <td>${i+1}</td>
        <td>${(t.title||'').slice(0,30)}</td>
        <td>${id}</td>
        <td>${id.length}</td>
        <td>${inHtml ? '⚠️HTML破壊文字あり' : bad ? '⚠️特殊文字' : '✓'}</td>
      </tr>`;
    });
    html += '</table>';
    document.getElementById('out').innerHTML = html;
  };
};
req.onerror = () => {
  document.getElementById('out').textContent = 'DBオープン失敗';
};
</script>
</body>
</html>
