function renderForecast(){
  const days=Array.from({length:14},(_,i)=>{const d=new Date(today()+'T00:00:00');d.setDate(d.getDate()+i);return d.toISOString().slice(0,10)});
  let tasks=S.tasks.filter(t=>t.status!=='archived');
  if(!S.showCompleted)tasks=tasks.filter(t=>t.status!=='completed');
  if(S.hideNotStarted){tasks=tasks.filter(x=>!isNotStartedTask(x));}
  if(S.filterTagIds&&S.filterTagIds.length)tasks=tasks.filter(x=>S.filterTagIds.every(id=>x.tagIds&&x.tagIds.includes(id)));
  let h='<div class="fc-grid">';
  days.forEach(day=>{
    const d=new Date(day+'T00:00:00');
    const wd=['日','月','火','水','木','金','土'][d.getDay()];
    const due=tasks.filter(t=>t.dueAt===day);
    const start=tasks.filter(t=>t.startAt===day&&t.dueAt!==day);
    const all=[...due,...start];
    h+='<div class="fc-day'+(day===today()?' today':'')+'">'
      +'<div class="fc-head"><span class="fc-date">'+d.getDate()+'</span><span class="fc-wd">'+wd+'</span>'+(all.length?'<span style="margin-left:auto;font-size:11px;opacity:.6">'+all.length+'</span>':'')+'</div>'
      +'<div class="fc-tasks">'
      +due.slice(0,4).map(t=>'<div class="fc-task" data-a="sel-edit" data-id="'+t.id+'"><span>🗓</span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(t.title)+'</span></div>').join('')
      +start.slice(0,2).map(t=>'<div class="fc-task" data-a="sel-edit" data-id="'+t.id+'"><span style="color:var(--blue)">▶</span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(t.title)+'</span></div>').join('')
      +(all.length===0?'<div style="font-size:11px;color:var(--text3);padding:3px 4px">予定なし</div>':'')
      +'</div></div>';
  });
  return h+'</div>';
}

function renderReview(){
  const sevenAgo=new Date();sevenAgo.setDate(sevenAgo.getDate()-7);
  const stale=S.tasks.filter(t=>t.status!=='completed'&&t.status!=='archived'&&!t.dueAt&&new Date(t.updatedAt)<sevenAgo).slice(0,8);
  const overdue=S.tasks.filter(t=>t.status!=='completed'&&t.status!=='archived'&&isOv(t.dueAt)).slice(0,8);
  const rvProjs=S.projects.filter(p=>p.status==='active'&&(!p.nextReviewAt||p.nextReviewAt<=today())).slice(0,5);
  let h='<div class="rv-wrap">';
  h+='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px"><div><div style="font-size:17px;font-weight:700;margin-bottom:3px">週次レビュー</div><div style="font-size:13px;color:var(--text3)">見落としを確認しましょう</div></div><button class="rv-btn" data-a="rv-done">✓ 完了</button></div>';
  if(overdue.length){
    h+='<div class="rv-card"><div class="rv-card-head"><span class="rv-card-title">期限切れ</span><span class="rv-badge rv-red">'+overdue.length+'件</span></div>';
    overdue.forEach(t=>{h+='<div class="rv-item" data-a="sel-edit" data-id="'+t.id+'" style="cursor:pointer"><span style="color:var(--p1)">!</span><span style="flex:1">'+esc(t.title)+'</span><span class="xs muted">'+fmtDate(t.dueAt)+'</span></div>'});
    h+='</div>';
  }
  if(stale.length){
    h+='<div class="rv-card"><div class="rv-card-head"><span class="rv-card-title">停滞タスク（7日以上）</span><span class="rv-badge rv-yellow">'+stale.length+'件</span></div>';
    stale.forEach(t=>{h+='<div class="rv-item" data-a="sel-edit" data-id="'+t.id+'" style="cursor:pointer"><span>📌</span><span style="flex:1">'+esc(t.title)+'</span></div>'});
    h+='</div>';
  }
  if(rvProjs.length){
    h+='<div class="rv-card"><div class="rv-card-head"><span class="rv-card-title">レビュー必要なプロジェクト</span></div>';
    rvProjs.forEach(p=>{h+='<div class="rv-item"><span class="pdot" style="background:'+esc(p.color)+'"></span><span style="flex:1;cursor:pointer" data-a="goto-proj" data-id="'+p.id+'">'+esc(p.name)+'</span><button class="act-btn" data-a="rv-proj" data-id="'+p.id+'">完了</button></div>'});
    h+='</div>';
  }
  if(!overdue.length&&!stale.length&&!rvProjs.length)h+='<div class="empty"><div class="empty-ico">🎉</div><div class="empty-t">完璧です！</div><div class="empty-d">期限切れも停滞タスクもありません</div></div>';
  return h+'</div>';
}

function renderNoteList(){

  if(S.filterTagIds&&S.filterTagIds.length){
    if(S.filterTagIds.includes('__none__'))notes=notes.filter(n=>!n.tagIds||n.tagIds.length===0);

    h+='<div style="padding:10px 0 6px;display:flex;gap:6px;align-items:center;flex-wrap:wrap">'

    h+='<div style="padding:10px 0 6px;display:flex;flex-direction:column;gap:4px">'

      const ins=map[btn.dataset.ns]||'';

function renderNextView(){
  // プロジェクト毎に最初の未完了タスクを1件ずつ取得
  const projs=getSortedProjects('active');
  const rows=[];
  for(const proj of projs){
    const tasks=S.tasks
      .filter(t=>{
        if(t.projectId!==proj.id||t.parentTaskId)return false;
        if(!S.showCompleted&&t.status==='completed')return false;
        if(S.hideNotStarted&&isNotStartedTask(t))return false;
        if(S.filterTagIds&&S.filterTagIds.length&&!S.filterTagIds.every(id=>t.tagIds&&t.tagIds.includes(id)))return false;
        return true;
      })
      .sort((a,b)=>{
        if(S.sort==='priority')return (a.priority||4)-(b.priority||4);
        if(S.sort==='dueAt'){if(!a.dueAt&&!b.dueAt)return 0;if(!a.dueAt)return 1;if(!b.dueAt)return-1;return a.dueAt.localeCompare(b.dueAt);}
        return (a.order||0)-(b.order||0);
      });
    if(tasks.length===0)continue;
    rows.push({proj,task:tasks[0]});
  }
  if(rows.length===0)return'<div class="empty"><div class="empty-ico">✅</div><div class="empty-t">すべてのプロジェクトは完了しています</div></div>';

  // サブタスクを持つタスクIDを収集
  const nvTasksWithSubs=rows.filter(({task})=>S.tasks.some(t=>t.parentTaskId===task.id)).map(({task})=>task.id);
  const hasAnySubs=nvTasksWithSubs.length>0;
  window._nvHasSubs=hasAnySubs; // フィルターバーの全開/全閉ボタン表示用

  let h='';
  h+='<div class="tlist">';
  for(const{proj,task} of rows){
    const done=task.status==='completed';
    const notStarted=!done&&isNotStartedTask(task);
    const isSel=S.selectedIds.includes(task.id);
    let meta='';
    if(task.startAt&&task.startAt!==task.dueAt){
      const cls=isToday(task.startAt)?'td':isSoon(task.startAt)?'sn':'';
      const timeLabel2=(task.startTime&&isToday(task.startAt))?' '+task.startTime:'';
      meta+='<span class="mc'+(cls?' '+cls:'')+'">🚀 '+fmtDate(task.startAt)+timeLabel2+'</span>';
    }
    if(task.dueAt){
      const cls=isOv(task.dueAt)?'ov':isToday(task.dueAt)?'td':isSoon(task.dueAt)?'sn':'';
      meta+='<span class="mc'+(cls?' '+cls:'')+'">⏰ '+fmtDate(task.dueAt)+'</span>';
    }
    // プロジェクト名チップ（クリックで遷移）
    meta+='<span class="mc proj-nav-chip" data-a="go-proj" data-id="'+proj.id+'" style="background:'+proj.color+'1a;color:'+proj.color+';cursor:pointer">'+esc(proj.name)+'</span>';
    if(task.tagIds&&task.tagIds.length){
      task.tagIds.slice(0,2).forEach(tid=>{
        const t=S.tags.find(x=>x.id===tid);
        if(t)meta+='<span class="mc" style="background:'+t.color+'1a;color:'+t.color+'">#'+esc(t.name)+'</span>';
      });
    }
    const nvSubs=S.tasks.filter(t=>t.parentTaskId===task.id);
    if(nvSubs.length){const dc=nvSubs.filter(s=>s.status==='completed').length;meta+='<button class="mc sub-toggle-btn" data-a="tog-subs" data-id="'+task.id+'" title="サブタスクを展開"><span class="sub-chev'+(S.openSubs[task.id]?' open':'')+'">▶</span>'+dc+'/'+nvSubs.length+'</button>';}
    const updStr=task.updatedAt?'<span class="mc" style="margin-left:auto">✏️ '+fmtDate(task.updatedAt.slice(0,10))+'</span>':'';
    const pclass=task.priority<4?'p'+task.priority:'';
    const nvHasParent=nvSubs.length>0;
    h+='<div class="trow'+(done?' done':'')+(isSel?' sel':'')+(S.taskId===task.id&&!isSel?' active':'')+(notStarted?' not-started':'')+(pclass?' '+pclass:'')+'" data-a="sel" data-id="'+task.id+'">'
      +'<button class="chk'+(done?' done':'')+'" data-a="chk" data-id="'+task.id+'">'+(done?'✓':'')+'</button>'
      +'<div class="tbody">'
        +'<div class="ttitle'+(nvHasParent?' has-subs':'')+'"'+(notStarted?' style="color:var(--text3)"':'')+'>'+( task.title?esc(task.title):'<span style="color:var(--text3)">無題</span>')+'</div>'
        +'<div class="tmeta">'+(meta||'')+updStr+'</div>'
      +'</div>'
      +'<button class="trow-edit-btn" data-a="sel-edit" data-id="'+task.id+'" title="詳細">'
        +'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>'
      +'</button>'
    +'</div>';
    if(nvSubs.length){
      const nvSubsOpen=!!S.openSubs[task.id];
      h+='<div class="sub-rows'+(nvSubsOpen?' open':'')+'" id="sub-rows-'+task.id+'">';
      h+=nvSubs.map(s=>'<div style="padding-left:28px">'+renderRow(s)+'</div>').join('');
      h+='</div>';
    }
  }
  h+='</div>';
  return h;
}

function renderSearchResults(q){
  if(!q)return'<div class="empty"><div class="empty-ico">🔍</div><div class="empty-t">キーワードを入力</div></div>';
  const ql=q.toLowerCase();
  let tasks=S.tasks.filter(t=>t.status!=='archived'&&(t.title.toLowerCase().includes(ql)||(t.notes||'').toLowerCase().includes(ql)));
  if(S.filterTagIds&&S.filterTagIds.length)tasks=tasks.filter(t=>S.filterTagIds.every(id=>t.tagIds&&t.tagIds.includes(id)));
  let notes=S.notes.filter(n=>(n.title+n.body).toLowerCase().includes(ql));
  if(S.filterTagIds&&S.filterTagIds.length){
    if(S.filterTagIds.includes('__none__'))notes=notes.filter(n=>!n.tagIds||n.tagIds.length===0);
    else notes=notes.filter(n=>S.filterTagIds.every(id=>n.tagIds&&n.tagIds.includes(id)));
  }
  if(!tasks.length&&!notes.length)return renderEmpty();
  let h='';
  if(tasks.length)h+='<div class="nav-label">タスク</div><div>'+tasks.map(t=>renderRow(t)).join('')+'</div>';
  if(notes.length){
    h+='<div class="nav-label" style="margin-top:12px">メモ</div>';
    notes.forEach(n=>{
      h+='<div class="trow" data-a="note-from-search" data-id="'+n.id+'">'
        +'<div class="tbody">'
          +'<div class="ttitle">📝 '+esc(n.title||'無題')+'</div>'
          +'<div class="tmeta" style="font-size:11px;color:var(--text3)">更新: '+fmtDate(n.updatedAt.slice(0,10))+'</div>'
        +'</div>'
      +'</div>';
    });
  }
  return h;
}

// ===== SUBTASK DRAG & DROP SORT =====
function initSubDrag(container){
  let dragSrc=null;
  // Mouse drag
  container.querySelectorAll('.sub-drag-handle').forEach(handle=>{
    const item=handle.closest('.sub-item');
    item.setAttribute('draggable','true');
    item.addEventListener('dragstart',e=>{
      dragSrc=item;
      item.classList.add('dragging');
      e.dataTransfer.effectAllowed='move';
    });
    item.addEventListener('dragend',()=>{
      item.classList.remove('dragging');
      container.querySelectorAll('.sub-item').forEach(i=>i.classList.remove('drag-over'));
      dragSrc=null;
    });
  });
  container.addEventListener('dragover',e=>{
    e.preventDefault();
    const target=e.target.closest('.sub-item');
    if(!target||target===dragSrc)return;
    container.querySelectorAll('.sub-item').forEach(i=>i.classList.remove('drag-over'));
    target.classList.add('drag-over');
  });
  container.addEventListener('drop',async e=>{
    e.preventDefault();
    const target=e.target.closest('.sub-item');
    if(!target||target===dragSrc||!dragSrc)return;
    const items=[...container.querySelectorAll('.sub-item')];
    const srcIdx=items.indexOf(dragSrc);
    const tgtIdx=items.indexOf(target);
    if(srcIdx<tgtIdx)target.after(dragSrc);else target.before(dragSrc);
    container.querySelectorAll('.sub-item').forEach(i=>i.classList.remove('drag-over'));
    await _saveSubOrder(container);
  });

  // Touch drag
  let touchDragSrc=null,touchClone=null,touchOffX=0,touchOffY=0;
  container.querySelectorAll('.sub-drag-handle').forEach(handle=>{
    handle.addEventListener('touchstart',e=>{
      const item=handle.closest('.sub-item');
      touchDragSrc=item;
      const r=item.getBoundingClientRect();
      const t=e.touches[0];
      touchOffX=t.clientX-r.left;touchOffY=t.clientY-r.top;
      touchClone=item.cloneNode(true);
      touchClone.style.cssText='position:fixed;z-index:9999;width:'+r.width+'px;opacity:.8;pointer-events:none;left:'+(t.clientX-touchOffX)+'px;top:'+(t.clientY-touchOffY)+'px;box-shadow:0 4px 16px rgba(0,0,0,.2)';
      document.body.appendChild(touchClone);
      item.classList.add('dragging');
    },{passive:true});
  });
  document.addEventListener('touchmove',e=>{
    if(!touchDragSrc)return;
    const t=e.touches[0];
    if(touchClone){touchClone.style.left=(t.clientX-touchOffX)+'px';touchClone.style.top=(t.clientY-touchOffY)+'px';}
    container.querySelectorAll('.sub-item').forEach(i=>i.classList.remove('drag-over'));
    const el=document.elementFromPoint(t.clientX,t.clientY);
    const over=el&&el.closest('.sub-item');
    if(over&&over!==touchDragSrc)over.classList.add('drag-over');
  },{passive:true});
  document.addEventListener('touchend',async e=>{
    if(!touchDragSrc)return;
    if(touchClone){touchClone.remove();touchClone=null;}
    const t=e.changedTouches[0];
    const el=document.elementFromPoint(t.clientX,t.clientY);
    const target=el&&el.closest('.sub-item');
    touchDragSrc.classList.remove('dragging');
    container.querySelectorAll('.sub-item').forEach(i=>i.classList.remove('drag-over'));
    if(target&&target!==touchDragSrc){
      const items=[...container.querySelectorAll('.sub-item')];
      const srcIdx=items.indexOf(touchDragSrc);
      const tgtIdx=items.indexOf(target);
      if(srcIdx<tgtIdx)target.after(touchDragSrc);else target.before(touchDragSrc);
      await _saveSubOrder(container);
    }
    touchDragSrc=null;
  },{passive:true});
}
async function _saveSubOrder(container){
  const items=[...container.querySelectorAll('.sub-item[data-id]')];
  for(let i=0;i<items.length;i++){
    const id=items[i].dataset.id;
    const task=S.tasks.find(t=>t.id===id);
    if(task){task.order=i*100;task.updatedAt=now();await saveTask(task);}
  }
}

function renderDrawer(){

    return;

// ===== COMMENTS =====
// S._commentCache[taskId] = {comments:[], loaded:true} でセッション内キャッシュ

function _cmTimeStr(isoStr){
  const d=new Date(isoStr),now=new Date();
  const diff=now-d;
  if(diff<60000)return 'たった今';
  if(diff<3600000)return Math.floor(diff/60000)+'分前';
  if(diff<86400000)return Math.floor(diff/3600000)+'時間前';
  if(d.getFullYear()===now.getFullYear())return (d.getMonth()+1)+'/'+(d.getDate())+' '+(d.getHours()+'').padStart(2,'0')+':'+(d.getMinutes()+'').padStart(2,'0');
  return d.getFullYear()+'/'+(d.getMonth()+1)+'/'+(d.getDate());
}

function _cmLinkify(escapedText){
  // エスケープ済みテキストのURLをリンク化（改行はbrに）
  return escapedText
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener" style="color:var(--accent);text-decoration:underline;word-break:break-all">$1</a>')
    .replace(/(^|[\s\n])(https?:\/\/[^\s<&"]+)/g,'$1<a href="$2" target="_blank" rel="noopener" style="color:var(--accent);text-decoration:underline;word-break:break-all">$2</a>')
    .replace(/\n/g,'<br>');
}

function _cmRenderList(comments){
  const list=document.getElementById('cm-list');
  const count=document.getElementById('cm-count');
  if(!list)return;
  const n=comments.length;
  if(count)count.textContent=n||'0';
  // ドロワー上部のコメントバッジも常時更新
  const jumpCount=document.getElementById('cm-jump-count');
  if(jumpCount)jumpCount.textContent=n;
  if(!n){list.innerHTML='<div class="cm-loading" style="font-size:12px;color:var(--text3);padding:6px 0">コメントなし</div>';return;}
  const uid=window._currentUser?.id;
  list.innerHTML=comments.map(c=>{
    const initial=(c.user_name||c.userName||'?').charAt(0).toUpperCase();
    const avatar=c.user_avatar||c.userAvatar
      ?`<img src="${c.user_avatar||c.userAvatar}" onerror="this.style.display='none'">`
      :initial;
    const isOwn=(c.user_id||c.userId)===uid;
    const createdAt=c.created_at||c.createdAt;
    const updatedAt=c.updated_at||c.updatedAt;
    const wasEdited=updatedAt&&createdAt&&(new Date(updatedAt)-new Date(createdAt))>2000;
    const editedLabel=wasEdited?`<span style="font-size:10px;color:var(--text3);margin-top:3px;display:block">編集済み ${_cmTimeStr(updatedAt)}</span>`:'';
    return `<div class="cm-item" data-cmid="${c.id}">
      <div class="cm-avatar">${typeof avatar==='string'&&avatar.startsWith('<')?avatar:initial}</div>
      <div class="cm-bubble">
        <div class="cm-meta">
          <span class="cm-name">${esc(c.user_name||c.userName||'ユーザー')}</span>
          <span class="cm-time">${_cmTimeStr(createdAt)}</span>
          ${isOwn?`<button class="cm-del" data-a="cm-edit" data-cmid="${c.id}" title="編集">編集</button>`:''}
          ${isOwn?`<button class="cm-del" data-a="cm-del" data-cmid="${c.id}" title="削除">✕</button>`:''}
        </div>
        <div class="cm-body" id="cm-body-${c.id}">${_cmLinkify(esc(c.body))}</div>
        ${editedLabel}
      </div>
    </div>`;
  }).join('');
}

async function initComments(taskId){
  // キャッシュがあれば即描画
  if(S._commentCache[taskId]){
    _cmRenderList(S._commentCache[taskId]);
    _cmSetupInput(taskId,S._commentCache[taskId]);
  }
  // Supabaseから取得（task_idが一致するものだけ）
  const SB=window._SB;
  if(!SB){
    const list=document.getElementById('cm-list');
    if(list)list.innerHTML='';
    _cmSetupInput(taskId,[]);
    return;
  }
  const uid=window._currentUser?.id;
  if(!uid)return;
  const{data,error}=await SB.from('task_comments')
    .select('*')
    .eq('task_id',taskId)
    .eq('user_id',uid)
    .order('created_at',{ascending:true});
  if(error){console.error('cm load',error);return;}
  const comments=data||[];
  S._commentCache[taskId]=comments;
  // ドロワーが同じタスクを開いたままの場合のみ描画
  if(S.taskId===taskId&&S.drawerOpen){
    _cmRenderList(comments);
    _cmSetupInput(taskId,comments);
  }
}

function _cmSetupInput(taskId,comments){
  const inp=document.getElementById('cm-input');
  const btn=document.getElementById('cm-send');
  if(!inp||!btn)return;
  // すでにセットアップ済みなら再登録しない
  if(inp._cmTaskId===taskId)return;
  inp._cmTaskId=taskId;
  // Linkボタン（onclickで上書き）
  const cmLinkBtn=document.getElementById('cm-link-btn');
  if(cmLinkBtn)cmLinkBtn.onclick=e=>{e.stopPropagation();showLinkPopover(cmLinkBtn,'cm-input',false);};
  // 送信ボタンの活性制御（onclickで上書き）
  inp.onfocus=()=>{
    // iPadOS/iOS でフォーカス時にページが最上部へ飛ぶのを防ぐ
    // drawer-body内でcm-inputが見えるよう、drawer-body側をスクロール
    requestAnimationFrame(()=>{
      setTimeout(()=>{
        const drBody=document.getElementById('drawer')?.querySelector('.drawer-body');
        if(!drBody)return;
        const inputRect=inp.getBoundingClientRect();
        const bodyRect=drBody.getBoundingClientRect();
        if(inputRect.bottom>bodyRect.bottom-10){
          drBody.scrollTop+=inputRect.bottom-bodyRect.bottom+24;
        }
      },350); // キーボードアニメーション待ち
    });
  };
  inp.oninput=()=>{
    btn.disabled=!inp.value.trim();
    inp.style.height='auto';
    inp.style.height=Math.min(inp.scrollHeight,120)+'px';
  };
  inp.onkeydown=e=>{
    if((e.metaKey||e.ctrlKey)&&e.key==='Enter'){e.preventDefault();if(!btn.disabled)_cmSend(taskId);}
  };
  btn.onclick=()=>_cmSend(taskId);
}

async function _cmSend(taskId){
  const inp=document.getElementById('cm-input');
  const btn=document.getElementById('cm-send');
  if(!inp||!btn)return;
  const body=inp.value.trim();
  if(!body)return;
  const SB=window._SB;
  const user=window._currentUser;
  if(!SB||!user)return;
  btn.disabled=true;
  const comment={
    id:uid(),
    task_id:taskId,
    user_id:user.id,
    user_name:user.user_metadata?.full_name||user.email||'',
    user_avatar:user.user_metadata?.avatar_url||'',
    body,
    created_at:new Date().toISOString(),
    updated_at:new Date().toISOString()
  };
  const{error}=await SB.from('task_comments').insert(comment);
  if(error){console.error('cm send',error);toast('コメントの送信に失敗しました');btn.disabled=false;return;}
  // キャッシュ更新
  if(!S._commentCache[taskId])S._commentCache[taskId]=[];
  S._commentCache[taskId]=[...S._commentCache[taskId],comment];
  _cmRenderList(S._commentCache[taskId]);
  inp.value='';inp.style.height='auto';btn.disabled=true;
  // リストの最下部にスクロール
  const list=document.getElementById('cm-list');
  if(list)list.scrollTop=list.scrollHeight;
}

async function _cmDelete(cmId,taskId){
  const SB=window._SB;if(!SB)return;
  const{error}=await SB.from('task_comments').delete().eq('id',cmId);
  if(error){toast('削除に失敗しました');return;}
  if(S._commentCache[taskId]){
    S._commentCache[taskId]=S._commentCache[taskId].filter(c=>c.id!==cmId);
    _cmRenderList(S._commentCache[taskId]);
  }
}

function _cmStartEdit(cmId,taskId){
  const cache=S._commentCache[taskId];
  if(!cache)return;
  const c=cache.find(x=>x.id===cmId);
  if(!c)return;
  const bodyEl=document.getElementById('cm-body-'+cmId);
  if(!bodyEl)return;
  // すでに編集中なら何もしない
  if(bodyEl.querySelector('textarea'))return;
  const origHtml=bodyEl.innerHTML;
  const origText=c.body;
  bodyEl.innerHTML='';
  // テキストエリア
  const ta=document.createElement('textarea');
  ta.className='cm-textarea';
  ta.value=origText;
  ta.style.cssText='width:100%;margin-bottom:6px;display:block';
  ta.rows=Math.max(2,origText.split('\n').length);
  // ボタン行
  const btnRow=document.createElement('div');
  btnRow.style.cssText='display:flex;gap:6px';
  const saveBtn=document.createElement('button');
  saveBtn.className='cm-send-btn';
  saveBtn.style.cssText='height:30px;padding:0 12px;font-size:12px';
  saveBtn.textContent='保存';
  const cancelBtn=document.createElement('button');
  cancelBtn.className='note-stamp-btn';
  cancelBtn.style.cssText='height:30px';
  cancelBtn.textContent='キャンセル';
  btnRow.append(saveBtn,cancelBtn);
  bodyEl.append(ta,btnRow);
  ta.focus();
  ta.selectionStart=ta.selectionEnd=ta.value.length;

  cancelBtn.onclick=()=>{bodyEl.innerHTML=origHtml;};
  saveBtn.onclick=async()=>{
    const newBody=ta.value.trim();
    if(!newBody){toast('本文を入力してください');return;}
    if(newBody===origText){bodyEl.innerHTML=origHtml;return;}
    saveBtn.disabled=true;saveBtn.textContent='保存中…';
    const SB=window._SB;
    const now=new Date().toISOString();
    const{error}=await SB.from('task_comments').update({body:newBody,updated_at:now}).eq('id',cmId);
    if(error){toast('更新に失敗しました');saveBtn.disabled=false;saveBtn.textContent='保存';return;}
    // キャッシュ更新
    const idx=cache.findIndex(x=>x.id===cmId);
    if(idx>=0){cache[idx]={...cache[idx],body:newBody,updated_at:now};}
    _cmRenderList(cache);
  };
  // Cmd/Ctrl+Enter で保存
  ta.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='Enter'){e.preventDefault();saveBtn.click();}});
  ta.addEventListener('input',()=>{ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,200)+'px';});
}

    startInp.addEventListener('change',()=>{startWd.textContent=wdStr(startInp.value);startWd.style.color=wdColor(startInp.value);applyDateInputStyle(startInp);startCleared=false;});
    dueInp.addEventListener('change',()=>{dueWd.textContent=wdStr(dueInp.value);dueWd.style.color=wdColor(dueInp.value);applyDateInputStyle(dueInp);dueCleared=false;});

    // 日付調整ヘルパー（タスク詳細と同じロジック）
    function adjBulkDate(inp,wdEl,days,months){
      let base;
      if(inp.value){
        const[y,m,d]=inp.value.split('-').map(Number);
        base=new Date(Date.UTC(y,m-1,d));
        if(days)base.setUTCDate(base.getUTCDate()+days);
        if(months)base.setUTCMonth(base.getUTCMonth()+months);
      }else{
        const n=new Date();
        base=new Date(Date.UTC(n.getFullYear(),n.getMonth(),n.getDate()));
        if(months)base.setUTCMonth(base.getUTCMonth()+months);
      }
      const v=base.toISOString().slice(0,10);
      inp.value=v;wdEl.textContent=wdStr(v);wdEl.style.color=wdColor(v);applyDateInputStyle(inp,v);
    }
    ov.querySelector('#bulk-sadj-d1').onclick=()=>adjBulkDate(startInp,startWd,1,0);

    ov.querySelector('#bulk-sadj-m1').onclick=()=>adjBulkDate(startInp,startWd,0,1);
    ov.querySelector('#bulk-dadj-d1').onclick=()=>adjBulkDate(dueInp,dueWd,1,0);
    ov.querySelector('#bulk-dadj-d7').onclick=()=>adjBulkDate(dueInp,dueWd,7,0);
    ov.querySelector('#bulk-dadj-m1').onclick=()=>adjBulkDate(dueInp,dueWd,0,1);

    // 開始時間調整ヘルパー
    function adjBulkTime(h){
      const cur=stimeInp.value;
      let hh=0,mm=0;
      if(cur){const[a,b]=cur.split(':');hh=parseInt(a);mm=parseInt(b);}
      else{const n=new Date();hh=n.getHours();mm=n.getMinutes();}
      hh=(hh+h+24)%24;
      stimeInp.value=String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0');
      stimeCleared=false;
    }
    ov.querySelector('#bulk-stime-h1').onclick=()=>adjBulkTime(1);
    ov.querySelector('#bulk-stime-h3').onclick=()=>adjBulkTime(3);
    ov.querySelector('#bulk-stime-m10').onclick=()=>{
      const cur=stimeInp.value;
      let hh=0,mm=0;
      if(cur){const[a,b]=cur.split(':');hh=parseInt(a);mm=parseInt(b);}
      else{const n=new Date();hh=n.getHours();mm=n.getMinutes();}
      mm+=10;if(mm>=60){hh=(hh+1)%24;mm-=60;}
      stimeInp.value=String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0');
      stimeCleared=false;
    };

      if(stimeInp.value){const[h]=stimeInp.value.split(':');stimeInp.value=h+':00';}

    ov.querySelector('#bulk-due-clr').onclick=()=>{dueInp.value='';dueWd.textContent='';applyDateInputStyle(dueInp,'');dueCleared=true;};
    ov.querySelector('#bulk-stime-clr').onclick=()=>{stimeInp.value='';stimeCleared=true;};
    [['#bulk-stime-900','09:00'],['#bulk-stime-1200','12:00'],['#bulk-stime-1500','15:00'],['#bulk-stime-1800','18:00']].forEach(([id,val])=>{

      if(sv&&dv&&sv>dv)dv=sv;

      for(const t of tasks){
        if(sv)t.startAt=sv;
        else if(startCleared)t.startAt=null;
        if(dv)t.dueAt=dv;
        else if(dueCleared)t.dueAt=null;
        // 個別タスクの既存日付との矛盾も解消
        if(sv&&t.dueAt&&t.dueAt<sv)t.dueAt=sv;
        if(dv&&t.startAt&&t.startAt>dv)t.startAt=dv;
        if(stv)t.startTime=stv;

    openConfirmModal(tasks.length+'件を削除',tasks.length+'件のタスクを削除しますか？この操作は取り消せません。',async()=>{
      for(const t of tasks)await delTask(t.id);
      S.selectMode=false;S.selectedIds=[];
      toast(tasks.length+'件を削除しました');render();
    });
  }
}


// ===== 親タスク選択モーダル =====
function openSetParentModal(taskIds,onSelect){  // 選択対象自身とその子孫は除外
  const excluded=new Set(Array.isArray(taskIds)?taskIds:[taskIds]);  const addDescendants=(id)=>{S.tasks.filter(t=>t.parentTaskId===id).forEach(t=>{excluded.add(t.id);addDescendants(t.id);});};  excluded.forEach(id=>addDescendants(id));  const candidates=S.tasks.filter(t=>!excluded.has(t.id)&&t.status!=='completed'&&t.status!=='archived'&&!t.parentTaskId);  let q='';  const render=()=>{    const filtered=q?candidates.filter(t=>(t.title||'').includes(q)):candidates;    listEl.innerHTML=filtered.slice(0,50).map(t=>      '<button class="act-btn" data-id="'+t.id+'" style="display:block;width:100%;text-align:left;padding:8px 10px;border-radius:6px;font-size:13px;border-bottom:1px solid var(--border)">'+esc(t.title||'無題')+'</button>'    ).join('');    listEl.querySelectorAll('[data-id]').forEach(btn=>{      btn.onclick=()=>{ov.remove();onSelect(btn.dataset.id);};    });  };  const ov=document.createElement('div');ov.className='overlay';  ov.innerHTML='<div class="modal" style="max-width:380px">'    +'<div class="modal-title">親タスクを選択</div>'    +'<input id="parent-search" class="finput" placeholder="タスク名で検索…" autocomplete="off" style="margin-bottom:10px">'    +'<div id="parent-list" style="max-height:280px;overflow-y:auto"></div>'    +'<div class="modal-foot" style="margin-top:8px"><button class="btn btn-ghost" id="parent-cancel">キャンセル</button></div>'  +'</div>';  document.body.appendChild(ov);requestAnimationFrame(()=>ov.classList.add('open'));  const listEl=ov.querySelector('#parent-list');  ov.querySelector('#parent-search').addEventListener('input',e=>{q=e.target.value;render();});  ov.querySelector('#parent-cancel').onclick=()=>ov.remove();  ov.addEventListener('click',e=>{if(e.target===ov)ov.remove();});  render();}

// ===== RENDER APP =====
function render(){
  localStorage.setItem('focus_view_state',JSON.stringify({view:S.view,projId:S.projId||null,tagId:S.tagId||null}));
  if(S.dark)document.documentElement.setAttribute('data-dark','');
  else document.documentElement.removeAttribute('data-dark');
  // モバイル: topbarの実際の高さをmainのpadding-topに反映
  if(window.innerWidth<=768){
    const tb=document.getElementById('topbar')||document.querySelector('.topbar');
    const main=document.querySelector('.main');
    if(tb&&main){
      const h=tb.offsetHeight;
      if(h>0)main.style.paddingTop=h+'px';
    }
  }
  // sidebar open/close
  const sb=document.getElementById('sidebar');
  const sov=document.getElementById('sov');
  if(S.sidebarOpen){sb.classList.add('open');sov.classList.add('open');if(window.innerWidth<=768)document.body.style.overflow='hidden';}
  else{sb.classList.remove('open');sov.classList.remove('open');document.body.style.overflow='';}
  renderSidebar();
  attachProjRenameListeners();
  attachProjDragListeners();
  attachTagDragListeners();
  renderBotNav();
  renderContent();
  renderDrawer();
  setupQA();
}
function renderInstant(){
  const sb=document.getElementById('sidebar');
  if(sb)sb.style.transition='none';
  render();
  requestAnimationFrame(()=>requestAnimationFrame(()=>{const sb=document.getElementById('sidebar');if(sb)sb.style.transition='';}));
}

// ===== QUICK ADD =====
function setupQA(){
  const inp=document.getElementById('qainput');
  const btn=document.getElementById('qabtn');
  const chips=document.getElementById('qachips');
  if(!inp)return;
  if(inp.dataset.qaReady)return;
  inp.dataset.qaReady='1';
  // モバイルで即座にキーボードを出す
  const wrap=document.getElementById('qawrap');
  if(wrap){
    wrap.addEventListener('touchend',e=>{
      if(!e.target.matches('button,input'))inp.focus();
    },{passive:true});
  }
  inp.addEventListener('input',()=>{
    const p=parseQA(inp.value);
    let h='';
    if(p.dueAt)h+='<span class="chip chip-date">📅 '+fmtDate(p.dueAt)+'</span>';
    if(p.priority<4)h+='<span class="chip chip-pri">P'+p.priority+'</span>';
    p.tagIds.forEach(id=>{const t=S.tags.find(x=>x.id===id);if(t)h+='<span class="chip chip-tag">#'+esc(t.name)+'</span>'});
    chips.innerHTML=h;
    btn.style.display=inp.value.trim()?'':'none';
  });
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();submitQA()}});
}

async function submitQA(){
  const inp=document.getElementById('qainput');
  if(!inp||!inp.value.trim())return;
  if(window._sbReady&&isPlanFree()&&getActiveTaskCount()>=getPlanDef().taskLimit){showUpgradeModal('tasks');return;}
  const p=parseQA(inp.value);
  if(!p.title){toast('タイトルを入力してください');return}
  // 未登録タグを自動作成
  if(p._newTagNames&&p._newTagNames.length){
    for(const name of p._newTagNames){
      const nt=mkTag({name,color:'#7c3aed'});
      await saveTag(nt);
      p.tagIds.push(nt.id);
    }
  }
  const status=S.view==='project'?'active':'inbox';
  const _t=today();
  const _d3=(()=>{const d=new Date();d.setDate(d.getDate()+3);return d.toISOString().slice(0,10);})();
  if(!p.dueAt)p.dueAt=_d3;
  if(!p.startAt)p.startAt=_t;
  const task=mkTask({...p,status,projectId:p.projectId||(S.view==='project'?S.projId:null)});
  await saveTask(task);
  inp.value='';
  document.getElementById('qachips').innerHTML='';
  document.getElementById('qabtn').style.display='none';
  playSE('add');
  toast('"'+task.title+'" を追加しました');
  render();
}

              drBody2.scrollTop+=inputRect.bottom-bodyRect.bottom+20;
            }
          }
        },100);
      },300);

    if(task.status==='completed'){
      task.status=task.projectId?'active':'inbox';task.completedAt=null;
      await saveTask(task);
      if(task.parentTaskId&&updateSubsOnly()){}else render();
    } else {
      const snap=JSON.stringify(task);
      const incompleteSubs=!task.parentTaskId?S.tasks.filter(t=>t.parentTaskId===task.id&&t.status!=='completed'):[];
      const doComplete=async()=>{
        task.status='completed';task.completedAt=now();
        await saveTask(task);
        // サブタスクも完了にする
        if(!task.parentTaskId){
          const subs=S.tasks.filter(t=>t.parentTaskId===task.id&&t.status!=='completed');
          for(const sub of subs){sub.status='completed';sub.completedAt=now();await saveTask(sub);}
        }
        playSE('complete');
        if(task.repeatRule&&task.dueAt){
          const next=nextRepeat(task);
          if(next){await saveTask(next);toast('"'+task.title+'" 完了。次回: '+fmtDate(next.dueAt))}
          else toast('"'+task.title+'" 完了 ✓');
        } else {
          toast('"'+(task.title||'無題')+'" 完了 ✓',async()=>{
            const r=JSON.parse(snap);
            r.status=r.status||'inbox';await saveTask(r);
            // 元に戻す時はサブタスクも戻す
            const subs=S.tasks.filter(t=>t.parentTaskId===r.id&&t.status==='completed');
            for(const sub of subs){sub.status='active';sub.completedAt=null;await saveTask(sub);}
            render();
          });
        }
        if(task.parentTaskId){
          if(!updateSubsOnly())render();
        } else {
          if(S.taskId===task.id){S.drawerOpen=false;S.taskId=null}
          render();
        }
      };
      if(incompleteSubs.length>0){
        openConfirmModal('未完了のサブタスクがあります',incompleteSubs.length+'件の未完了サブタスクがあります。完了にするとサブタスクもすべて完了になります。',doComplete,'完了にする',false);
      } else {
        await doComplete();
      }
    }

// ===== GLOBAL CALCULATOR DRAWER =====
let _calcState={expr:'',result:'',history:[],justEvaled:false};
let _calcBuilt=false;

// 電卓ドロワーと expand modal の同時表示を同期（PCのみ）
function _syncExpandWithCalc(){
  if(window.innerWidth<=768)return;
  const calcDr=document.getElementById('calc-drawer-global');
  const calcOv=document.getElementById('calc-drawer-ov');
  const expandOv=document.querySelector('.expand-overlay');
  const calcOpen=calcDr?.classList.contains('open');
  if(calcOpen&&expandOv){
    expandOv.classList.add('calc-beside');
    calcOv?.classList.add('behind-modal');
  } else {
    expandOv?.classList.remove('calc-beside');
    calcOv?.classList.remove('behind-modal');
  }
}

function openCalcDrawer(){
  const ov=document.getElementById('calc-drawer-ov');
  const dr=document.getElementById('calc-drawer-global');
  if(!ov||!dr)return;
  if(!_calcBuilt){_buildCalcInDrawer();_calcBuilt=true;}
  // スマホではキーボードを閉じる
  if(document.activeElement&&(document.activeElement.tagName==='INPUT'||document.activeElement.tagName==='TEXTAREA')){
    document.activeElement.blur();
  }
  ov.classList.add('open');
  dr.classList.add('open');
  _syncExpandWithCalc();
}

function closeCalcDrawer(){
  const ov=document.getElementById('calc-drawer-ov');
  const dr=document.getElementById('calc-drawer-global');
  if(ov)ov.classList.remove('open');
  if(dr)dr.classList.remove('open');
  _syncExpandWithCalc();
}

function toggleCalcDrawer(){
  const dr=document.getElementById('calc-drawer-global');
  if(dr&&dr.classList.contains('open'))closeCalcDrawer();
  else openCalcDrawer();
}

// close on overlay click
document.getElementById('calc-drawer-ov')?.addEventListener('click',closeCalcDrawer);
document.getElementById('calc-drawer-close-btn')?.addEventListener('click',closeCalcDrawer);

document.getElementById('calc-drawer-global')?.addEventListener('click',e=>{

// Right-edge swipe (≤22px from right) → open calc drawer
(function(){
  let _sx=null,_sy=null;
  document.addEventListener('touchstart',e=>{
    const t=e.touches[0];
    if(window.innerWidth-t.clientX<=22){_sx=t.clientX;_sy=t.clientY;}
    else _sx=null;
  },{passive:true});
  document.addEventListener('touchmove',e=>{
    if(_sx===null)return;
    const t=e.touches[0];
    const dx=_sx-t.clientX;
    const dy=Math.abs(t.clientY-_sy);
    if(dx>36&&dy<80){_sx=null;openCalcDrawer();}
  },{passive:true});
})();

// Left-to-right swipe on calc drawer → close
(function(){
  const dr=document.getElementById('calc-drawer-global');
  if(!dr)return;
  let _sx=null,_sy=null;
  dr.addEventListener('touchstart',e=>{
    const t=e.touches[0];_sx=t.clientX;_sy=t.clientY;
  },{passive:true});
  dr.addEventListener('touchmove',e=>{
    if(_sx===null)return;
    const t=e.touches[0];
    const dx=t.clientX-_sx; // positive = right swipe
    const dy=Math.abs(t.clientY-_sy);
    if(dx>60&&dy<80){_sx=null;closeCalcDrawer();}
  },{passive:true});
  dr.addEventListener('touchend',()=>{_sx=null;},{passive:true});
  dr.addEventListener('touchcancel',()=>{_sx=null;},{passive:true});
})();

function _buildCalcInDrawer(){
  const container=document.getElementById('calc-drawer-body');
  if(!container)return;

  let expr=_calcState.expr,result=_calcState.result,calcHistory=_calcState.history,justEvaled=_calcState.justEvaled;

  function saveState(){_calcState={expr,result,history:calcHistory,justEvaled};}

  function safeCalc(s){
    try{
      if(!s||!/^[0-9+\-*/.() ]+$/.test(s))return null;
      const r=new Function('return('+s+')')();
      if(typeof r!=='number'||!isFinite(r))return null;
      return String(Math.round(r*1e10)/1e10);
    }catch(e){return null;}
  }

  function fmtComma(s){
    if(s===''||s==null)return s;
    const neg=s[0]==='-';const abs=neg?s.slice(1):s;
    const[intPart,decPart]=abs.split('.');
    const fmt=intPart.replace(/\B(?=(\d{3})+(?!\d))/g,',');
    return(neg?'-':'')+fmt+(decPart!=null?'.'+decPart:'');
  }

  function fmtOkuMan(s){
    const num=parseFloat(s);if(isNaN(num)||!isFinite(num))return '';
    const abs=Math.abs(num);if(abs<10000)return '';
    const sign=num<0?'-':'';
    const cho=Math.floor(abs/1000000000000);
    const oku=Math.floor((abs%1000000000000)/100000000);
    const man=Math.floor((abs%100000000)/10000);
    if(cho>0&&oku>0&&man>0)return sign+fmtComma(String(cho))+'兆'+fmtComma(String(oku))+'億'+fmtComma(String(man))+'万';
    if(cho>0&&oku>0)return sign+fmtComma(String(cho))+'兆'+fmtComma(String(oku))+'億';
    if(cho>0&&man>0)return sign+fmtComma(String(cho))+'兆'+fmtComma(String(man))+'万';
    if(cho>0)return sign+fmtComma(String(cho))+'兆';
    if(oku>0&&man>0)return sign+fmtComma(String(oku))+'億'+fmtComma(String(man))+'万';
    if(oku>0)return sign+fmtComma(String(oku))+'億';
    return sign+fmtComma(String(man))+'万';
  }

  function fmtExpr(s){
    return s.replace(/(\d+\.?\d*)/g,m=>fmtComma(m)).replace(/\*/g,'×').replace(/\//g,'÷');
  }

  function doCopy(text,doneCb){
    if(!text)return;
    const _fb=()=>{
      const t=document.createElement('textarea');t.value=text;
      t.style.cssText='position:fixed;top:0;left:0;opacity:0;pointer-events:none';
      document.body.appendChild(t);t.focus();t.select();
      try{document.execCommand('copy');}catch(e){}
      t.remove();doneCb?.();
    };
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(doneCb).catch(_fb);
    } else {
      _fb();
    }
  }

  // Button press animation + sound
  function pressAnimate(btn){
    if(!btn)return;
    btn.classList.add('pressed');
    window.playClick?.();
    setTimeout(()=>btn.classList.remove('pressed'),160);
  }
  function attachPressEvents(el, onTouch, noDefaultSound){
    el.addEventListener('touchstart',e=>{
      const btn=e.target.closest('[data-cv]');if(!btn)return;
      btn.classList.add('pressed');
      if(!noDefaultSound)window.playClick?.();
      if(onTouch)onTouch(btn);
    },{passive:true});
    el.addEventListener('touchend',e=>{
      const btn=e.target.closest('[data-cv]');if(btn)btn.classList.remove('pressed');
    },{passive:true});
    el.addEventListener('touchcancel',e=>{
      const btn=e.target.closest('[data-cv]');if(btn)btn.classList.remove('pressed');
    },{passive:true});
  }

  // Utility button feedback

    btn.innerHTML='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20,6 9,17 4,12"/></svg> コピー済';

          +'</div>'
          +'<div class="calc-result-wrap">'
            +'<div style="flex:1">'
              +'<div class="calc-result">0</div>'
              +'<div class="calc-okuMan"></div>'

  function upd(){
    exEl.textContent=expr?fmtExpr(expr):'';
    reEl.textContent=result?fmtComma(result):'0';
    omEl.textContent=result?fmtOkuMan(result):'';
    // 億・万ラベルをオーバーレイ（canvas幅計測で正確に配置）
    reEl.querySelectorAll('.calc-unit-label').forEach(el=>el.remove());
    if(result){
      const num=parseFloat(result);
      if(!isNaN(num)&&Math.abs(num)>=10000){
        const abs=Math.abs(num);
        const formatted=fmtComma(result);
        // canvas で文字幅を計測
        const _cv=document.createElement('canvas');
        const _ctx=_cv.getContext('2d');
        const fs=parseFloat(getComputedStyle(reEl).fontSize)||35;
        _ctx.font=`700 ${fs}px system-ui,sans-serif`;
        const totalW=_ctx.measureText(formatted).width;
        // 2行折り返し時はラベル表示しない
        if(totalW>reEl.offsetWidth*1.05)return;
        function rightOffsetFor(suffixStr){
          return totalW-_ctx.measureText(formatted.slice(0,formatted.length-suffixStr.length)).width;
        }
        // 億: 右から9桁目の数字の左端に配置
        if(abs>=100000000){
          let dCount=0,okuIdx=-1;
          for(let i=formatted.length-1;i>=0;i--){
            if(/[0-9]/.test(formatted[i]))dCount++;
            if(dCount===9){okuIdx=i;break;}
          }
          if(okuIdx>=0){
            // okuIdxより右側の文字列の幅 = right値
            const rightStr=formatted.slice(okuIdx+1);
            const rOff=_ctx.measureText(rightStr).width;
            const okuLabel=document.createElement('span');
            okuLabel.className='calc-unit-label';
            okuLabel.textContent='億';
            okuLabel.style.right=rOff+'px';
            reEl.appendChild(okuLabel);
          }
        }
        // 万: 右から5桁目の数字の左端に配置
        if(abs>=10000){
          let dCount=0,manIdx=-1;
          for(let i=formatted.length-1;i>=0;i--){
            if(/[0-9]/.test(formatted[i]))dCount++;
            if(dCount===5){manIdx=i;break;}
          }
          if(manIdx>=0){
            const rightStr=formatted.slice(manIdx+1);
            const rOff=_ctx.measureText(rightStr).width;
            const manLabel=document.createElement('span');
            manLabel.className='calc-unit-label';
            manLabel.textContent='万';
            manLabel.style.right=rOff+'px';
            reEl.appendChild(manLabel);
          }
        }
      }
    }
    saveState();
  }

    // 結果バッジ: タップ → 電卓に入力 / 長押し → 数値をコピー
    histEl.querySelectorAll('.calc-hist-result').forEach(badge=>{
      const idx=parseInt(badge.dataset.insertHi);
      // モバイル: setTimeoutベース長押し判定（iOS Safariでも確実に動作）
      let _bLpT=null,_bMoved=false,_bSx=0,_bSy=0,_bFired=false;
      const _bCancel=()=>{if(_bLpT){clearTimeout(_bLpT);_bLpT=null;}};
      badge.addEventListener('touchstart',e=>{
        e.stopPropagation();
        _bMoved=false;_bFired=false;
        _bSx=e.touches[0].clientX;_bSy=e.touches[0].clientY;
        _bLpT=setTimeout(()=>{
          _bLpT=null;if(_bMoved)return;
          _bFired=true;
          const h=calcHistory[idx];if(!h)return;
          window.playClick?.();
          doCopy(fmtComma(h.result),()=>{
            badge.closest('.calc-hist-item').classList.add('flash');
            setTimeout(()=>badge.closest('.calc-hist-item')?.classList.remove('flash'),500);
            toast('結果をコピーしました 📋');
          });
        },500);
      },{passive:true});
      badge.addEventListener('touchmove',e=>{
        if(Math.abs(e.touches[0].clientX-_bSx)>8||Math.abs(e.touches[0].clientY-_bSy)>8){_bMoved=true;_bCancel();}
      },{passive:true});
      badge.addEventListener('touchend',e=>{
        e.stopPropagation();
        _bCancel();
        if(_bMoved||_bFired)return;
        // タップ: 電卓に入力
        const h=calcHistory[idx];if(!h)return;
        window.playClickEq?.();
        pressNum(h.result);
        badge.closest('.calc-hist-item').classList.add('flash');
        setTimeout(()=>badge.closest('.calc-hist-item')?.classList.remove('flash'),250);
      },{passive:false});
      badge.addEventListener('touchcancel',()=>{_bMoved=true;_bCancel();},{passive:true});
      // PC: マウス長押しでコピー（setTimeoutはPCでは正常動作）
      let lpTimer=null;
      const lpStart=()=>{
        lpTimer=setTimeout(()=>{
          lpTimer=null;
          const h=calcHistory[idx];

          window.playClick?.();

  function pressNum(n){
    if(n==='0'&&!justEvaled){
      const seg=(expr.match(/[0-9.]*$/)||[''])[0];
      if(seg==='0'){window.playClickNG?.();return;}
    }
    if(justEvaled){expr=n;result='';justEvaled=false;}else expr+=n;
    const r=safeCalc(expr);if(r!=null)result=r;upd();
  }
  function pressOp(op){justEvaled=false;if(expr&&'+-*/'.includes(expr.slice(-1)))expr=expr.slice(0,-1);expr+=op;upd();}
  function pressParen(p){justEvaled=false;expr+=p;const r=safeCalc(expr);if(r!=null)result=r;upd();}
  function pressDot(){const seg=(expr.match(/[0-9.]*$/)||[''])[0];if(seg.includes('.'))return;if(!expr||'+-*/('.includes(expr.slice(-1)))expr+='0';expr+='.';justEvaled=false;upd();}

      const labelEl=document.getElementById('calc-label-inp');

    }
    upd();
  }

  resWrap.addEventListener('touchstart',e=>{

  },{passive:true});
  resWrap.addEventListener('touchmove',e=>{

  // 転記先ノート名をボタンラベルに反映
  function updateToNoteLabel(btn){
    if(!btn)return;
    let label='📝 ノートへ';
    if(S.noteOpen&&S.noteId){
      const n=S.notes.find(x=>x.id===S.noteId);
      if(n)label='📝 → '+(n.title||'無題');

      label='📝 → 新規作成';

  const toNoteBtn=document.getElementById('calc-head-tonote-btn');
  if(toNoteBtn)toNoteBtn.addEventListener('click',async()=>{
    if(!calcHistory.length)return;
    const lines=calcHistory.map(h=>{
      const lbl=h.label?h.label+': ':'';
      // 式が数字のみ（演算子なし）なら式を省略、演算式があれば括弧付きで付加
      const hasExpr=h.expr&&/[+\-*\/]/.test(h.expr);
      const exprPart=hasExpr?' ('+fmtExpr(h.expr)+')':'';
      return lbl+fmtComma(h.result)+'円'+exprPart;
    });
    const total=calcHistory.reduce((s,h)=>s+(parseFloat(h.result)||0),0);
    lines.push('──────');
    lines.push('合計: '+fmtComma(String(Math.round(total*100)/100))+'円');
    const text=lines.join('\n');
    let targetNote=null;
    if(S.noteOpen&&S.noteId){
      targetNote=S.notes.find(n=>n.id===S.noteId);
    }
    if(!targetNote){
      const d=new Date();
      const title=(d.getMonth()+1)+'/'+(d.getDate())+' お買い物メモ';
      targetNote=mkNote({title,body:''});
      await saveNote(targetNote);
      S.notes.unshift(targetNote);
      S.noteId=targetNote.id;
      S.noteOpen=true;
    }
    const sep=targetNote.body&&!targetNote.body.endsWith('\n')?'\n':'';
    targetNote.body+=sep+text;
    targetNote.updatedAt=now();
    await saveNote(targetNote);
    const bodyEl=document.getElementById('nt-body');
    if(bodyEl){bodyEl.value=targetNote.body;}
    renderNoteListOnly();
    playSE('add');
    const noteName=targetNote.title||'無題';

  // 税込・税抜ボタン
  function applyTax(inclusive){
    const num=parseFloat(result||'0');if(isNaN(num)||num===0)return;
    const rate=(typeof getSetting==='function'?getSetting('taxRate',10):10)/100;
    const r=Math.round((inclusive?num*(1+rate):num/(1+rate))*100)/100;
    result=String(r);expr='';justEvaled=true;upd();
  }

  // 通貨変換ボタン
  function applyFX(toUSD){
    const num=parseFloat(result||'0');if(isNaN(num)||num===0)return;
    const rate=getSetting('fxRate',160);
    const r=toUSD
      ? Math.round(num/rate*100)/100  // ¥→$
      : Math.round(num*rate);          // $→¥
    const label=toUSD?'toドル':'to円';
    calcHistory.push({expr:fmtComma(String(num))+' '+label,result:String(r)});
    result=String(r);expr='';justEvaled=true;renderHist();upd();
  }
  // % / INT ボタン
  function applyPct(){
    const num=parseFloat(result||'0');if(isNaN(num)||num===0)return;
    result=String(Math.round(num/100*1e10)/1e10);expr='';justEvaled=true;upd();
  }
  function applyInt(){
    const num=parseFloat(result||'0');if(isNaN(num)||num===0)return;

  function pasteNumber(text){
    const cleaned=text.replace(/[,，¥$￥€£\s]/g,'').match(/^-?\d+(?:\.\d*)?/)?.[0];
    if(!cleaned||cleaned==='-'){window.playClickNG?.();return;}
    if(justEvaled){expr=cleaned;result='';justEvaled=false;}else expr+=cleaned;
    const r=safeCalc(expr);if(r!=null)result=r;
    window.playClick?.();upd();
  }
  async function doPaste(){
    try{const text=await navigator.clipboard.readText();pasteNumber(text);}
    catch(e){window.playClickNG?.();}
  }

    if(btn.dataset.cv){window.playClick?.();pressParen(btn.dataset.cv);}

    else if(btn.dataset.fn==='int'){window.playClick?.();applyInt();}

    pressAnimate(btn);execActionBtn(btn);
  });

  // 貼付: スマホ→式エリア長押しOSメニュー、PC→Ctrl+V
  const pasteInp=wrap.querySelector('#calc-paste-inp');
  if(pasteInp){
    // スマホ: 式エリアをタップ→フォーカス→長押しでOSペーストメニュー(inputmode=noneでキーボード非表示)
    pasteInp.addEventListener('paste',e=>{
      e.preventDefault();
      const text=(e.clipboardData||window.clipboardData)?.getData('text')||'';
      pasteNumber(text);
      pasteInp.blur();
      setTimeout(()=>{pasteInp.value='';},10);
    });
    // フォーカスが外れたら値をリセット
    pasteInp.addEventListener('blur',()=>{setTimeout(()=>{pasteInp.value='';},50);});
  }
  // PC: Ctrl+V / Cmd+V（ラベル入力欄は除外）
  document.addEventListener('keydown',e=>{
    const dr=document.getElementById('calc-drawer-global');
    if(!dr?.classList.contains('open'))return;
    if(e.target===pasteInp)return;// paste イベントに任せる
    if(e.target?.id==='calc-label-inp')return;
    if(e.target?.tagName==='INPUT'||e.target?.tagName==='TEXTAREA')return;
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='v'){e.preventDefault();doPaste();}
  },{capture:true});

  // bottom row (toドル / to円 / 税込 / 税抜) — touchstartで即実行、clickはPC専用
  const bottomRow=wrap.querySelector('.calc-bottom-row');
  if(bottomRow){
    bottomRow.addEventListener('touchstart',e=>{
      const btn=e.target.closest('[data-fx]');if(!btn)return;
      btn.classList.add('pressed');
      window.playClick?.();
      applyFX(btn.dataset.fx==='jpy2usd');
    },{passive:true});
    bottomRow.addEventListener('touchend',e=>{
      const btn=e.target.closest('[data-fx]');if(btn)btn.classList.remove('pressed');
    },{passive:true});
    bottomRow.addEventListener('touchcancel',e=>{
      const btn=e.target.closest('[data-fx]');if(btn)btn.classList.remove('pressed');
    },{passive:true});
    bottomRow.addEventListener('click',e=>{
      if('ontouchstart' in window)return; // スマホはtouchstartで処理済み
      const btn=e.target.closest('[data-fx]');if(!btn)return;
      pressAnimate(btn);window.playClick?.();
      applyFX(btn.dataset.fx==='jpy2usd');
    });
  }

  function pressMulti(s){if(justEvaled){expr=s;result='';justEvaled=false;}else expr+=s;const r=safeCalc(expr);if(r!=null)result=r;upd();}

  // Number/op grid: touchstartで入力(スマホ), clickはPC専用
  function execBtn(v){
    if(v==='AC'){window.playClickAC?.();pressAC();}
    else if(v==='='){window.playClickEq?.();pressEq();}
    else{window.playClick?.();
      if(v==='±')pressPM();else if(v==='BS')pressBS();
      else if(v==='/')pressOp('/');else if(v==='*')pressOp('*');else if(v==='-')pressOp('-');else if(v==='+')pressOp('+');
      else if(v==='.')pressDot();else pressNum(v);
    }
  }
  const grid=wrap.querySelector('.calc-grid');
  attachPressEvents(grid, btn=>execBtn(btn.dataset.cv), true);
  grid.addEventListener('click',e=>{
    if('ontouchstart' in window)return; // スマホはtouchstartで処理済み
    const btn=e.target.closest('[data-cv]');if(!btn)return;
    pressAnimate(btn);execBtn(btn.dataset.cv);
  });

  // 入力補助ボタン（百 / 千 / 万 / 億）
  const utilRow=wrap.querySelector('.calc-util-flat-row');
  if(utilRow){
    function execUtil(v){
      if(!expr||parseFloat(result||'0')===0){window.playClickNG?.();return;}
      if(v==='00')pressMulti('00');
      else if(v==='000')pressMulti('000');
      else if(v==='万')pressMulti('0000');
      else if(v==='億')pressMulti('00000000');
    }
    attachPressEvents(utilRow, btn=>execUtil(btn.dataset.cv));
    utilRow.addEventListener('click',e=>{
      if('ontouchstart' in window)return;
      const btn=e.target.closest('[data-cv]');if(!btn)return;
      pressAnimate(btn);execUtil(btn.dataset.cv);
    });
  }

  // ===== PCキーボード入力 =====
  if(!('ontouchstart' in window)){
    // ボタンアニメーションのみ（音はexecBtnが担当するので二重再生しない）
    const _animBtn=btn=>{if(!btn)return;btn.classList.add('pressed');setTimeout(()=>btn.classList.remove('pressed'),160);};
    document.addEventListener('keydown',e=>{
      // 電卓ドロワーが閉じていれば無視
      const dr=document.getElementById('calc-drawer-global');
      if(!dr||!dr.classList.contains('open'))return;
      // 修飾キー付きは無視（Ctrl+Z, Ctrl+C など）
      if(e.ctrlKey||e.metaKey||e.altKey)return;
      // input / textarea / select にフォーカスがあれば無視
      const ae=document.activeElement;
      if(ae&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA'||ae.tagName==='SELECT'||ae.isContentEditable))return;

      const k=e.key;
      // ( ) はグリッド外なので個別処理
      if(k==='('||k===')'){
        e.preventDefault();
        _animBtn(wrap.querySelector('[data-cv="'+k+'"]'));
        window.playClick?.();
        pressParen(k);
        return;
      }
      // グリッドボタンへのキーマップ
      let cv=null;
      if(k>='0'&&k<='9')cv=k;
      else if(k==='+')cv='+';
      else if(k==='-')cv='-';
      else if(k==='*')cv='*';
      else if(k==='/')cv='/';
      else if(k==='.')cv='.';
      else if(k==='Enter'||k==='=')cv='=';
      else if(k==='Backspace')cv='BS';
      else if(k==='Delete')cv='AC';
      if(cv===null)return;
      e.preventDefault();
      _animBtn(wrap.querySelector('[data-cv="'+cv+'"]'));
      execBtn(cv);
    });
  }
}

function openExpandModal(type){
  document.querySelectorAll('.expand-overlay').forEach(el=>el.remove());
  const ov=document.createElement('div');
  ov.className='expand-overlay';
  const modal=document.createElement('div');
  modal.className='expand-modal';
  ov.appendChild(modal);
  document.body.appendChild(ov);

  function renderInto(){
    if(type==='task'){
      renderDrawer();
      const dr=document.getElementById('drawer');
      if(dr){
        modal.innerHTML=dr.innerHTML;
        // re-attach events by cloning drawer logic into modal
        modal.querySelectorAll('[data-a="close-drawer"]').forEach(b=>{b.addEventListener('click',()=>{ov.remove();S.drawerOpen=false;S.taskId=null;renderDrawer();renderContent();});});
        modal.querySelectorAll('[data-a="task-nav-prev"],[data-a="task-nav-next"]').forEach(b=>{
          b.addEventListener('click',()=>{
            const dir=b.dataset.a;
            const visibleTasks=getTasks().filter(t=>!t.parentTaskId);
            const idx=visibleTasks.findIndex(t=>t.id===S.taskId);
            const next=dir==='task-nav-prev'?visibleTasks[idx-1]:visibleTasks[idx+1];
            if(next){S.taskId=next.id;renderInto();}
          });
        });
      }
    } else {
      renderNoteDrawer();
      const dr=document.getElementById('drawer');
      if(dr){
        modal.innerHTML=dr.innerHTML;
        modal.querySelectorAll('[data-a="close-note"]').forEach(b=>{b.addEventListener('click',()=>{ov.remove();S.noteOpen=false;S.noteId=null;renderNoteDrawer();renderContent();});});
        modal.querySelectorAll('[data-a="note-nav-prev"],[data-a="note-nav-next"]').forEach(b=>{
          b.addEventListener('click',()=>{
            const dir=b.dataset.a;
            const q=(S.noteSearch||'').toLowerCase();
            const sortKey=S.noteSort||'updatedAt';
            const visibleNotes=[...S.notes].filter(n=>!q||(n.title+n.body).toLowerCase().includes(q)).sort((a,b)=>b[sortKey].localeCompare(a[sortKey]));
            const idx=visibleNotes.findIndex(n=>n.id===S.noteId);
            const next=dir==='note-nav-prev'?visibleNotes[idx-1]:visibleNotes[idx+1];
            if(next){S.noteId=next.id;renderInto();}
          });
        });
      }
    }
    // wire modal inner buttons via event delegation
    reattachModalEvents(modal, type, ()=>{ov.remove();renderContent();renderDrawer();});
  }
  renderInto();
  ov.addEventListener('click',e=>{if(e.target===ov){ov.remove();}});
  document.addEventListener('keydown',function escKey(e){if(e.key==='Escape'){ov.remove();document.removeEventListener('keydown',escKey);}});
  // 電卓ドロワーと同時表示の同期
  _syncExpandWithCalc();
  const _syncObs=new MutationObserver(()=>{if(!document.contains(ov)){_syncObs.disconnect();_syncExpandWithCalc();}});
  _syncObs.observe(document.body,{childList:true});
}

    if(mPvBtn)mPvBtn.addEventListener('click',()=>{mPvMode?mExitPv():mEnterPv();});
    mEnterPv();

    // data-ns スタンプボタン（日時等）

    const _pad=n=>String(n).padStart(2,'0');
    modal.querySelectorAll('[data-ns]').forEach(btn=>{
      btn.addEventListener('click',e=>{
        e.stopPropagation();
        if(mPvMode)mExitPv();
        if(!bodyEl)return;
        const d=new Date();
        const dateBase=d.getFullYear()+'/'+_pad(d.getMonth()+1)+'/'+_pad(d.getDate());
        const timeBase=_pad(d.getHours())+':'+_pad(d.getMinutes());
        const map={date:dateBase,time:timeBase,datetime:dateBase+' '+timeBase,datetimeweek:dateBase+'（'+_days[d.getDay()]+'） '+timeBase+' ',sep:'—————————————'};
        const ins=map[btn.dataset.ns]||'';
        if(!ins)return;
        if(!bodyEl._stampFocused){
          bodyEl.value=ins+'\n'+bodyEl.value;
          bodyEl.selectionStart=bodyEl.selectionEnd=ins.length+1;
        }else{
          const s=bodyEl.selectionStart,e2=bodyEl.selectionEnd;
          bodyEl.value=bodyEl.value.slice(0,s)+ins+bodyEl.value.slice(e2);
          bodyEl.selectionStart=bodyEl.selectionEnd=s+ins.length;
        }
        bodyEl.focus();save();
      });
    });

    // Linkボタン
    const mLinkBtn=modal.querySelector('#nt-link-btn');
    if(mLinkBtn)mLinkBtn.addEventListener('click',e=>{
      e.stopPropagation();
      if(mPvMode)mExitPv();
      showLinkPopover(mLinkBtn,'nt-body',!bodyEl?._stampFocused,modal);
    });
  }
}

document.addEventListener('dblclick',e=>{
  const el=e.target.closest('[data-note-title-edit]');
  if(!el)return;
  e.preventDefault();e.stopPropagation();
  const noteId=el.dataset.noteTitleEdit;
  const note=S.notes.find(n=>n.id===noteId);
  if(!note||el.querySelector('input'))return;
  const inp=document.createElement('input');
  inp.value=note.title||'';
  inp.className='note-title-edit-inp';
  el.innerHTML='';el.appendChild(inp);
  inp.focus();inp.select();
  let committed=false;
  async function commit(){
    if(committed)return;committed=true;
    const val=inp.value.trim();
    if(val!==note.title){note.title=val||'無題';note.updatedAt=now();await saveNote(note);}
    renderNoteListOnly();
    if(S.noteId===noteId&&S.noteOpen){const hdr=document.querySelector('.drawer-head div div:last-child');if(hdr)hdr.textContent=note.title||'無題';const ti=document.getElementById('nt-title');if(ti)ti.value=note.title||'';}
  }

// ===== SWIPE TO OPEN/CLOSE SIDEBAR =====
(function(){
  let startX=0,startY=0,tracking=false;
  const EDGE=30;      // 左端からこのpx以内でスワイプ開始 → 開く
  const MIN_DIST=60;  // 最低スワイプ距離(px)
  const ANGLE=0.6;    // 水平判定: |dy|/|dx| < ANGLE なら水平スワイプとみなす

  document.addEventListener('touchstart',e=>{
    if(window.innerWidth>768)return;
    const t=e.touches[0];
    if(t.clientX<=EDGE&&!S.sidebarOpen){
      // 左端から右スワイプ → 開く候補
      startX=t.clientX;startY=t.clientY;tracking='open';
    } else if(S.sidebarOpen&&t.clientX<=280){
      // サイドバー内から左スワイプ → 閉じる候補
      startX=t.clientX;startY=t.clientY;tracking='close';
    }
  },{passive:true});

  // touchend で判定することで垂直スクロールとの誤作動を防止
  document.addEventListener('touchend',e=>{
    if(!tracking)return;
    const dx=e.changedTouches[0].clientX-startX;
    const dy=e.changedTouches[0].clientY-startY;
    // 縦成分が横成分より大きい場合は無視
    if(Math.abs(dy)>Math.abs(dx)*ANGLE){tracking=false;return;}
    if(tracking==='open'&&dx>=MIN_DIST){
      S.sidebarOpen=true;S._sidebarJustOpened=Date.now();render();
    } else if(tracking==='close'&&dx<=-MIN_DIST){
      S.sidebarOpen=false;render();
    }
    tracking=false;
  },{passive:true});

  document.addEventListener('touchcancel',()=>{tracking=false;},{passive:true});
})();

(function(){

  }

// ===== BACKUP =====
async function saveBackup(label){
  const data={
    tasks:S.tasks,
    projects:S.projects,
    tags:S.tags,
  };
  const uid2=window._currentUser?.id;
  if(!uid2)throw new Error('ログインが必要です');
  const backup={id:uid(),label,created_at:now(),data:JSON.stringify(data),user_id:uid2};
  const{error}=await window._SB.from('backups').insert(backup);
  if(error)throw error;
  return backup;
}

async function loadBackups(){
  const uid2=window._currentUser?.id;
  if(!uid2)return[];
  const{data,error}=await window._SB.from('backups').select('*').eq('user_id',uid2).order('created_at',{ascending:false}).limit(20);
  if(error)throw error;
  return data||[];
}

async function deleteBackup(id){
  const{error}=await window._SB.from('backups').delete().eq('id',id);
  if(error)throw error;
}

async function restoreBackup(backup){
  const data=JSON.parse(backup.data);
  // 現在のデータを全削除してから復元
  for(const t of S.tasks)await dbDel('tasks',t.id);
  for(const p of S.projects)await dbDel('projects',p.id);
  for(const g of S.tags)await dbDel('tags',g.id);
  // 復元
  for(const t of data.tasks||[])await dbPut('tasks',t);
  for(const p of data.projects||[])await dbPut('projects',p);
  for(const g of data.tags||[])await dbPut('tags',g);
  await loadAll();
  render();
}

  // ===== CSV ユーティリティ =====
  function toShiftJIS(str){
    // TextEncoder/Decoderでは直接ShiftJISに変換できないため、
    // BOMなしShiftJISをUint8Arrayで生成するため文字コード変換テーブルを使う
    // ブラウザ標準APIにShiftJIS encoderがないので、
    // iconv-liteなどは使えない環境のためXMLHttpRequestを使ったBlobで対応
    const buf=[];
    const encoder=new TextEncoder();
    // ShiftJISマッピングテーブルをCanvas経由で得る方法はないため、
    // UTF-8 BOM付きCSVとして出力しExcelでも文字化けしない形式にする
    // ※ ShiftJISへの変換はサーバーサイドなしでは困難なため
    //   BOM付きUTF-8（\uFEFF）を付けることでExcelが正しく認識する
    return encoder.encode('\uFEFF'+str);
  }

  function downloadCSV(filename, csvStr){
    const bytes=toShiftJIS(csvStr);
    const blob=new Blob([bytes],{type:'text/csv;charset=utf-8'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=filename;
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),3000);
  }

  function escCsv(v){
    if(v===null||v===undefined)return'';
    const s=String(v).replace(/"/g,'""');
    return(s.includes(',')||s.includes('"')||s.includes('\n'))?'"'+s+'"':s;
  }

  // 複数行セル（改行を含むbody等）に対応したCSVパーサー
  function parseCsv(text){
    // BOM除去・改行統一
    const t=(text.startsWith('\uFEFF')?text.slice(1):text).replace(/\r\n/g,'\n').replace(/\r/g,'\n');
    if(!t.trim())return{headers:[],rows:[]};
    // 全体を1文字ずつスキャンしてトークン分割
    const tokens=[];let cur='';let inQ=false;
    for(let i=0;i<t.length;i++){
      const c=t[i];
      if(inQ){
        if(c==='"'&&t[i+1]==='"'){cur+='"';i++;}
        else if(c==='"'){inQ=false;}
        else{cur+=c;}
      } else {
        if(c==='"'){inQ=true;}
        else if(c===','){tokens.push({v:cur,nl:false});cur='';}
        else if(c==='\n'){tokens.push({v:cur,nl:true});cur='';}
        else{cur+=c;}
      }
    }
    tokens.push({v:cur,nl:true});
    // トークン列を行に組み立て
    const allRows=[];let row=[];
    for(const tk of tokens){
      row.push(tk.v);
      if(tk.nl){allRows.push(row);row=[];}
    }
    // 先頭行をヘッダーに

    +'</div>'

  document.body.appendChild(ov);requestAnimationFrame(()=>ov.classList.add('open'));
  // ov.querySelector で ID重複を回避（複数モーダルが重なっても正しく動作）
  const cancelBtn=ov.querySelector('#m-cancel');
  const okBtn=ov.querySelector('#m-ok');
  cancelBtn.onclick=()=>ov.remove();
  okBtn.onclick=async()=>{ov.remove();await onOk()};
  // フォーカスをキャンセルボタンへ移動（Enterキーで背後のボタンが再発火するのを防ぐ）
  requestAnimationFrame(()=>cancelBtn?.focus());
  // キーボード操作
  ov.addEventListener('keydown',e=>{
    if(e.key==='Escape'){e.stopPropagation();ov.remove();}
    else if(e.key==='Enter'){e.stopPropagation();}// デフォルト(キャンセルボタンが focused のため Enter=キャンセル)
  });
  // オーバーレイ外クリックで閉じる
  ov.addEventListener('click',e=>{if(e.target===ov)ov.remove();});
}

// ===== PULL TO REFRESH =====
(function(){
  const el=document.getElementById('content');
  const ind=document.getElementById('ptr-indicator');
  const lbl=document.getElementById('ptr-label');
  let startY=0,pulling=false,triggered=false,syncing=false;
  const THRESHOLD=72;

  el.addEventListener('touchstart',e=>{
    if(el.scrollTop===0)startY=e.touches[0].clientY;
  },{passive:true});

  el.addEventListener('touchmove',e=>{
    if(!startY||syncing)return;
    const dy=e.touches[0].clientY-startY;
    if(dy<0){startY=0;return}
    if(dy>8){pulling=true}
    if(!pulling)return;
    const pull=Math.min(dy,THRESHOLD+24);
    ind.style.transform='translateY('+(pull-56)+'px)';
    ind.style.opacity=Math.min(pull/THRESHOLD,1);
    lbl.textContent=pull>=THRESHOLD?'離して同期':'引っ張って同期';
    triggered=pull>=THRESHOLD;
  },{passive:true});

  el.addEventListener('touchend',async()=>{
    if(!pulling){startY=0;return}
    pulling=false;startY=0;
    if(!triggered){
      ind.style.transform='translateY(-56px)';
      ind.style.opacity=0;
      return;
    }
    // sync
    syncing=true;
    const spinner=document.getElementById('ptr-spinner');
    ind.style.transform='translateY(0px)';
    spinner.classList.add('spinning');
    lbl.textContent='同期中…';
    try{
      await loadAll();
      render();
      lbl.textContent='✓ 同期完了';
      await new Promise(r=>setTimeout(r,800));
    }catch(err){
      lbl.textContent='同期失敗…';
      await new Promise(r=>setTimeout(r,1000));
    }
    ind.style.transform='translateY(-56px)';
    ind.style.opacity=0;
    spinner.classList.remove('spinning');
    syncing=false;triggered=false;
  });
})();

async function aiExecuteActions(actions){
  const done=[];
  // タグ名→IDを解決（未登録なら自動作成）
  async function resolveTagIds(tagNames){
    if(!tagNames||!tagNames.length)return[];
    const ids=[];
    for(const name of (Array.isArray(tagNames)?tagNames:[tagNames])){
      if(!name)continue;
      let tag=S.tags.find(t=>t.name===name);
      if(!tag){tag=mkTag({name,color:'#7c3aed'});await saveTag(tag);}
      if(!ids.includes(tag.id))ids.push(tag.id);
    }
    return ids;
  }
  for(const a of actions){
    try{
      if(a.type==='addTask'){
        if(isPlanFree()&&getActiveTaskCount()>=getPlanDef().taskLimit){done.push({...a,label:a.title,error:'タスク上限（'+getPlanDef().taskLimit+'件）に達しています。スタンダードプランにアップグレードしてください。'});continue;}
        const tagIds=await resolveTagIds(a.tagNames);
        const t=mkTask({
          title:a.title||'新しいタスク',
          dueAt:a.dueAt||null,
          priority:a.priority||4,
          flagged:a.flagged||false,
          projectId:a.projectId?S.projects.find(p=>p.name===a.projectId)?.id||null:null,
          tagIds,
          status:(a.projectId&&S.projects.find(p=>p.name===a.projectId))?'active':'inbox',
        });
        await saveTask(t);
        done.push({...a,label:a.title});
      } else if(a.type==='completeTask'){
        const _ct=a.taskId
          ?[S.tasks.find(x=>x.id===a.taskId)].filter(Boolean)
          :a.keyword?S.tasks.filter(x=>x.title&&x.title.includes(a.keyword)&&x.status!=='completed'):[];
        for(const t of _ct){t.status='completed';t.completedAt=now();await saveTask(t);done.push({...a,label:t.title});}
      } else if(a.type==='deleteTask'){
        const t=a.keyword?S.tasks.find(x=>x.title&&x.title.includes(a.keyword)):null;
        if(t){await delTask(t.id);done.push({...a,label:t.title})}
      } else if(a.type==='updateTask'){
        // keywordまたはidで対象タスクを特定。複数マッチ・id直接指定にも対応
        let targets=[];
        if(a.taskId){
          const t=S.tasks.find(x=>x.id===a.taskId);
          if(t)targets=[t];
        } else if(a.keyword){
          // 完全一致を優先、なければ部分一致
          const exact=S.tasks.filter(x=>x.title===a.keyword&&x.status!=='completed');
          targets=exact.length?exact:S.tasks.filter(x=>x.title&&x.title.includes(a.keyword)&&x.status!=='completed');
        }
        for(const t of targets){
          if(!t.tagIds)t.tagIds=[];// tagIds未初期化ガード
          if(a.dueAt!==undefined)t.dueAt=a.dueAt;
          if(a.startAt!==undefined)t.startAt=a.startAt;
          if(a.priority!==undefined)t.priority=a.priority;
          if(a.flagged!==undefined)t.flagged=a.flagged;
          if(a.newTitle)t.title=a.newTitle;
          if(a.repeatRule!==undefined)t.repeatRule=a.repeatRule||null;
          // 時刻フィールド（HH:MM形式でdueAt/startAtに付加）
          if(a.startTime&&t.startAt)t.startAt=t.startAt.slice(0,10)+'T'+a.startTime+':00';
          if(a.dueTime&&t.dueAt)t.dueAt=t.dueAt.slice(0,10)+'T'+a.dueTime+':00';
          // メモ追記
          if(a.appendNote){
            t.notes=(t.notes?t.notes+'\n':'')+a.appendNote;
          }
          if(a.projectId!==undefined){
            const proj=S.projects.find(p=>p.name===a.projectId);
            t.projectId=proj?proj.id:null;
            if(t.projectId&&t.status==='inbox')t.status='active';
          }
          // タグの追加・置換
          if(a.tagNames!==undefined){
            const newIds=await resolveTagIds(a.tagNames);
            if(a.appendTags){
              newIds.forEach(id=>{if(!t.tagIds.includes(id))t.tagIds.push(id);});
            } else {
              t.tagIds=newIds;
            }
          }
          await saveTask(t);done.push({...a,label:t.title});
        }
      } else if(a.type==='addProject'){
        const p=mkProject({name:a.name,color:a.color||'#3b82f6'});
        await saveProject(p);done.push({...a,label:a.name});
      } else if(a.type==='addSubtask'){
        let parent=a.parentTaskId?S.tasks.find(x=>x.id===a.parentTaskId):null;
        if(!parent&&a.parentKeyword)parent=S.tasks.find(x=>x.title&&x.title.includes(a.parentKeyword)&&x.status!=='completed');
        if(parent){
          const sub=mkTask({
            title:a.title||'サブタスク',
            parentTaskId:parent.id,
            projectId:parent.projectId,
            status:parent.status==='inbox'?'inbox':'active',
            dueAt:a.dueAt||parent.dueAt,
            priority:a.priority||parent.priority,
            notes:a.notes||'',
          });
          await saveTask(sub);done.push({...a,label:a.title+'（'+parent.title+'のサブタスク）'});
        } else {
          done.push({...a,label:a.title,error:'親タスクが見つかりません'});
        }
      } else if(a.type==='addTag'){
        const exists=S.tags.find(t=>t.name===a.name);
        if(exists){
          done.push({...a,label:a.name,error:'同名タグが既に存在します'});
        } else {
          const tag=mkTag({name:a.name,color:a.color||'#7c3aed'});
          await saveTag(tag);done.push({...a,label:'#'+a.name});
        }
      } else if(a.type==='addNote'){
        const tagIds=await resolveTagIds(a.tagNames||[]);
        const note=mkNote({title:a.title||'無題',body:a.body||'',tagIds});
        await saveNote(note);
        done.push({...a,label:a.title});
      }
    }catch(e){console.error('action error',e)}
  }
  if(done.length)render();
  return done;
}

async function aiSend(){
  const inp=document.getElementById('ai-input');
  const text=inp.value.trim();
  if(!text||AI.loading)return;

  inp.value='';inp.style.height='auto';
  aiAddMsg('user',text);
  AI.loading=true;aiRender();

  // 現在の状態をコンテキストとして渡す
  // 現在表示中のタスクを特定

    const t2=today();
    if(S.view==='today')return S.tasks.filter(x=>(isToday(x.dueAt)||x.flagged)&&x.status!=='completed');
    if(S.view==='next')return S.tasks.filter(x=>x.startAt&&x.startAt>t2&&x.status!=='completed').slice(0,20);
    if(S.view==='flagged')return S.tasks.filter(x=>x.flagged&&x.status!=='completed');
    if(S.view==='inbox')return S.tasks.filter(x=>x.status==='inbox'&&!x.parentTaskId);
    if(S.view==='project')return S.tasks.filter(x=>x.projectId===S.projId&&x.status!=='completed');
    if(S.view==='tag')return S.tasks.filter(x=>(x.tagIds||[]).includes(S.tagId)&&x.status!=='completed');
    return [];
  })();

    currentView:S.view,

      id:t.id,title:t.title,dueAt:t.dueAt,startAt:t.startAt,
      priority:t.priority,flagged:t.flagged,repeatRule:t.repeatRule,

      project:S.projects.find(p=>p.id===t.projectId)?.name||null,

    })),
    tasks:S.tasks.filter(t=>t.status!=='completed').map(t=>({
      id:t.id,title:t.title,status:t.status,priority:t.priority,

    projects:S.projects.filter(p=>p.status==='active').map(p=>({name:p.name,color:p.color})),

  const systemPrompt=`あなたはタスク管理アプリ「Taskra」のAIアシスタントです。
ユーザーの依頼に応じて、提供されたツールを使ってタスクを操作してください。

## 現在のデータ
${JSON.stringify(context,null,2)}

- dueAtは"YYYY-MM-DD"形式。今日は${today()}
- 提供されたツール以外の操作（カレンダー連携・外部サービス・ファイル操作など）はできないことを正直に伝える
- 操作不要な質問や雑談には reply_to_user で返答する
- タスクが見つからない場合は reply_to_user で丁寧に伝える
- 複数の操作を一度にまとめて実行できる（複数ツール呼び出し可）
- 「今のビューの」「表示されているタスク」などはcurrentViewTasksを参照する
- repeat_ruleの書式: daily/weekly/monthly/yearly/weekdays/weekly:mon,wed,fri/monthly:1,15,25
- append_noteはメモへの追記。既存メモを上書きしない
- start_time/due_timeはHH:MM形式（24時間）
- 【重要】「ノートを追加」「Note追加」「メモを作って」→ 必ず add_note ツールを使う。add_task は絶対に使わない
- 【重要】add_note の body フィールドには必ずユーザーが指定した内容を入れる。省略しない
- タスクのメモ（notes）への追記は append_note フィールドを使う。ノート（Note機能）とは別物
- 【重要】サブタスク作成時、内容の説明・コツ・参考情報・URLなどを求められた場合は notes フィールドに詳細を記載する。Web検索はできないが、知識の範囲で有用な情報を入れること`;

  // ── ツール定義 ──────────────────────────────────────────
  const tools=[
    {
      name:'reply_to_user',
      description:'操作を伴わない返答、質問への回答、できないことの説明、エラー報告などテキスト返答のみ行う場合に使う',
      input_schema:{
        type:'object',
        properties:{
          message:{type:'string',description:'ユーザーへの返答（日本語）'},
        },
        required:['message'],
      },
    },
    {
      name:'add_task',
      description:'新しいタスクを追加する',
      input_schema:{
        type:'object',
        properties:{
          title:{type:'string',description:'タスクのタイトル'},
          due_at:{type:'string',description:'期日 YYYY-MM-DD形式。不明な場合はnull'},
          priority:{type:'number',description:'優先度 1=高 2=中 3=低 4=なし'},
          flagged:{type:'boolean',description:'フラグ'},

          tag_names:{type:'array',items:{type:'string'},description:'タグ名の配列'},
        },
        required:['title'],
      },
    },
    {
      name:'complete_task',
      description:'タスクを完了にする',
      input_schema:{
        type:'object',
        properties:{
          task_id:{type:'string',description:'タスクID（推奨）'},
          keyword:{type:'string',description:'タイトルの一部（task_id不明時）'},
        },
      },
    },
    {
      name:'update_task',
      description:'タスクを更新する（タイトル変更・期日変更・タグ追加など）',
      input_schema:{
        type:'object',
        properties:{
          task_id:{type:'string',description:'タスクID（推奨）'},
          keyword:{type:'string',description:'タイトルの一部（task_id不明時）'},
          new_title:{type:'string',description:'新しいタイトル'},
          due_at:{type:'string',description:'新しい期日 YYYY-MM-DD'},
          priority:{type:'number',description:'優先度 1-4'},
          flagged:{type:'boolean',description:'フラグ'},
          project_name:{type:'string',description:'プロジェクト名'},
          tag_names:{type:'array',items:{type:'string'},description:'タグ名の配列'},
          append_tags:{type:'boolean',description:'trueなら既存タグに追記、falseなら置換'},
        },
      },
    },
    {
      name:'delete_task',
      description:'タスクを削除する',
      input_schema:{
        type:'object',
        properties:{
          task_id:{type:'string',description:'タスクID（推奨）'},
          keyword:{type:'string',description:'タイトルの一部（task_id不明時）'},
        },
      },
    },
    {
      name:'add_project',
      description:'新しいプロジェクトを追加する',
      input_schema:{
        type:'object',
        properties:{
          name:{type:'string',description:'プロジェクト名'},
          color:{type:'string',description:'カラーコード #xxxxxx'},
        },
        required:['name'],
      },
    },
    {
      name:'add_subtask',
      description:'既存タスクにサブタスクを追加する',
      input_schema:{
        type:'object',
        properties:{
          parent_task_id:{type:'string',description:'親タスクのID'},
          parent_keyword:{type:'string',description:'親タスクのタイトルの一部（parent_task_id不明時）'},
          title:{type:'string',description:'サブタスクのタイトル'},
          due_at:{type:'string',description:'期日 YYYY-MM-DD'},
          priority:{type:'number',description:'優先度 1-4'},
          notes:{type:'string',description:'メモ・詳細情報・コツ・参考URLなど。サブタスクの説明や補足情報を入れる'},
        },
        required:['title'],
      },
    },
    {
      name:'add_tag',
      description:'新しいタグを作成する',
      input_schema:{
        type:'object',
        properties:{
          name:{type:'string',description:'タグ名'},
          color:{type:'string',description:'カラーコード #xxxxxx。省略時は紫'},
        },
        required:['name'],
      },
    },
    {
      name:'add_note',
      description:'新しいノート（メモ帳）を作成する。「ノート追加」「Note追加」「メモを作って」などの指示に使う。タスクとは別の機能',
      input_schema:{
        type:'object',
        properties:{
          title:{type:'string',description:'ノートのタイトル'},
          body:{type:'string',description:'ノートの本文・内容。ユーザーが指定した内容を必ず入れる'},
          tag_names:{type:'array',items:{type:'string'},description:'タグ名の配列'},
        },
        required:['title'],
      },
    },
  ];
  // update_taskツール定義にフィールドを追加（既存定義を拡張）
  const updateTaskTool=tools.find(t=>t.name==='update_task');
  if(updateTaskTool){
    Object.assign(updateTaskTool.input_schema.properties,{
      start_at:{type:'string',description:'開始日 YYYY-MM-DD'},

    });
  }

  try{
    const { data: { session } } = await window._SB.auth.getSession();
    if(!session?.access_token){
      AI.loading=false;
      aiAddMsg('ai','ログインが必要です。再度ログインしてください。');
      aiRender();
      return;
    }

    // 会話履歴を構築（tool_use対応形式）
    const messages=AI.msgs.filter(m=>!m.loading).slice(-8).map(m=>({
      role:m.role==='user'?'user':'assistant',
      content:m.role==='user'?m.text:(m.toolUseBlocks||[{type:'text',text:m.text}]),
    }));

    const res=await fetch(AI_ENDPOINT,{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'Authorization':'Bearer '+session.access_token,
      },
      body:JSON.stringify({
        model:'claude-sonnet-4-20250514',

        messages,
        tools,

    });

      AI.loading=false;
      aiAddMsg('ai',data.message||'今月のAI利用回数が上限に達しました。');
      aiRender();
      showUpgradeModal('ai');
      return;

    if(data._usage){
      AI.usageCount=data._usage.count;
      AI.usageLimit=data._usage.limit;
      aiUpdateUsageLabel();
    }

    // ── tool_useレスポンスを処理 ────────────────────────────
    const toolUseBlocks=data.content||[];
    let replyMessage='';
    const actions=[];

    for(const block of toolUseBlocks){
      if(block.type==='text'){
        replyMessage+=block.text;
      } else if(block.type==='tool_use'){
        const inp=block.input||{};
        if(block.name==='reply_to_user'){
          replyMessage+=inp.message||'';
