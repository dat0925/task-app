// ===== SUBTASK DRAG & DROP SORT =====
function initSubDrag(container){
  let dragSrc=null;
  // Mouse drag
  container.querySelectorAll('.sub-drag-handle').forEach(handle=>{
    const item=handle.closest('.sub-item');
    item.setAttribute('draggable','true');
    item.addEventListener('dragstart',e=>{
      dragSrc=item;
      item.classList.add('dragging');
      e.dataTransfer.effectAllowed='move';
    });
    item.addEventListener('dragend',()=>{
      item.classList.remove('dragging');
      container.querySelectorAll('.sub-item').forEach(i=>i.classList.remove('drag-over'));
      dragSrc=null;
    });
  });
  container.addEventListener('dragover',e=>{
    e.preventDefault();
    const target=e.target.closest('.sub-item');
    if(!target||target===dragSrc)return;
    container.querySelectorAll('.sub-item').forEach(i=>i.classList.remove('drag-over'));
    target.classList.add('drag-over');
  });
  container.addEventListener('drop',async e=>{
    e.preventDefault();
    const target=e.target.closest('.sub-item');
    if(!target||target===dragSrc||!dragSrc)return;
    const items=[...container.querySelectorAll('.sub-item')];
    const srcIdx=items.indexOf(dragSrc);
    const tgtIdx=items.indexOf(target);
    if(srcIdx<tgtIdx)target.after(dragSrc);else target.before(dragSrc);
    container.querySelectorAll('.sub-item').forEach(i=>i.classList.remove('drag-over'));
    await _saveSubOrder(container);
  });

  // Touch drag
  let touchDragSrc=null,touchClone=null,touchOffX=0,touchOffY=0;
  container.querySelectorAll('.sub-drag-handle').forEach(handle=>{
    handle.addEventListener('touchstart',e=>{
      const item=handle.closest('.sub-item');
      touchDragSrc=item;
      const r=item.getBoundingClientRect();
      const t=e.touches[0];
      touchOffX=t.clientX-r.left;touchOffY=t.clientY-r.top;
      touchClone=item.cloneNode(true);
      touchClone.style.cssText='position:fixed;z-index:9999;width:'+r.width+'px;opacity:.8;pointer-events:none;left:'+(t.clientX-touchOffX)+'px;top:'+(t.clientY-touchOffY)+'px;box-shadow:0 4px 16px rgba(0,0,0,.2)';
      document.body.appendChild(touchClone);
      item.classList.add('dragging');
    },{passive:true});
  });
  document.addEventListener('touchmove',e=>{
    if(!touchDragSrc)return;
    const t=e.touches[0];
    if(touchClone){touchClone.style.left=(t.clientX-touchOffX)+'px';touchClone.style.top=(t.clientY-touchOffY)+'px';}
    container.querySelectorAll('.sub-item').forEach(i=>i.classList.remove('drag-over'));
    const el=document.elementFromPoint(t.clientX,t.clientY);
    const over=el&&el.closest('.sub-item');
    if(over&&over!==touchDragSrc)over.classList.add('drag-over');
  },{passive:true});
  document.addEventListener('touchend',async e=>{
    if(!touchDragSrc)return;
    if(touchClone){touchClone.remove();touchClone=null;}
    const t=e.changedTouches[0];
    const el=document.elementFromPoint(t.clientX,t.clientY);
    const target=el&&el.closest('.sub-item');
    touchDragSrc.classList.remove('dragging');
    container.querySelectorAll('.sub-item').forEach(i=>i.classList.remove('drag-over'));
    if(target&&target!==touchDragSrc){
      const items=[...container.querySelectorAll('.sub-item')];
      const srcIdx=items.indexOf(touchDragSrc);
      const tgtIdx=items.indexOf(target);
      if(srcIdx<tgtIdx)target.after(touchDragSrc);else target.before(touchDragSrc);
      await _saveSubOrder(container);
    }
    touchDragSrc=null;
  },{passive:true});
}
async function _saveSubOrder(container){
  const items=[...container.querySelectorAll('.sub-item[data-id]')];
  for(let i=0;i<items.length;i++){
    const id=items[i].dataset.id;
    const task=S.tasks.find(t=>t.id===id);
    if(task){task.order=i*100;task.updatedAt=now();await saveTask(task);}
  }
}

        +'<div class="cm-list" id="cm-list"><div class="cm-loading">読み込み中…</div></div>'
        +'<div class="cm-composer">'
          +'<div style="display:flex;gap:4px">'
          +'<button class="note-copy-btn" id="cm-link-btn">リンク</button>'
          +'<button class="note-copy-btn" data-a="cm-stamp" data-type="datetimeweek">日時</button>'
        +'</div>'
        +'<div id="cm-mention-bar" style="display:none;flex-wrap:wrap;gap:4px"></div>'
        +'<div class="cm-input-row">'
          +'<textarea class="cm-textarea" id="cm-input" placeholder="コメントを追加… (Cmd+Enterで送信)" rows="1"></textarea>'
          +'<button class="cm-send-btn" id="cm-send" disabled>送信</button>'
        +'</div>'
      +'</div>'
      +'</div>'
    +'</div>'
  ;
}

// 作成/更新日時と自動保存の表示
function _dtMeta(c){
  const {task,subs,done,pLabels}=c;
  return ''
    +'<div style="display:flex;align-items:center;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:1px solid var(--border)">'
      +'<div class="muted xs" style="line-height:2">'
          +'<div>作成: '+new Date(task.createdAt).toLocaleString('ja-JP')+' </div>'
          +'<div>更新: '+new Date(task.updatedAt).toLocaleString('ja-JP')+' </div>'
        +'</div>'
        +'<div class="autosave-ind" id="autosave-ind">自動保存 ✓</div>'
      +'</div>'
  ;
}

// フッタ（完了ボタン・モバイル操作バー）
function _dtFoot(c){
  const {task,subs,done,pLabels}=c;
  return ''
    +'<div class="drawer-foot drawer-foot-desktop">'
      +(!done
        ?'<button class="btn btn-complete" data-a="complete-confirm" data-id="'+task.id+'">✓ 完了</button>'
        :'<button class="btn btn-ghost" data-a="uncomplete" data-id="'+task.id+'">↩ 未完了に戻す</button>')
      +'<div style="display:flex;gap:4px;margin-left:auto;align-items:center">'
        +'<button class="btn btn-ghost" data-a="close-drawer">✕ 閉じる</button>'
      +'</div>'
    +'</div>'
    +'<div class="mob-action-bar">'
      +(!done
        ?'<button class="mob-btn mob-btn-complete" data-a="complete-confirm" data-id="'+task.id+'">完了</button>'
        :'<button class="mob-btn mob-btn-ghost" data-a="uncomplete" data-id="'+task.id+'">↩ 戻す</button>')
      +'<button class="mob-btn mob-btn-ghost" id="copy-url-btn-mob"><span class="mob-btn-ico">🔗</span>コピー</button>'
      +(task.projectId?'<button class="mob-btn mob-btn-ghost" data-a="move-to-top" data-id="'+task.id+'"><span class="mob-btn-ico">↑</span>最上部</button>':'')
      +'<button class="mob-btn mob-btn-ghost" id="task-more-btn" style="letter-spacing:1px">•••</button>'
      +'<button class="mob-btn-close" data-a="close-drawer">✕</button>'
    +'</div>';
  ;
}

function renderDrawer(){
  const dr=document.getElementById('drawer');
  if(!S.drawerOpen||!S.taskId||S.view==='notes'){
    // 拡大表示中にドロワーを閉じる場合は、先にドロワー要素を元の位置へ戻す
    // （モーダル内で display:none にすると空のモーダルが残る）
    if(!S.noteOpen)closeExpandModal(false);
    if(!S.noteOpen){dr.style.display='none';dr.classList.remove('open');history.replaceState(null,'',location.pathname);const _m=document.querySelector('.main');if(_m)_m.style.maxWidth='';}
    return;
  }
  // スクロール位置を保持
  const _drBody=dr.querySelector('.drawer-body');
  const _scrollY=_drBody?_drBody.scrollTop:0;
  // 集中モードは本体でなく列がスクロールするので、列単位で位置を控える
  const _fzScroll={};
  ['.fz-rail','.fz-main','.fz-side'].forEach(sel=>{const _z=dr.querySelector(sel);if(_z&&_z.scrollTop>0)_fzScroll[sel]=_z.scrollTop;});
  const task=S.tasks.find(t=>t.id===S.taskId);
  if(!task){closeExpandModal(false);dr.style.display='none';dr.classList.remove('open');const _mr=document.querySelector('.main');if(_mr)_mr.style.maxWidth='';return}
  // 再描画（バックグラウンド同期など）で入力途中の内容が消えないよう、未保存の下書きを退避
  // （同じタスクを開いたままの再描画時のみ。復元は innerHTML 再構築後）
  let _draft=null;
  if(dr._taskId===task.id){
    const _dCi=dr.querySelector('#cm-input');
    const _dDn=dr.querySelector('#dt-notes');
    const _dDt=dr.querySelector('#dt-title');
    _draft={cm:_dCi?_dCi.value:null,notes:_dDn?_dDn.value:null,title:_dDt?_dDt.value:null};
  }
  // タスクのプロジェクトをrecentに記録
  if(task.projectId)addRecentProject(task.projectId);
  dr.style.display='flex';
  // 拡大表示中はドロワーがレイアウトから外れているので幅制限を計算しない
  // （モーダルの幅 860px を引いてしまい main が潰れる）
  const _mainEl=document.querySelector('.main');if(_mainEl&&window.innerWidth>768&&!isExpandOpen()){const _sbW=document.getElementById('sidebar')?.getBoundingClientRect().width||0;const _drW=dr.getBoundingClientRect().width||336;_mainEl.style.maxWidth=(window.innerWidth-_sbW-_drW)+'px';}
  dr.classList.add('open');
  const subs=S.tasks.filter(t=>t.parentTaskId===task.id);
  const done=task.status==='completed';
  const pLabels={1:'高',2:'中',3:'低',4:'無'};
  // セクション部品へ渡すコンテキスト（集中モードでも同じものを使う）
  const c={task,subs,done,pLabels};
  // 集中モード（最大化）とドロワで器を切り替える。
  // 部品（_dt*）は共通で、どのゾーンに置くかだけが違う。
  const _fz=isExpandOpen();
  dr.innerHTML= _fz
    ? _dtHead(c)
      +'<div class="drawer-body fz">'
        +'<div class="fz-band">'
          +_dtParentRow(c)
          +_dtTitleField(c)
        +'</div>'
        +'<div class="fz-cols">'
          +'<div class="fz-zone fz-main">'
            +_dtMemo(c)
            +_dtSubs(c)
            +_attSectionHTML('task',task.id)
          +'</div>'
          +'<div class="fz-zone fz-side">'
            +_dtComments(c)
          +'</div>'
          +'<div class="fz-zone fz-rail">'
            +'<span class="fz-zone-label">属性</span>'
            +_dtPriTags(c,'rail')
            +_dtProject(c)
            +_dtSchedule(c)
            +_dtMeta(c)
          +'</div>'
        +'</div>'
      +'</div>'
      +_dtFoot(c)
    : _dtHead(c)
    +'<div class="drawer-body">'
      +_dtNav(c)
      +_dtIdentity(c)

      +_dtProject(c)
      +_dtSchedule(c)
      +_dtMemo(c)
      +_dtSubs(c)
      +_attSectionHTML('task',task.id)
      +_dtComments(c)
    +_dtMeta(c)
    +'</div>'
    +_dtFoot(c);
  // 集中モードは「一望できる」ことが価値なので、折りたたみは開いた状態で描画する。
  // トグル自体は殺さない（閉じたい人は閉じられる）。
  if(_fz){
    dr.querySelectorAll('.dt-section-head.closed,.dt-section-chev.closed').forEach(el=>el.classList.remove('closed'));
    dr.querySelectorAll('.dt-section-body').forEach(b=>{if(b.style.display==='none')b.style.display='';});
  }


  // URL sync
  const taskUrl=location.origin+location.pathname+'#task/'+task.id;
  history.replaceState(null,'',taskUrl);

  // copy URL button (desktop + mobile)
  let _lastCopyUrlAt=0;
  async function copyTaskUrl(){
    if(_touchMoved)return;
    const _now=Date.now();if(_now-_lastCopyUrlAt<600)return;_lastCopyUrlAt=_now;
    try{await navigator.clipboard.writeText(taskUrl);toast('URLをコピーしました 🔗');}
    catch(e){const inp=document.createElement('input');inp.value=taskUrl;document.body.appendChild(inp);inp.select();inp.setSelectionRange(0,9999);document.execCommand('copy');inp.remove();toast('URLをコピーしました 🔗');}
  }
  document.getElementById('copy-url-btn')?.addEventListener('click',copyTaskUrl);
  document.getElementById('copy-url-btn-mob')?.addEventListener('click',copyTaskUrl);

  // ••• メニュー
  document.getElementById('task-more-btn')?.addEventListener('click',e=>{
    if(_touchMoved)return;
    e.stopPropagation();
    // 既存メニューがあれば閉じる
    document.getElementById('task-more-menu')?.remove();
    const menu=document.createElement('div');
    menu.id='task-more-menu';
    menu.style.cssText='position:fixed;bottom:64px;left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:360px;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:0 8px 32px rgba(0,0,0,.18);z-index:9999;overflow:hidden';
    const items=[
      {label:'タスクを削除',action:'del-confirm-hdr',id:task.id,danger:true},
      {label:'Noteに変換して削除',action:'task-to-note',id:task.id},
      {label:'メモ欄をクリア',action:'clear-task-notes',id:task.id},
      {label:'複製する',action:'dup',id:task.id},
    ];
    // 「タスクのURLをコピー」「プロジェクトの最上部へ移動」は下部アクションバーのボタンに昇格したためメニューからは除外
    items.forEach((item,i)=>{
      const btn=document.createElement('button');
      btn.style.cssText='width:100%;padding:15px 18px;background:none;border:none;border-top:'+(i===0?'none':'1px solid var(--border)')+';font-size:15px;color:'+(item.danger?'#c0392b':'var(--text)')+';text-align:left;cursor:pointer;display:block'+(item.danger?';font-weight:600':'');
      btn.textContent=item.label;
      btn.addEventListener('click',e=>{
        e.stopPropagation();
        menu.remove();overlay.remove();
        if(item.action==='copy-task-url'){copyTaskUrl();return;}
        // data-a経由でhandleAction呼び出し
        const dummy=document.createElement('button');
        dummy.dataset.a=item.action;
        dummy.dataset.id=item.id;
        document.body.appendChild(dummy);
        dummy.click();
        dummy.remove();
      });
      menu.appendChild(btn);
    });
    // キャンセルボタン
    const cancel=document.createElement('button');
    cancel.style.cssText='width:100%;padding:15px 18px;background:none;border:none;border-top:1px solid var(--border);font-size:15px;color:var(--text3);text-align:center;cursor:pointer;font-weight:600;display:block';
    cancel.textContent='キャンセル';
    cancel.addEventListener('click',e=>{e.stopPropagation();menu.remove();overlay.remove();});
    menu.appendChild(cancel);
    const overlay=document.createElement('div');
    overlay.style.cssText='position:fixed;inset:0;z-index:9998;background:rgba(0,0,0,.3)';
    overlay.addEventListener('click',()=>{menu.remove();overlay.remove();});
    document.body.appendChild(overlay);
    document.body.appendChild(menu);
  });

  // 退避した未保存の下書きを復元（同じタスクの再描画時のみ）
  dr._taskId=task.id;dr._noteId=null;
  if(_draft){
    const _rCi=dr.querySelector('#cm-input');
    if(_rCi&&_draft.cm)_rCi.value=_draft.cm;
    const _rDn=dr.querySelector('#dt-notes');
    if(_rDn&&_draft.notes!=null&&_draft.notes!==_rDn.value)_rDn.value=_draft.notes;
    const _rDt=dr.querySelector('#dt-title');
    if(_rDt&&_draft.title!=null&&_draft.title!==_rDt.value)_rDt.value=_draft.title;
  }

  // attach drawer input events
  const setInd=(s)=>{const el=document.getElementById('autosave-ind');if(!el)return;el.className='autosave-ind '+s;el.textContent=s==='saving'?'保存中…':s==='saved'?'保存済み ✓':'自動保存 ✓'};
  let _composing=false;
  const autosave=(force)=>{
    if(_composing&&!force)return;
    setInd('saving');
    clearTimeout(autosave._t);
    autosave._t=setTimeout(async()=>{
      const t2=S.tasks.find(x=>x.id===S.taskId);if(!t2)return;
      // 【重要】400msのデバウンス待ちの間にドロワーが閉じる・別タスク/ノートに切り替わる・
      // render()でDOMが作り直されると、入力欄が取得できなくなる。
      // 以前はその場合でも ?.value||'' / ||null が無条件に代入され、タイトル・メモ・期限・
      // 開始日・プロジェクト・繰り返しルールが一斉に空で保存される全損事故が起きていた
      // （2026-08-01に繰り返しタスクが1件全損。詳細はHANDOVER.md参照）。
      // ドロワーが対象タスクを表示中でなければ保存自体を行わない
      const drEl=document.getElementById('drawer');
      if(!drEl||drEl._taskId!==t2.id||!document.getElementById('dt-title')){setInd('');return;}
      const prevStatus=t2.status;
      const prevProjectId=t2.projectId;
      // 各入力欄は「存在する場合のみ」反映する（拡大モーダル側のsaveと同じガード方針に統一）
      const _elTitle=document.getElementById('dt-title');if(_elTitle)t2.title=_elTitle.value;
      const _elNotes=document.getElementById('dt-notes');if(_elNotes)t2.notes=_elNotes.value;
      const _elDue=document.getElementById('dt-due');if(_elDue)t2.dueAt=_elDue.value||null;
      const _elStart=document.getElementById('dt-start');if(_elStart)t2.startAt=_elStart.value||null;
      const _elPlanned=document.getElementById('dt-planned-start');if(_elPlanned)t2.plannedStartAt=_elPlanned.value||null;
      const _elStartTime=document.getElementById('dt-start-time');if(_elStartTime)t2.startTime=_elStartTime.value||null;
      const _elProj=document.getElementById('dt-proj');if(_elProj)t2.projectId=_elProj.value||null;
      if(t2.projectId)addRecentProject(t2.projectId);
      const _elAssignee=document.getElementById('dt-assignee');if(_elAssignee)t2.assigneeId=_elAssignee.value||null;
      if(document.getElementById('dt-repeat'))t2.repeatRule=getRepeatRule();
      if(t2.projectId&&t2.status==='inbox')t2.status='active';

      // Inboxからプロジェクトに初めて割り当てられた場合、sort_orderをプロジェクト最上部に設定
      if(t2.projectId&&!prevProjectId){
        const sibOrders=S.tasks
          .filter(x=>x.projectId===t2.projectId&&x.id!==t2.id&&x.status==='active')
          .map(x=>x.order||0);
        t2.order=sibOrders.length>0?Math.min(...sibOrders)-1000:0;
      }

      const activeId=document.activeElement?.id;
      const activeInDrawer=document.activeElement?.closest('#drawer,.expand-modal');
      await saveTask(t2);
      if(!t2.parentTaskId&&t2.projectId!==prevProjectId){
        const children=S.tasks.filter(c=>c.parentTaskId===t2.id);
        for(const child of children){child.projectId=t2.projectId;await saveTask(child);}
      }
      setInd('saved');

      const drawerInputIds=['dt-title','dt-notes','dt-due','dt-start','dt-proj','dt-assignee','dt-repeat','sub-inp','lp-text','lp-url','nt-title','nt-body'];
      if(t2.status!==prevStatus||(!drawerInputIds.includes(activeId)&&!activeInDrawer)){
        renderSidebar();renderContent();
      }
    },400);
  };
  // タイトル・メモはcomposition対応（IME変換中はautosave抑制）
  const _dtNotesTA=document.getElementById('dt-notes');
  makeResizable(_dtNotesTA);
  if(_dtNotesTA){_dtNotesTA._stampFocused=false;_dtNotesTA.addEventListener('focus',()=>{_dtNotesTA._stampFocused=true;});}

  // シークレットメモ（E2EE）：メモセクション直後に本人専用セクションを差し込み、
  // 平文メモ入力中のパスワードらしきパターンを検知して移動提案する（ローカル完結・サーバー送信なし）。
  if(window.SecretMemo){
    try{window.SecretMemo.mountTaskSection(task);}catch(_e){console.error('SecretMemo mount',_e);}
    if(_dtNotesTA){_dtNotesTA.addEventListener('input',()=>{try{window.SecretMemo.onNotesInput(_dtNotesTA);}catch(_e2){}});}
  }
  const dtLinkBtnEl=document.getElementById('dt-link-btn');
  if(dtLinkBtnEl)dtLinkBtnEl.addEventListener('click',e=>{
    e.stopPropagation();
    const _mc2=document.getElementById('memo-collapse');
    if(_mc2&&_mc2.style.display==='none'){_mc2.style.display='';_mc2.classList.remove('hidden');}
    showLinkPopover(dtLinkBtnEl,'dt-notes',!(_dtNotesTA&&_dtNotesTA._stampFocused));
  });
  // プレビュー切替
  const dtPreviewBtn=document.getElementById('dt-preview-btn');
  const dtPreviewArea=document.getElementById('dt-preview-area');
  const dtNotesEl=document.getElementById('dt-notes');
  let dtPrevMode=true; // デフォルトはプレビュー（編集テキストエリアは非表示）

  function renderDtPreview(){
    if(!dtNotesEl||!dtPreviewArea)return;
    dtPreviewArea.innerHTML=_memoLinkify(esc(dtNotesEl.value));
    // 高さ超過で「もっと見る」表示
    const expandBtn=document.getElementById('memo-expand-btn');
    if(expandBtn){
      const isOverflow=dtPreviewArea.scrollHeight>dtPreviewArea.clientHeight+4;
      expandBtn.style.display=isOverflow?'block':'none';
    }
  }
  function dtEnterPreview(){
    renderDtPreview();
    if(dtNotesEl)dtNotesEl.style.display='none';
    if(dtPreviewArea)dtPreviewArea.style.display='block';
    if(dtPreviewBtn)dtPreviewBtn.textContent='編集';
    dtPrevMode=true;
    const badge=document.getElementById('memo-preview-badge');
    if(badge)badge.style.display='';
  }
  function dtExitPreview(){
    if(dtNotesEl){dtNotesEl.style.display='';dtNotesEl.focus();}
    if(dtPreviewArea)dtPreviewArea.style.display='none';
    if(dtPreviewBtn)dtPreviewBtn.textContent='プレビュー';
    dtPrevMode=false;
    const badge=document.getElementById('memo-preview-badge');
    if(badge)badge.style.display='none';
    const expandBtn=document.getElementById('memo-expand-btn');
    if(expandBtn)expandBtn.style.display='none';
  }
  if(dtPreviewBtn){dtPreviewBtn.addEventListener('click',()=>{
    const _mc3=document.getElementById('memo-collapse');
    if(_mc3&&_mc3.style.display==='none'){_mc3.style.display='';_mc3.classList.remove('hidden');}
    dtPrevMode?dtExitPreview():dtEnterPreview();
  });}

  // メモ折りたたみトグル
  const memoCollapse=document.getElementById('memo-collapse');
  const memoChev=document.getElementById('dt-memo-chev');
  let memoOpen=!!(task.notes);
  function _memoSetOpen(open){
    memoOpen=open;
    if(memoCollapse){
      memoCollapse.style.display=open?'':'none';
    }
    if(memoChev)memoChev.classList.toggle('closed',!open);
    // メモヘッダーのグラデーション/グレー切り替え
    const memoHead=document.querySelector('[data-a="dt-memo-toggle"]');
    if(memoHead)memoHead.classList.toggle('closed',!open);
    if(open&&dtPrevMode)renderDtPreview();
    if(open&&!task.notes&&!dtPrevMode){if(dtNotesEl){dtNotesEl.focus();}}
  }
  // グローバルハンドラから呼べるよう公開
  window._dtMemoToggle=()=>_memoSetOpen(!memoOpen);

  // もっと見るボタン
  const expandBtn=document.getElementById('memo-expand-btn');
  const collapseBtn=document.getElementById('memo-collapse-btn');
  if(expandBtn){
    expandBtn.addEventListener('click',()=>{
      if(dtPreviewArea){dtPreviewArea.style.maxHeight='none';dtPreviewArea.style.overflow='visible';}
      expandBtn.style.display='none';
      if(collapseBtn)collapseBtn.style.display='block';
    });
  }
  if(collapseBtn){
    collapseBtn.addEventListener('click',()=>{
      if(dtPreviewArea){dtPreviewArea.style.maxHeight='320px';dtPreviewArea.style.overflow='hidden';}
      collapseBtn.style.display='none';
      if(expandBtn){
        const isOverflow=dtPreviewArea&&dtPreviewArea.scrollHeight>324;
        expandBtn.style.display=isOverflow?'block':'none';
      }
      // 先頭にスクロール
      if(dtPreviewArea)dtPreviewArea.scrollTop=0;
    });
  }

  // プレビューエリアタップで編集へ（長押し不要にしてシングルタップで編集へ）
  if(dtPreviewArea){
    dtPreviewArea.addEventListener('click',e=>{
      // リンク・フォルダパスチップ（コピー専用）は編集モードへ入らない
      if(_isCopyOnlyTarget(e.target))return;
      dtExitPreview();
    });
  }

  // メモ内容があればプレビュー、なければ編集モードで開く
  if(task.notes){
    dtEnterPreview();
  } else {
    // メモが空なら折りたたまれているのでプレビューエリアは隠す
    if(dtPreviewArea)dtPreviewArea.style.display='none';
  }
  ['dt-title','dt-notes'].forEach(id=>{
    const el=document.getElementById(id);
    if(!el)return;
    el.addEventListener('compositionstart',()=>{_composing=true});
    el.addEventListener('compositionend',()=>{_composing=false;autosave(true);});
    el.addEventListener('input',()=>{autosave();});
  });
  // 復元した下書きがまだ保存されていない場合は自動保存を予約
  if(_draft){
    const _aDn=document.getElementById('dt-notes');
    const _aDt=document.getElementById('dt-title');
    if((_aDn&&_aDn.value!==(task.notes||''))||(_aDt&&_aDt.value!==(task.title||'')))autosave(true);
  }
  // 日付・セレクトはcomposition不要
  // dt-planned-start（計画開始日／ガント開始日）は autosave の保存対象には入っていたが
  // この変更リストから漏れていたため、この欄だけを変更して閉じると値が保存されずに消えていた
  // （他の欄を触ったときに一緒に保存されるので、気づきにくい形で消える）。
  ['dt-due','dt-start','dt-planned-start','dt-start-time','dt-proj','dt-assignee','dt-repeat'].forEach(id=>{
    const el=document.getElementById(id);
    if(el)el.addEventListener('change',()=>{
      if(id==='dt-repeat'&&el.value&&isPlanFree()){
        // 繰り返しは全プラン利用可能
      }
      // 開始日を直接変更した場合は開始時間をクリア
      if(id==='dt-start'){
        const stiEl=document.getElementById('dt-start-time');
        if(stiEl){stiEl.value='';}
        const task=S.tasks.find(t=>t.id===S.taskId);
        if(task){task.startTime=null;}
      }
      // 開始日・期限日の矛盾を自動修正
      if(id==='dt-start'&&el.value){
        const dueEl=document.getElementById('dt-due');
        if(dueEl&&dueEl.value&&el.value>dueEl.value){
          dueEl.value=el.value;
          applyDateInputStyleFixed(dueEl,el.value);
          const wdD=document.getElementById('dt-due-wd');
          if(wdD){wdD.textContent='('+(wdStr(el.value).replace('曜','')||'　')+')';wdD.style.color=wdColor(el.value);}
        }
      }
      if(id==='dt-due'&&el.value){
        const startEl=document.getElementById('dt-start');
        if(startEl&&startEl.value&&el.value<startEl.value){
          startEl.value=el.value;
          applyDateInputStyleFixed(startEl,el.value);
          const wdS=document.getElementById('dt-start-wd');
          if(wdS){wdS.textContent='('+(wdStr(el.value).replace('曜','')||'　')+')';wdS.style.color=wdColor(el.value);}
        }
      }
      autosave(true);
      if(id==='dt-due'||id==='dt-start'||id==='dt-planned-start'){
        const wd=document.getElementById(id+'-wd');
        if(wd){wd.textContent='('+(wdStr(el.value).replace('曜','')||'　')+')';wd.style.color=wdColor(el.value);}
        applyDateInputStyleFixed(el,el.value);
      }
    });
  });
  const subParentBtn=document.getElementById('sub-parent-btn');
  if(subParentBtn){
    subParentBtn.addEventListener('click',()=>{
      const si=document.getElementById('sub-inp');
      if(!si)return;
      const pt=S.tasks.find(t=>t.id===S.taskId);
      if(!pt)return;
      const title=pt.title||'無題';
      const prefix='('+title+')';
      if(!si.value.includes(prefix)){
        si.value=prefix+(si.value?' '+si.value:'');
      }
      si.focus();
      si.setSelectionRange(si.value.length,si.value.length);
    });
  }
  const si=document.getElementById('sub-inp');
  if(si)si.addEventListener('keydown',async e=>{
    if(e.key==='Enter'&&si.value.trim()){
      const _pt=S.tasks.find(t=>t.id===S.taskId);const s=mkTask({title:si.value.trim(),parentTaskId:S.taskId,status:'active',order:Date.now(),priority:_pt?.priority??4,projectId:_pt?.projectId??null,tagIds:_pt?.tagIds?[..._pt.tagIds]:[],startAt:_pt?.startAt??null,dueAt:_pt?.dueAt??null});
      const drBody=document.getElementById('drawer-body');
      const scrollY=drBody?drBody.scrollTop:0;
      await saveTask(s);si.value='';
      // renderDrawer()を呼ばずサブタスクリストだけ差し替えてスクロール位置を維持
      const subsEl=document.getElementById('subs');
      if(subsEl){
        const allSubs=S.tasks.filter(t=>t.parentTaskId===S.taskId).sort((a,b)=>a.order-b.order);
        subsEl.innerHTML=allSubs.map(sub=>
          '<div class="sub-item" data-id="'+sub.id+'"><span class="sub-drag-handle" title="並び替え">⠿</span><button class="chk'+(sub.status==="completed"?' done':'')+'" data-a="chk" data-id="'+sub.id+'">'+(sub.status==="completed"?'✓':'')+'</button><button class="sub-title" data-a="sel-edit" data-id="'+sub.id+'" style="'+(sub.status==="completed"?'text-decoration:line-through;color:var(--text3)':'')+'">'+esc(sub.title)+'</button><button class="icon-btn" data-a="del" data-id="'+sub.id+'" style="width:24px;height:24px;color:var(--text3)">'+ICONS.x+'</button></div>'
        ).join('');
        initSubDrag(subsEl);
      }
      si.value='';
      si.focus();
    }
  });

  const subsEl2=document.getElementById('subs');
  if(subsEl2){
    initSubDrag(subsEl2);
  }
  // renderDrawer内でスクロール位置を復元
  // （旧コードは getElementById('drawer-body') を見ていたが、その id は存在せず復元が効いていなかった）
  if(_scrollY>0||Object.keys(_fzScroll).length){
    setTimeout(()=>{
      const _dr2=document.getElementById('drawer');
      if(!_dr2)return;
      const _drBody2=_dr2.querySelector('.drawer-body');
      if(_drBody2&&_scrollY>0)_drBody2.scrollTop=_scrollY;
      Object.keys(_fzScroll).forEach(sel=>{const _z=_dr2.querySelector(sel);if(_z)_z.scrollTop=_fzScroll[sel];});
    },50);
  }
  // コメントセクションを非同期ロード（パフォーマンス: メインのloadAllには含めない）
  initComments(task.id);
  // 添付セクションを非同期ロード
  initAttachments('task',task.id);
}

// ===== COMMENTS =====
// S._commentCache[taskId] = {comments:[], loaded:true} でセッション内キャッシュ

function _cmTimeStr(isoStr){
  const d=new Date(isoStr),now=new Date();
  const diff=now-d;
  if(diff<60000)return 'たった今';
  if(diff<3600000)return Math.floor(diff/60000)+'分前';
  if(diff<86400000)return Math.floor(diff/3600000)+'時間前';
  if(d.getFullYear()===now.getFullYear())return (d.getMonth()+1)+'/'+(d.getDate())+' '+(d.getHours()+'').padStart(2,'0')+':'+(d.getMinutes()+'').padStart(2,'0');
  return d.getFullYear()+'/'+(d.getMonth()+1)+'/'+(d.getDate());
}

// ===== フォルダパス検出（メモ1行がまるごとPC/Macのフォルダパスの場合、タップでコピー＆案内） =====
function _isFolderPathLine(t){
  if(!t)return false;
  if(/^[A-Za-z]:[\\\/][^<>|?*\r\n]*$/.test(t))return true; // Windows: C:\... / C:/...
  if(/^\\\\[^\\<>|?*\r\n]+\\[^<>|?*\r\n]*$/.test(t))return true; // UNC: \\server\share\...
  if(/^~(\/[^<>|?*\r\n]+)+\/?$/.test(t))return true; // ~/Documents/...
  if(/^\/[A-Za-z0-9_.\-][^<>|?*\r\n]*(\/[^<>|?*\r\n]+)+\/?$/.test(t))return true; // /Users/name/...
  return false;
}
function _pathifyLine(escLine){
  const t=escLine.trim();
  if(!t||!_isFolderPathLine(t))return escLine;
  const attr=t.replace(/'/g,'&#39;');
  return '<button type="button" class="note-path-chip" data-a="open-folder-path" data-path="'+attr+'" title="タップでパスをコピー">📁 '+t+'</button>';
}
function _pathifyText(escapedText){
  return escapedText.split('\n').map(_pathifyLine).join('\n');
}
// プレビュー領域内で「コピー専用」扱いにする要素（フォルダパスチップ・リンク）
// これらをタップしたときは編集モードへ切り替えない
function _isCopyOnlyTarget(t){
  if(!t||!t.closest)return false;
  return !!t.closest('.note-path-chip,a');
}
function openFolderPathAction(rawPath){
  const isMac=/Mac|iPhone|iPad|iPod/.test(navigator.platform||navigator.userAgent||'');
  const guide=isMac?'パスをコピーしました。Finderで⌘+Shift+Gを押し、貼り付けて開けます':'パスをコピーしました。エクスプローラーのアドレス欄に貼り付けてEnterで開けます';
  const done=()=>toast(guide);
  if(navigator.clipboard?.writeText)navigator.clipboard.writeText(rawPath).then(done).catch(done);
  else done();
}

// メモ（タスク詳細）のプレビュー用リンク化。ドロワーと拡大モーダルで同じ結果になるよう共通化する。
// markdown形式 [表示名](URL) と、素のURL（https://… をそのまま貼ったもの）の両方をリンクにする。
function _memoLinkify(escapedText){
  return _pathifyText(escapedText)
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\)]+)\)/g,'<a href="$2" target="_blank" rel="noopener" style="color:var(--accent);text-decoration:underline">$1</a>')
    // 素のURL。esc() 済みなのでクエリの & は &amp; になっている。これを許容しないと
    // https://example.com/?a=1&b=2 のようなURLが「&」の手前で切れてリンクにならない。
    .replace(/(^|[\s\n>])((https?:\/\/)(?:&amp;|[^\s<&"])+)/g,'$1<a href="$2" target="_blank" rel="noopener" style="color:var(--accent);text-decoration:underline">$2</a>')
    .replace(/\n/g,'<br>');
}

function _cmLinkify(escapedText){
  // エスケープ済みテキストのURLをリンク化（改行はbrに）
  return _pathifyText(escapedText)
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener" style="color:var(--accent);text-decoration:underline;word-break:break-all">$1</a>')
    .replace(/(^|[\s\n])(https?:\/\/[^\s<&"]+)/g,'$1<a href="$2" target="_blank" rel="noopener" style="color:var(--accent);text-decoration:underline;word-break:break-all">$2</a>')
    .replace(/\n/g,'<br>');
}

function _cmRenderList(comments){
  const list=document.getElementById('cm-list');
  const count=document.getElementById('cm-count');
  if(!list)return;
  const n=comments.length;
  if(count)count.textContent=n||'0';
  // ドロワー上部のコメントバッジも常時更新
  const jumpCount=document.getElementById('cm-jump-count');
  if(jumpCount)jumpCount.textContent=n;
  if(!n){list.innerHTML='<div class="cm-loading" style="font-size:12px;color:var(--text3);padding:6px 0">コメントなし</div>';return;}
  const uid=window._currentUser?.id;
  const PREVIEW=3; // デフォルト表示件数
  const expanded=list._cmExpanded||false;
  const displayComments=(!expanded&&n>PREVIEW)?comments.slice(-PREVIEW):comments;
  const hiddenCount=n-PREVIEW;

  let html='';
  // 折りたたみ中の場合「以前のX件を見る」ボタン
  if(!expanded&&n>PREVIEW){
    html+=`<button class="cm-show-all-btn" id="cm-show-all">以前の${hiddenCount}件を見る</button>`;
  }
  html+=displayComments.map(c=>{
    const initial=(c.user_name||c.userName||'?').charAt(0).toUpperCase();
    const avatar=c.user_avatar||c.userAvatar
      ?`<img src="${c.user_avatar||c.userAvatar}" onerror="this.style.display='none'">`
      :initial;
    const isOwn=(c.user_id||c.userId)===uid;
    const createdAt=c.created_at||c.createdAt;
    const updatedAt=c.updated_at||c.updatedAt;
    const wasEdited=updatedAt&&createdAt&&(new Date(updatedAt)-new Date(createdAt))>2000;
    const editedLabel=wasEdited?`<span style="font-size:10px;color:var(--text3);margin-top:3px;display:block">編集済み ${_cmTimeStr(updatedAt)}</span>`:'';
    return `<div class="cm-item" data-cmid="${c.id}">
      <div class="cm-avatar">${typeof avatar==='string'&&avatar.startsWith('<')?avatar:initial}</div>
      <div class="cm-bubble">
        <div class="cm-meta">
          <span class="cm-name">${esc(c.user_name||c.userName||'ユーザー')}</span>
          <span class="cm-time">${_cmTimeStr(createdAt)}</span>
          ${isOwn?`<button class="cm-del" data-a="cm-edit" data-cmid="${c.id}" title="編集">編集</button>`:''}
          ${isOwn?`<button class="cm-del" data-a="cm-del" data-cmid="${c.id}" title="削除">✕</button>`:''}
        </div>
        <div class="cm-body" id="cm-body-${c.id}">${_cmLinkify(esc(c.body))}</div>
        ${editedLabel}
      </div>
    </div>`;
  }).join('');
  list.innerHTML=html;
  // 「以前のX件を見る」ボタンのイベント
  const showAllBtn=list.querySelector('#cm-show-all');
  if(showAllBtn){
    showAllBtn.addEventListener('click',()=>{
      list._cmExpanded=true;
      _cmRenderList(comments);
    });
  }
}

// ===== 添付ファイル (attachments) =====
// 保存先: Supabase Storage の private バケット 'attachments'
//   パス命名: {user_id}/{attachment_id}/{filename}
//   タスク添付は共有プロジェクト配下なら他メンバーも閲覧可（RLSで制御）。
//   ノート添付は個人のみ。表示は毎回 createSignedUrl(有効期限付き)。
const _attUrlCache=new Map(); // storage_path -> {url, exp}
const ATT_ACCEPT='image/*,application/pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.csv,.zip';
const ATT_MIME_BY_EXT={png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',gif:'image/gif',webp:'image/webp',heic:'image/heic',heif:'image/heif',pdf:'application/pdf',doc:'application/msword',docx:'application/vnd.openxmlformats-officedocument.wordprocessingml.document',xls:'application/vnd.ms-excel',xlsx:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',ppt:'application/vnd.ms-powerpoint',pptx:'application/vnd.openxmlformats-officedocument.presentationml.presentation',txt:'text/plain',csv:'text/csv',zip:'application/zip'};

// file.type が空でも拡張子からMIMEを補完（バケットのMIME制限で弾かれないように）
function _attResolveMime(file){
  if(file.type)return file.type;
  const ext=(file.name||'').split('.').pop().toLowerCase();
  return ATT_MIME_BY_EXT[ext]||'application/octet-stream';
}
// プラン別の単体ファイルサイズ上限（クライアント一次防御。実効防御はバケット側 file_size_limit）
function _attSizeLimit(){return getUserPlan()==='free'?10*1024*1024:25*1024*1024;}
function _attFmtSize(n){n=Number(n)||0;if(n<1024)return n+'B';if(n<1048576)return Math.round(n/1024)+'KB';return (n/1048576).toFixed(1)+'MB';}

// 添付セクションのHTML（タスク詳細/ノート詳細で共通利用）
function _attSectionHTML(scope,parentId){
  return '<div class="dt-schedule-block" id="att-section" data-att-scope="'+scope+'" data-att-parent="'+esc(parentId)+'" style="margin-bottom:10px">'
    +'<div class="dt-section-head" data-a="dt-att-toggle">'
      +'<span class="dt-section-label">'
        +'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>'
        +' 添付'
        +'<span class="cm-count" id="att-count" style="font-size:10px;color:var(--accent);background:var(--bg2);border-radius:4px;padding:1px 6px;font-weight:600">…</span>'
      +'</span>'
      +'<span class="dt-section-chev" id="att-chev">▼</span>'
    +'</div>'
    +'<div id="att-body" class="dt-section-body">'
      +(isPlanFree()
        // 無料プラン: アップロード不可。🔒表示＋アップグレード誘導（閲覧・DLは可能なので att-list は下で描画）
        ? '<div id="att-dropzone" data-a="att-upsell" style="border:1.5px dashed var(--border);border-radius:10px;padding:14px;text-align:center;font-size:12.5px;color:var(--text3);cursor:pointer;background:var(--bg2)">'
            +'🔒 ファイル・画像の添付は<b>スタンダードプラン以上</b>で利用できます'
            +'<div style="font-size:11px;margin-top:3px;color:var(--accent)">タップしてアップグレード</div>'
          +'</div>'
        // 有料プラン: 通常のドロップゾーン
        : '<div id="att-dropzone" data-a="att-pick" ondragover="_attDragOver(event)" ondragleave="_attDragLeave(event)" ondrop="_attDrop(event)" style="border:1.5px dashed var(--border);border-radius:10px;padding:14px;text-align:center;font-size:12.5px;color:var(--text3);cursor:pointer">'
            +'📎 ここにドラッグ＆ドロップ / タップして選択'
            +'<input type="file" id="att-file-input" multiple accept="'+ATT_ACCEPT+'" onchange="_attOnPick(this)" style="display:none">'
          +'</div>')
      +'<div id="att-list" style="display:flex;flex-direction:column;gap:6px;margin-top:8px"><div class="cm-loading">読み込み中…</div></div>'
    +'</div>'
  +'</div>';
}

// インラインハンドラ（拡大モーダルへ innerHTML コピーされても動くよう window に公開）
window._attOnPick=function(input){
  const sec=input.closest('#att-section');if(!sec)return;
  const scope=sec.dataset.attScope,parent=sec.dataset.attParent;
  [...input.files].forEach(f=>_attUpload(scope,parent,f));
  input.value='';
};
window._attDragOver=function(e){e.preventDefault();e.currentTarget.style.background='var(--bg2)';};
window._attDragLeave=function(e){e.currentTarget.style.background='';};
window._attDrop=function(e){
  e.preventDefault();const zone=e.currentTarget;zone.style.background='';
  const sec=zone.closest('#att-section');if(!sec)return;
  const scope=sec.dataset.attScope,parent=sec.dataset.attParent;
  [...(e.dataTransfer?.files||[])].forEach(f=>_attUpload(scope,parent,f));
};

// 署名付きURL（メモリキャッシュ。期限30秒前で再発行）
async function attSignedUrl(path){
  const c=_attUrlCache.get(path);
  if(c&&c.exp>Date.now()+30000)return c.url;
  const{data,error}=await window._SB.storage.from('attachments').createSignedUrl(path,3600);
  if(error){console.error('att signedUrl',error);return '';}
  _attUrlCache.set(path,{url:data.signedUrl,exp:Date.now()+3600*1000});
  return data.signedUrl;
}

async function _attRenderList(scope,parentId,rows){
  const list=document.getElementById('att-list');if(!list)return;
  const cnt=document.getElementById('att-count');if(cnt)cnt.textContent=rows.length||'0';
  if(!rows.length){list.innerHTML='<div class="muted xs" style="font-size:12px;color:var(--text3);padding:4px 0">添付なし</div>';return;}
  const parts=await Promise.all(rows.map(async a=>{
    const url=await attSignedUrl(a.storage_path);
    const inner=a.kind==='image'
      ?'<img src="'+url+'" loading="lazy" style="max-width:120px;max-height:120px;border-radius:8px;object-fit:cover;display:block">'
      :'<span style="display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--text)">📄 '+esc(a.file_name)+'</span>';
    return '<div class="att-chip" style="display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:6px 10px">'
      +'<a href="'+url+'" target="_blank" rel="noopener" title="'+esc(a.file_name)+'" style="flex:1;min-width:0;overflow:hidden;text-decoration:none">'+inner+'</a>'
      +'<span style="font-size:10px;color:var(--text3);flex-shrink:0">'+_attFmtSize(a.size_bytes)+'</span>'
      +'<button class="icon-btn" data-a="att-del" data-id="'+esc(a.id)+'" data-path="'+esc(a.storage_path)+'" data-scope="'+scope+'" data-parent="'+esc(parentId)+'" title="削除" style="width:24px;height:24px;color:var(--text3);flex-shrink:0">'+ICONS.x+'</button>'
    +'</div>';
  }));
  list.innerHTML=parts.join('');
}

// ドロワー描画後に呼ぶ：キャッシュ即描画→Supabaseから取得（共有分はRLS経由で返る）
async function initAttachments(scope,parentId){
  if(S._attCache[parentId])_attRenderList(scope,parentId,S._attCache[parentId]);
  const SB=window._SB;
  if(!SB||!window._currentUser){
    if(!S._attCache[parentId]){const l=document.getElementById('att-list');if(l)l.innerHTML='<div class="muted xs">添付なし</div>';}
    return;
  }
  const col=scope==='task'?'task_id':'note_id';
  const{data,error}=await SB.from('attachments').select('*').eq(col,parentId).order('created_at',{ascending:true});
  if(error){console.error('att load',error);const l=document.getElementById('att-list');if(l)l.innerHTML='<div class="muted xs">読み込みに失敗しました</div>';return;}
  const rows=data||[];
  S._attCache[parentId]=rows;
  const stillOpen=scope==='task'?(S.taskId===parentId&&S.drawerOpen):(S.noteId===parentId&&S.noteOpen);
  if(stillOpen)_attRenderList(scope,parentId,rows);
}

// アップロード本体：Storage直アップロード→attachments行挿入（失敗時はロールバック）
async function _attUpload(scope,parentId,file){
  const SB=window._SB,user=window._currentUser;
  if(!SB||!user){toast('ログインが必要です');return;}
  // 有料プラン限定（ドラッグ&ドロップ経路もここで止める。サーバー側RLSでも二重に強制）
  if(isPlanFree()){showUpgradeModal('attachments');return;}
  if(!scope||!parentId||!file)return;
  const LIMIT=_attSizeLimit();
  if(file.size>LIMIT){toast('ファイルは'+Math.floor(LIMIT/1048576)+'MBまでです');return;}
  const id=uid();
  const safe=(file.name||'file').replace(/[^\w.\-]+/g,'_').slice(-100)||'file';
  const path=user.id+'/'+id+'/'+safe;
  const mime=_attResolveMime(file);
  const kind=mime.startsWith('image/')?'image':'file';
  // 「アップロード中」プレースホルダ
  const list=document.getElementById('att-list');
  let ph=null;
  if(list){
    const m=list.querySelector('.muted');if(m)list.innerHTML='';
    ph=document.createElement('div');
    ph.style.cssText='display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;opacity:.6;font-size:12px;color:var(--text3)';
    ph.textContent='⏳ '+(file.name||'file')+' をアップロード中…';
    list.appendChild(ph);
  }
  const{error:upErr}=await SB.storage.from('attachments').upload(path,file,{contentType:mime,upsert:false});
  if(upErr){ph?.remove();console.error('att upload',upErr);toast('アップロード失敗: '+(upErr.message||''));return;}
  const row={id,user_id:user.id,file_name:file.name||'file',mime_type:mime,size_bytes:file.size,storage_path:path,kind,created_at:new Date().toISOString()};
  row[scope==='task'?'task_id':'note_id']=parentId;
  const{error:insErr}=await SB.from('attachments').insert(row);
  if(insErr){ph?.remove();console.error('att insert',insErr);toast('保存失敗: '+(insErr.message||''));await SB.storage.from('attachments').remove([path]);return;}
  S._attCache[parentId]=[...(S._attCache[parentId]||[]),row];
  _attRenderList(scope,parentId,S._attCache[parentId]);
  toast('添付しました');
}

// タスク/ノート本体削除時に添付の実体(Storage)も掃除する（FK CASCADEは行のみ消し実体は残るため）
async function _attPurgeForParent(scope,parentId){
  const SB=window._SB;
  if(SB&&parentId){
    try{
      const col=scope==='task'?'task_id':'note_id';
      const{data}=await SB.from('attachments').select('storage_path').eq(col,parentId);
      const paths=(data||[]).map(r=>r.storage_path).filter(Boolean);
      if(paths.length)await SB.storage.from('attachments').remove(paths);
      paths.forEach(p=>_attUrlCache.delete(p));
    }catch(e){console.error('att purge',e);}
  }
  delete S._attCache[parentId];
}

function _cmSetupInput(taskId,comments){
  const inp=document.getElementById('cm-input');
  const btn=document.getElementById('cm-send');
  if(!inp||!btn)return;
  // すでにセットアップ済みなら再登録しない
  if(inp._cmTaskId===taskId)return;
  inp._cmTaskId=taskId;
  // Linkボタン（onclickで上書き）
  const cmLinkBtn=document.getElementById('cm-link-btn');
  if(cmLinkBtn)cmLinkBtn.onclick=e=>{e.stopPropagation();showLinkPopover(cmLinkBtn,'cm-input',false);};
  // 入力欄は .cm-composer で position:sticky 固定されており常に可視なため、
  // フォーカス時のスクロール補正（旧 inp.onfocus）は不要になった。
  inp.oninput=()=>{
    btn.disabled=!inp.value.trim();
    inp.style.height='auto';
    inp.style.height=Math.min(inp.scrollHeight,120)+'px';
    // @mention 候補表示
    const pos=inp.selectionStart;
    const textBefore=inp.value.slice(0,pos);
    const match=textBefore.match(/@([^\s@]*)$/);
    if(match)_cmShowMentionPop(inp,taskId,match[1],pos-match[0].length);
    else _cmHideMentionPop();
  };
  inp.onblur=()=>{setTimeout(_cmHideMentionPop,200);};
  inp.onkeydown=e=>{
    if((e.metaKey||e.ctrlKey)&&e.key==='Enter'){e.preventDefault();if(!btn.disabled)_cmSend(taskId);}
    if(e.key==='Escape')_cmHideMentionPop();
  };
  btn.onclick=()=>_cmSend(taskId);
  // 再描画で復元された下書きがある場合、送信ボタンの活性と入力欄の高さを同期
  if(inp.value){
    btn.disabled=!inp.value.trim();
    inp.style.height='auto';
    inp.style.height=Math.min(inp.scrollHeight,120)+'px';
  }
}

function _cmGetWsMembers(taskId){
  const task=S.tasks.find(t=>t.id===taskId);
  if(!task?.projectId)return[];
  const proj=S.projects.find(p=>p.id===task.projectId);
  if(!proj?.workspaceId)return[];
  return S.wsMembers[proj.workspaceId]||[];
}
function _cmHideMentionPop(){
  const bar=document.getElementById('cm-mention-bar');
  if(bar){bar.innerHTML='';bar.style.display='none';}
}
function _cmShowMentionPop(inp,taskId,query,atPos){
  const bar=document.getElementById('cm-mention-bar');
  if(!bar)return;
  const members=_cmGetWsMembers(taskId).filter(m=>!query||m.user_name.toLowerCase().includes(query.toLowerCase()));
  if(!members.length){_cmHideMentionPop();return;}
  bar.innerHTML='';
  bar.style.display='flex';
  members.slice(0,8).forEach(m=>{
    const btn=document.createElement('button');
    btn.style.cssText='display:flex;align-items:center;gap:5px;padding:4px 10px;border:1px solid var(--border);border-radius:16px;background:var(--surface);cursor:pointer;font-size:12px;color:var(--text);white-space:nowrap';
    const initial=(m.user_name||'?').charAt(0).toUpperCase();
    const av=m.user_avatar
      ?`<img src="${m.user_avatar}" style="width:20px;height:20px;border-radius:50%;object-fit:cover;flex-shrink:0">`
      :`<div style="width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0">${initial}</div>`;
    btn.innerHTML=av+`<span>${esc(m.user_name||m.user_email||'ユーザー')}</span>`;
    btn.onmousedown=btn.ontouchstart=e=>{
      e.preventDefault();
      const name=m.user_name||m.user_email||'';
      const before=inp.value.slice(0,atPos);
      const after=inp.value.slice(inp.selectionStart);
      inp.value=before+'@'+name+' '+after;
      inp.selectionStart=inp.selectionEnd=atPos+name.length+2;
      if(!inp._mentionedIds)inp._mentionedIds=new Set();
      inp._mentionedIds.add(m.userId||m.user_id);
      inp.dispatchEvent(new Event('input'));
      _cmHideMentionPop();
      inp.focus();
    };
    bar.appendChild(btn);
  });
}

async function _cmSend(taskId){
  const inp=document.getElementById('cm-input');
  const btn=document.getElementById('cm-send');
  if(!inp||!btn)return;
  const body=inp.value.trim();
  if(!body)return;
  const SB=window._SB;
  const user=window._currentUser;
  if(!SB||!user)return;

  // @mention 抽出（ポップアップ選択ID優先 ＋ テキストパターンで補完）
  const wsMembers=_cmGetWsMembers(taskId);
  const mentionedIds=[];
  // ① ポップアップで選択済みのID（スペース入り名前でも確実に捕捉）
  if(inp._mentionedIds){for(const id of inp._mentionedIds){if(!mentionedIds.includes(id))mentionedIds.push(id);}}
  // ② テキスト内の @name を全メンバー名と照合（includes でスペース対応）
  if(wsMembers.length){
    wsMembers.forEach(m=>{
      const name=m.user_name||m.user_email||'';
      if(name&&body.includes('@'+name)){
        const fid=m.userId||m.user_id;
        if(fid&&!mentionedIds.includes(fid))mentionedIds.push(fid);
      }
    });
  }

  btn.disabled=true;
  const comment={
    id:uid(),
    task_id:taskId,
    user_id:user.id,
    user_name:user.user_metadata?.full_name||user.email||'',
    user_avatar:user.user_metadata?.avatar_url||'',
    body,
    created_at:new Date().toISOString(),
    updated_at:new Date().toISOString()
  };
  const{error}=await SB.from('task_comments').insert(comment);
  if(error){console.error('cm send',error);toast('コメントの送信に失敗しました');btn.disabled=false;return;}
  // キャッシュ更新
  if(!S._commentCache[taskId])S._commentCache[taskId]=[];
  S._commentCache[taskId]=[...S._commentCache[taskId],comment];
  _cmRenderList(S._commentCache[taskId]);
  // 一覧の💬バッジ件数も更新（drawerは対象外のcontentのみ再描画されるので入力欄には影響しない）
  S.commentCounts[taskId]=(S.commentCounts[taskId]||0)+1;
  if(typeof renderContent==='function')renderContent();
  inp.value='';inp.style.height='auto';btn.disabled=true;
  inp._mentionedIds=null;
  _cmHideMentionPop();
  // メンション通知（fire and forget）
  if(mentionedIds.length){
    const task=S.tasks.find(t=>t.id===taskId);
    SB.auth.getSession().then(({data:{session}})=>{
      if(!session?.access_token)return;
      fetch('https://sfhtvtcmgueystyuhzvd.supabase.co/functions/v1/notify-mention',{
        method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},
        body:JSON.stringify({taskId,taskTitle:task?.title||'',commentBody:body,mentionedUserIds:mentionedIds}),
      }).catch(e=>console.error('notify-mention',e));
    });
  }
  // リストの最下部にスクロール
  const list=document.getElementById('cm-list');
  if(list)list.scrollTop=list.scrollHeight;
}

async function _cmDelete(cmId,taskId){
  const SB=window._SB;if(!SB)return;
  const{error}=await SB.from('task_comments').delete().eq('id',cmId);
  if(error){toast('削除に失敗しました');return;}
  if(S._commentCache[taskId]){
    S._commentCache[taskId]=S._commentCache[taskId].filter(c=>c.id!==cmId);
    _cmRenderList(S._commentCache[taskId]);
  }
  // 一覧の💬バッジ件数も更新
  if(S.commentCounts[taskId]){
    S.commentCounts[taskId]--;
    if(S.commentCounts[taskId]<=0)delete S.commentCounts[taskId];
  }
  if(typeof renderContent==='function')renderContent();
}

function _cmStartEdit(cmId,taskId){
  const cache=S._commentCache[taskId];
  if(!cache)return;
  const c=cache.find(x=>x.id===cmId);
  if(!c)return;
  const bodyEl=document.getElementById('cm-body-'+cmId);

  // すでに編集中なら何もしない

  const ta=document.createElement('textarea');
  ta.className='cm-textarea';
  ta.value=origText;
  ta.style.cssText='width:100%;margin-bottom:6px;display:block';
  ta.rows=Math.max(2,origText.split('\n').length);
  // ボタン行
  const btnRow=document.createElement('div');

  const saveBtn=document.createElement('button');

function _ncmRenderList(comments){
  const list=document.getElementById('ncm-list');

  if(!list)return;
  const n=comments.length;
  if(count)count.textContent=n||'0';
  if(!n){list.innerHTML='<div class="cm-loading" style="font-size:12px;color:var(--text3);padding:6px 0">コメントなし</div>';return;}
  const uid=window._currentUser?.id;
  list.innerHTML=comments.map(c=>{

    const avatar=c.user_avatar
      ?`<img src="${c.user_avatar}" onerror="this.style.display='none'">`
      :initial;
    const isOwn=(c.user_id)===uid;
    const createdAt=c.created_at;
    const updatedAt=c.updated_at;
    const wasEdited=updatedAt&&createdAt&&(new Date(updatedAt)-new Date(createdAt))>2000;
    const editedLabel=wasEdited?`<span style="font-size:10px;color:var(--text3);margin-top:3px;display:block">編集済み ${_cmTimeStr(updatedAt)}</span>`:'';
    return `<div class="cm-item" data-ncmid="${c.id}">
      <div class="cm-avatar">${typeof avatar==='string'&&avatar.startsWith('<')?avatar:initial}</div>
      <div class="cm-bubble">
        <div class="cm-meta">
          <span class="cm-name">${esc(c.user_name||'ユーザー')}</span>
          <span class="cm-time">${_cmTimeStr(createdAt)}</span>
          ${isOwn?`<button class="cm-del" data-a="ncm-edit" data-ncmid="${c.id}" title="編集">編集</button>`:''}
          ${isOwn?`<button class="cm-del" data-a="ncm-del" data-ncmid="${c.id}" title="削除">✕</button>`:''}
        </div>
        <div class="cm-body" id="ncm-body-${c.id}">${_cmLinkify(esc(c.body))}</div>
        ${editedLabel}
      </div>
    </div>`;
  }).join('');
}

// ===== 親タスク選択モーダル =====
function openSetParentModal(taskIds,onSelect){  // 選択対象自身とその子孫は除外
  const excluded=new Set(Array.isArray(taskIds)?taskIds:[taskIds]);  const addDescendants=(id)=>{S.tasks.filter(t=>t.parentTaskId===id).forEach(t=>{excluded.add(t.id);addDescendants(t.id);});};  excluded.forEach(id=>addDescendants(id));  const candidates=S.tasks.filter(t=>!excluded.has(t.id)&&t.status!=='completed'&&t.status!=='archived'&&!t.parentTaskId);  let q='';  const render=()=>{    const filtered=q?candidates.filter(t=>(t.title||'').includes(q)):candidates;    listEl.innerHTML=filtered.slice(0,50).map(t=>      '<button class="act-btn" data-id="'+t.id+'" style="display:block;width:100%;text-align:left;padding:8px 10px;border-radius:6px;font-size:13px;border-bottom:1px solid var(--border)">'+esc(t.title||'無題')+'</button>'    ).join('');    listEl.querySelectorAll('[data-id]').forEach(btn=>{      btn.onclick=()=>{ov.remove();onSelect(btn.dataset.id);};    });  };  const ov=document.createElement('div');ov.className='overlay';  ov.innerHTML='<div class="modal" style="max-width:380px">'    +'<div class="modal-title">親タスクを選択</div>'    +'<input id="parent-search" class="finput" placeholder="タスク名で検索…" autocomplete="off" style="margin-bottom:10px">'    +'<div id="parent-list" style="max-height:280px;overflow-y:auto"></div>'    +'<div class="modal-foot" style="margin-top:8px"><button class="btn btn-ghost" id="parent-cancel">キャンセル</button></div>'  +'</div>';  document.body.appendChild(ov);requestAnimationFrame(()=>ov.classList.add('open'));  const listEl=ov.querySelector('#parent-list');  ov.querySelector('#parent-search').addEventListener('input',e=>{q=e.target.value;render();});  ov.querySelector('#parent-cancel').onclick=()=>ov.remove();  ov.addEventListener('click',e=>{if(e.target===ov)ov.remove();});  render();}

// ===== 未保存ドラフト検出 =====
// バックグラウンド同期（_syncNow等）による再描画が、入力途中のコメント・メモを
// 消してしまわないためのガード。trueの間は全画面再描画を伴う同期をスキップする
// （次回のポーリング周期で自動的に再試行されるため、同期自体は失われない）。
function hasUnsavedDraft(){
  // 何らかの入力欄にフォーカス中（IME変換中含む）
  const ae=document.activeElement;
  if(ae&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA'||ae.isContentEditable))return true;
  // 未送信のコメント入力（タスク詳細・ノート詳細。PC拡大モーダル内の複製idも対象）
  for(const el of document.querySelectorAll('[id="cm-input"],[id="ncm-input"]')){
    if(el.value&&el.value.trim())return true;
  }
  // 既存コメントのインライン編集中
  if(document.querySelector('[id^="cm-body-"] textarea,[id^="ncm-body-"] textarea'))return true;
  // タスク詳細のタイトル・メモに自動保存が未確定の変更がある
  if(S.taskId){
    const t=S.tasks.find(x=>x.id===S.taskId);
    if(t){
      for(const el of document.querySelectorAll('[id="dt-notes"]')){if(el.value!==(t.notes||''))return true;}
      for(const el of document.querySelectorAll('[id="dt-title"]')){if(el.value!==(t.title||''))return true;}
    }
  }
  // ノート詳細のタイトル・本文に自動保存が未確定の変更がある
  if(S.noteId){
    const n=S.notes.find(x=>x.id===S.noteId);
    if(n){
      for(const el of document.querySelectorAll('[id="nt-body"]')){if(el.value!==(n.body||''))return true;}
      for(const el of document.querySelectorAll('[id="nt-title"]')){if(el.value!==(n.title||''))return true;}
    }
  }
  return false;
}

  const inp=document.getElementById('qainput');
  const btn=document.getElementById('qabtn');
  const chips=document.getElementById('qachips');
  if(!inp)return;
  if(inp.dataset.qaReady)return;
  inp.dataset.qaReady='1';
  // モバイルで即座にキーボードを出す
  const wrap=document.getElementById('qawrap');
  if(wrap){
    wrap.addEventListener('touchend',e=>{
      if(!e.target.matches('button,input'))inp.focus();
    },{passive:true});
  }
  inp.addEventListener('input',()=>{
    const p=parseQA(inp.value);
    let h='';
    if(p.dueAt)h+='<span class="chip chip-date">📅 '+fmtDate(p.dueAt)+'</span>';
    if(p.priority<4)h+='<span class="chip chip-pri">P'+p.priority+'</span>';
    p.tagIds.forEach(id=>{const t=S.tags.find(x=>x.id===id);if(t)h+='<span class="chip chip-tag">#'+esc(t.name)+'</span>'});
    chips.innerHTML=h;
    btn.style.display=inp.value.trim()?'':'none';
  });
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();submitQA()}});
}

async function submitQA(){
  const inp=document.getElementById('qainput');
  if(!inp||!inp.value.trim())return;
  if(window._sbReady&&isPlanFree()&&getActiveTaskCount()>=getPlanDef().taskLimit){showUpgradeModal('tasks');return;}
  const p=parseQA(inp.value);
  if(!p.title){toast('タイトルを入力してください');return}
  // 未登録タグを自動作成
  if(p._newTagNames&&p._newTagNames.length){
    for(const name of p._newTagNames){
      const nt=mkTag({name,color:'#7c3aed'});
      await saveTag(nt);
      p.tagIds.push(nt.id);
    }
  }
  const status=S.view==='project'?'active':'inbox';
  const _t=today();
  const _d3=(()=>{const d=new Date();d.setDate(d.getDate()+3);return d.toISOString().slice(0,10);})();
  if(!p.dueAt)p.dueAt=_d3;
  if(!p.startAt)p.startAt=_t;
  const _newProjId=p.projectId||(S.view==='project'?S.projId:null);
  const task=mkTask({...p,status,projectId:_newProjId,order:_newProjId?topOrderInProject(_newProjId):Date.now()});
  await saveTask(task);
  inp.value='';
  document.getElementById('qachips').innerHTML='';
  document.getElementById('qabtn').style.display='none';
  playSE('add');
  toast('"'+task.title+'" を追加しました');
  render();
}

      const snap=JSON.stringify(task);
      const incompleteSubs=!task.parentTaskId?S.tasks.filter(t=>t.parentTaskId===task.id&&t.status!=='completed'):[];
      const doComplete=async()=>{
        task.status='completed';task.completedAt=now();
        await saveTask(task);
        // サブタスクも完了にする
        if(!task.parentTaskId){
          const subs=S.tasks.filter(t=>t.parentTaskId===task.id&&t.status!=='completed');

      } else {

// ===== GLOBAL CALCULATOR DRAWER =====
// ===== PC 拡大表示 =====
// 【従来】dr.innerHTML をモーダルへコピーし、reattachModalEvents で配線を貼り直していた。
// その結果 id が document 内に2つ存在する状態になり、renderDrawer 側の
// document.getElementById(...) はドロワー側を掴む。だからモーダル用にもう一度
// 同じ配線を書く必要があり、書き写し漏れがそのまま機能差になっていた
// （計画開始日が保存されない／サブタスクの並び替えが効かない／
//   「📌 親タスクのタイトル」が反応しない／曜日表示の色が付かない 等）。
//
// 【現在】ドロワー要素そのものをモーダルへ *移動* する。id は一意のままなので、
// renderDrawer が付けた配線と非同期ロード（コメント・添付・シークレットメモ）が
// そのまま効く。モーダル専用の配線は不要になった。
let _expandState=null;

function isExpandOpen(){return !!_expandState}

function openExpandModal(type){
  // 既に開いていれば、まずドロワーを元の位置へ戻してから開き直す
  closeExpandModal(false);
  // 状態を持たない残骸のオーバーレイがあれば掃除する
  document.querySelectorAll('.expand-overlay').forEach(el=>el.remove());

  const dr=document.getElementById('drawer');
  if(!dr)return;

  const ov=document.createElement('div');
  ov.className='expand-overlay';
  const modal=document.createElement('div');
  modal.className='expand-modal';
  ov.appendChild(modal);
  document.body.appendChild(ov);

  // 元の位置を覚えてから移動する（閉じるときにここへ戻す）
  _expandState={ov,type,parent:dr.parentNode,next:dr.nextSibling};
  modal.appendChild(dr);
  // 描画はここで行う。_expandState を立てた後でないと renderDrawer 側の
  // isExpandOpen() が false になり、1列の器で描いてから組み直す二重描画になる。
  if(type==='task')renderDrawer(); else renderNoteDrawer();
  // 描画側で閉じられた（対象が見つからない等）場合はここで打ち切る
  if(!_expandState)return;
  if(dr.style.display==='none'){closeExpandModal(false);return;}
  // ドロワがレイアウトから外れるので、main の幅制限を解除する
  const _m=document.querySelector('.main');if(_m)_m.style.maxWidth='';

  ov.addEventListener('click',e=>{if(e.target===ov)closeExpandModal()});
  document.addEventListener('keydown',_expandEsc);
}

function _expandEsc(e){if(e.key==='Escape')closeExpandModal()}

// rerender=false は「畳むだけ（描画は呼び出し側でやる）」。
// renderDrawer/renderNoteDrawer の内部から呼ぶ場合は再帰させないため必ず false。
function closeExpandModal(rerender=true){
  const st=_expandState;
  if(!st)return;
  _expandState=null;
  document.removeEventListener('keydown',_expandEsc);
  const dr=document.getElementById('drawer');
  // 【重要】オーバーレイを消す前に必ずドロワーを元へ戻す。
  // 戻さずに remove するとドロワー要素ごと DOM から消える。
  if(dr&&st.parent)st.parent.insertBefore(dr,st.next);
  st.ov.remove();
  if(rerender){
    if(st.type==='task')renderDrawer(); else renderNoteDrawer();
  }
}

// ===== SWIPE TO OPEN/CLOSE SIDEBAR =====
(function(){
  let startX=0,startY=0,tracking=false;
  const EDGE=30;      // 左端からこのpx以内でスワイプ開始 → 開く
  const MIN_DIST=60;  // 最低スワイプ距離(px)
  const ANGLE=0.6;    // 水平判定: |dy|/|dx| < ANGLE なら水平スワイプとみなす

  document.addEventListener('touchstart',e=>{
    if(window.innerWidth>768)return;
    const t=e.touches[0];
    if(t.clientX<=EDGE&&!S.sidebarOpen){
      // 左端から右スワイプ → 開く候補
      startX=t.clientX;startY=t.clientY;tracking='open';
    } else if(S.sidebarOpen&&t.clientX<=280){
      // サイドバー内から左スワイプ → 閉じる候補
      startX=t.clientX;startY=t.clientY;tracking='close';
    }
  },{passive:true});

  // touchend で判定することで垂直スクロールとの誤作動を防止
  document.addEventListener('touchend',e=>{
    if(!tracking)return;
    const dx=e.changedTouches[0].clientX-startX;
    const dy=e.changedTouches[0].clientY-startY;
    // 縦成分が横成分より大きい場合は無視
    if(Math.abs(dy)>Math.abs(dx)*ANGLE){tracking=false;return;}
    if(tracking==='open'&&dx>=MIN_DIST){
      S.sidebarOpen=true;S._sidebarJustOpened=Date.now();render();
    } else if(tracking==='close'&&dx<=-MIN_DIST){
      S.sidebarOpen=false;render();
    }
    tracking=false;
  },{passive:true});

  document.addEventListener('touchcancel',()=>{tracking=false;},{passive:true});
})();

// ===== MOBILE SEARCH EXPAND/COLLAPSE =====
(function(){
  const wrap=document.getElementById('global-srch-wrap');
  const input=document.getElementById('global-srch');
  const topbar=wrap?.closest('.topbar');
  if(!wrap||!input)return;

  function expand(){
    wrap.classList.add('srch-expanded');
    topbar?.classList.add('srch-active');
    setTimeout(()=>input.focus(),50);
  }
  function collapse(){
    wrap.classList.remove('srch-expanded');
    topbar?.classList.remove('srch-active');
  }

  wrap.addEventListener('click',e=>{
    if(window.innerWidth>768)return;
    if(!wrap.classList.contains('srch-expanded')){e.stopPropagation();expand();}
  });
  input.addEventListener('blur',()=>{
    if(window.innerWidth>768)return;
    if(!input.value)setTimeout(collapse,150);
  });
  // 検索クリア時も折りたたむ
  input.addEventListener('search',()=>{
    if(window.innerWidth>768)return;
    if(!input.value)setTimeout(collapse,150);
  });
})();

// keyboard
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&S.drawerOpen){
    // 集中モードのときの Escape は、一気に一覧まで戻らずドロワ表示に畳む。
    // 展げたものを畳むのが Escape で、閉じるのは✕という役割分けにする。
    if(isExpandOpen()){closeExpandModal();return;}
    S.drawerOpen=false;S.taskId=null;renderDrawer();renderContent();
  }
  if(e.key==='n'&&!e.target.matches('input,textarea,select')){e.preventDefault();document.getElementById('qainput')?.focus()}
  if(e.key==='f'&&(e.ctrlKey||e.metaKey)&&window.innerWidth>768){e.preventDefault();const gs=document.getElementById('global-srch');if(gs){gs.focus();gs.select();}}
  if((e.ctrlKey||e.metaKey)&&(e.key==='ArrowUp'||e.key==='ArrowDown')){
    e.preventDefault();
    doViewNav(e.key==='ArrowUp'?'prev':'next');
  }
  // PC専用: ↑↓でタスク選択移動、Spaceで完了トグル
  if(window.innerWidth>768&&!e.target.matches('input,textarea,select')){
    if(e.key==='ArrowUp'||e.key==='ArrowDown'){
      if(e.ctrlKey||e.metaKey)return; // Ctrl/Cmd+↑↓はビュー切替なのでスキップ
      e.preventDefault();
      const vt=S.view==='nextview'?getNextViewRows().map(r=>r.task):getTasks().filter(t=>!t.parentTaskId);
      if(!vt.length)return;
      const cur=vt.findIndex(t=>t.id===S.taskId);
      let ni=e.key==='ArrowUp'?cur-1:cur+1;
      if(ni<0)ni=0;
      if(ni>=vt.length)ni=vt.length-1;
      const next=vt[ni];
      if(!next||next.id===S.taskId)return;
      S.taskId=next.id;S.drawerOpen=true;S.noteOpen=false;
      renderDrawer();renderContent();
      // スクロールして選択行を表示
      requestAnimationFrame(()=>{
        document.querySelector('.trow[data-id="'+next.id+'"]')?.scrollIntoView({block:'nearest',behavior:'smooth'});
      });
    }
    if(e.key===' '){
      if(!S.taskId||S.drawerOpen===false)return;
      // フォーカスがinput/textareaにある場合は通常スペースを優先
      const active=document.activeElement;
      if(active&&active.matches('input,textarea,select,[contenteditable]'))return;
      e.preventDefault();
      const chkBtn=document.querySelector('.trow[data-id="'+S.taskId+'"] .chk');
      if(chkBtn)chkBtn.click();
    }
  }
});

// ===== BACKUP =====
async function saveBackup(label){
  const data={
    tasks:S.tasks,
    projects:S.projects,
    tags:S.tags,
  };
  const uid2=window._currentUser?.id;
  if(!uid2)throw new Error('ログインが必要です');
  const backup={id:uid(),label,created_at:now(),data:JSON.stringify(data),user_id:uid2};
  const{error}=await window._SB.from('backups').insert(backup);
  if(error)throw error;
  return backup;
}

async function loadBackups(){
  const uid2=window._currentUser?.id;
  if(!uid2)return[];
  const{data,error}=await window._SB.from('backups').select('*').eq('user_id',uid2).order('created_at',{ascending:false}).limit(20);
  if(error)throw error;
  return data||[];
}

async function deleteBackup(id){
  const{error}=await window._SB.from('backups').delete().eq('id',id);
  if(error)throw error;
}

async function restoreBackup(backup){
  const data=JSON.parse(backup.data);
  // 現在のデータを全削除してから復元
  for(const t of S.tasks)await dbDel('tasks',t.id);
  for(const p of S.projects)await dbDel('projects',p.id);
  for(const g of S.tags)await dbDel('tags',g.id);
  // 復元
  for(const t of data.tasks||[])await dbPut('tasks',t);
  for(const p of data.projects||[])await dbPut('projects',p);
  for(const g of data.tags||[])await dbPut('tags',g);
  await loadAll();
  render();
}

  // ===== CSV ユーティリティ =====
  function toShiftJIS(str){
    // TextEncoder/Decoderでは直接ShiftJISに変換できないため、
    // BOMなしShiftJISをUint8Arrayで生成するため文字コード変換テーブルを使う
    // ブラウザ標準APIにShiftJIS encoderがないので、
    // iconv-liteなどは使えない環境のためXMLHttpRequestを使ったBlobで対応
    const buf=[];
    const encoder=new TextEncoder();
    // ShiftJISマッピングテーブルをCanvas経由で得る方法はないため、
    // UTF-8 BOM付きCSVとして出力しExcelでも文字化けしない形式にする
    // ※ ShiftJISへの変換はサーバーサイドなしでは困難なため
    //   BOM付きUTF-8（\uFEFF）を付けることでExcelが正しく認識する
    return encoder.encode('\uFEFF'+str);
  }

  function downloadCSV(filename, csvStr){
    const bytes=toShiftJIS(csvStr);
    const blob=new Blob([bytes],{type:'text/csv;charset=utf-8'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=filename;
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),3000);
  }

  function escCsv(v){
    if(v===null||v===undefined)return'';
    const s=String(v).replace(/"/g,'""');
    return(s.includes(',')||s.includes('"')||s.includes('\n'))?'"'+s+'"':s;
  }

  // 複数行セル（改行を含むbody等）に対応したCSVパーサー
  function parseCsv(text){
    // BOM除去・改行統一
    const t=(text.startsWith('\uFEFF')?text.slice(1):text).replace(/\r\n/g,'\n').replace(/\r/g,'\n');
    if(!t.trim())return{headers:[],rows:[]};
    // 全体を1文字ずつスキャンしてトークン分割
    const tokens=[];let cur='';let inQ=false;
    for(let i=0;i<t.length;i++){
      const c=t[i];
      if(inQ){
        if(c==='"'&&t[i+1]==='"'){cur+='"';i++;}
        else if(c==='"'){inQ=false;}
        else{cur+=c;}
      } else {
        if(c==='"'){inQ=true;}
        else if(c===','){tokens.push({v:cur,nl:false});cur='';}
        else if(c==='\n'){tokens.push({v:cur,nl:true});cur='';}
        else{cur+=c;}
      }
    }
    tokens.push({v:cur,nl:true});
    // トークン列を行に組み立て
    const allRows=[];let row=[];
    for(const tk of tokens){
      row.push(tk.v);
      if(tk.nl){allRows.push(row);row=[];}
    }
    // 先頭行をヘッダーに
    if(allRows.length<2)return{headers:[],rows:[]};
    const headers=allRows[0];
    const rows=[];
    for(let i=1;i<allRows.length;i++){
      if(allRows[i].every(v=>!v.trim()))continue;
      const r={};
      headers.forEach((h,idx)=>{r[h]=allRows[i][idx]??'';});
      rows.push(r);
    }
    return{headers,rows};
  }
  // 後方互換用（内部では使わない）
  function parseCsvLine(line){return parseCsv(line+'\n').rows[0]?Object.values(parseCsv('h\n'+line+'\n').rows[0]):[];}

// ===== PULL TO REFRESH =====
(function(){
  const el=document.getElementById('content');
  const ind=document.getElementById('ptr-indicator');
  const lbl=document.getElementById('ptr-label');
  let startY=0,pulling=false,triggered=false,syncing=false;
  const THRESHOLD=72;

  el.addEventListener('touchstart',e=>{
    if(el.scrollTop===0)startY=e.touches[0].clientY;
  },{passive:true});

  el.addEventListener('touchmove',e=>{
    if(!startY||syncing)return;
    const dy=e.touches[0].clientY-startY;
    if(dy<0){startY=0;return}
    if(dy>8){pulling=true}
    if(!pulling)return;
    const pull=Math.min(dy,THRESHOLD+24);
    ind.style.transform='translateY('+(pull-56)+'px)';
    ind.style.opacity=Math.min(pull/THRESHOLD,1);
    lbl.textContent=pull>=THRESHOLD?'離して同期':'引っ張って同期';
    triggered=pull>=THRESHOLD;
  },{passive:true});

  el.addEventListener('touchend',async()=>{
    if(!pulling){startY=0;return}
    pulling=false;startY=0;
    if(!triggered){
      ind.style.transform='translateY(-56px)';
      ind.style.opacity=0;
      return;
    }
    // sync
    syncing=true;
    const spinner=document.getElementById('ptr-spinner');
    ind.style.transform='translateY(0px)';
    spinner.classList.add('spinning');
    lbl.textContent='同期中…';
    try{
      await loadAll();
      render();
      lbl.textContent='✓ 同期完了';
      await new Promise(r=>setTimeout(r,800));
    }catch(err){
      lbl.textContent='同期失敗…';
      await new Promise(r=>setTimeout(r,1000));
    }
    ind.style.transform='translateY(-56px)';
    ind.style.opacity=0;
    spinner.classList.remove('spinning');
    syncing=false;triggered=false;
  });
})();

async function aiExecuteActions(actions){
  const done=[];
  // タグ名→IDを解決（未登録なら自動作成）。タグは1件につき1つのため、複数指定されても最初の1件のみ採用
  async function resolveTagIds(tagNames){
    if(!tagNames||!tagNames.length)return[];
    const list=Array.isArray(tagNames)?tagNames:[tagNames];
    const name=list.find(Boolean);
    if(!name)return[];
    let tag=S.tags.find(t=>t.name===name);
    if(!tag){tag=mkTag({name,color:'#7c3aed'});await saveTag(tag);}
    return[tag.id];
  }
  for(const a of actions){
    try{
      if(a.type==='addTask'){
        if(isPlanFree()&&getActiveTaskCount()>=getPlanDef().taskLimit){done.push({...a,label:a.title,error:'タスク上限（'+getPlanDef().taskLimit+'件）に達しています。スタンダードプランにアップグレードしてください。'});continue;}
        const tagIds=await resolveTagIds(a.tagNames);
        const t=mkTask({
          title:a.title||'新しいタスク',
          dueAt:a.dueAt||null,
          priority:a.priority||4,
          flagged:a.flagged||false,
          projectId:a.projectId?S.projects.find(p=>p.name===a.projectId)?.id||null:null,
          tagIds,
          status:(a.projectId&&S.projects.find(p=>p.name===a.projectId))?'active':'inbox',
        });
        await saveTask(t);
        done.push({...a,label:a.title});
      } else if(a.type==='deleteTask'){
        const t=a.keyword?S.tasks.find(x=>x.title&&x.title.includes(a.keyword)):null;
        if(t){await delTask(t.id);done.push({...a,label:t.title})}
      } else if(a.type==='updateTask'){
        // keywordまたはidで対象タスクを特定。複数マッチ・id直接指定にも対応
        // status:'completed'への変更→未完了タスクから探す。status:'completed'以外への変更（完了取り消し）→完了済みタスクから探す
        let targets=[];
        if(a.taskId){
          const t=S.tasks.find(x=>x.id===a.taskId);
          if(t)targets=[t];
        } else if(a.keyword){
          const reactivating=a.status!==undefined&&a.status!=='completed';
          const pool=reactivating?S.tasks.filter(x=>x.status==='completed'):S.tasks.filter(x=>x.status!=='completed');
          // 完全一致を優先、なければ部分一致
          const exact=pool.filter(x=>x.title===a.keyword);
          targets=exact.length?exact:pool.filter(x=>x.title&&x.title.includes(a.keyword));
        }
        if(!targets.length&&(a.taskId||a.keyword)){
          done.push({...a,label:a.keyword||a.taskId||'',error:'対象のタスクが見つかりません'});
        }
        for(const t of targets){
          if(!t.tagIds)t.tagIds=[];// tagIds未初期化ガード
          if(a.dueAt!==undefined)t.dueAt=a.dueAt;
          if(a.startAt!==undefined)t.startAt=a.startAt;
          if(a.priority!==undefined)t.priority=a.priority;
          if(a.flagged!==undefined)t.flagged=a.flagged;
          if(a.newTitle)t.title=a.newTitle;
          if(a.repeatRule!==undefined)t.repeatRule=a.repeatRule||null;
          // 時刻フィールド（HH:MM形式でdueAt/startAtに付加）
          if(a.startTime&&t.startAt)t.startAt=t.startAt.slice(0,10)+'T'+a.startTime+':00';
          if(a.dueTime&&t.dueAt)t.dueAt=t.dueAt.slice(0,10)+'T'+a.dueTime+':00';
          // メモ追記
          if(a.appendNote){
            t.notes=(t.notes?t.notes+'\n':'')+a.appendNote;
          }
          if(a.projectId!==undefined){
            const proj=S.projects.find(p=>p.name===a.projectId);
            t.projectId=proj?proj.id:null;
            if(t.projectId&&t.status==='inbox')t.status='active';
          }
          // タグの設定（1件につき1つのため、append指定でも常に置き換え）
          if(a.tagNames!==undefined){
            t.tagIds=await resolveTagIds(a.tagNames);
          }
          // ステータス変更（完了・未完了への復帰・アーカイブ）
          if(a.status!==undefined){
            if(a.status==='completed'){
              t.status='completed';t.completedAt=now();
            } else if(a.status==='archived'){
              t.status='archived';
            } else {
              t.status=a.status==='inbox'?'inbox':(t.projectId?'active':'inbox');
              t.completedAt=null;
            }
          }
          await saveTask(t);done.push({...a,label:t.title});
        }
      } else if(a.type==='addProject'){
        const p=mkProject({name:a.name,color:a.color||'#3b82f6'});
        await saveProject(p);done.push({...a,label:a.name});
      } else if(a.type==='addSubtask'){
        let parent=a.parentTaskId?S.tasks.find(x=>x.id===a.parentTaskId):null;
        if(!parent&&a.parentKeyword)parent=S.tasks.find(x=>x.title&&x.title.includes(a.parentKeyword)&&x.status!=='completed');
        if(parent){
          const sub=mkTask({
            title:a.title||'サブタスク',
            parentTaskId:parent.id,
            projectId:parent.projectId,
            status:parent.status==='inbox'?'inbox':'active',
            dueAt:a.dueAt||parent.dueAt,
            priority:a.priority||parent.priority,
            notes:a.notes||'',
          });
          await saveTask(sub);done.push({...a,label:a.title+'（'+parent.title+'のサブタスク）'});
        } else {
          done.push({...a,label:a.title,error:'親タスクが見つかりません'});
        }
      } else if(a.type==='addTag'){
        const exists=S.tags.find(t=>t.name===a.name);
        if(exists){
          done.push({...a,label:a.name,error:'同名タグが既に存在します'});
        } else {
          const tag=mkTag({name:a.name,color:a.color||'#7c3aed'});
          await saveTag(tag);done.push({...a,label:'#'+a.name});
        }
      } else if(a.type==='addNote'){
        const tagIds=await resolveTagIds(a.tagNames||[]);
        const note=mkNote({title:a.title||'無題',body:a.body||'',tagIds});
        await saveNote(note);
        done.push({...a,label:a.title});
      }
    }catch(e){console.error('action error',e)}
  }
  if(done.length)render();
  return done;
}

    // 会話履歴を構築（tool_use対応形式）
    const messages=AI.msgs.filter(m=>!m.loading).slice(-8).map(m=>({
      role:m.role==='user'?'user':'assistant',

          actions.push({
            type:'updateTask',
            taskId:inp.task_id,keyword:inp.keyword,
            newTitle:inp.new_title,
            dueAt:inp.due_at,startAt:inp.start_at,
            startTime:inp.start_time,dueTime:inp.due_time,

            projectId:inp.project_name,
            tagNames:inp.tag_names,appendTags:inp.append_tags,
            repeatRule:inp.repeat_rule,
            appendNote:inp.append_note,
            status:inp.status,
          });
        } else if(block.name==='delete_task'){
          actions.push({type:'deleteTask',taskId:inp.task_id,keyword:inp.keyword});
        } else if(block.name==='add_project'){
          actions.push({type:'addProject',name:inp.name,color:inp.color||'#3b82f6'});
        } else if(block.name==='add_subtask'){
          actions.push({
            type:'addSubtask',
            parentTaskId:inp.parent_task_id,
            parentKeyword:inp.parent_keyword,
            title:inp.title,
            dueAt:inp.due_at||null,
            priority:inp.priority||4,
            notes:inp.notes||'',
          });
        } else if(block.name==='add_tag'){
          actions.push({type:'addTag',name:inp.name,color:inp.color||'#7c3aed'});
        } else if(block.name==='add_note'){
          actions.push({type:'addNote',title:inp.title,body:inp.body||'',tagNames:inp.tag_names||[]});
        }
      }
    }

    AI.loading=false;
    // 次のターンのためにtoolUseBlocksを保存
    const lastMsg=AI.msgs[AI.msgs.length-1];
    if(lastMsg&&lastMsg.role==='user'){
      // assistantのtool_useブロックを会話履歴に保持
    }
    const done=await aiExecuteActions(actions);
    // 件数サマリーをメッセージに付加
    let summary=replyMessage||'';

      done.forEach(d=>{

      const parts=Object.entries(counts).map(([k,v])=>k+' '+v+'件');
      if(!summary)summary='処理が完了しました。';
      summary+='\n\n✅ '+parts.join('、');
    }
    aiAddMsg('ai',summary||'完了しました',done);
    aiRender('last-ai');

  }catch(e){
    AI.loading=false;
    aiAddMsg('ai','エラーが発生しました: '+e.message);

}

(function(){
  const panel=document.getElementById('ai-panel');
  let startY=0,startAt=0,dragging=false;
  const onStart=e=>{
    if(!panel.classList.contains('open'))return;
    startY=e.touches[0].clientY;startAt=Date.now();dragging=true;
    panel.classList.add('dragging');
  };
  const onMove=e=>{
    if(!dragging)return;
    const dy=e.touches[0].clientY-startY;
    if(dy<=0){panel.style.transform='';return;}// 上方向への引き戻しは無視
    panel.style.transform='translateY('+dy+'px)';
  };
  const onEnd=e=>{
    if(!dragging)return;
    dragging=false;
    panel.classList.remove('dragging');
    const endY=e.changedTouches?e.changedTouches[0].clientY:startY;
    const dy=endY-startY,dt=Date.now()-startAt;
    const isFlick=dy>30&&dt<200;// 素早いフリックは小さい移動量でも閉じる
    if(dy>80||isFlick){aiToggle(false);}else{panel.style.transform='';}
  };
  [document.getElementById('ai-panel-handle'),document.getElementById('ai-panel-head')].forEach(el=>{
    el.addEventListener('touchstart',onStart,{passive:true});
    el.addEventListener('touchmove',onMove,{passive:true});
    el.addEventListener('touchend',onEnd,{passive:true});
    el.addEventListener('touchcancel',onEnd,{passive:true});
  });
})();

// PC/Mac: エクスプローラー/Finderでファイルをコピーしてテキストエリアにペーストすると、
// 画像に限らず（PDF/Word/Excel/PowerPoint等）そのまま添付できるようにする（Claudeのチャット欄と同じ体験）
function extractHandlePasteEvent(ov,e){
  const items=e.clipboardData?.items;
  if(!items)return;
  for(const item of items){
    if(item.kind==='file'){
      if(!isPlanPremium()){toast('ファイル・画像からの解析はプレミアムプラン限定です');return;}
      const file=item.getAsFile();
      if(!file)continue;
      e.preventDefault();
      handleExtractFile(ov,file);
      return;
    }
  }
}

function fileToBase64Raw(file){
  return new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onload=()=>resolve(String(r.result).split(',')[1]||'');
    r.onerror=()=>reject(new Error('ファイルの読み込みに失敗しました'));
    r.readAsDataURL(file);
  });
}

function loadScriptOnce(key,src){
  if(window[key])return Promise.resolve();
  if(!window._extractLibPromises)window._extractLibPromises={};
  if(window._extractLibPromises[key])return window._extractLibPromises[key];
  window._extractLibPromises[key]=new Promise((resolve,reject)=>{
    const s=document.createElement('script');
    s.src=src;
    s.onload=()=>resolve();
    s.onerror=()=>reject(new Error('読み込み用ライブラリの取得に失敗しました'));
    document.head.appendChild(s);
  });
  return window._extractLibPromises[key];
}
