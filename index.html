            type:'addTask',
            title:inp.title,
            dueAt:inp.due_at||null,
            priority:inp.priority||4,
            flagged:inp.flagged||false,
            projectId:inp.project_name||null,
            tagNames:inp.tag_names||[],
          });
        } else if(block.name==='complete_task'){
          actions.push({type:'completeTask',taskId:inp.task_id,keyword:inp.keyword});
        } else if(block.name==='update_task'){
          actions.push({
            type:'updateTask',
            taskId:inp.task_id,keyword:inp.keyword,
            newTitle:inp.new_title,
            dueAt:inp.due_at,startAt:inp.start_at,
            startTime:inp.start_time,dueTime:inp.due_time,
            priority:inp.priority,flagged:inp.flagged,
            projectId:inp.project_name,
            tagNames:inp.tag_names,appendTags:inp.append_tags,
            repeatRule:inp.repeat_rule,
            appendNote:inp.append_note,
          });
        } else if(block.name==='delete_task'){
          actions.push({type:'deleteTask',taskId:inp.task_id,keyword:inp.keyword});
        } else if(block.name==='add_project'){
          actions.push({type:'addProject',name:inp.name,color:inp.color||'#3b82f6'});
        } else if(block.name==='add_subtask'){
          actions.push({
            type:'addSubtask',
            parentTaskId:inp.parent_task_id,
            parentKeyword:inp.parent_keyword,
            title:inp.title,
            dueAt:inp.due_at||null,
            priority:inp.priority||4,
            notes:inp.notes||'',
          });
        } else if(block.name==='add_tag'){
          actions.push({type:'addTag',name:inp.name,color:inp.color||'#7c3aed'});
        } else if(block.name==='add_note'){
          actions.push({type:'addNote',title:inp.title,body:inp.body||'',tagNames:inp.tag_names||[]});
        }
      }
    }

    AI.loading=false;
    // 次のターンのためにtoolUseBlocksを保存
    const lastMsg=AI.msgs[AI.msgs.length-1];
    if(lastMsg&&lastMsg.role==='user'){
      // assistantのtool_useブロックを会話履歴に保持
    }
    const done=await aiExecuteActions(actions);
    // 件数サマリーをメッセージに付加
    let summary=replyMessage||'';
    if(done&&done.length>0){
      const counts={};
      done.forEach(d=>{
        const label=d.type==='addTask'?'タスク追加':d.type==='completeTask'?'完了':d.type==='updateTask'?'更新':d.type==='deleteTask'?'削除':d.type==='addProject'?'プロジェクト追加':d.type==='addTag'?'タグ追加':d.type==='addNote'?'ノート追加':d.type==='addSubtask'?'サブタスク追加':d.type;
        counts[label]=(counts[label]||0)+1;
      });
      const parts=Object.entries(counts).map(([k,v])=>k+' '+v+'件');
      if(!summary)summary='処理が完了しました。';
      summary+='\n\n✅ '+parts.join('、');
    }
    aiAddMsg('ai',summary||'完了しました',done);
    aiRender();

  }catch(e){
    AI.loading=false;
    aiAddMsg('ai','エラーが発生しました: '+e.message);
    aiRender();
  }
}

      [[0,520,0.06],[0.055,780,0.07]].forEach(([delay,freq,dur])=>{
        const o=ctx.createOscillator();o.type='sine';o.frequency.value=freq;
        const g=ctx.createGain();g.gain.setValueAtTime(0.0,t+delay);g.gain.linearRampToValueAtTime(0.5,t+delay+0.008);g.gain.exponentialRampToValueAtTime(0.001,t+delay+dur);
        o.connect(g);g.connect(master);o.start(t+delay);o.stop(t+delay+dur+0.01);
      });
    }catch(e){}
  };

  // NG: 短い下降音（無効入力）
  window.playClickNG=function(){
    if(!getSetting('soundFx',true))return;
    try{
      if(!_audioCtx)_audioCtx=new(window.AudioContext||window.webkitAudioContext)();
      const ctx=_audioCtx;const t=ctx.currentTime;
      const o=ctx.createOscillator();o.type='square';
      o.frequency.setValueAtTime(220,t);o.frequency.exponentialRampToValueAtTime(130,t+0.09);
      const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=700;
      const g=ctx.createGain();g.gain.setValueAtTime(0.0,t);g.gain.linearRampToValueAtTime(0.07,t+0.005);g.gain.exponentialRampToValueAtTime(0.001,t+0.12);
      o.connect(lp);lp.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+0.13);
    }catch(e){}
  };
})();



// ===== INIT =====
async function init(){
  try{
    renderBotNav(); // ボトムナビを即時描画（データロード前）
    // Supabaseの準備を最大5秒待つ
    await new Promise(res=>{
      if(window._sbReady)return res();
      const t=Date.now();
      const iv=setInterval(()=>{
        if(window._sbReady||Date.now()-t>5000){clearInterval(iv);res()}
      },50);
    });
    await openDB();
    await loadUserPlan();
    await seed();
    await loadAll();
    await loadNavOrder();
    // 招待トークンチェック（ログイン済みの場合はここで即処理）
    checkInviteToken();
    const _storedToken=localStorage.getItem('pendingInviteToken');
    if(_storedToken){
      localStorage.removeItem('pendingInviteToken');
      await joinWorkspaceByToken(_storedToken);
    }
    // 保存済みビューの有効性を検証（削除済みプロジェクト/タグへの参照を除去）
    if(S.view==='project'&&!S.projects.find(p=>p.id===S.projId)){S.view='inbox';S.projId=null;}
    if(S.view==='tag'&&S.tagId!=='__none__'&&!S.tags.find(t=>t.id===S.tagId)){S.view='inbox';S.tagId=null;}
    // ?note= URLパラメータからノートを開く
    const urlP=new URLSearchParams(location.search);
    const noteP=urlP.get('note');
    if(noteP&&S.notes.find(n=>n.id===noteP)){
      S.view='notes';S.noteId=noteP;S.noteOpen=true;
      history.replaceState(null,'',location.pathname);
      renderInstant();
      applySettings();
      setTimeout(()=>renderNoteDrawer(),150);
      if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
      return;
    }
    // URLハッシュからタスクを開く
    const hash=location.hash.match(/^#task\/(.+)$/);
    if(hash){
      const id=hash[1];
      const found=S.tasks.find(t=>t.id===id);
      if(found){S.taskId=id;S.drawerOpen=true}
      else{
        // ハッシュをリセットしてトーストで通知
        history.replaceState(null,'',location.pathname);
        renderInstant();
        applySettings();
        setTimeout(()=>toast('タスクが見つかりませんでした'),500);
        if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
        return;
      }
    }
    renderInstant();
    applySettings();
    if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
    // ===== BNAV 左右ボタン 長押し → 特殊アクション =====
    (()=>{
      const botnav=document.getElementById('botnav');
      if(!botnav)return;
      let _lpt=null,_lpmoved=false,_lpsx=0,_lpsy=0,_lptarget=null;
      const lockSel=()=>{document.documentElement.style.webkitUserSelect='none';document.documentElement.style.userSelect='none';};
      const unlockSel=()=>{document.documentElement.style.webkitUserSelect='';document.documentElement.style.userSelect='';};
      const _preventCtx=e=>{if(_lpt!=null)e.preventDefault();};
      document.addEventListener('contextmenu',_preventCtx,{passive:false});
      document.addEventListener('selectstart',e=>{if(_lpt!=null)e.preventDefault();},{passive:false});
      botnav.addEventListener('touchstart',e=>{
        const isPrev=e.target.closest('.bnav-prev');
        const isNext=e.target.closest('.bnav-next');
        if(!isPrev&&!isNext)return;
        _lptarget=isPrev?'prev':'next';
        _lpmoved=false;_lpsx=e.touches[0].clientX;_lpsy=e.touches[0].clientY;
        lockSel();
        _lpt=setTimeout(()=>{
          if(_lpmoved){unlockSel();return;}
          _lpt=null;unlockSel();
          playSE('toggle');
          if(_lptarget==='prev'){S.sidebarOpen=true;render();}
          else{openNavEdit();}
        },500);
      },{passive:true});
      botnav.addEventListener('touchmove',e=>{
        if(_lpt==null)return;
        if(Math.abs(e.touches[0].clientX-_lpsx)>8||Math.abs(e.touches[0].clientY-_lpsy)>8){
          _lpmoved=true;clearTimeout(_lpt);_lpt=null;unlockSel();
        }
      },{passive:true});
      const endLp=()=>{if(_lpt!=null){clearTimeout(_lpt);_lpt=null;}unlockSel();};
      botnav.addEventListener('touchend',endLp,{passive:true});
      botnav.addEventListener('touchcancel',endLp,{passive:true});
    })();

    // ===== BNAV 左右ボタン 長押しリピート =====
    (()=>{
      const doNavStep=(dir)=>{
        const seq=getNavSequence();
        if(!seq.length)return;
        const cur=getCurrentNavIdx(seq);
        const len=seq.length;
        let ni;
        if(dir==='prev') ni=cur<=0?len-1:cur-1;
        else ni=cur>=len-1?0:cur+1;
        const item=seq[ni];
        if(!item)return;
        S.taskId=null;S.drawerOpen=false;
        if(item.type==='view'){S.view=item.v;}
        else if(item.type==='proj'){S.view='project';S.projId=item.id;}
        else if(item.type==='tag'){S.view='tag';S.tagId=item.id;}
        playSE('toggle');render();
      };
      const prevBtn=botnav.querySelector('.bnav-prev');
      const nextBtn=botnav.querySelector('.bnav-next');
      attachLongPressRepeat(prevBtn, ()=>doNavStep('prev'));
      attachLongPressRepeat(nextBtn, ()=>doNavStep('next'));
    })();
  }catch(err){
    console.error(err);
    document.getElementById('layout').innerHTML=
      '<div style="padding:40px;font-family:sans-serif"><h2 style="color:#4f46e5">エラーが発生しました</h2>'
      +'<pre style="font-size:12px;color:#666;margin-top:10px">'+esc(err&&err.message||String(err))+'</pre></div>';
  }
}
init();
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
(function(){
async function setupSB(){
  try{
    const SB=window.supabase.createClient('https://sfhtvtcmgueystyuhzvd.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNmaHR2dGNtZ3VleXN0eXVoenZkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ3Nzg0MDYsImV4cCI6MjA5MDM1NDQwNn0.qsON2xYdDf22LtU-jGd96Ubaif0xzzswC9KnzWndKNw');
    window._SB=SB;

    // カラム名マッピング（JS camelCase ↔ DB snake_case）
    const TO={projectId:'project_id',parentTaskId:'parent_task_id',sectionId:'section_id',tagIds:'tag_ids',dueAt:'due_at',startAt:'start_at',plannedStartAt:'planned_start_at',deadlineAt:'deadline_at',repeatRule:'repeat_rule',reminderAt:'reminder_at',createdAt:'created_at',updatedAt:'updated_at',completedAt:'completed_at',reviewEveryDays:'review_every_days',nextReviewAt:'next_review_at',order:'sort_order',workspaceId:'workspace_id'};
    const FR=Object.fromEntries(Object.entries(TO).map(([k,v])=>[v,k]));
    const toDB=o=>{const r={};for(const[k,v]of Object.entries(o)){if(k.startsWith('_'))continue;r[TO[k]||k]=v;}return r};
    const frDB=o=>{const r={};for(const[k,v]of Object.entries(o))r[FR[k]||k]=v;return r};
    // ===== DB操作: user_idでフィルタ =====
    let _lastErrMsg='',_lastErrTs=0;
    window.dbAll=async s=>{
      const uid=window._currentUser?.id;
      if(!uid)return[];
      const{data,error}=await SB.from(s).select('*').eq('user_id',uid);
      if(error){console.error('SB.dbAll',s,error);return[]}
      return(data||[]).map(frDB);
    };
    window.dbPut=async(s,i)=>{
      const uid=window._currentUser?.id;
      if(!uid)return;
      const row=toDB(i);
      row.user_id=uid;
      const{error}=await SB.from(s).upsert(row,{onConflict:'id'});
      if(error){
        console.error('SB.dbPut error',s,error);
        const msg='⚠ 同期エラー('+s+'): '+(error.message||JSON.stringify(error)).slice(0,60);
        const now2=Date.now();
        if(typeof toast==='function'&&(msg!==_lastErrMsg||now2-_lastErrTs>5000)){
          toast(msg);_lastErrMsg=msg;_lastErrTs=now2;
        }
      }
    };
    window.dbDel=async(s,id)=>{
      const{error}=await SB.from(s).delete().eq('id',id);
      if(error){console.error('SB.dbDel',s,error);if(typeof toast==='function')toast('⚠ 削除エラー: '+(error.message||'').slice(0,60));}
    };
    window._lastSelfSave=0;

    // app_settings: key-value同期（user_idでユーザーごとに分離）
    window.sbGetSetting=async(key)=>{
      const uid=window._currentUser?.id;
      if(!uid)return null;
      const{data}=await SB.from('app_settings').select('value').eq('user_id',uid).eq('key',key).maybeSingle();
      return data?data.value:null;
    };
    window.sbSetSetting=async(key,value)=>{
      const uid=window._currentUser?.id;
      if(!uid)return;
      await SB.from('app_settings').upsert({user_id:uid,key,value,updated_at:new Date().toISOString()},{onConflict:'user_id,key'});
    };

    // ===== 認証状態の管理 =====
    const loginScreen=document.getElementById('loginScreen');
    const showLogin=()=>{if(loginScreen)loginScreen.style.display='flex';};
    const hideLogin=()=>{if(loginScreen)loginScreen.style.display='none';};

    // Googleサインインボタン
    const signinBtn=document.getElementById('google-signin-btn');
    const loadingEl=document.getElementById('login-loading');
    const switchBtn=document.getElementById('google-switch-btn');
    const _doSignIn=async(selectAccount)=>{
      if(signinBtn)signinBtn.disabled=true;
      if(switchBtn)switchBtn.disabled=true;
      if(loadingEl)loadingEl.style.display='flex';
      const opts={redirectTo:location.origin+location.pathname};
      if(selectAccount)opts.queryParams={prompt:'select_account'};
      await SB.auth.signInWithOAuth({provider:'google',options:opts});
    };
    if(signinBtn)signinBtn.addEventListener('click',()=>_doSignIn(false));
    if(switchBtn)switchBtn.addEventListener('click',()=>_doSignIn(true));

    // 初回セッション確認（getSession()を正とする。onAuthStateChangeのINITIAL_SESSIONは使わない）
    const{data:{session}}=await SB.auth.getSession();
    window._currentUser=session?.user||null;
    if(window._currentUser){hideLogin();}else{showLogin();}
    window._sbReady=true;

    // 認証状態変化の監視（初回以降の変化のみ対応）
    SB.auth.onAuthStateChange((event,session)=>{
      if(event==='INITIAL_SESSION')return; // 初回はgetSession()で処理済み
      window._currentUser=session?.user||null;
      if(event==='SIGNED_IN'){
        hideLogin();
        if(typeof loadUserPlan==='function')loadUserPlan().then(()=>{if(typeof renderSidebar==='function')renderSidebar();}).catch(()=>{});
        if(typeof loadAll==='function'&&typeof render==='function'){
          loadAll().then(async()=>{
            // 招待リンク経由でOAuth後にリロードされた場合はlocalStorageから復元して参加
            const _pt=localStorage.getItem('pendingInviteToken');
            if(_pt){
              localStorage.removeItem('pendingInviteToken');
              await joinWorkspaceByToken(_pt);
            } else {
              render();
            }
          }).catch(()=>{});
        }
      } else if(event==='SIGNED_OUT'){
        window._currentUser=null;
        showLogin();
      }
    });

    // ===== Realtimeサブスクリプション =====
    window._lastSync=0;
    const _syncNow=(force)=>{
      if(!window._currentUser)return;
      if(Date.now()-window._lastSelfSave<5000)return;
      if(!force&&Date.now()-window._lastSync<60000)return;
      const ae=document.activeElement;
      if(ae&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA'))return;
      if(typeof loadAll==='function'&&typeof render==='function'){
        loadAll().then(()=>{window._lastSync=Date.now();render();}).catch(()=>{});
      }
    };
    // Realtimeサブスクリプションは無効化（Disk IO削減のため）
    // 120秒ポーリング＋visibilitychangeで同期を維持（60秒以内の再取得はスキップ）
    document.addEventListener('visibilitychange',()=>{
      if(document.visibilityState==='visible'){
        const ae=document.activeElement;
        if(ae&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA'))return;
        _syncNow();
      }
    });
    setInterval(()=>_syncNow(true),120000);

    // ===== IndexedDBからSupabaseへのインポート =====
    window.importFromIndexedDB=async()=>{
      const uid=window._currentUser?.id;
      if(!uid){toast('先にサインインしてください');return 0;}
      const stores=['tasks','projects','sections','tags'];
      let done=0;

      // 1. localStorage（f_tasks, f_projects…）から読み込み
      for(const s of stores){
        let items=[];
        try{items=JSON.parse(localStorage.getItem('f_'+s)||'[]')}catch(e){}
        console.log('localStorage '+s+':',items.length,'件');
        for(const item of items){
          const row=toDB(item);
          row.user_id=uid;
          const{error}=await SB.from(s).upsert(row,{onConflict:'id'});
          if(error){console.error('ls import error',s,error);}
          else done++;
        }
      }

      // 2. IndexedDB（focus-db）から読み込み
      await new Promise(resolve=>{
        const req=indexedDB.open('focus-db');
        req.onerror=()=>{console.warn('IndexedDB open failed');resolve();};
        req.onsuccess=async e=>{
          const db=e.target.result;
          for(const s of stores){
            if(!db.objectStoreNames.contains(s))continue;
            const items=await new Promise(r=>{
              const tx=db.transaction(s,'readonly');
              const req2=tx.objectStore(s).getAll();
              req2.onsuccess=()=>r(req2.result);
              req2.onerror=()=>r([]);
            });
            console.log('IndexedDB '+s+':',items.length,'件');
            for(const item of items){
              const row=toDB(item);
              row.user_id=uid;
              const{error}=await SB.from(s).upsert(row,{onConflict:'id'});
              if(error){console.error('idb import error',s,error);}
              else done++;
            }
          }
          db.close();
          resolve();
        };
      }).catch(()=>{});

      // 3. Supabaseに既にある未割当データ（user_id=null）をこのユーザーに帰属
      for(const s of stores){
        const{error}=await SB.from(s).update({user_id:uid}).is('user_id',null);
        if(error){console.log('claim null user_id error',s,error.message);}
        else console.log('claimed null rows in',s);
      }

      return done;
    };

  }catch(e){console.error('Supabase init failed',e);window._sbReady=true;}
}
setupSB();
})();
</script>
