// ===== Google Play（Androidアプリ）判定 =====
// Google Playで配布するTWA（Trusted Web Activity）の中で開かれているかを判定する。
// Google Playの決済ポリシーが規制するのは「アプリ内でデジタルコンテンツを購入させる」行為で、
// 他所で購入した権利をアプリ内で利用させること（＝消費専用）は明示的に認められている。
// そこでアプリ内では課金導線（Stripe Payment Link・カスタマーポータル）を一切出さず、
// リンクを張らないテキスト告知に差し替える。リンクを設置しなければGoogleへの
// 外部決済手数料は発生しない（リンクを置くとクリック後24時間の購入が手数料対象になる）。
//
// 判定シグナル（どちらかがヒットすればPlayアプリ扱い）:
//   1. document.referrer が 'android-app://<自分のパッケージ名>'（TWA起動時にChromeが付与）
//   2. 起動URLに ?src=twa が付いている（Bubblewrapのlaunch URLに設定しておく／保険）
//
// ★1で「android-app:// で始まる」だけを見てはいけない。Chromeは他のAndroidアプリ内の
//   リンクから開かれた場合も referrer に android-app://com.google.android.gm 等を入れるため、
//   Gmail・LINE・Slackのリンクから来たWeb版ユーザーを誤ってPlayアプリ扱いし、
//   購入ボタンを消してしまう。必ず自分のパッケージ名と完全一致で判定する。
//
// 保持先が sessionStorage なのは意図的。localStorageにすると同一端末のChromeブラウザ
// （＝Web版）とストレージを共有してしまい、Web版でも購入ボタンが消えてしまう。
// 誤検知で購入できなくなった場合は ?src=web を付けて開けばそのセッションの間は解除できる。
//
// PLAY_APP_PACKAGE は Play Console に登録する applicationId と必ず一致させること。
// （Bubblewrapの初期値は app.taskra.jp を反転した jp.taskra.app）
const PLAY_APP_PACKAGE='jp.taskra.app';
const PLAY_APP_FLAG='taskra_src_twa';
const IS_PLAY_APP=(function(){
  const ss=(function(){try{return window.sessionStorage;}catch(_){return null;}})();
  const read=function(){try{return ss?ss.getItem(PLAY_APP_FLAG):null;}catch(_){return null;}};
  const write=function(v){try{if(ss)ss.setItem(PLAY_APP_FLAG,v);}catch(_){}};

  let src=null;
  try{src=new URLSearchParams(location.search).get('src');}catch(_){}

  // ?src=web は明示的な解除。以降このセッションでは判定シグナルより優先する。
  if(src==='web'){write('0');return false;}
  if(read()==='0')return false;

  const ref=document.referrer||'';
  const fromOurApp=ref==='android-app://'+PLAY_APP_PACKAGE
                 ||ref.indexOf('android-app://'+PLAY_APP_PACKAGE+'/')===0;
  if(src==='twa'||fromOurApp){write('1');return true;}

  return read()==='1';
})();
// 実機（Chrome DevTools リモートデバッグ）から判定結果を確認できるように公開する。
// 判定に使うのは常に IS_PLAY_APP 側。こちらは参照専用。

function urlBase64ToUint8Array(base64String){
  const padding='='.repeat((4 - base64String.length % 4) % 4);
  const base64=(base64String+padding).replace(/-/g,'+').replace(/_/g,'/');
  const raw=atob(base64);
  const out=new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++)out[i]=raw.charCodeAt(i);
  return out;
}

    repeat_start:!!s.repeat_start,
    quiet_start:s.quiet_start||'',
    quiet_end:s.quiet_end||'',
  };
  try{ await window.sbSetSetting?.('notif_settings',JSON.stringify(data)); }catch(e){ console.warn('sbSetSetting',e); }
  // notification_settings テーブルにも書く（cronから参照される）
  try{
    if(!window._currentUser)return;
    await window._SB.from('notification_settings').upsert({
      user_id:window._currentUser.id,
      push_enabled:data.push_enabled,
      due_reminder:data.due_reminder,
      due_minutes_before:data.due_minutes_before,
      mention_notify:data.mention_notify,
      repeat_start:data.repeat_start,
      quiet_start:data.quiet_start||null,
      quiet_end:data.quiet_end||null,
      updated_at:new Date().toISOString(),
    },{onConflict:'user_id'});
  }catch(e){console.warn('notification_settings upsert',e);}
}

async function subscribeToPush(){
  if(!isPushSupported())throw new Error('このブラウザはプッシュ通知に対応していません');
  if(isIosTabWithoutPush())throw new Error('iOSではホーム画面に追加したPWAでのみプッシュ通知が利用できます');
  if(!VAPID_PUBLIC_KEY || VAPID_PUBLIC_KEY.startsWith('__'))throw new Error('VAPID公開鍵が未設定です');

  const reg=await navigator.serviceWorker.ready;
  let sub=await reg.pushManager.getSubscription();
  if(!sub){
    sub=await reg.pushManager.subscribe({
      userVisibleOnly:true,
      applicationServerKey:urlBase64ToUint8Array(VAPID_PUBLIC_KEY),
    });
  }
  // Supabaseへ保存
  if(!window._currentUser)throw new Error('ログインが必要です');
  const subJson=sub.toJSON();
  await window._SB.from('push_subscriptions').upsert({
    user_id:window._currentUser.id,
    endpoint:subJson.endpoint,
    p256dh:subJson.keys.p256dh,
    auth:subJson.keys.auth,
    user_agent:(navigator.userAgent||'').slice(0,200),
    last_used_at:new Date().toISOString(),
  },{onConflict:'endpoint'});
  return sub;
}

async function unsubscribeFromPush(){
  try{
    const reg=await navigator.serviceWorker.ready;
    const sub=await reg.pushManager.getSubscription();
    if(sub){
      const endpoint=sub.endpoint;
      await sub.unsubscribe();
      if(window._currentUser){
        await window._SB.from('push_subscriptions').delete().eq('endpoint',endpoint);
      }
    }
  }catch(e){console.warn('unsubscribe',e);}
}

// service worker からのメッセージを受けてタスクを開く
if('serviceWorker' in navigator){
  navigator.serviceWorker.addEventListener('message',e=>{
    if(e.data&&e.data.type==='OPEN_TASK'&&e.data.taskId){
      const tid=e.data.taskId;
      // タスクが存在すればドロワーで開く
      setTimeout(()=>{
        const t=(window.S?.tasks||[]).find(x=>x.id===tid);
        if(t&&typeof render==='function'){
          window.S.taskId=tid;window.S.drawerOpen=true;render();
        }
      },300);
    }
    // 新しいSWが有効化されたら、入力中のデータを消さないよう即リロードせず
    // バナーで知らせてユーザーの操作で更新してもらう
    if(e.data&&e.data.type==='SW_UPDATED'){
      showUpdateBanner();
    }
  });
  // ホーム画面PWAはタブと違いバックグラウンド復帰時に自動でSW更新チェックが
  // 走らないことがあるため、フォアグラウンド復帰のたびに明示的にチェックする
  document.addEventListener('visibilitychange',()=>{
    if(document.visibilityState==='visible'){
      navigator.serviceWorker.getRegistration().then(reg=>reg&&reg.update()).catch(()=>{});
    }
  });
}

  // カスタマーポータルへ遷移（共通処理）
  async function goToPortal(btn,originalLabel){
    btn.textContent='読み込み中...';
    btn.disabled=true;
    try{
      const session=await window._SB.auth.getSession();
      const token=session?.data?.session?.access_token;
      const res=await fetch('https://sfhtvtcmgueystyuhzvd.supabase.co/functions/v1/stripe-portal',{
        method:'POST',
        headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'},
        body:JSON.stringify({return_url:location.href}),
      });
      const data=await res.json();
      if(data.url){location.href=data.url;}
      else{
        const msg=data.error||data.message||JSON.stringify(data);
        console.error('[stripe-portal]',res.status,msg);
        toast('エラー: '+msg);
        btn.textContent=originalLabel;btn.disabled=false;
      }
    }catch(e){
      console.error('[stripe-portal] fetch error',e);
      toast('通信エラー: '+e.message);
      btn.textContent=originalLabel;btn.disabled=false;
    }
  }

  // 「プラン変更・解約」ボタン
  const portalBtn=document.getElementById('my-plan-portal-btn');
  if(portalBtn)portalBtn.addEventListener('click',()=>goToPortal(portalBtn,'プランの管理・解約はこちら →'));

  // 有料プランからの「アップグレード」ボタン（ポータル経由）
  const upgradePortalBtn=document.getElementById('plan-upgrade-portal-btn');
  if(upgradePortalBtn)upgradePortalBtn.addEventListener('click',()=>goToPortal(upgradePortalBtn,'プレミアムにアップグレード →'));
}

// ===== プラン管理画面（管理者のみ）=====
async function openPlanAdmin(){
  if(!isAdmin()){toast('管理者のみアクセスできます');return;}
  const SB=window._SB;
  let planRows=[];
  let usageRows=[];
  let activeTab='plans';

  async function loadData(){
    try{const{data}=await SB.from('user_plans').select('*').order('email');planRows=data||[];}catch(e){planRows=[];}
    try{const{data}=await SB.from('ai_usage').select('*').order('month',{ascending:false});usageRows=data||[];}catch(e){usageRows=[];}
  }
  await loadData();

  // 登録日フォーマッタ（created_at を日本時間で YYYY/MM/DD 表示）
  function fmtRegDate(s){
    if(!s)return'—';
    const d=new Date(s);
    if(isNaN(d.getTime()))return'—';
    return d.toLocaleDateString('ja-JP',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'});
  }

  const planOptions=Object.keys(PLAN_DEFS).map(k=>'<option value="'+k+'">'+PLAN_DEFS[k].label+'</option>').join('');

  // プラン管理タブの状態
  const PLAN_PAGE_SIZE=20;
  let planFilter={email:'',plan:''};
  let planSort='created_desc'; // 既定：登録日が新しい順（新規ユーザーを把握しやすく）
  let planPage=0;

  function getFilteredPlans(){
    const list=planRows.filter(r=>{
      if(planFilter.email&&!r.email.includes(planFilter.email))return false;
      if(planFilter.plan&&r.plan!==planFilter.plan)return false;
      return true;
    });
    const ts=r=>{const t=new Date(r.created_at).getTime();return isNaN(t)?0:t;};
    if(planSort==='created_desc')list.sort((a,b)=>ts(b)-ts(a));
    else if(planSort==='created_asc')list.sort((a,b)=>ts(a)-ts(b));
    else if(planSort==='email_asc')list.sort((a,b)=>a.email.localeCompare(b.email));
    return list;
  }

  function buildPlanTable(list){
    if(!list.length)return'<div style="color:var(--text3);font-size:13px;text-align:center;padding:20px">登録なし</div>';
    return'<table class="admin-table"><thead><tr><th>メールアドレス</th><th>プラン</th><th>登録日</th><th>メモ</th><th></th></tr></thead><tbody>'
      +list.map(r=>'<tr data-id="'+esc(r.id)+'">'
        +'<td class="ad-title" style="font-size:13px">'+esc(r.email)+'</td>'
        +'<td data-label="プラン"><select class="admin-plan-sel" data-id="'+esc(r.id)+'">'+Object.keys(PLAN_DEFS).map(k=>'<option value="'+k+'"'+(r.plan===k?' selected':'')+'>'+PLAN_DEFS[k].label+'</option>').join('')+'</select></td>'
        +'<td data-label="登録日" style="font-size:12px;color:var(--text2);white-space:nowrap">'+fmtRegDate(r.created_at)+'</td>'
        +'<td data-label="メモ"><input class="admin-note-inp" data-id="'+esc(r.id)+'" value="'+esc(r.note||'')+'" placeholder="メモ" style="width:100%;background:none;border:none;outline:none;font-size:12px;color:var(--text2)"></td>'
        +'<td class="ad-act"><button class="admin-del-btn icon-btn" data-id="'+esc(r.id)+'" title="削除" style="color:var(--text3)">✕</button></td>'
      +'</tr>').join('')
    +'</tbody></table>';
  }

  // AI利用状況タブの状態
  const USAGE_PAGE_SIZE=20;
  let usageFilter={email:'',month:'',plan:''};
  let usagePage=0;

  function getFilteredUsage(){
    return usageRows.filter(r=>{
      const plan=planRows.find(p=>p.email===r.email)?.plan||'free';
      if(usageFilter.email&&!r.email.includes(usageFilter.email))return false;
      if(usageFilter.month&&r.month!==usageFilter.month)return false;
      if(usageFilter.plan&&plan!==usageFilter.plan)return false;
      return true;
    });
  }

  function buildUsageTable(list){
    if(!list.length)return'<div style="color:var(--text3);font-size:13px;text-align:center;padding:20px">利用履歴なし</div>';
    return'<table class="admin-table"><thead><tr><th>メールアドレス</th><th>プラン</th><th>月</th><th>利用回数</th><th>上限</th><th></th></tr></thead><tbody>'
      +list.map(r=>{
        const plan=planRows.find(p=>p.email===r.email)?.plan||'free';
        const planLabel=PLAN_DEFS[plan]?.label||'フリー';
        const limit=PLAN_DEFS[plan]?.aiLimit||20;
        const pct=Math.min(100,Math.round(r.count/limit*100));
        const color=pct>=100?'var(--p1)':pct>=80?'#f59e0b':'var(--green)';
        return'<tr>'
          +'<td class="ad-title" style="font-size:12px">'+esc(r.email)+'</td>'
          +'<td data-label="プラン" style="font-size:12px;color:var(--text2)">'+esc(planLabel)+'</td>'
          +'<td data-label="月">'+esc(r.month)+'</td>'
          +'<td data-label="利用回数"><span style="font-weight:600;color:'+color+'">'+r.count+'</span></td>'
          +'<td data-label="上限">'+limit+'</td>'
          +'<td class="ad-reset"><button class="usage-reset-btn btn btn-ghost" data-id="'+r.id+'" data-email="'+esc(r.email)+'" data-month="'+esc(r.month)+'" style="font-size:11px;padding:2px 8px">リセット</button></td>'
        +'</tr>';
      }).join('')
    +'</tbody></table>';
  }

  function getMonthOptions(){
    const months=[...new Set(usageRows.map(r=>r.month))].sort().reverse();
    return'<option value="">すべての月</option>'+months.map(m=>'<option value="'+m+'"'+(usageFilter.month===m?' selected':'')+'>'+m+'</option>').join('');
  }

  function renderModal(){
    const wrap=document.getElementById('admin-content-wrap');
    if(!wrap)return;
    if(activeTab==='plans'){
      const filteredP=getFilteredPlans();
      const totalPagesP=Math.ceil(filteredP.length/PLAN_PAGE_SIZE)||1;
      if(planPage>=totalPagesP)planPage=totalPagesP-1;
      const pagedP=filteredP.slice(planPage*PLAN_PAGE_SIZE,(planPage+1)*PLAN_PAGE_SIZE);
      const planFilterOpts='<option value="">すべてのプラン</option>'
        +Object.keys(PLAN_DEFS).map(k=>'<option value="'+k+'"'+(planFilter.plan===k?' selected':'')+'>'+PLAN_DEFS[k].label+'</option>').join('');
      const planSortOpts=[['created_desc','登録日が新しい順'],['created_asc','登録日が古い順'],['email_asc','メール順（A→Z）']]
        .map(o=>'<option value="'+o[0]+'"'+(planSort===o[0]?' selected':'')+'>'+o[1]+'</option>').join('');
      const planPager=''
        +'<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-size:12px;color:var(--text2)">'
          +'<span>'+filteredP.length+'件中 '+(filteredP.length?planPage*PLAN_PAGE_SIZE+1:0)+'〜'+Math.min((planPage+1)*PLAN_PAGE_SIZE,filteredP.length)+'件</span>'
          +'<div style="display:flex;gap:4px">'
            +'<button class="btn btn-ghost plan-page-btn" data-page="'+(planPage-1)+'" style="font-size:12px;padding:4px 10px"'+(planPage===0?' disabled':'')+'>◀</button>'
            +'<span style="padding:4px 8px;align-self:center">'+(planPage+1)+' / '+totalPagesP+'</span>'
            +'<button class="btn btn-ghost plan-page-btn" data-page="'+(planPage+1)+'" style="font-size:12px;padding:4px 10px"'+(planPage>=totalPagesP-1?' disabled':'')+'>▶</button>'
          +'</div>'
        +'</div>';
      wrap.innerHTML=''
        +'<div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap">'
          +'<input id="plan-filter-email" class="finput" placeholder="メールで絞り込み" value="'+esc(planFilter.email)+'" style="flex:1;min-width:150px;font-size:12px;padding:5px 8px">'
          +'<select id="plan-filter-plan" class="finput fselect" style="width:120px;font-size:12px;padding:5px 8px">'+planFilterOpts+'</select>'
          +'<select id="plan-sort" class="finput fselect" style="width:150px;font-size:12px;padding:5px 8px" title="並び替え">'+planSortOpts+'</select>'
          +'<button class="btn btn-ghost" id="plan-filter-clear" style="font-size:12px;padding:5px 10px">クリア</button>'
        +'</div>'
        +planPager
        +buildPlanTable(pagedP)
        +'<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;border-top:1px solid var(--border);padding-top:12px">'
          +'<input id="admin-new-email" class="finput" placeholder="追加するメールアドレス" style="flex:1;min-width:200px">'
          +'<select id="admin-new-plan" class="finput fselect" style="width:140px">'+planOptions+'</select>'
          +'<button class="btn btn-primary" id="admin-add-btn">追加</button>'
        +'</div>';
      bindPlanEvents();
    }else{
      const filtered=getFilteredUsage();
      const totalPages=Math.ceil(filtered.length/USAGE_PAGE_SIZE)||1;
      if(usagePage>=totalPages)usagePage=totalPages-1;
      const paged=filtered.slice(usagePage*USAGE_PAGE_SIZE,(usagePage+1)*USAGE_PAGE_SIZE);
      const planFilterOptions='<option value="">すべてのプラン</option>'
        +Object.keys(PLAN_DEFS).map(k=>'<option value="'+k+'"'+(usageFilter.plan===k?' selected':'')+'>'+PLAN_DEFS[k].label+'</option>').join('');
      const usagePager=''
        +'<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-size:12px;color:var(--text2)">'
          +'<span>'+filtered.length+'件中 '+(filtered.length?usagePage*USAGE_PAGE_SIZE+1:0)+'〜'+Math.min((usagePage+1)*USAGE_PAGE_SIZE,filtered.length)+'件</span>'
          +'<div style="display:flex;gap:4px">'
            +'<button class="btn btn-ghost usage-page-btn" data-page="'+(usagePage-1)+'" style="font-size:12px;padding:4px 10px"'+(usagePage===0?' disabled':'')+'>◀</button>'
            +'<span style="padding:4px 8px;align-self:center">'+(usagePage+1)+' / '+totalPages+'</span>'
            +'<button class="btn btn-ghost usage-page-btn" data-page="'+(usagePage+1)+'" style="font-size:12px;padding:4px 10px"'+(usagePage>=totalPages-1?' disabled':'')+'>▶</button>'
          +'</div>'
        +'</div>';
      wrap.innerHTML=''
        +'<div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap">'
          +'<input id="usage-filter-email" class="finput" placeholder="メールで絞り込み" value="'+esc(usageFilter.email)+'" style="flex:1;min-width:150px;font-size:12px;padding:5px 8px">'
          +'<select id="usage-filter-month" class="finput fselect" style="width:110px;font-size:12px;padding:5px 8px">'+getMonthOptions()+'</select>'
          +'<select id="usage-filter-plan" class="finput fselect" style="width:110px;font-size:12px;padding:5px 8px">'+planFilterOptions+'</select>'
          +'<button class="btn btn-ghost" id="usage-filter-clear" style="font-size:12px;padding:5px 10px">クリア</button>'
        +'</div>'
        +usagePager
        +buildUsageTable(paged);
      bindUsageEvents();
    }
    document.querySelectorAll('.admin-tab-btn').forEach(b=>{
      b.style.fontWeight=b.dataset.tab===activeTab?'700':'400';
      b.style.borderBottom=b.dataset.tab===activeTab?'2px solid var(--accent)':'2px solid transparent';
    });
  }

  const ov=document.createElement('div');ov.className='overlay';
  // すでに管理者パネルが開いている場合は閉じてから開き直す
  document.querySelectorAll('.overlay').forEach(el=>{if(el.querySelector('#admin-content-wrap'))el.remove();});
  ov.innerHTML='<div class="modal" style="max-width:640px;width:95vw">'
    +'<div class="modal-title" style="display:flex;align-items:center;gap:8px">🔑 管理者パネル<span style="font-size:11px;font-weight:400;color:var(--text3);margin-left:auto">管理者専用</span></div>'
    +'<div style="display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:12px">'
      +'<button class="admin-tab-btn" data-tab="plans" style="background:none;border:none;border-bottom:2px solid var(--accent);padding:8px 16px;font-size:13px;font-weight:700;color:var(--text);cursor:pointer">プラン管理</button>'
      +'<button class="admin-tab-btn" data-tab="usage" style="background:none;border:none;border-bottom:2px solid transparent;padding:8px 16px;font-size:13px;font-weight:400;color:var(--text);cursor:pointer">AI利用状況</button>'
    +'</div>'
    +'<div id="admin-content-wrap"></div>'
    +'<div class="modal-foot" style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">'
      +'<a class="btn btn-ghost" href="https://flowra.taskra.jp/admin.html" target="_blank" rel="noopener" style="font-size:12px;padding:5px 10px;text-decoration:none">🔗 Flowra管理画面</a>'
      +'<a class="btn btn-ghost" href="https://tavera.taskra.jp/admin.html" target="_blank" rel="noopener" style="font-size:12px;padding:5px 10px;text-decoration:none">🔗 Tavera管理画面</a>'
      +'<button class="btn btn-ghost" id="admin-close" style="margin-left:auto">閉じる</button>'
    +'</div>'
  +'</div>';
  document.body.appendChild(ov);requestAnimationFrame(()=>ov.classList.add('open'));
  renderModal();

  document.querySelectorAll('.admin-tab-btn').forEach(b=>{
    b.onclick=()=>{activeTab=b.dataset.tab;renderModal();};
  });

  async function refresh(){
    await loadData();
    renderModal();
  }

  function bindPlanEvents(){
    // フィルタ
    const emailInp=document.getElementById('plan-filter-email');
    const planSel=document.getElementById('plan-filter-plan');
    const sortSel=document.getElementById('plan-sort');
    const clearBtn=document.getElementById('plan-filter-clear');
    if(emailInp){let _t;emailInp.oninput=()=>{clearTimeout(_t);_t=setTimeout(()=>{planFilter.email=emailInp.value.trim();planPage=0;renderModal();},300);};}
    if(planSel){planSel.onchange=()=>{planFilter.plan=planSel.value;planPage=0;renderModal();};}
    if(sortSel){sortSel.onchange=()=>{planSort=sortSel.value;planPage=0;renderModal();};}
    if(clearBtn){clearBtn.onclick=()=>{planFilter={email:'',plan:''};planPage=0;renderModal();};}
    // ページネーション
    document.querySelectorAll('.plan-page-btn').forEach(btn=>{
      btn.onclick=()=>{if(btn.disabled)return;planPage=parseInt(btn.dataset.page);renderModal();};
    });
    document.querySelectorAll('.admin-plan-sel').forEach(sel=>{
      sel.onchange=async()=>{
        const{error:uerr}=await SB.from('user_plans').update({plan:sel.value,updated_at:new Date().toISOString()}).eq('id',sel.dataset.id);
        if(uerr){toast('更新エラー: '+uerr.message);return;}
        toast('プランを更新しました');
        const row=planRows.find(r=>r.id===sel.dataset.id);
        if(row?.email===window._currentUser?.email){window._userPlan=sel.value;renderSidebar();}
        await refresh();
      };
    });
    document.querySelectorAll('.admin-note-inp').forEach(inp=>{
      let _t;inp.oninput=()=>{clearTimeout(_t);_t=setTimeout(async()=>{
        await SB.from('user_plans').update({note:inp.value,updated_at:new Date().toISOString()}).eq('id',inp.dataset.id);
      },600);};
    });
    document.querySelectorAll('.admin-del-btn').forEach(btn=>{
      btn.onclick=async()=>{
        if(!confirm('削除しますか？'))return;
        await SB.from('user_plans').delete().eq('id',btn.dataset.id);
        await refresh();
      };
    });
    document.getElementById('admin-add-btn').onclick=async()=>{
      const email=document.getElementById('admin-new-email').value.trim().toLowerCase();
      const plan=document.getElementById('admin-new-plan').value;
      if(!email||!email.includes('@')){toast('有効なメールアドレスを入力してください');return;}
      const{error}=await SB.from('user_plans').upsert({email,plan,updated_at:new Date().toISOString()},{onConflict:'email'});
      if(error){toast('エラー: '+error.message);return;}
      document.getElementById('admin-new-email').value='';
      await refresh();toast(email+' を '+PLAN_DEFS[plan].label+' で登録しました');
    };
  }

  function bindUsageEvents(){
    document.querySelectorAll('.usage-reset-btn').forEach(btn=>{
      btn.onclick=async()=>{
        if(!confirm(btn.dataset.email+' の '+btn.dataset.month+' の利用回数をリセットしますか？'))return;
        const{error}=await SB.from('ai_usage').update({count:0,updated_at:new Date().toISOString()}).eq('id',btn.dataset.id);
        if(error){toast('エラー: '+error.message);return;}
        toast('リセットしました');
        await refresh();
      };
    });
    // フィルタ
    const emailInp=document.getElementById('usage-filter-email');
    const monthSel=document.getElementById('usage-filter-month');
    const planSel=document.getElementById('usage-filter-plan');
    const clearBtn=document.getElementById('usage-filter-clear');
    if(emailInp){
      let _t;emailInp.oninput=()=>{clearTimeout(_t);_t=setTimeout(()=>{usageFilter.email=emailInp.value.trim();usagePage=0;renderModal();},300);};
    }
    if(monthSel){monthSel.onchange=()=>{usageFilter.month=monthSel.value;usagePage=0;renderModal();};}
    if(planSel){planSel.onchange=()=>{usageFilter.plan=planSel.value;usagePage=0;renderModal();};}
    if(clearBtn){clearBtn.onclick=()=>{usageFilter={email:'',month:'',plan:''};usagePage=0;renderModal();};}
    // ページネーション
    document.querySelectorAll('.usage-page-btn').forEach(btn=>{
      btn.onclick=()=>{if(btn.disabled)return;usagePage=parseInt(btn.dataset.page);renderModal();};
    });
  }

  document.getElementById('admin-close').onclick=()=>ov.remove();
  ov.addEventListener('click',e=>{if(e.target===ov)ov.remove();});
}

          ||window.matchMedia('(display-mode: minimal-ui)').matches
          ||(typeof navigator.standalone!=='undefined'&&navigator.standalone===true);

function showLinkPopover(anchorBtn, taId, insertAtTop=false, ctx=null){
  document.querySelectorAll('.link-popover').forEach(el=>el.remove());
  const ta=(ctx&&ctx.querySelector&&ctx.querySelector('#'+taId))||document.getElementById(taId);
  if(!ta)return;
  const sel=ta.value.substring(ta.selectionStart,ta.selectionEnd);
  const pop=document.createElement('div');
  pop.className='link-popover';
  pop.innerHTML=
    '<div style="font-size:12px;font-weight:600;color:var(--text2);margin-bottom:2px">🔗 リンクを挿入</div>'+
    '<input id="lp-text" placeholder="表示テキスト" value="'+esc(sel)+'">'+
    '<input id="lp-url" placeholder="URL (https://...)">'+
    '<div class="link-popover-btns">'+
      '<button class="btn btn-ghost" id="lp-cancel" style="font-size:12px;padding:4px 10px">キャンセル</button>'+
      '<button class="btn btn-primary" id="lp-insert" style="font-size:12px;padding:4px 10px">挿入</button>'+
    '</div>';
  // position:fixed でiPadスクロール問題を回避
  pop.style.cssText='position:fixed;z-index:500';
  document.body.appendChild(pop);
  // ボタン位置から座標計算
  const r=anchorBtn.getBoundingClientRect();
  const pw=260,ph=140;
  let top=r.bottom+6;
  let left=r.left;
  if(left+pw>window.innerWidth-8)left=window.innerWidth-pw-8;
  if(top+ph>window.innerHeight-8)top=r.top-ph-6;
  pop.style.top=top+'px';
  pop.style.left=left+'px';

  const urlEl=pop.querySelector('#lp-url');
  const textEl=pop.querySelector('#lp-text');
  (sel?urlEl:textEl).focus();

  const close=()=>pop.remove();
  const doInsert=()=>{
    const text=textEl.value.trim()||urlEl.value.trim();
    const url=urlEl.value.trim();
    if(!url){urlEl.focus();return;}
    const md='['+text+']('+url+')';
    if(insertAtTop){
      ta.value=md+'\n'+ta.value;
      ta.selectionStart=ta.selectionEnd=md.length+1;
    }else{
      const s=ta.selectionStart,e=ta.selectionEnd;
      ta.value=ta.value.substring(0,s)+md+ta.value.substring(e);
      ta.selectionStart=ta.selectionEnd=s+md.length;
    }
    ta.focus();
    ta.dispatchEvent(new Event('input',{bubbles:true}));
    close();
  };
  pop.querySelector('#lp-cancel').onclick=close;
  pop.querySelector('#lp-insert').onclick=doInsert;
  urlEl.addEventListener('keydown',e=>{if(e.key==='Enter')doInsert();if(e.key==='Escape')close();});
  setTimeout(()=>document.addEventListener('click',function h(e){
    if(!pop.contains(e.target)&&e.target!==anchorBtn){close();document.removeEventListener('click',h);}
  }),100);
}

// テキストエリアにドラッグリサイズハンドルを付与
function makeResizable(ta){
  if(!ta||ta._resizable)return;
  ta._resizable=true;
  let wrap;
  if(ta.parentNode&&ta.parentNode.classList.contains('textarea-wrap')){
    // already wrapped (e.g. innerHTML copy from drawer) — reuse, strip dead handles
    wrap=ta.parentNode;
    wrap.querySelectorAll('.resize-handle').forEach(h=>h.remove());
  } else {
    wrap=document.createElement('div');
    wrap.className='textarea-wrap';
    ta.parentNode.insertBefore(wrap,ta);
    wrap.appendChild(ta);
  }
  const handle=document.createElement('div');
  handle.className='resize-handle';
  wrap.appendChild(handle);
  let startY=0,startH=0;
  const onMove=e=>{
    const dy=(e.touches?e.touches[0].clientY:e.clientY)-startY;
    ta.style.height=Math.max(72,startH+dy)+'px';
    e.preventDefault();
  };
  const onEnd=()=>{
    document.body.style.userSelect='';
    document.body.style.cursor='';
    document.removeEventListener('mousemove',onMove);
    document.removeEventListener('mouseup',onEnd);
    document.removeEventListener('touchmove',onMove);
    document.removeEventListener('touchend',onEnd);
  };
  handle.addEventListener('mousedown',e=>{
    startY=e.clientY;startH=ta.offsetHeight;
    document.body.style.userSelect='none';
    document.body.style.cursor='ns-resize';
    document.addEventListener('mousemove',onMove);
    document.addEventListener('mouseup',onEnd);
    e.preventDefault();
  });
  handle.addEventListener('touchstart',e=>{
    startY=e.touches[0].clientY;startH=ta.offsetHeight;
    document.addEventListener('touchmove',onMove,{passive:false});
    document.addEventListener('touchend',onEnd);
    e.stopPropagation();
  },{passive:true});
}

function fmtDate(d){
  if(!d)return'';
  const t=today(),dd=new Date(d+'T00:00:00'),td=new Date(t+'T00:00:00');
  const diff=Math.round((dd-td)/86400000);
  const wd=wdStr(d);
  if(diff===0)return'今日('+wd+')';
  if(diff===1)return'明日('+wd+')';
  if(diff===-1)return'昨日('+wd+')';
  if(diff<0)return Math.abs(diff)+'日前('+wd+')';
  return(dd.getMonth()+1)+'/'+(dd.getDate())+'('+wd+')';
}

function parseQA(input){
  let title=input;
  const r={title:'',projectId:null,tagIds:[],priority:4,dueAt:null,flagged:false,repeatRule:null};
  // priority
  title=title.replace(/!(高|1)/g,()=>{r.priority=1;return''})
    .replace(/!(中|2)/g,()=>{r.priority=2;return''})
    .replace(/!(低|3)/g,()=>{r.priority=3;return''});
  // tags（1件につき1つのため、複数#タグが書かれても最後の1つのみ採用）
  r._newTagNames=[];
  title=title.replace(/#([\w\u3040-\u9FFF\u30A0-\u30FF]+)/g,(m,n)=>{
    const t=S.tags.find(x=>x.name===n);
    if(t){r.tagIds=[t.id];r._newTagNames=[];}
    else{r.tagIds=[];r._newTagNames=[n];}
    return'';
  });
  // project
  title=title.replace(/@([\w\u3040-\u9FFF\u30A0-\u30FF]+)/g,(m,n)=>{
    const p=S.projects.find(x=>x.name===n);
    if(p)r.projectId=p.id;return'';
  });
  // flag
  if(title.includes('*')){r.flagged=true;title=title.replace(/\*/g,'')}
  // repeat
  if(/毎日|daily/i.test(title)){r.repeatRule='daily';title=title.replace(/毎日|daily/gi,'')}
  else if(/毎週|weekly/i.test(title)){r.repeatRule='weekly';title=title.replace(/毎週|weekly/gi,'')}
  else if(/毎月|monthly/i.test(title)){r.repeatRule='monthly';title=title.replace(/毎月|monthly/gi,'')}
  else if(/平日|weekdays/i.test(title)){r.repeatRule='weekly:mon,tue,wed,thu,fri';title=title.replace(/平日|weekdays/gi,'')}
  // date
  const dateMap={'今日':0,'きょう':0,'明日':1,'あした':1,'明後日':2,'tomorrow':1,'today':0};
  for(const[k,v] of Object.entries(dateMap)){
    if(title.toLowerCase().includes(k)){
      const d=new Date();d.setDate(d.getDate()+v);
      r.dueAt=d.toISOString().slice(0,10);
      title=title.replace(new RegExp(k,'i'),'');break;
    }
  }
  if(!r.dueAt){
    const wk=['日','月','火','水','木','金','土'];
    for(let i=0;i<7;i++){
      const dc=wk[i];
      const inBracket=new RegExp('[（(]'+dc+'[）)]').test(title);
      const hasYoubi=title.includes(dc+'曜');
      const hasDayAlone=!inBracket&&new RegExp('(^|\\s)'+dc+'(?=\\s|$)').test(title);
      if(hasYoubi||hasDayAlone){
        const d=new Date(),diff=(i-d.getDay()+7)%7||7;
        d.setDate(d.getDate()+diff);r.dueAt=d.toISOString().slice(0,10);
        if(hasYoubi){title=title.replace(dc+'曜','');}
        else{title=title.replace(new RegExp('(^|\\s)'+dc+'(?=\\s|$)'),'$1');}
        break;
      }
    }
  }
  if(!r.dueAt){
    const m=title.match(/(\d{4}[-\/]\d{1,2}[-\/]\d{1,2})/);
    if(m){r.dueAt=m[1].replace(/\//g,'-');title=title.replace(m[0],'')}
  }
  r.title=title.replace(/\s+/g,' ').trim();
  return r;
}

function nextRepeat(task){
  if(!task.repeatRule||!task.dueAt)return null;
  const[dy,dm,dd]=task.dueAt.split('-').map(Number);
  const d=new Date(Date.UTC(dy,dm-1,dd));
  const origMs=d.getTime();
  const rule=task.repeatRule;
  if(rule==='daily')d.setUTCDate(d.getUTCDate()+1);
  else if(rule==='weekly')d.setUTCDate(d.getUTCDate()+7);
  else if(rule==='monthly')d.setUTCMonth(d.getUTCMonth()+1);
  else if(rule==='yearly')d.setUTCFullYear(d.getUTCFullYear()+1);
  else if(rule==='weekdays'){do{d.setUTCDate(d.getUTCDate()+1)}while(d.getUTCDay()===0||d.getUTCDay()===6)}
  else if(rule.startsWith('weekly:')){
    const DAY_MAP={sun:0,mon:1,tue:2,wed:3,thu:4,fri:5,sat:6};
    const days=rule.slice(7).split(',').map(x=>DAY_MAP[x]).filter(x=>x!==undefined).sort((a,b)=>a-b);
    if(!days.length)return null;
    d.setUTCDate(d.getUTCDate()+1);
    for(let i=0;i<14;i++){if(days.includes(d.getUTCDay()))break;d.setUTCDate(d.getUTCDate()+1);}
  }
  else if(rule.startsWith('monthly:')){
    // 複数日対応: monthly:12,18,21
    const targetDays=rule.slice(8).split(',').map(Number).filter(n=>n>=1&&n<=31).sort((a,b)=>a-b);
    if(!targetDays.length)return null;
    // 今日以降で直近の指定日を探す（同月→翌月→翌々月）
    const curDay=d.getUTCDate();
    const curMonth=d.getUTCMonth();
    const curYear=d.getUTCFullYear();
    let found=false;
    for(let mOffset=0;mOffset<=2&&!found;mOffset++){
      const tryMonth=curMonth+mOffset;
      const tryYear=curYear+Math.floor(tryMonth/12);
      const tryMonthMod=tryMonth%12;
      const maxDay=new Date(Date.UTC(tryYear,tryMonthMod+1,0)).getUTCDate();
      for(const td of targetDays){
        const actualDay=Math.min(td,maxDay);// 末日処理
        if(mOffset===0&&actualDay<=curDay)continue;// 同月は今日より後のみ
        d.setUTCFullYear(tryYear,tryMonthMod,actualDay);
        found=true;break;
      }
    }
    if(!found)return null;
  }
  const shift=d.getTime()-origMs;
  const result={...task,id:uid(),status:'active',completedAt:null,createdAt:now(),updatedAt:now(),dueAt:d.toISOString().slice(0,10)};
  if(task.startAt){
    const[sy,sm,sd2]=task.startAt.split('-').map(Number);
    const s=new Date(Date.UTC(sy,sm-1,sd2));
    s.setTime(s.getTime()+shift);
    result.startAt=s.toISOString().slice(0,10);
  }
  return result;
}

async function loadWorkspaces(){
  // 同時実行防止：並列呼び出し時は同じPromiseを返す（重複push防止）
  if(loadWorkspaces._running){
    return loadWorkspaces._running;
  }
  loadWorkspaces._running=(async()=>{
    const SB=window._SB;
    if(!SB)return;
    try{
      // RLSが設定済みなのでそのまま全件取得（自分が見えるものだけ返る）
      const{data:wsList,error}=await SB.from('workspaces').select('*');
      if(error){console.error('loadWorkspaces select error',error);toast('WS取得エラー: '+(error.message||''));return;}
      S.workspaces=(wsList||[]).map(w=>({
        id:w.id,name:w.name,ownerId:w.owner_id,
        inviteToken:w.invite_token,
        owner_id:w.owner_id,invite_token:w.invite_token,
        createdAt:w.created_at,updatedAt:w.updated_at
      }));
      S.wsMembers={};
      if(S.workspaces.length){
        const wsIds=S.workspaces.map(w=>w.id);
        const{data:members,error:e2}=await SB.from('workspace_members').select('*').in('workspace_id',wsIds);
        if(e2){console.error('loadWorkspaces members error',e2);return;}
        (members||[]).forEach(m=>{
          if(!S.wsMembers[m.workspace_id])S.wsMembers[m.workspace_id]=[];
          // 同一user_idの重複追加を防ぐ（二重fetch対策）
          if(S.wsMembers[m.workspace_id].some(x=>x.user_id===m.user_id))return;
          S.wsMembers[m.workspace_id].push({
            id:m.id,workspaceId:m.workspace_id,workspace_id:m.workspace_id,
            userId:m.user_id,user_id:m.user_id,
            user_name:m.user_name,user_avatar:m.user_avatar,
            user_email:m.user_email,role:m.role,joinedAt:m.joined_at
          });
        });
      }
      console.log('loadWorkspaces ok',S.workspaces.length,'件');
    }catch(e){console.error('loadWorkspaces',e);}
  })();
  try{
    await loadWorkspaces._running;
  }finally{
    loadWorkspaces._running=null;
  }
}

async function joinWorkspaceByToken(token){

  const{data:existing}=await SB.from('workspace_members').select('id')
    .eq('workspace_id',ws.id).eq('user_id',user.id).maybeSingle();
  if(existing){toast('すでにメンバーです');await loadWorkspaces();render();return true;}
  const mem={id:uid(),workspace_id:ws.id,user_id:user.id,
    user_name:user.user_metadata?.full_name||user.email||'',
    user_avatar:user.user_metadata?.avatar_url||'',
    user_email:user.email||'',role:'member',
    joined_at:new Date().toISOString()};
  const{error}=await SB.from('workspace_members').insert(mem);
  if(error){toast('参加に失敗しました');return false;}

function getTasks(){
  const t=today();
  let tasks=S.tasks.filter(x=>x.status!=='archived');
  if(S.view==='inbox')tasks=tasks.filter(x=>x.status==='inbox'||(S.showCompleted&&x.status==='completed'&&!x.projectId));
  else if(S.view==='today')tasks=tasks.filter(x=>(isToday(x.dueAt)||x.flagged)&&(S.showCompleted||x.status!=='completed'));
  else if(S.view==='overdue')tasks=tasks.filter(x=>x.dueAt&&x.dueAt<t&&(S.showCompleted||x.status!=='completed'));
  else if(S.view==='upcoming')tasks=tasks.filter(x=>x.dueAt&&x.dueAt>t&&(S.showCompleted||x.status!=='completed'));
  else if(S.view==='flagged')tasks=tasks.filter(x=>x.flagged&&(S.showCompleted||x.status!=='completed'));
  else if(S.view==='forecast-day')tasks=tasks.filter(x=>(x.dueAt===S.forecastDate||x.startAt===S.forecastDate)&&(S.showCompleted||x.status!=='completed'));
  else if(S.view==='assigned'){const _auid=window._currentUser?.id;tasks=_auid?tasks.filter(x=>x.assigneeId===_auid&&(S.showCompleted||x.status!=='completed')):[];}
  else if(S.view==='completed')tasks=tasks.filter(x=>x.status==='completed');
  else if(S.view==='project')tasks=tasks.filter(x=>x.projectId===S.projId&&(S.showCompleted||x.status!=='completed'));
  else if(S.view==='tag')tasks=tasks.filter(x=>S.tagId==='__none__'?(!x.tagIds||x.tagIds.length===0)&&(S.showCompleted||x.status!=='completed'):x.tagIds&&x.tagIds.includes(S.tagId)&&(S.showCompleted||x.status!=='completed'));
  if(S.search){const terms=searchTerms(S.search);if(terms.length)tasks=tasks.filter(x=>matchesSearch(x.title+' '+(x.notes||''),terms))}
  if(S.hideNotStarted&&S.view!=='inbox'&&S.view!=='completed'){tasks=tasks.filter(x=>!isNotStartedTask(x))} // Inboxは捕捉・整理用の受信箱なので「現在」フィルタを適用しない（開始日が未来のタスクが消えバッジ件数と不一致になる問題の修正）
  if(!S.showShared&&(S.view==='today')){const spids=new Set(S.projects.filter(p=>p.workspaceId).map(p=>p.id));tasks=tasks.filter(x=>!spids.has(x.projectId));}
  if(S.filterTagIds&&S.filterTagIds.length&&S.view!=='tag')tasks=tasks.filter(x=>S.filterTagIds.every(id=>x.tagIds&&x.tagIds.includes(id)));
  // Logbook（完了済み一覧）は常に「最近完了した順」固定。他ビューでの並び替え設定の影響を受けない
  if(S.view==='completed')return tasks.sort((a,b)=>(b.completedAt||'').localeCompare(a.completedAt||''));
  if(S.sort==='updated') return tasks.sort((a,b)=>(b.updatedAt||'').localeCompare(a.updatedAt||''));
  if(S.sort==='startAt') return tasks.sort((a,b)=>{if(!a.startAt&&!b.startAt)return 0;if(!a.startAt)return 1;if(!b.startAt)return -1;return a.startAt.localeCompare(b.startAt);});
  if(S.sort==='priority') return tasks.sort((a,b)=>(a.priority||4)-(b.priority||4));
  if(S.sort==='dueAt') return tasks.sort((a,b)=>{if(!a.dueAt&&!b.dueAt)return 0;if(!a.dueAt)return 1;if(!b.dueAt)return-1;return a.dueAt.localeCompare(b.dueAt);});
  return tasks.sort((a,b)=>(a.order||0)-(b.order||0));
}

// ===== SE SOUNDS =====
(function(){
  let _sCtx=null;
  function _ctx(){
    if(!_sCtx)_sCtx=new(window.AudioContext||window.webkitAudioContext)();
    return _sCtx;
  }
  function _gain(ctx,val,t){const g=ctx.createGain();g.gain.setValueAtTime(val,t);return g}

  window.playSE=function(type){
    if(!getSetting('soundFx',true))return;
    try{
      const ctx=_ctx();const t=ctx.currentTime;
      if(type==='add'){
        // 軽いポップ音 ↑
        const o=ctx.createOscillator();o.type='sine';
        o.frequency.setValueAtTime(520,t);o.frequency.exponentialRampToValueAtTime(780,t+0.06);
        const g=_gain(ctx,0,t);g.gain.linearRampToValueAtTime(0.18,t+0.01);g.gain.exponentialRampToValueAtTime(0.001,t+0.1);
        o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+0.12);
      } else if(type==='complete'){
        // スーパーマリオ コイン音: 短い高音 → 少し低めの余韻
        [[0,1319,0.045,'square'],[0.045,1760,0.18,'square']].forEach(([dt,freq,dur,wt])=>{
          const o=ctx.createOscillator();o.type=wt;o.frequency.value=freq;
          const g=ctx.createGain();
          g.gain.setValueAtTime(0,t+dt);
          g.gain.linearRampToValueAtTime(0.13,t+dt+0.004);
          g.gain.exponentialRampToValueAtTime(0.001,t+dt+dur);
          o.connect(g);g.connect(ctx.destination);o.start(t+dt);o.stop(t+dt+dur+0.01);
        });
      } else if(type==='delete'){
        // 下降する短音
        const o=ctx.createOscillator();o.type='sine';
        o.frequency.setValueAtTime(340,t);o.frequency.exponentialRampToValueAtTime(200,t+0.12);
        const g=_gain(ctx,0.12,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.14);
        o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+0.16);
      } else if(type==='toggle'){
        // 小さいクリック
        const sz=Math.floor(ctx.sampleRate*0.012);
        const buf=ctx.createBuffer(1,sz,ctx.sampleRate);
        const d=buf.getChannelData(0);
        for(let i=0;i<sz;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/(ctx.sampleRate*0.003));
        const src=ctx.createBufferSource();src.buffer=buf;
        const bp=ctx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=2200;bp.Q.value=2;
        const g=_gain(ctx,0.35,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.015);
        src.connect(bp);bp.connect(g);g.connect(ctx.destination);src.start(t);src.stop(t+0.02);
      } else if(type==='open'){
        // ドロワー開く – 短い上昇
        const o=ctx.createOscillator();o.type='sine';
        o.frequency.setValueAtTime(400,t);o.frequency.linearRampToValueAtTime(480,t+0.05);
        const g=_gain(ctx,0.08,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.08);
        o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+0.09);
      } else if(type==='error'){
        // エラー通知音
        const o=ctx.createOscillator();o.type='square';o.frequency.value=220;
        const g=_gain(ctx,0,t);g.gain.linearRampToValueAtTime(0.08,t+0.005);g.gain.exponentialRampToValueAtTime(0.001,t+0.18);
        o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+0.2);
      }
    }catch(e){}
  };
})();

// ===== TAG ORDER (localStorage) =====
function getTagOrder(){try{return JSON.parse(localStorage.getItem('tag_order')||'null')}catch(e){return null}}
async function saveTagOrder(tags){
  localStorage.setItem('tag_order',JSON.stringify(tags.map(t=>t.id)));
  tags.forEach((t,i)=>{
    const tag=S.tags.find(x=>x.id===t.id);
    if(tag){tag.order=i;dbPut('tags',tag).catch(e=>console.error('saveTagOrder',e));}
  });
}
function getSortedTags(){
  const order=getTagOrder();
  if(!order)return[...S.tags].sort((a,b)=>(a.order||0)-(b.order||0));
  return[...S.tags].sort((a,b)=>{
    const ai=order.indexOf(a.id),bi=order.indexOf(b.id);
    if(ai===-1&&bi===-1)return(a.order||0)-(b.order||0);if(ai===-1)return 1;if(bi===-1)return -1;return ai-bi;
  });
}
function startTagRename(span){
  const t=S.tags.find(x=>x.id===span.dataset.tagId);
  if(!t||span.querySelector('input'))return;
  const input=document.createElement('input');
  input.value=t.name;
  input.style.cssText='flex:1;min-width:0;width:100%;font:inherit;font-size:inherit;background:var(--bg2);border:1px solid var(--accent);border-radius:4px;padding:0 5px;color:var(--text);outline:none;';
  span.innerHTML='';span.appendChild(input);input.focus();input.select();
  let committed=false;
  async function commit(){
    if(committed)return;committed=true;
    const newName=input.value.trim();
    if(newName&&newName!==t.name){t.name=newName;await saveTag(t);}
    render();
  }
  input.addEventListener('blur',commit);
  input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();input.blur();}if(e.key==='Escape'){committed=true;render();}});
  input.addEventListener('click',e=>e.stopPropagation());
  input.addEventListener('touchstart',e=>e.stopPropagation(),{passive:true});
}

function attachTagDragListeners(){
  const nav=document.getElementById('sidenav');if(!nav)return;
  const items=[...nav.querySelectorAll('.tag-item[data-id]')];
  const dropLines=[...nav.querySelectorAll('.tag-drop-line')];
  function clearLines(){dropLines.forEach(l=>l.classList.remove('active'));}
  function showDropLine(beforeId){
    clearLines();
    const sel=beforeId==='last'?nav.querySelector('.tag-drop-line[data-tdrop-after="last"]'):nav.querySelector('.tag-drop-line[data-tdrop-before="'+beforeId+'"]');
    if(sel)sel.classList.add('active');
  }
  function doReorder(srcId,dstId,insertBefore){
    const tags=getSortedTags();
    const si=tags.findIndex(t=>t.id===srcId);if(si<0)return;
    const[moved]=tags.splice(si,1);
    if(dstId==='last'){tags.push(moved);}
    else{const di=tags.findIndex(t=>t.id===dstId);if(di<0)tags.push(moved);else tags.splice(insertBefore?di:di+1,0,moved);}
    saveTagOrder(tags);renderSidebar();attachProjRenameListeners();attachProjDragListeners();attachTagDragListeners();
  }
  let dragSrc=null;
  items.forEach(item=>{
    const handle=item.querySelector('.tag-drag-handle');
    if(handle)handle.addEventListener('mousedown',()=>item.setAttribute('draggable','true'),{passive:true});
    item.addEventListener('dragstart',e=>{dragSrc=item;e.dataTransfer.effectAllowed='move';setTimeout(()=>{item.style.opacity='0.45';},0);});
    item.addEventListener('dragend',()=>{item.style.opacity='';item.setAttribute('draggable','false');clearLines();dragSrc=null;});
    item.addEventListener('dragover',e=>{
      e.preventDefault();e.dataTransfer.dropEffect='move';if(dragSrc===item)return;
      const r=item.getBoundingClientRect();const mid=r.top+r.height/2;
      if(e.clientY<mid){showDropLine(item.dataset.id);}
      else{const ni=items[items.indexOf(item)+1];showDropLine(ni?ni.dataset.id:'last');}
    });
    item.addEventListener('drop',e=>{
      e.preventDefault();e.stopPropagation();if(!dragSrc||dragSrc===item)return;
      const r=item.getBoundingClientRect();const ib=e.clientY<r.top+r.height/2;
      const dstId=ib?item.dataset.id:(items[items.indexOf(item)+1]?.dataset.id||'last');
      doReorder(dragSrc.dataset.id,dstId,true);dragSrc=null;
    });
  });
  dropLines.forEach(line=>{
    line.addEventListener('dragover',e=>{e.preventDefault();e.dataTransfer.dropEffect='move';line.classList.add('active');});
    line.addEventListener('dragleave',()=>line.classList.remove('active'));
    line.addEventListener('drop',e=>{
      e.preventDefault();e.stopPropagation();if(!dragSrc)return;
      const bid=line.dataset.tdropBefore||'last';doReorder(dragSrc.dataset.id,bid,true);dragSrc=null;
    });
  });
  items.forEach(item=>{
    const handle=item.querySelector('.tag-drag-handle');if(!handle)return;
    handle.addEventListener('touchstart',e=>{
      e.stopPropagation();const srcId=item.dataset.id;let dropTargetId=null;
      item.style.opacity='0.6';
      const sb=document.querySelector('.sidebar-body');if(sb)sb.style.overflowY='hidden';
      const onMove=ev=>{
        ev.preventDefault();const touch=ev.touches[0];clearLines();
        const el=document.elementFromPoint(touch.clientX,touch.clientY);
        const hov=el?.closest('.tag-item[data-id]');
        if(hov&&hov!==item){
          const r=hov.getBoundingClientRect();const ib=touch.clientY<r.top+r.height/2;
          dropTargetId=ib?hov.dataset.id:(items[items.indexOf(hov)+1]?.dataset.id||'last');
          showDropLine(dropTargetId);
        }else dropTargetId=null;
      };
      const onEnd=()=>{
        item.style.opacity='';clearLines();if(sb)sb.style.overflowY='';
        document.removeEventListener('touchmove',onMove);document.removeEventListener('touchend',onEnd);
        if(dropTargetId)doReorder(srcId,dropTargetId,true);
      };
      document.addEventListener('touchmove',onMove,{passive:false});
      document.addEventListener('touchend',onEnd,{passive:true});
    },{passive:true});
  });
}

// ===== PROJECT ORDER (localStorage + Supabase) =====
function getProjectOrder(){try{return JSON.parse(localStorage.getItem('proj_order')||'null')}catch(e){return null}}
async function saveProjectOrder(projs){
  localStorage.setItem('proj_order',JSON.stringify(projs.map(p=>p.id)));
  projs.forEach((p,i)=>{
    const proj=S.projects.find(x=>x.id===p.id);
    if(proj){proj.order=i;dbPut('projects',proj).catch(e=>console.error('saveProjectOrder',e));}
  });
}
function getSortedProjects(status){
  const projs=S.projects.filter(p=>status?p.status===status:true);
  const order=getProjectOrder();
  if(!order)return[...projs].sort((a,b)=>(a.order||0)-(b.order||0));
  return[...projs].sort((a,b)=>{
    const ai=order.indexOf(a.id),bi=order.indexOf(b.id);
    if(ai===-1&&bi===-1)return(a.order||0)-(b.order||0);
    if(ai===-1)return 1;
    if(bi===-1)return -1;
    return ai-bi;
  });
}

function openWsSettings(wsId){
  const ws=S.workspaces.find(w=>w.id===wsId);
  if(!ws)return;
  if(openWsSettings._busy)return;
  openWsSettings._busy=true;
  // メンバー情報を最新化してから表示
  loadWorkspaces().then(()=>{
    const wsLatest=S.workspaces.find(w=>w.id===wsId);
    if(!wsLatest){openWsSettings._busy=false;return;}
    _openWsSettingsModal(wsId);
    setTimeout(()=>{openWsSettings._busy=false;},500);
  });
}
function _openWsSettingsModal(wsId){
  const ws=S.workspaces.find(w=>w.id===wsId);
  if(!ws)return;
  const isOwner=ws.owner_id===window._currentUser?.id;
  const members=S.wsMembers[wsId]||[];
  const ov=document.createElement('div');ov.className='overlay';
  ov.innerHTML='<div class="modal" style="max-width:400px">'
    +'<div class="modal-title">'+esc(ws.name)+'</div>'
    +'<div style="font-size:12px;font-weight:600;color:var(--text3);margin-bottom:8px">メンバー ('+members.length+'人)</div>'
    +'<div style="display:flex;flex-direction:column;gap:6px;margin-bottom:16px">'
    +members.map(m=>{
      const av=m.user_avatar
        ?`<img src="${esc(m.user_avatar)}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`
        :(m.user_name||'?').charAt(0).toUpperCase();
      const badge=m.role==='owner'?'<span style="font-size:10px;color:var(--accent);background:var(--accent-bg);border-radius:4px;padding:1px 5px;margin-left:4px">Owner</span>':'';
      const delBtn=(isOwner&&m.user_id!==window._currentUser?.id)
        ?`<button data-a="ws-kick" data-wsid="${wsId}" data-memberid="${m.id}" style="font-size:11px;color:var(--p1);background:none;border:none;cursor:pointer;padding:2px 6px;flex-shrink:0">除名</button>`:'';
      return `<div style="display:flex;align-items:center;gap:8px">
        <div style="width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0">${av}</div>
        <div style="flex:1;min-width:0">
          <div style="font-size:13px;font-weight:600">${esc(m.user_name||'ユーザー')}${badge}</div>
          <div style="font-size:11px;color:var(--text3)">${esc(m.user_email)}</div>
        </div>${delBtn}
      </div>`;
    }).join('')
    +'</div>'
    +(isOwner?'<div style="margin-bottom:12px"><button class="btn btn-ghost" data-a="ws-invite" data-wsid="'+wsId+'" style="font-size:13px;width:100%">🔗 招待リンクをコピー</button></div>':'')
    +'<div class="modal-foot">'
    +(!isOwner?'<button class="btn" style="color:var(--p1);border-color:var(--p1)" data-a="ws-leave" data-wsid="'+wsId+'">脱退する</button>':'')
    +(isOwner?'<button class="btn" style="color:var(--p1);border-color:var(--p1)" data-a="ws-delete" data-wsid="'+wsId+'">チームを削除</button>':'')
    +'<button class="btn btn-ghost" id="ws-settings-close">閉じる</button>'
    +'</div></div>';
  document.body.appendChild(ov);requestAnimationFrame(()=>ov.classList.add('open'));
  const _closeOv=()=>ov.classList.contains('open')&&(ov.classList.remove('open'),setTimeout(()=>ov.remove(),200));
  ov.querySelector('#ws-settings-close')?.addEventListener('click',e2=>{e2.preventDefault();_closeOv();});
  const _handleBtn=async e2=>{
    e2.preventDefault();e2.stopPropagation();
    if(e2.target===ov){_closeOv();return;}
    const btn=e2.target.closest('[data-a]');if(!btn)return;
    if(btn._wsBusy)return;btn._wsBusy=true;setTimeout(()=>btn._wsBusy=false,1500);
    const ba=btn.dataset.a;
    if(ba==='ws-kick'){
      const mid=btn.dataset.memberid;
      if(!confirm('このメンバーを除名しますか？'))return;
      const{error}=await window._SB.from('workspace_members').delete().eq('id',mid);
      if(error){toast('エラー: '+error.message);return;}
      await loadWorkspaces();_closeOv();render();
    } else if(ba==='ws-leave'){
      if(!confirm('このチームから脱退しますか？'))return;
      const uid2=window._currentUser?.id;
      const{error}=await window._SB.from('workspace_members').delete().eq('workspace_id',wsId).eq('user_id',uid2);
      if(error){toast('エラー: '+error.message);return;}
      S.workspaces=S.workspaces.filter(w=>w.id!==wsId);
      delete S.wsMembers[wsId];
      _closeOv();render();toast('チームから脱退しました');
    } else if(ba==='ws-delete'){
      if(!confirm('チームを削除します。共有プロジェクトは個人プロジェクトに戻ります。よろしいですか？'))return;
      const r1=await window._SB.from('workspace_members').delete().eq('workspace_id',wsId);
      const r2=await window._SB.from('projects').update({workspace_id:null}).eq('workspace_id',wsId);
      const r3=await window._SB.from('workspaces').delete().eq('id',wsId);
      const err=r1.error||r2.error||r3.error;
      if(err){toast('削除エラー: '+err.message);return;}
      S.workspaces=S.workspaces.filter(w=>w.id!==wsId);
      delete S.wsMembers[wsId];
      S.projects.forEach(p=>{if(p.workspaceId===wsId)p.workspaceId=null;});
      _closeOv();render();toast('チームを削除しました');
    } else if(ba==='ws-invite'){
      const url=getInviteUrl(ws);
      try{await navigator.clipboard.writeText(url);}
      catch{const inp2=document.createElement('input');inp2.value=url;document.body.appendChild(inp2);inp2.select();document.execCommand('copy');inp2.remove();}
      toast('招待リンクをコピーしました 🔗');
    }
  };
  ov.addEventListener('click',_handleBtn);
}

// NOTE一覧スワイプ削除
function initNoteSwipe(container){
  container.querySelectorAll('.note-swipe-wrap').forEach(wrap=>{
    const inner=wrap.querySelector('.note-swipe-inner');
    const noteId=wrap.dataset.noteSwipeId;
    if(!inner||!noteId)return;
    const THRESH=72;// 削除実行の閾値px
    let sx=0,sy=0,dx=0,active=false,opened=false;

    inner.addEventListener('touchstart',e=>{
      if(e.touches.length>1)return;
      sx=e.touches[0].clientX;sy=e.touches[0].clientY;
      dx=0;active=true;
      inner.classList.add('swiping');
    },{passive:true});

    inner.addEventListener('touchmove',e=>{
      if(!active)return;
      dx=e.touches[0].clientX-sx;
      const dy=Math.abs(e.touches[0].clientY-sy);
      if(dy>Math.abs(dx)*1.5){active=false;inner.classList.remove('swiping');inner.style.transform='';return;}
      if(dx>0&&!opened){inner.style.transform='';return;}// 右スワイプは閉じるのみ
      const tx=Math.max(-THRESH-20,Math.min(0,dx+(opened?-THRESH:0)));
      inner.style.transform='translateX('+tx+'px)';
    },{passive:true});

    inner.addEventListener('touchend',async e=>{
      if(!active){active=false;return;}
      inner.classList.remove('swiping');
      active=false;
      const finalDx=dx+(opened?-THRESH:0);
      if(dx>10&&opened){
        // 右スワイプ → 閉じる
        opened=false;
        inner.style.transition='transform .2s cubic-bezier(.25,.1,.25,1)';
        inner.style.transform='';
        const bgEl2=wrap.querySelector('.note-swipe-del-bg');
        if(bgEl2){bgEl2.style.clipPath='inset(0 0 0 100%)';bgEl2.style.pointerEvents='none';}
      } else if(finalDx<-THRESH){
        // 閾値超え → 削除ボタン表示
        inner.style.transition='transform .2s cubic-bezier(.25,.1,.25,1)';
        inner.style.transform='translateX(-'+THRESH+'px)';
        const bgEl=wrap.querySelector('.note-swipe-del-bg');
        if(bgEl){bgEl.style.clipPath='inset(0 0 0 0)';bgEl.style.pointerEvents='auto';bgEl.style.cursor='pointer';}
        opened=true;
        if(bgEl&&!bgEl._bound){
          bgEl._bound=true;
          bgEl.addEventListener('click',()=>{

      } else {

        inner.style.transition='transform .2s cubic-bezier(.25,.1,.25,1)';
        inner.style.transform=opened?'translateX(-'+THRESH+'px)':'';
      }
    },{passive:true});

    // 他のrowをスワイプしたら閉じる
    container.addEventListener('touchstart',e=>{
      if(opened&&!wrap.contains(e.target)){
        opened=false;
        inner.style.transition='transform .2s cubic-bezier(.25,.1,.25,1)';
        inner.style.transform='';
        const bgEl3=wrap.querySelector('.note-swipe-del-bg');
        if(bgEl3){bgEl3.style.clipPath='inset(0 0 0 100%)';bgEl3.style.pointerEvents='none';}
      }
    },{passive:true});
  });
}

// タスク一覧スワイプ削除
function initTaskSwipe(container){
  container.querySelectorAll('.note-swipe-wrap[data-task-swipe-id]').forEach(wrap=>{
    const inner=wrap.querySelector('.note-swipe-inner');
    const taskId=wrap.dataset.taskSwipeId;
    if(!inner||!taskId)return;
    const THRESH=72;
    let sx=0,sy=0,dx=0,active=false,opened=false;

    inner.addEventListener('touchstart',e=>{
      if(e.touches.length>1)return;
      if(e.target.closest('button,.chk,.task-drag-handle'))return;// ボタン類は除外
      sx=e.touches[0].clientX;sy=e.touches[0].clientY;
      dx=0;active=true;
      inner.classList.add('swiping');
    },{passive:true});

    inner.addEventListener('touchmove',e=>{
      if(!active)return;
      dx=e.touches[0].clientX-sx;
      const dy=Math.abs(e.touches[0].clientY-sy);
      if(dy>Math.abs(dx)*1.5){active=false;inner.classList.remove('swiping');inner.style.transform='';return;}
      if(dx>0&&!opened){inner.style.transform='';return;}
      const tx=Math.max(-THRESH-20,Math.min(0,dx+(opened?-THRESH:0)));
      inner.style.transform='translateX('+tx+'px)';
    },{passive:true});

    inner.addEventListener('touchend',async e=>{
      if(!active){active=false;return;}
      inner.classList.remove('swiping');
      active=false;
      const finalDx=dx+(opened?-THRESH:0);
      if(dx>10&&opened){
        opened=false;
        inner.style.transition='transform .2s cubic-bezier(.25,.1,.25,1)';
        inner.style.transform='';
        const bg=wrap.querySelector('.task-swipe-complete-bg');
        if(bg){bg.style.clipPath='inset(0 0 0 100%)';bg.style.pointerEvents='none';}
      } else if(finalDx<-THRESH){
        inner.style.transition='transform .2s cubic-bezier(.25,.1,.25,1)';
        inner.style.transform='translateX(-'+THRESH+'px)';
        const bg=wrap.querySelector('.task-swipe-complete-bg');
        if(bg){bg.style.clipPath='inset(0 0 0 0)';bg.style.pointerEvents='auto';bg.style.cursor='pointer';}
        opened=true;
        if(bg&&!bg._bound){
          bg._bound=true;
          bg.addEventListener('click',()=>{
            opened=false;
            inner.style.transition='transform .2s cubic-bezier(.25,.1,.25,1)';
            inner.style.transform='';
            bg.style.clipPath='inset(0 0 0 100%)';bg.style.pointerEvents='none';
            const chkBtn=wrap.querySelector('.chk');
            if(chkBtn)chkBtn.click();
          });
        }
      } else {
        inner.style.transition='transform .2s cubic-bezier(.25,.1,.25,1)';
        inner.style.transform=opened?'translateX(-'+THRESH+'px)':'';
      }
    },{passive:true});

    container.addEventListener('touchstart',e=>{
      if(opened&&!wrap.contains(e.target)){
        opened=false;
        inner.style.transition='transform .2s cubic-bezier(.25,.1,.25,1)';
        inner.style.transform='';
        const bg=wrap.querySelector('.task-swipe-complete-bg');
        if(bg){bg.style.clipPath='inset(0 0 0 100%)';bg.style.pointerEvents='none';}
      }
    },{passive:true});
  });
}

// ===== PROJ DRAG & DROP =====
let _projDragEndedAt=0; // スマホドラッグ後にサイドバーが閉じるのを防ぐ

function _clearDropLines(nav){
  nav.querySelectorAll('.proj-drop-line').forEach(l=>{l.classList.remove('active');});
}

function attachProjDragListeners(){
  const nav=document.getElementById('sidenav');
  if(!nav)return;

  // ===== Active projects =====
  function doReorder(srcId,dstId,insertBefore){
    const projs=getSortedProjects('active');
    const si=projs.findIndex(p=>p.id===srcId);
    if(si<0)return;
    const[moved]=projs.splice(si,1);
    if(dstId==='last'){projs.push(moved);}
    else{
      const di=projs.findIndex(p=>p.id===dstId);
      if(di<0){projs.push(moved);}
      else{projs.splice(insertBefore?di:di+1,0,moved);}
    }
    saveProjectOrder(projs);
    renderSidebar();attachProjRenameListeners();attachProjDragListeners();attachTagDragListeners();
  }

  const items=[...nav.querySelectorAll('.proj-section-inner .proj-item[data-id]:not(.hidden-proj-item)')];
  const dropLines=[...nav.querySelectorAll('.proj-section-inner .proj-drop-line:not(.hidden-drop-line)')];

  function showDropLine(beforeId){
    _clearDropLines(nav);
    const sel=beforeId==='last'
      ?nav.querySelector('.proj-section-inner .proj-drop-line[data-drop-after="last"]')
      :nav.querySelector('.proj-section-inner .proj-drop-line[data-drop-before="'+beforeId+'"]');
    if(sel)sel.classList.add('active');
  }

  // PC: HTML5 drag
  let dragSrc=null;
  items.forEach(item=>{
    const handle=item.querySelector('.proj-drag-handle:not(.hidden-drag-handle)');
    if(handle){handle.addEventListener('mousedown',()=>{item.setAttribute('draggable','true');},{passive:true});}
    item.addEventListener('dragstart',e=>{
      dragSrc=item;e.dataTransfer.effectAllowed='move';
      setTimeout(()=>{item.style.opacity='0.45';},0);
    });
    item.addEventListener('dragend',()=>{
      item.style.opacity='';item.setAttribute('draggable','false');
      _clearDropLines(nav);dragSrc=null;
    });
    item.addEventListener('dragover',e=>{
      e.preventDefault();e.dataTransfer.dropEffect='move';
      if(dragSrc===item)return;
      const r=item.getBoundingClientRect();
      const mid=r.top+r.height/2;
      if(e.clientY<mid){showDropLine(item.dataset.id);}
      else{
        const nextItem=items[items.indexOf(item)+1];
        showDropLine(nextItem?nextItem.dataset.id:'last');
      }
    });
    item.addEventListener('dragleave',e=>{
      if(!item.contains(e.relatedTarget)){}
    });
    item.addEventListener('drop',e=>{
      e.preventDefault();e.stopPropagation();
      if(!dragSrc||dragSrc===item)return;
      const r=item.getBoundingClientRect();
      const insertBefore=e.clientY<r.top+r.height/2;
      const dstId=insertBefore?item.dataset.id:(items[items.indexOf(item)+1]?.dataset.id||'last');
      doReorder(dragSrc.dataset.id,dstId,true);
      dragSrc=null;
    });
  });
  // drop on lines
  dropLines.forEach(line=>{
    line.addEventListener('dragover',e=>{e.preventDefault();e.dataTransfer.dropEffect='move';line.classList.add('active');});
    line.addEventListener('dragleave',()=>{line.classList.remove('active');});
    line.addEventListener('drop',e=>{
      e.preventDefault();e.stopPropagation();
      if(!dragSrc)return;
      const beforeId=line.dataset.dropBefore||'last';
      doReorder(dragSrc.dataset.id,beforeId,true);
      dragSrc=null;
    });
  });

  // Mobile: touch drag from handle
  items.forEach(item=>{
    const handle=item.querySelector('.proj-drag-handle:not(.hidden-drag-handle)');
    if(!handle)return;
    handle.addEventListener('touchstart',e=>{
      e.stopPropagation();
      const srcId=item.dataset.id;
      let dropTargetId=null;
      let dropBefore=true;
      item.style.opacity='0.6';
      const sidebarBody=document.querySelector('.sidebar-body');
      if(sidebarBody)sidebarBody.style.overflowY='hidden';
      const onMove=ev=>{
        ev.preventDefault();
        const touch=ev.touches[0];
        _clearDropLines(nav);
        const el=document.elementFromPoint(touch.clientX,touch.clientY);
        const hovered=el?.closest('.proj-section-inner .proj-item[data-id]:not(.hidden-proj-item)');
        if(hovered&&hovered!==item){
          const r=hovered.getBoundingClientRect();
          const isBefore=touch.clientY<r.top+r.height/2;
          dropTargetId=isBefore?hovered.dataset.id:(items[items.indexOf(hovered)+1]?.dataset.id||'last');
          dropBefore=true;
          showDropLine(dropTargetId);
        } else {
          dropTargetId=null;
        }
      };
      const onEnd=()=>{
        item.style.opacity='';
        _clearDropLines(nav);
        if(sidebarBody)sidebarBody.style.overflowY='';
        document.removeEventListener('touchmove',onMove);
        document.removeEventListener('touchend',onEnd);
        if(dropTargetId){
          _projDragEndedAt=Date.now();
          doReorder(srcId,dropTargetId,dropBefore);
        }
      };
      document.addEventListener('touchmove',onMove,{passive:false});
      document.addEventListener('touchend',onEnd,{passive:true});
    },{passive:true});
  });

  // ===== Hidden projects drag =====
  function doHiddenReorder(srcId,dstId){
    const projs=S.projects.filter(p=>p.status==='hidden').sort((a,b)=>(a.hiddenOrder||0)-(b.hiddenOrder||0));
    const si=projs.findIndex(p=>p.id===srcId);
    if(si<0)return;
    const[moved]=projs.splice(si,1);
    if(dstId==='last'){projs.push(moved);}
    else{const di=projs.findIndex(p=>p.id===dstId);if(di<0)projs.push(moved);else projs.splice(di,0,moved);}
    projs.forEach((p,i)=>{p.hiddenOrder=i;});
    Promise.all(projs.map(p=>saveProject(p))).then(()=>{renderSidebar();attachProjRenameListeners();attachProjDragListeners();attachTagDragListeners();});
  }

  const hItems=[...nav.querySelectorAll('.hidden-proj-item[data-id]')];
  const hDropLines=[...nav.querySelectorAll('.hidden-drop-line')];

  function showHDropLine(beforeId){
    hDropLines.forEach(l=>l.classList.remove('active'));
    const sel=beforeId==='last'
      ?nav.querySelector('.hidden-drop-line[data-hdrop-after="last"]')
      :nav.querySelector('.hidden-drop-line[data-hdrop-before="'+beforeId+'"]');
    if(sel)sel.classList.add('active');
  }

  let hDragSrc=null;
  hItems.forEach(item=>{
    const handle=item.querySelector('.hidden-drag-handle');
    if(handle){handle.addEventListener('mousedown',()=>{item.setAttribute('draggable','true');},{passive:true});}
    item.addEventListener('dragstart',e=>{hDragSrc=item;e.dataTransfer.effectAllowed='move';setTimeout(()=>{item.style.opacity='0.45';},0);});
    item.addEventListener('dragend',()=>{item.style.opacity='';item.setAttribute('draggable','false');hDropLines.forEach(l=>l.classList.remove('active'));hDragSrc=null;});
    item.addEventListener('dragover',e=>{
      e.preventDefault();e.dataTransfer.dropEffect='move';
      if(hDragSrc===item)return;
      const r=item.getBoundingClientRect();
      const dstId=e.clientY<r.top+r.height/2?item.dataset.id:(hItems[hItems.indexOf(item)+1]?.dataset.id||'last');
      showHDropLine(dstId);
    });
    item.addEventListener('drop',e=>{
      e.preventDefault();e.stopPropagation();
      if(!hDragSrc||hDragSrc===item)return;
      const r=item.getBoundingClientRect();
      const dstId=e.clientY<r.top+r.height/2?item.dataset.id:(hItems[hItems.indexOf(item)+1]?.dataset.id||'last');
      doHiddenReorder(hDragSrc.dataset.id,dstId);hDragSrc=null;
    });
  });
  hDropLines.forEach(line=>{
    line.addEventListener('dragover',e=>{e.preventDefault();line.classList.add('active');});
    line.addEventListener('dragleave',()=>{line.classList.remove('active');});
    line.addEventListener('drop',e=>{
      e.preventDefault();e.stopPropagation();
      if(!hDragSrc)return;
      doHiddenReorder(hDragSrc.dataset.id,line.dataset.hdropBefore||'last');hDragSrc=null;
    });
  });
  hItems.forEach(item=>{
    const handle=item.querySelector('.hidden-drag-handle');
    if(!handle)return;
    handle.addEventListener('touchstart',e=>{
      e.stopPropagation();
      const srcId=item.dataset.id;
      let dropTargetId=null;
      item.style.opacity='0.6';
      const sidebarBody=document.querySelector('.sidebar-body');
      if(sidebarBody)sidebarBody.style.overflowY='hidden';
      const onMove=ev=>{
        ev.preventDefault();
        const touch=ev.touches[0];
        hDropLines.forEach(l=>l.classList.remove('active'));
        const el=document.elementFromPoint(touch.clientX,touch.clientY);
        const hovered=el?.closest('.hidden-proj-item[data-id]');
        if(hovered&&hovered!==item){
          const r=hovered.getBoundingClientRect();
          dropTargetId=touch.clientY<r.top+r.height/2?hovered.dataset.id:(hItems[hItems.indexOf(hovered)+1]?.dataset.id||'last');
          showHDropLine(dropTargetId);
        } else {dropTargetId=null;}
      };
      const onEnd=()=>{
        item.style.opacity='';hDropLines.forEach(l=>l.classList.remove('active'));
        if(sidebarBody)sidebarBody.style.overflowY='';
        document.removeEventListener('touchmove',onMove);document.removeEventListener('touchend',onEnd);
        if(dropTargetId){_projDragEndedAt=Date.now();doHiddenReorder(srcId,dropTargetId);}
      };
      document.addEventListener('touchmove',onMove,{passive:false});
      document.addEventListener('touchend',onEnd,{passive:true});
    },{passive:true});
  });
}

function getNavOrder(){
  try{
    const saved=JSON.parse(localStorage.getItem('bnav_order')||'null');
    if(Array.isArray(saved)&&saved.length)return saved;
  }catch(e){}
  return['inbox','today','forecast','_sidebar','search','ai','_edit'];
}
async function loadNavOrder(){
  try{
    if(!window.sbGetSetting)return;
    const val=await window.sbGetSetting('bnav_order');
    if(val){
      const parsed=JSON.parse(val);
      if(Array.isArray(parsed)&&parsed.length){
        // 既存の保存順に 'gantt' がなければ forecast の直後に挿入
        if(!parsed.includes('gantt')){
          const fi=parsed.indexOf('forecast');
          fi>=0?parsed.splice(fi+1,0,'gantt'):parsed.unshift('gantt');
          window.sbSetSetting('bnav_order',JSON.stringify(parsed));
        }
        localStorage.setItem('bnav_order',JSON.stringify(parsed));
        renderBotNav();renderSidebar();
      }
    }
  }catch(e){console.error('loadNavOrder',e);}
}

function getNavSequence(){
  const SYS_VIEWS=['dashboard','inbox','today','overdue','forecast','flagged','review','nextview','search','notes'];
  const bnavOrder=getNavOrder().filter(v=>SYS_VIEWS.includes(v));
  const orderedSys=[...bnavOrder,...SYS_VIEWS.filter(v=>!bnavOrder.includes(v))];
  const views=orderedSys.map(v=>({type:'view',v}));
  const projs=getSortedProjects('active').map(p=>({type:'proj',id:p.id,name:p.name}));
  const noneTag={type:'tag',id:'__none__',name:'タグなし'};
  const tags=getSortedTags().map(t=>({type:'tag',id:t.id,name:t.name}));
  return [...views,...projs,noneTag,...tags];
}
function getCurrentNavIdx(seq){
  if(S.view==='project')return seq.findIndex(x=>x.type==='proj'&&x.id===S.projId);
  if(S.view==='tag')return seq.findIndex(x=>x.type==='tag'&&x.id===S.tagId);
  return seq.findIndex(x=>x.type==='view'&&x.v===S.view);
}
function doViewNav(dir){ // dir: 'prev' | 'next'
  playSE('toggle');
  const seq=getNavSequence();
  if(!seq.length)return;
  const cur=getCurrentNavIdx(seq);
  const len=seq.length;
  // curが-1（未知のビュー）のときは先頭/末尾へ
  let ni;
  if(dir==='prev') ni=cur<=0?len-1:cur-1;
  else ni=cur>=len-1?0:cur+1;
  const item=seq[ni];
  if(!item)return;
  S.taskId=null;S.drawerOpen=false;
  if(item.type==='view'){S.view=item.v;}
  else if(item.type==='proj'){S.view='project';S.projId=item.id;}
  else if(item.type==='tag'){S.view='tag';S.tagId=item.id;}
  render();
  // サイドバーのアクティブ項目が見えるようにスクロール
  requestAnimationFrame(()=>{
    const sidenav=document.getElementById('sidenav');
    const active=sidenav?.querySelector('.nav-item.on');
    if(active)active.scrollIntoView({block:'nearest',behavior:'smooth'});
  });
}

      .filter(i=>i.special!=='ai'||aiEnabled).filter(i=>i.special!=='edit').filter(i=>i.v!=='gantt');
    document.getElementById('botnav').innerHTML='<div class="bot-nav-inner">'+items.map(mkItem).join('')+'</div>';
  }
}
function openNavEdit(){
  const ov=document.createElement('div');ov.className='overlay';
  ov.innerHTML='<div class="modal" style="max-height:90vh;overflow-y:auto"><div class="modal-title">ナビ並び替え</div>'
    +'<div id="nav-edit-list"></div>'
