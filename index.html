          +'<button class="calc-util-btn" data-cv="億">億</button>'
        +'</div>'
      +'</div>';

  container.appendChild(wrap);

  const exEl=wrap.querySelector('.calc-expr-inline');
  const reEl=wrap.querySelector('.calc-result');
  const omEl=wrap.querySelector('.calc-okuMan');
  const histEl=wrap.querySelector('.calc-hist');

  function upd(){
    exEl.textContent=expr?fmtExpr(expr):'';
    reEl.textContent=result?fmtComma(result):'0';
    omEl.textContent=result?fmtOkuMan(result):'';
    saveState();
  }
  upd();

  function renderHist(){
    if(!calcHistory.length){histEl.style.display='none';return;}
    histEl.style.display='flex';
    histEl.innerHTML=calcHistory.slice(-10).reverse().map((h,i)=>
      '<div class="calc-hist-item" data-hi="'+(calcHistory.length-1-i)+'">'
        +'<span class="calc-hist-expr-zone" data-copy-hi="'+(calcHistory.length-1-i)+'" title="タップで式をコピー">'
          +'<span class="calc-hist-expr">'+esc(fmtExpr(h.expr))+'</span>'
          +'<span class="calc-hist-sep">=</span>'
        +'</span>'
        +'<span class="calc-hist-result" data-insert-hi="'+(calcHistory.length-1-i)+'" title="タップで電卓に入力">'+esc(fmtComma(h.result))+'</span>'
      +'</div>'
    ).join('');

    // 式ゾーン: タップ → 式+結果をコピー
    histEl.querySelectorAll('.calc-hist-expr-zone').forEach(zone=>{
      const idx=parseInt(zone.dataset.copyHi);
      zone.addEventListener('click',e=>{
        e.stopPropagation();
        const h=calcHistory[idx];
        if(!h)return;
        doCopy(fmtExpr(h.expr)+'='+fmtComma(h.result),()=>{
          zone.closest('.calc-hist-item').classList.add('flash');
          setTimeout(()=>zone.closest('.calc-hist-item')?.classList.remove('flash'),400);
          toast('式をコピーしました 📋');
        });
      });
    });

    // 結果バッジ: タップ → 電卓に入力 / 長押し → 数値をコピー
    histEl.querySelectorAll('.calc-hist-result').forEach(badge=>{
      const idx=parseInt(badge.dataset.insertHi);
      let lpTimer=null;
      const lpStart=()=>{
        lpTimer=setTimeout(()=>{
          lpTimer=null;
          const h=calcHistory[idx];
          if(!h)return;
          doCopy(fmtComma(h.result),()=>{
            badge.closest('.calc-hist-item').classList.add('flash');
            setTimeout(()=>badge.closest('.calc-hist-item')?.classList.remove('flash'),500);
            toast('結果をコピーしました 📋');
          });
        },500);
      };
      const lpEnd=(isTap)=>{
        if(lpTimer){
          clearTimeout(lpTimer);lpTimer=null;
          if(isTap){
            const h=calcHistory[idx];
            if(h){
              pressNum(h.result);
              badge.closest('.calc-hist-item').classList.add('flash');
              setTimeout(()=>badge.closest('.calc-hist-item')?.classList.remove('flash'),250);
            }
          }
        }
      };
      const lpCancel=()=>{if(lpTimer){clearTimeout(lpTimer);lpTimer=null;}};
      badge.addEventListener('touchstart',e=>{e.stopPropagation();e.preventDefault();lpStart();},{passive:false});
      badge.addEventListener('touchend',e=>{e.stopPropagation();e.preventDefault();lpEnd(true);},{passive:false});
      badge.addEventListener('touchcancel',lpCancel);
      badge.addEventListener('mousedown',e=>{e.stopPropagation();lpStart();});
      badge.addEventListener('mouseup',e=>{e.stopPropagation();lpEnd(true);});
      badge.addEventListener('mouseleave',lpCancel);
    });
  }
  renderHist();

  function pressNum(n){if(justEvaled){expr=n;result='';justEvaled=false;}else expr+=n;const r=safeCalc(expr);if(r!=null)result=r;upd();}
  function pressOp(op){justEvaled=false;if(expr&&'+-*/'.includes(expr.slice(-1)))expr=expr.slice(0,-1);expr+=op;upd();}
  function pressParen(p){justEvaled=false;expr+=p;const r=safeCalc(expr);if(r!=null)result=r;upd();}
  function pressDot(){const seg=(expr.match(/[0-9.]*$/)||[''])[0];if(seg.includes('.'))return;if(!expr||'+-*/('.includes(expr.slice(-1)))expr+='0';expr+='.';justEvaled=false;upd();}
  function pressEq(){if(!expr)return;const r=safeCalc(expr);if(r!=null){calcHistory.push({expr,result:r});result=r;justEvaled=true;renderHist();}upd();}
  function pressBS(){if(justEvaled){expr='';result='';justEvaled=false;upd();return;}expr=expr.slice(0,-1);const r=safeCalc(expr);if(r!=null)result=r;else if(!expr)result='';upd();}
  function pressAC(){expr='';result='';justEvaled=false;upd();}
  function pressPM(){const m=expr.match(/^(.*[+\-*/])?(-?)(\d+\.?\d*)$/);if(m){expr=(m[1]||'')+(m[2]==='-'?'':'-')+m[3];}else if(!expr){expr='-';}else if(expr==='-'){expr='';}const r=safeCalc(expr);if(r!=null)result=r;upd();}

  // 結果エリア長押しでコピー
  let _resLpTimer=null;
  const resWrap=wrap.querySelector('.calc-result-wrap');
  function _copyResult(){
    if(!result||result==='0')return;
    doCopy(fmtComma(result),()=>{
      resWrap.style.opacity='.4';setTimeout(()=>{resWrap.style.opacity='';},300);
      toast('計算結果をコピーしました 📋');
    });
  }
  function _resLpStart(){_resLpTimer=setTimeout(()=>{_resLpTimer=null;_copyResult();},500);}
  function _resLpEnd(){if(_resLpTimer){clearTimeout(_resLpTimer);_resLpTimer=null;}}
  resWrap.addEventListener('touchstart',_resLpStart,{passive:true});
  resWrap.addEventListener('touchend',_resLpEnd);
  resWrap.addEventListener('touchcancel',_resLpEnd);
  resWrap.addEventListener('mousedown',_resLpStart);
  resWrap.addEventListener('mouseup',_resLpEnd);
  resWrap.addEventListener('mouseleave',_resLpEnd);

  // 式クリア・式コピー（ヘッダーボタン）
  const exClearBtn=document.getElementById('calc-head-clear-btn');
  const exCopyBtn=document.getElementById('calc-head-copy-btn');
  if(exClearBtn)exClearBtn.addEventListener('click',()=>{calcHistory=[];_calcState.history=[];renderHist();toast('式ログをクリアしました');});
  if(exCopyBtn)exCopyBtn.addEventListener('click',()=>{
    if(!calcHistory.length)return;
    const text=calcHistory.map(h=>fmtExpr(h.expr)+' = '+fmtComma(h.result)).join('\n');
    doCopy(text,()=>toast('式ログをコピーしました 📋'));
  });

  // 税込・税抜ボタン
  function applyTax(inclusive){
    const num=parseFloat(result||'0');if(isNaN(num)||num===0)return;
    const rate=(typeof getSetting==='function'?getSetting('taxRate',10):10)/100;
    const r=Math.round((inclusive?num*(1+rate):num/(1+rate))*100)/100;
    result=String(r);expr='';justEvaled=true;upd();
  }
  wrap.querySelector('.calc-tax-in').onclick=()=>{pressAnimate(wrap.querySelector('.calc-tax-in'));applyTax(true);}
  wrap.querySelector('.calc-tax-out').onclick=()=>{pressAnimate(wrap.querySelector('.calc-tax-out'));applyTax(false);}

  // Paren buttons with animation
  wrap.querySelector('.calc-action-row').addEventListener('click',e=>{
    const btn=e.target.closest('[data-cv]');if(!btn)return;
    pressAnimate(btn);pressParen(btn.dataset.cv);
  });

  function pressMulti(s){if(justEvaled){expr=s;result='';justEvaled=false;}else expr+=s;const r=safeCalc(expr);if(r!=null)result=r;upd();}

  // Number/op grid: touch for animation + sound, click for logic
  const grid=wrap.querySelector('.calc-grid');
  grid.addEventListener('touchstart',e=>{
    const btn=e.target.closest('[data-cv]');if(!btn)return;
    pressAnimate(btn);
  },{passive:true});
  grid.addEventListener('click',e=>{
    const btn=e.target.closest('[data-cv]');if(!btn)return;
    const v=btn.dataset.cv;
    if(v==='AC')pressAC();else if(v==='±')pressPM();else if(v==='BS')pressBS();
    else if(v==='/')pressOp('/');else if(v==='*')pressOp('*');else if(v==='-')pressOp('-');else if(v==='+')pressOp('+');
    else if(v==='=')pressEq();else if(v==='.')pressDot();else pressNum(v);
    if(!('ontouchstart' in window))pressAnimate(btn);
  });

  // 入力補助ボタン（00 / 000 / 万 / 億）
  const utilRow=wrap.querySelector('.calc-util-row');
  if(utilRow){
    utilRow.addEventListener('touchstart',e=>{const btn=e.target.closest('[data-cv]');if(btn)pressAnimate(btn);},{passive:true});
    utilRow.addEventListener('click',e=>{
      const btn=e.target.closest('[data-cv]');if(!btn)return;
      const v=btn.dataset.cv;
      if(v==='00')pressMulti('00');
      else if(v==='000')pressMulti('000');
      else if(v==='万')pressMulti('0000');
      else if(v==='億')pressMulti('00000000');
      if(!('ontouchstart' in window))pressAnimate(btn);
    });
  }
}

// ===== PC EXPAND MODAL =====
function openExpandModal(type){
  document.querySelectorAll('.expand-overlay').forEach(el=>el.remove());
  const ov=document.createElement('div');
  ov.className='expand-overlay';
  const modal=document.createElement('div');
  modal.className='expand-modal';
  ov.appendChild(modal);
  document.body.appendChild(ov);

  function renderInto(){
    if(type==='task'){
      renderDrawer();
      const dr=document.getElementById('drawer');
      if(dr){
        modal.innerHTML=dr.innerHTML;
        // re-attach events by cloning drawer logic into modal
        modal.querySelectorAll('[data-a="close-drawer"]').forEach(b=>{b.addEventListener('click',()=>{ov.remove();S.drawerOpen=false;S.taskId=null;renderDrawer();renderContent();});});
      }
    } else {
      renderNoteDrawer();
      const dr=document.getElementById('drawer');
      if(dr){
        modal.innerHTML=dr.innerHTML;
        modal.querySelectorAll('[data-a="close-note"]').forEach(b=>{b.addEventListener('click',()=>{ov.remove();S.noteOpen=false;S.noteId=null;renderNoteDrawer();renderContent();});});
      }
    }
    // wire modal inner buttons via event delegation
    reattachModalEvents(modal, type, ()=>{ov.remove();renderContent();renderDrawer();});
  }
  renderInto();
  ov.addEventListener('click',e=>{if(e.target===ov){ov.remove();}});
  document.addEventListener('keydown',function escKey(e){if(e.key==='Escape'){ov.remove();document.removeEventListener('keydown',escKey);}});
}

function reattachModalEvents(modal, type, onClose){
  // textarea / input autosave inside modal
  if(type==='task'){
    const titleEl=modal.querySelector('#dt-title');
    const notesEl=modal.querySelector('#dt-notes');
    const dueEl=modal.querySelector('#dt-due');
    const startEl=modal.querySelector('#dt-start');
    const projEl=modal.querySelector('#dt-proj');
    const secEl=modal.querySelector('#dt-sec');
    const repeatEl=modal.querySelector('#dt-repeat');
    const indEl=modal.querySelector('#autosave-ind');
    const setInd=(s)=>{if(!indEl)return;indEl.className='autosave-ind '+s;indEl.textContent=s==='saving'?'保存中…':s==='saved'?'保存済み ✓':'自動保存 ✓'};
    let _c=false;
    const save=(force)=>{
      if(_c&&!force)return;
      setInd('saving');
      clearTimeout(save._t);
      save._t=setTimeout(async()=>{
        const t=S.tasks.find(x=>x.id===S.taskId);if(!t)return;
        if(titleEl)t.title=titleEl.value;
        if(notesEl)t.notes=notesEl.value;
        if(dueEl)t.dueAt=dueEl.value||null;
        if(startEl)t.startAt=startEl.value||null;
        if(projEl)t.projectId=projEl.value||null;
        if(secEl)t.sectionId=secEl.value||null;
        if(repeatEl)t.repeatRule=repeatEl.value||null;
        await saveTask(t);setInd('saved');
      },400);
    };
    ['dt-title','dt-notes'].forEach(id=>{
      const el=modal.querySelector('#'+id);if(!el)return;
      el.addEventListener('compositionstart',()=>{_c=true});
      el.addEventListener('compositionend',()=>{_c=false;save(true);});
      el.addEventListener('input',()=>save());
    });
    ['dt-due','dt-start','dt-proj','dt-sec','dt-repeat'].forEach(id=>{
      const el=modal.querySelector('#'+id);
      if(el)el.addEventListener('change',()=>{
        save(true);
        if(id==='dt-due'||id==='dt-start'){
          const wd=modal.querySelector('#dt-'+( id==='dt-due'?'due':'start')+'-wd');
          if(wd)wd.textContent=wdStr(el.value);
        }
      });
    });
    const subInp=modal.querySelector('#sub-inp');
    if(subInp)subInp.addEventListener('keydown',async e=>{
      if(e.key==='Enter'&&subInp.value.trim()){
        const s=mkTask({title:subInp.value.trim(),parentTaskId:S.taskId,status:'active'});
        await saveTask(s);subInp.value='';
        // re-render subs
        const subsEl=modal.querySelector('#subs');
        if(subsEl){const subs=S.tasks.filter(t=>t.parentTaskId===S.taskId);subsEl.innerHTML=subs.map(s=>'<div class="sub-item"><button class="chk'+(s.status==='completed'?' done':'')+'" data-a="chk" data-id="'+s.id+'">'+(s.status==='completed'?'✓':'')+'</button><span>'+esc(s.title)+'</span></div>').join('');}
      }
    });
    makeResizable(modal.querySelector('#dt-notes'));
    const previewToggle=modal.querySelector('#dt-preview-toggle');
    const preview=modal.querySelector('#dt-preview');
    if(previewToggle&&preview){
      previewToggle.addEventListener('click',()=>{const open=preview.style.display!=='none';preview.style.display=open?'none':'block';previewToggle.innerHTML=(open?'▶':'▼')+' プレビュー';});
      makePreviewResizable(preview);
    }
    // copy url btn
    const copyUrlBtn=modal.querySelector('#copy-url-btn');
    if(copyUrlBtn){
      const taskUrl=location.origin+location.pathname+'#task/'+S.taskId;
      copyUrlBtn.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(taskUrl);toast('URLをコピーしました 🔗');}catch(e){toast(taskUrl);}});
    }
  } else {
    const titleEl=modal.querySelector('#nt-title');
    const bodyEl=modal.querySelector('#nt-body');
    const note=S.notes.find(n=>n.id===S.noteId);
    if(!note)return;
    makeResizable(bodyEl);
    const previewToggle=modal.querySelector('#nt-preview-toggle');
    const previewAnim=modal.querySelector('#nt-preview-anim');
    if(previewToggle&&previewAnim){
      previewToggle.addEventListener('click',()=>{const open=previewAnim.style.maxHeight!=='0px';previewAnim.style.maxHeight=open?'0px':'600px';previewAnim.style.opacity=open?'0':'1';previewToggle.innerHTML=(open?'▶':'▼')+' プレビュー';});
      makePreviewResizable(preview);
    }
    let _c=false,nt2;
    const save=()=>{clearTimeout(nt2);nt2=setTimeout(async()=>{note.title=titleEl?.value||'';note.body=bodyEl?.value||'';await saveNote(note);const h=modal.querySelector('.drawer-head div div:last-child');if(h)h.textContent=note.title||'無題';},600);};
    titleEl?.addEventListener('compositionstart',()=>{_c=true});titleEl?.addEventListener('compositionend',()=>{_c=false;save()});titleEl?.addEventListener('input',()=>{if(!_c)save()});
    bodyEl?.addEventListener('compositionstart',()=>{_c=true});bodyEl?.addEventListener('compositionend',()=>{_c=false;save()});bodyEl?.addEventListener('input',()=>{if(!_c)save()});
  }
}

// ===== NOTE TITLE INLINE EDIT =====
document.addEventListener('dblclick',e=>{
  const el=e.target.closest('[data-note-title-edit]');
  if(!el)return;
  e.preventDefault();e.stopPropagation();
  const noteId=el.dataset.noteTitleEdit;
  const note=S.notes.find(n=>n.id===noteId);
  if(!note||el.querySelector('input'))return;
  const inp=document.createElement('input');
  inp.value=note.title||'';
  inp.className='note-title-edit-inp';
  el.innerHTML='';el.appendChild(inp);
  inp.focus();inp.select();
  let committed=false;
  async function commit(){
    if(committed)return;committed=true;
    const val=inp.value.trim();
    if(val!==note.title){note.title=val||'無題';note.updatedAt=now();await saveNote(note);}
    renderNoteListOnly();
    if(S.noteId===noteId&&S.noteOpen){const hdr=document.querySelector('.drawer-head div div:last-child');if(hdr)hdr.textContent=note.title||'無題';const ti=document.getElementById('nt-title');if(ti)ti.value=note.title||'';}
  }
  inp.addEventListener('blur',commit);
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();inp.blur();}if(e.key==='Escape'){committed=true;renderNoteListOnly();}});
  inp.addEventListener('click',e=>e.stopPropagation());
  inp.addEventListener('touchstart',e=>e.stopPropagation(),{passive:true});
});

// タスクタイトル インライン編集 (PC: ダブルクリック)
function startTaskInlineEdit(el){
  const taskId=el.dataset.titleEdit;
  const task=S.tasks.find(t=>t.id===taskId);
  if(!task||el.querySelector('input'))return;
  const inp=document.createElement('input');
  inp.value=task.title;
  inp.style.cssText='width:100%;font:inherit;font-size:inherit;background:var(--bg2);border:1px solid var(--accent);border-radius:4px;padding:1px 5px;color:var(--text);outline:none;box-sizing:border-box';
  el.innerHTML='';
  el.appendChild(inp);
  inp.focus();inp.select();
  let committed=false;
  async function commit(){
    if(committed)return;committed=true;
    const newTitle=inp.value.trim();
    if(newTitle&&newTitle!==task.title){task.title=newTitle;await saveTask(task);}
    renderContent();
  }
  inp.addEventListener('blur',commit);
  inp.addEventListener('keydown',e=>{
    if(e.key==='Enter'){e.preventDefault();inp.blur();}
    if(e.key==='Escape'){committed=true;renderContent();}
  });
  inp.addEventListener('click',e=>e.stopPropagation());
  inp.addEventListener('touchstart',e=>e.stopPropagation(),{passive:true});
}
document.addEventListener('dblclick',e=>{
  const el=e.target.closest('[data-title-edit]');
  if(!el)return;
  e.preventDefault();
  e.stopPropagation();
  startTaskInlineEdit(el);
});

function updateSrch(val){
  S.search=val;
  // global-srch と srch を同期
  const gs=document.getElementById('global-srch');
  if(gs&&gs.value!==val)gs.value=val;
  const c=document.getElementById('srch-results');
  if(c)c.innerHTML=renderSearchResults(S.search);else renderContent();
}
function activateGlobalSrch(val){
  // Search画面に切り替えてから結果を更新

// ===== SWIPE TO OPEN SIDEBAR (disabled) =====
(function(){
  return; // 誤操作が多いため無効化
  let startX=0,startY=0,tracking=false;
  const EDGE=30; // 左端30px以内からスワイプ開始
  const MIN_DIST=60; // 最低60px右に動かす
  const MAX_Y=40; // 縦ズレ許容

  document.addEventListener('touchstart',e=>{
    if(window.innerWidth>768)return;
    const t=e.touches[0];
    // 開く: 左端から右スワイプ
    if(t.clientX<=EDGE&&!S.sidebarOpen){
      startX=t.clientX;startY=t.clientY;tracking='open';
    }
    // 閉じる: サイドバー内から左スワイプ
    else if(S.sidebarOpen&&t.clientX<=280){
      startX=t.clientX;startY=t.clientY;tracking='close';
    }
  },{passive:true});

  document.addEventListener('touchmove',e=>{
    if(!tracking)return;
    const t=e.touches[0];
    const dx=t.clientX-startX;
    const dy=Math.abs(t.clientY-startY);
    if(tracking==='open'&&dx>MIN_DIST&&dy<MAX_Y){
      S.sidebarOpen=true;S._sidebarJustOpened=Date.now();render();tracking=false;
    } else if(tracking==='close'&&dx<-MIN_DIST&&dy<MAX_Y){
      S.sidebarOpen=false;render();tracking=false;
    }
  },{passive:true});

  document.addEventListener('touchend',()=>{tracking=false;},{passive:true});
})();

// ===== MOBILE SEARCH EXPAND/COLLAPSE =====
(function(){
  const wrap=document.getElementById('global-srch-wrap');
  const input=document.getElementById('global-srch');
  const topbar=wrap?.closest('.topbar');
  if(!wrap||!input)return;

  function expand(){
    wrap.classList.add('srch-expanded');
    topbar?.classList.add('srch-active');
    setTimeout(()=>input.focus(),50);
  }
  function collapse(){
    wrap.classList.remove('srch-expanded');
    topbar?.classList.remove('srch-active');
  }

  wrap.addEventListener('click',e=>{
    if(window.innerWidth>768)return;
    if(!wrap.classList.contains('srch-expanded')){e.stopPropagation();expand();}
  });
  input.addEventListener('blur',()=>{
    if(window.innerWidth>768)return;
    if(!input.value)setTimeout(collapse,150);
  });
  // 検索クリア時も折りたたむ
  input.addEventListener('search',()=>{
    if(window.innerWidth>768)return;
    if(!input.value)setTimeout(collapse,150);
  });
})();

// ===== BACKUP =====
async function saveBackup(label){
  const data={
    tasks:S.tasks,
    projects:S.projects,
    sections:S.sections,
    tags:S.tags,
  };
  const backup={id:uid(),label,created_at:now(),data:JSON.stringify(data)};
  const{error}=await window._SB.from('backups').insert(backup);
  if(error)throw error;
  return backup;
}

async function loadBackups(){
  const{data,error}=await window._SB.from('backups').select('*').order('created_at',{ascending:false}).limit(20);
  if(error)throw error;
  return data||[];
}

async function deleteBackup(id){
  const{error}=await window._SB.from('backups').delete().eq('id',id);
  if(error)throw error;
}

async function restoreBackup(backup){
  const data=JSON.parse(backup.data);
  // 現在のデータを全削除してから復元
  for(const t of S.tasks)await dbDel('tasks',t.id);
  for(const p of S.projects)await dbDel('projects',p.id);
  for(const s of S.sections)await dbDel('sections',s.id);
  for(const g of S.tags)await dbDel('tags',g.id);
  // 復元
  for(const t of data.tasks||[])await dbPut('tasks',t);
  for(const p of data.projects||[])await dbPut('projects',p);
  for(const s of data.sections||[])await dbPut('sections',s);
  for(const g of data.tags||[])await dbPut('tags',g);
  await loadAll();
  render();
}

async function openBackupModal(){

          +'<button class="icon-btn" style="color:var(--text3);font-size:12px" data-bk-del="'+b.id+'">✕</button>'
        +'</div>';
      }).join('');

            async()=>{

      +' '+now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0');
    const btn=document.getElementById('bk-save');
    btn.disabled=true;btn.textContent='保存中…';

      setTimeout(()=>{if(btn)btn.textContent='📦 今すぐバックアップ';if(btn)btn.disabled=false},1500);

      setTimeout(()=>{if(btn)btn.textContent='📦 今すぐバックアップ';if(btn)btn.disabled=false},2000);
    }

function openConfirmModal(title,message,onOk,okLabel='削除',danger=true){

    +'<div class="modal-title">'+esc(title)+'</div>'

    +'<div class="modal-foot">'

    +'</div>'
  +'</div>';
  document.body.appendChild(ov);requestAnimationFrame(()=>ov.classList.add('open'));
  // ov.querySelector で ID重複を回避（複数モーダルが重なっても正しく動作）
  const cancelBtn=ov.querySelector('#m-cancel');
  const okBtn=ov.querySelector('#m-ok');
  cancelBtn.onclick=()=>ov.remove();
  okBtn.onclick=async()=>{ov.remove();await onOk()};
  // フォーカスをキャンセルボタンへ移動（Enterキーで背後のボタンが再発火するのを防ぐ）
  requestAnimationFrame(()=>cancelBtn?.focus());
  // キーボード操作
  ov.addEventListener('keydown',e=>{
    if(e.key==='Escape'){e.stopPropagation();ov.remove();}
    else if(e.key==='Enter'){e.stopPropagation();}// デフォルト(キャンセルボタンが focused のため Enter=キャンセル)
  });
  // オーバーレイ外クリックで閉じる
  ov.addEventListener('click',e=>{if(e.target===ov)ov.remove();});
}

  const el=document.getElementById('content');
  const ind=document.getElementById('ptr-indicator');
  const lbl=document.getElementById('ptr-label');
  let startY=0,pulling=false,triggered=false,syncing=false;
  const THRESHOLD=72;

  el.addEventListener('touchstart',e=>{
    if(el.scrollTop===0)startY=e.touches[0].clientY;
  },{passive:true});

  el.addEventListener('touchmove',e=>{
    if(!startY||syncing)return;
    const dy=e.touches[0].clientY-startY;
    if(dy<0){startY=0;return}
    if(dy>8){pulling=true}
    if(!pulling)return;
    const pull=Math.min(dy,THRESHOLD+24);
    ind.style.transform='translateY('+(pull-56)+'px)';
    ind.style.opacity=Math.min(pull/THRESHOLD,1);
    lbl.textContent=pull>=THRESHOLD?'離して同期':'引っ張って同期';
    triggered=pull>=THRESHOLD;
  },{passive:true});

  el.addEventListener('touchend',async()=>{
    if(!pulling){startY=0;return}
    pulling=false;startY=0;
    if(!triggered){
      ind.style.transform='translateY(-56px)';
      ind.style.opacity=0;
      return;
    }
    // sync
    syncing=true;
    const spinner=document.getElementById('ptr-spinner');
    ind.style.transform='translateY(0px)';
    spinner.classList.add('spinning');
    lbl.textContent='同期中…';
    try{
      await loadAll();
      render();
      lbl.textContent='✓ 同期完了';
      await new Promise(r=>setTimeout(r,800));
    }catch(err){
      lbl.textContent='同期失敗…';
      await new Promise(r=>setTimeout(r,1000));
    }
    ind.style.transform='translateY(-56px)';
    ind.style.opacity=0;
    spinner.classList.remove('spinning');
    syncing=false;triggered=false;
  });
})();

async function aiExecuteActions(actions){
  const done=[];
  // タグ名→IDを解決（未登録なら自動作成）
  async function resolveTagIds(tagNames){
    if(!tagNames||!tagNames.length)return[];
    const ids=[];
    for(const name of tagNames){
      let tag=S.tags.find(t=>t.name===name);
      if(!tag){tag=mkTag({name,color:'#7c3aed'});await saveTag(tag);}
      if(!ids.includes(tag.id))ids.push(tag.id);
    }
    return ids;
  }
  for(const a of actions){
    try{
      if(a.type==='addTask'){
        const tagIds=await resolveTagIds(a.tagNames);
        const t=mkTask({
          title:a.title||'新しいタスク',
          dueAt:a.dueAt||null,
          priority:a.priority||4,
          flagged:a.flagged||false,
          projectId:a.projectId?S.projects.find(p=>p.name===a.projectId)?.id||null:null,
          tagIds,
          status:(a.projectId&&S.projects.find(p=>p.name===a.projectId))?'active':'inbox',
        });
        await saveTask(t);
        done.push({...a,label:a.title});
      } else if(a.type==='completeTask'){
        const t=a.keyword?S.tasks.find(x=>x.title&&x.title.includes(a.keyword)&&x.status!=='completed'):null;
        if(t){const snap=JSON.parse(JSON.stringify(t));t.status='completed';t.completedAt=now();await saveTask(t);done.push({...a,label:t.title})}
      } else if(a.type==='deleteTask'){
        const t=a.keyword?S.tasks.find(x=>x.title&&x.title.includes(a.keyword)):null;
        if(t){await delTask(t.id);done.push({...a,label:t.title})}
      } else if(a.type==='updateTask'){
        const t=a.keyword?S.tasks.find(x=>x.title&&x.title.includes(a.keyword)):null;
        if(t){
          if(a.dueAt!==undefined)t.dueAt=a.dueAt;
          if(a.priority!==undefined)t.priority=a.priority;
          if(a.flagged!==undefined)t.flagged=a.flagged;
          if(a.newTitle)t.title=a.newTitle;
          if(a.projectId!==undefined){
            const proj=S.projects.find(p=>p.name===a.projectId);
            t.projectId=proj?proj.id:null;
            if(t.projectId&&t.status==='inbox')t.status='active';
          }
          // タグの追加・置換
          if(a.tagNames!==undefined){
            const newIds=await resolveTagIds(a.tagNames);
            // appendMode: trueなら既存タグに追記、falseなら置換
            if(a.appendTags){
              newIds.forEach(id=>{if(!t.tagIds.includes(id))t.tagIds.push(id);});
            } else {
              t.tagIds=newIds;
            }
          }
          await saveTask(t);done.push({...a,label:t.title});
        }
      } else if(a.type==='addProject'){
        const p=mkProject({name:a.name,color:a.color||'#3b82f6'});
        await saveProject(p);done.push({...a,label:a.name});
      }
    }catch(e){console.error('action error',e)}
  }
  if(done.length)render();
  return done;
}

async function aiSend(){
  const inp=document.getElementById('ai-input');
  const text=inp.value.trim();
  if(!text||AI.loading)return;
  if(!AI.key){aiShowKeyPrompt();return}

  inp.value='';inp.style.height='auto';
  aiAddMsg('user',text);
  AI.loading=true;aiRender();

  // 現在の状態をコンテキストとして渡す
  const context={
    tasks:S.tasks.filter(t=>t.status!=='completed').map(t=>({
      id:t.id,title:t.title,status:t.status,priority:t.priority,
      dueAt:t.dueAt,flagged:t.flagged,
      project:S.projects.find(p=>p.id===t.projectId)?.name||null,
      tags:t.tagIds.map(id=>S.tags.find(g=>g.id===id)?.name).filter(Boolean),
    })),
    projects:S.projects.filter(p=>p.status==='active').map(p=>({name:p.name,color:p.color})),

    today:today(),
  };

  const systemPrompt=`あなたはタスク管理アプリ「Taskra」のAIアシスタントです。
ユーザーの依頼に応じてタスクの操作を行います。

## 現在のデータ
${JSON.stringify(context,null,2)}

## レスポンス形式
必ずJSON形式で返してください（マークダウンのコードブロック不要）:
{
  "message": "ユーザーへの返答（日本語）",
  "actions": [
    // タスク追加
    {"type":"addTask","title":"タイトル","dueAt":"YYYY-MM-DD or null","priority":1-4,"flagged":false,"projectId":"プロジェクト名 or null","tagNames":["タグ名"]}
    // タスク完了
    {"type":"completeTask","keyword":"タイトルの一部"}
    // タスク削除
    {"type":"deleteTask","keyword":"タイトルの一部"}
    // タスク更新
    {"type":"updateTask","keyword":"タイトルの一部","dueAt":"YYYY-MM-DD","priority":1-4,"flagged":true,"newTitle":"新タイトル","projectId":"プロジェクト名 or null","tagNames":["タグ名"],"appendTags":true}
    // プロジェクト追加
    {"type":"addProject","name":"名前","color":"#hexcolor"}
  ]
}

## ルール
- priorityは1(高)〜4(なし)
- dueAtは"YYYY-MM-DD"形式。今日は${today()}
- 操作不要なら"actions":[]
- タスクが見つからない場合はmessageで教える
- 複数の操作も一度にできる`;

  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':AI.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({
        model:'claude-sonnet-4-20250514',
        max_tokens:1024,
        system:systemPrompt,
        messages:AI.msgs.filter(m=>m.role!=='ai'||!m.loading).slice(-8).map(m=>({
          role:m.role==='user'?'user':'assistant',
          content:m.text,
        })),
      }),
    });
    const data=await res.json();
    if(data.error)throw new Error(data.error.message);
    const raw=data.content[0].text;
    let parsed;
    try{parsed=JSON.parse(raw.replace(/```json|```/g,'').trim())}
    catch(e){parsed={message:raw,actions:[]}}
    AI.loading=false;
    const done=await aiExecuteActions(parsed.actions||[]);
    aiAddMsg('ai',parsed.message||'完了しました',done);
    aiRender();
  }catch(e){
    AI.loading=false;
    aiAddMsg('ai','エラーが発生しました: '+e.message);
    aiRender();
  }
}

      const ctx=_audioCtx;

      const sr=ctx.sampleRate;

      master.gain.value=1.0;
      const masterLP=ctx.createBiquadFilter();
      masterLP.type='lowpass';masterLP.frequency.value=1800;masterLP.Q.value=0.5;
      master.connect(masterLP);masterLP.connect(ctx.destination);

      const clickSrc=ctx.createBufferSource();clickSrc.buffer=clickBuf;
      const clickBP=ctx.createBiquadFilter();clickBP.type='bandpass';clickBP.frequency.value=2800;clickBP.Q.value=1.8;
      const gClick=ctx.createGain();gClick.gain.setValueAtTime(0.9,t);gClick.gain.exponentialRampToValueAtTime(0.001,t+0.01);
      clickSrc.connect(clickBP);clickBP.connect(gClick);gClick.connect(master);
      clickSrc.start(t);clickSrc.stop(t+0.012);
      const bodyOsc=ctx.createOscillator();bodyOsc.type='triangle';
      bodyOsc.frequency.setValueAtTime(130,t);bodyOsc.frequency.exponentialRampToValueAtTime(75,t+0.08);
      const gBody=ctx.createGain();gBody.gain.setValueAtTime(0.0,t);gBody.gain.linearRampToValueAtTime(0.45,t+0.003);gBody.gain.exponentialRampToValueAtTime(0.001,t+0.11);
      bodyOsc.connect(gBody);gBody.connect(master);bodyOsc.start(t);bodyOsc.stop(t+0.12);
      const impSize=Math.floor(sr*0.015);const impBuf=ctx.createBuffer(1,impSize,sr);const impData=impBuf.getChannelData(0);
      for(let i=0;i<impSize;i++){const env=Math.exp(-i/(sr*0.004));impData[i]=(Math.random()*2-1)*env;}
      const impSrc=ctx.createBufferSource();impSrc.buffer=impBuf;
      const impBP=ctx.createBiquadFilter();impBP.type='bandpass';impBP.frequency.value=650;impBP.Q.value=1.2;
      const gImp=ctx.createGain();gImp.gain.setValueAtTime(0.0,t);gImp.gain.linearRampToValueAtTime(0.55,t+0.001);gImp.gain.exponentialRampToValueAtTime(0.001,t+0.018);
      impSrc.connect(impBP);impBP.connect(gImp);gImp.connect(master);impSrc.start(t+0.003);impSrc.stop(t+0.02);
      const resSize=Math.floor(sr*0.07);const resBuf=ctx.createBuffer(1,resSize,sr);const rData=resBuf.getChannelData(0);const rf=320;
      for(let i=0;i<resSize;i++){const env=Math.exp(-i/(sr*0.022));rData[i]=(Math.sin(2*Math.PI*rf*i/sr)+Math.sin(2*Math.PI*rf*1.98*i/sr)*0.3)*env;}
      const resSrc=ctx.createBufferSource();resSrc.buffer=resBuf;
      const gRes=ctx.createGain();gRes.gain.setValueAtTime(0.0,t);gRes.gain.linearRampToValueAtTime(0.18,t+0.005);gRes.gain.exponentialRampToValueAtTime(0.001,t+0.08);
      resSrc.connect(gRes);gRes.connect(master);resSrc.start(t+0.002);resSrc.stop(t+0.09);

// ===== LOCK SCREEN =====
(function(){
  const DEFAULT_PIN='7086';
  const SESS_KEY='focus_unlocked';
  const CRED_KEY='focus_webauthn_cred';
  const PIN_KEY='focus_pin';
  const LOCK_ENABLED_KEY='focus_lock_enabled';
  const screen=document.getElementById('lockScreen');
  if(!screen)return;
  // ロック無効 or セッション認証済み or 直近認証済み or ローカル開発環境ならスキップ
  const UNLOCK_TS_KEY='focus_unlocked_ts';
  const lockEnabled=localStorage.getItem(LOCK_ENABLED_KEY)!=='false';
  const isLocalhost=['localhost','127.0.0.1',''].includes(location.hostname);
  const recentUnlock=Date.now()-parseInt(localStorage.getItem(UNLOCK_TS_KEY)||'0')<3600000; // 1時間以内
  if(!lockEnabled||sessionStorage.getItem(SESS_KEY)==='1'||recentUnlock||isLocalhost){screen.style.display='none';return}
  function getPin(){return localStorage.getItem(PIN_KEY)||DEFAULT_PIN;}

  function unlock(){
    sessionStorage.setItem(SESS_KEY,'1');
    localStorage.setItem(UNLOCK_TS_KEY,String(Date.now())); // タイムスタンプ保存
    screen.style.transition='opacity .3s';
    screen.style.opacity='0';
    setTimeout(()=>screen.style.display='none',300);
  }

  // WebAuthn
  const faceBtn=document.getElementById('face-id-btn');
  const hint=document.getElementById('biometric-hint');
  const supported=window.PublicKeyCredential&&typeof PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable==='function';

  async function checkBiometric(){
    if(!supported)return;
    const available=await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();
    if(!available)return;
    faceBtn.style.display='flex';
    const cred=localStorage.getItem(CRED_KEY);
    if(cred){
      hint.textContent='顔認証ボタンでロック解除';
    } else {
      hint.textContent='初回: PINで認証後に顔認証を登録できます';
    }
  }

  async function registerBiometric(){
    try{
      const challenge=crypto.getRandomValues(new Uint8Array(32));
      const cred=await navigator.credentials.create({publicKey:{
        challenge,
        rp:{name:'Taskra',id:location.hostname},
        user:{id:new TextEncoder().encode('taskra-user'),name:'user',displayName:'Taskra User'},
        pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
        authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'},
        timeout:60000
      }});
      localStorage.setItem(CRED_KEY,JSON.stringify({id:btoa(String.fromCharCode(...new Uint8Array(cred.rawId)))}));
      hint.textContent='顔認証を登録しました！次回から使えます';
      faceBtn.style.display='flex';
    }catch(e){
      hint.textContent='顔認証の登録に失敗しました';
    }
  }

  async function tryBiometric(){
    const stored=localStorage.getItem(CRED_KEY);
    if(!stored)return;
    try{
      const {id}=JSON.parse(stored);
      const credId=Uint8Array.from(atob(id),c=>c.charCodeAt(0));
      const challenge=crypto.getRandomValues(new Uint8Array(32));
      await navigator.credentials.get({publicKey:{
        challenge,
        allowCredentials:[{type:'public-key',id:credId}],
        userVerification:'required',
        timeout:60000
      }});
      unlock();
    }catch(e){
      // 資格情報が無効な場合はクリアして再登録を促す
      if(e.name==='NotAllowedError'||e.name==='InvalidStateError'){
        localStorage.removeItem(CRED_KEY);
        hint.textContent='顔認証の再登録が必要です。PINで認証してください';
        faceBtn.style.display='none';
      } else {
        hint.textContent='認証に失敗しました';
      }
    }
  }

  faceBtn.addEventListener('click',()=>tryBiometric());
  checkBiometric();

  // PIN
  let entered='';
  function updateDots(){
    for(let i=0;i<4;i++){
      const d=document.getElementById('ld'+i);
      if(d)d.className='lock-dot'+(i<entered.length?' filled':'');
    }
  }
  function shake(){
    screen.style.animation='none';
    requestAnimationFrame(()=>{screen.style.animation='lkshake .4s ease';});
  }
  document.head.insertAdjacentHTML('beforeend','<style>@keyframes lkshake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}</style>');
  function handleKey(k){
    const v=k.dataset.k;
    if(v==='clr'){entered=''}
    else if(v==='del'){entered=entered.slice(0,-1)}
    else if(entered.length<4){entered+=v}
    updateDots();
    document.getElementById('lockErr').textContent='';
    if(entered.length===4){
      if(entered===getPin()){
        unlock();
        if(supported&&!localStorage.getItem(CRED_KEY)&&!localStorage.getItem('focus_faceid_skip')){
          setTimeout(()=>{
            if(confirm('顔認証（Face ID / Touch ID）を登録しますか？次回からPIN不要になります。')){
              registerBiometric();
            } else {
              localStorage.setItem('focus_faceid_skip','1');
            }
          },400);
        }
      } else {
        document.getElementById('lockErr').textContent='PINが違います';
        setTimeout(()=>{entered='';updateDots();document.getElementById('lockErr').textContent=''},800);
      }
    }
  }
  function pressKey(k){
    if(!k)return;
    k.classList.add('pressed');
    window.playClick?.();
    // 深いストロークに合わせて押し込み保持を長めに
    setTimeout(()=>k.classList.remove('pressed'),160);
    handleKey(k);
  }
  screen.addEventListener('touchstart',e=>{
    e.preventDefault();
    const k=e.target.closest('[data-k]');
    pressKey(k);
  },{passive:false});
  screen.addEventListener('click',e=>{
    const k=e.target.closest('[data-k]');
    if(!k)return;
    // avoid double-fire on touch devices
    if(k._lastTouch&&Date.now()-k._lastTouch<300)return;
    pressKey(k);
  });
  screen.addEventListener('touchend',e=>{
    const k=e.target.closest('[data-k]');
    if(k)k._lastTouch=Date.now();
  });
  // PC keyboard number key support
  document.addEventListener('keydown',e=>{
    const ls=document.getElementById('lockScreen');
    if(!ls||ls.style.display==='none')return;
    if(e.key>='0'&&e.key<='9'){
      const k=screen.querySelector('[data-k="'+e.key+'"]');
      if(k)pressKey(k);
    } else if(e.key==='Backspace'){
      const k=screen.querySelector('[data-k="del"]');
      if(k)pressKey(k);
    } else if(e.key==='Escape'){
      const k=screen.querySelector('[data-k="clr"]');
      if(k)pressKey(k);
    }
  });
})();

    // 保存済みビューの有効性を検証（削除済みプロジェクト/タグへの参照を除去）
    if(S.view==='project'&&!S.projects.find(p=>p.id===S.projId)){S.view='inbox';S.projId=null;}
    if(S.view==='tag'&&S.tagId!=='__none__'&&!S.tags.find(t=>t.id===S.tagId)){S.view='inbox';S.tagId=null;}
    // ?note= URLパラメータからノートを開く
    const urlP=new URLSearchParams(location.search);
    const noteP=urlP.get('note');
    if(noteP&&S.notes.find(n=>n.id===noteP)){
      S.view='notes';S.noteId=noteP;S.noteOpen=true;
      history.replaceState(null,'',location.pathname);
      renderInstant();
      applySettings();
      setTimeout(()=>renderNoteDrawer(),150);
      if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
      return;
    }
    // URLハッシュからタスクを開く
    const hash=location.hash.match(/^#task\/(.+)$/);
    if(hash){
      const id=hash[1];
      const found=S.tasks.find(t=>t.id===id);
      if(found){S.taskId=id;S.drawerOpen=true}
      else{
        // ハッシュをリセットしてトーストで通知
        history.replaceState(null,'',location.pathname);
        renderInstant();
        applySettings();
        setTimeout(()=>toast('タスクが見つかりませんでした'),500);
        if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
        return;
      }
    }
    renderInstant();
    applySettings();
    if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
    // ===== BNAV-NEXT LONG-PRESS → SIDEBAR =====
    (()=>{
      const botnav=document.getElementById('botnav');
      if(!botnav)return;
      let _lpt=null,_lpmoved=false,_lpsx=0,_lpsy=0;
      const lockSel=()=>{document.documentElement.style.webkitUserSelect='none';document.documentElement.style.userSelect='none';};
      const unlockSel=()=>{document.documentElement.style.webkitUserSelect='';document.documentElement.style.userSelect='';};
      const _preventCtx=e=>{if(_lpt!=null)e.preventDefault();};
      document.addEventListener('contextmenu',_preventCtx,{passive:false});
      document.addEventListener('selectstart',e=>{if(_lpt!=null)e.preventDefault();},{passive:false});
      botnav.addEventListener('touchstart',e=>{
        if(!e.target.closest('.bnav-next,.bnav'))return;
        _lpmoved=false;_lpsx=e.touches[0].clientX;_lpsy=e.touches[0].clientY;
        lockSel();
        _lpt=setTimeout(()=>{
          if(_lpmoved){unlockSel();return;}
          _lpt=null;unlockSel();
          playSE('toggle');S.sidebarOpen=true;render();
        },500);
      },{passive:true});
      botnav.addEventListener('touchmove',e=>{
        if(_lpt==null)return;
        if(Math.abs(e.touches[0].clientX-_lpsx)>8||Math.abs(e.touches[0].clientY-_lpsy)>8){
          _lpmoved=true;clearTimeout(_lpt);_lpt=null;unlockSel();
        }
      },{passive:true});
      const endLp=()=>{if(_lpt!=null){clearTimeout(_lpt);_lpt=null;}unlockSel();};
      botnav.addEventListener('touchend',endLp,{passive:true});
      botnav.addEventListener('touchcancel',endLp,{passive:true});
    })();
  }catch(err){
    console.error(err);
    document.getElementById('layout').innerHTML=
      '<div style="padding:40px;font-family:sans-serif"><h2 style="color:#e85d3a">エラーが発生しました</h2>'
      +'<pre style="font-size:12px;color:#666;margin-top:10px">'+esc(err&&err.message||String(err))+'</pre></div>';
  }
}
init();
</script>
