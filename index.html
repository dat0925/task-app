function parseQA(input){
  let title=input;
  const r={title:'',projectId:null,tagIds:[],priority:4,dueAt:null,flagged:false,repeatRule:null};
  // priority
  title=title.replace(/!(高|1)/g,()=>{r.priority=1;return''})
    .replace(/!(中|2)/g,()=>{r.priority=2;return''})
    .replace(/!(低|3)/g,()=>{r.priority=3;return''});
  // tags
  r._newTagNames=[];
  title=title.replace(/#([\w\u3040-\u9FFF\u30A0-\u30FF]+)/g,(m,n)=>{
    const t=S.tags.find(x=>x.name===n);
    if(t&&!r.tagIds.includes(t.id))r.tagIds.push(t.id);
    else if(!t&&!r._newTagNames.includes(n))r._newTagNames.push(n);
    return'';
  });
  // project
  title=title.replace(/@([\w\u3040-\u9FFF\u30A0-\u30FF]+)/g,(m,n)=>{
    const p=S.projects.find(x=>x.name===n);
    if(p)r.projectId=p.id;return'';
  });
  // flag
  if(title.includes('*')){r.flagged=true;title=title.replace(/\*/g,'')}
  // repeat
  if(/毎日|daily/i.test(title)){r.repeatRule='daily';title=title.replace(/毎日|daily/gi,'')}
  else if(/毎週|weekly/i.test(title)){r.repeatRule='weekly';title=title.replace(/毎週|weekly/gi,'')}
  else if(/毎月|monthly/i.test(title)){r.repeatRule='monthly';title=title.replace(/毎月|monthly/gi,'')}
  else if(/平日|weekdays/i.test(title)){r.repeatRule='weekly:mon,tue,wed,thu,fri';title=title.replace(/平日|weekdays/gi,'')}
  // date
  const dateMap={'今日':0,'きょう':0,'明日':1,'あした':1,'明後日':2,'tomorrow':1,'today':0};
  for(const[k,v] of Object.entries(dateMap)){
    if(title.toLowerCase().includes(k)){
      const d=new Date();d.setDate(d.getDate()+v);
      r.dueAt=d.toISOString().slice(0,10);
      title=title.replace(new RegExp(k,'i'),'');break;
    }
  }
  if(!r.dueAt){
    const wk=['日','月','火','水','木','金','土'];
    for(let i=0;i<7;i++){
      if(title.includes(wk[i]+'曜')||title.includes(wk[i])){
        const d=new Date(),diff=(i-d.getDay()+7)%7||7;
        d.setDate(d.getDate()+diff);r.dueAt=d.toISOString().slice(0,10);
        title=title.replace(wk[i]+'曜','').replace(wk[i],'');break;
      }
    }
  }
  if(!r.dueAt){
    const m=title.match(/(\d{4}[-\/]\d{1,2}[-\/]\d{1,2})/);
    if(m){r.dueAt=m[1].replace(/\//g,'-');title=title.replace(m[0],'')}
  }
  r.title=title.replace(/\s+/g,' ').trim();
  return r;
}

function nextRepeat(task){
  if(!task.repeatRule||!task.dueAt)return null;
  const[dy,dm,dd]=task.dueAt.split('-').map(Number);
  const d=new Date(Date.UTC(dy,dm-1,dd));
  const origMs=d.getTime();
  const rule=task.repeatRule;
  if(rule==='daily')d.setUTCDate(d.getUTCDate()+1);
  else if(rule==='weekly')d.setUTCDate(d.getUTCDate()+7);
  else if(rule==='monthly')d.setUTCMonth(d.getUTCMonth()+1);
  else if(rule==='yearly')d.setUTCFullYear(d.getUTCFullYear()+1);
  else if(rule==='weekdays'){do{d.setUTCDate(d.getUTCDate()+1)}while(d.getUTCDay()===0||d.getUTCDay()===6)}
  else if(rule.startsWith('weekly:')){
    const DAY_MAP={sun:0,mon:1,tue:2,wed:3,thu:4,fri:5,sat:6};
    const days=rule.slice(7).split(',').map(x=>DAY_MAP[x]).filter(x=>x!==undefined).sort((a,b)=>a-b);
    if(!days.length)return null;
    d.setUTCDate(d.getUTCDate()+1);
    for(let i=0;i<14;i++){if(days.includes(d.getUTCDay()))break;d.setUTCDate(d.getUTCDate()+1);}
  }
  else if(rule.startsWith('monthly:')){
    // 複数日対応: monthly:12,18,21
    const targetDays=rule.slice(8).split(',').map(Number).filter(n=>n>=1&&n<=31).sort((a,b)=>a-b);
    if(!targetDays.length)return null;
    // 今日以降で直近の指定日を探す（同月→翌月→翌々月）
    const curDay=d.getUTCDate();
    const curMonth=d.getUTCMonth();
    const curYear=d.getUTCFullYear();
    let found=false;
    for(let mOffset=0;mOffset<=2&&!found;mOffset++){
      const tryMonth=curMonth+mOffset;
      const tryYear=curYear+Math.floor(tryMonth/12);
      const tryMonthMod=tryMonth%12;
      const maxDay=new Date(Date.UTC(tryYear,tryMonthMod+1,0)).getUTCDate();
      for(const td of targetDays){
        const actualDay=Math.min(td,maxDay);// 末日処理
        if(mOffset===0&&actualDay<=curDay)continue;// 同月は今日より後のみ
        d.setUTCFullYear(tryYear,tryMonthMod,actualDay);
        found=true;break;
      }
    }
    if(!found)return null;
  }
  const shift=d.getTime()-origMs;
  const result={...task,id:uid(),status:'active',completedAt:null,createdAt:now(),updatedAt:now(),dueAt:d.toISOString().slice(0,10)};
  if(task.startAt){
    const[sy,sm,sd2]=task.startAt.split('-').map(Number);
    const s=new Date(Date.UTC(sy,sm-1,sd2));
    s.setTime(s.getTime()+shift);
    result.startAt=s.toISOString().slice(0,10);
  }
  return result;
}

function showSaveStatus(state){
  const el=document.getElementById('save-status');
  const dot=document.getElementById('save-dot');
  const lbl=document.getElementById('save-label');
  if(!el)return;
  clearTimeout(_saveTimer);
  el.classList.add('show');
  dot.className='';
  if(state==='saving'){dot.classList.add('saving');lbl.textContent='保存中…'}
  else if(state==='saved'){dot.classList.add('saved');lbl.textContent='保存済み';_saveTimer=setTimeout(()=>el.classList.remove('show'),2000)}
  else if(state==='error'){dot.style.background='var(--p1)';lbl.textContent='保存失敗'}
}

// ===== STORE =====
async function loadAll(){
  [S.tasks,S.projects,S.tags,S.notes]=await Promise.all([
    dbAll('tasks'),dbAll('projects'),dbAll('tags'),dbAll('notes')
  ]);
  // ワークスペースは専用関数で取得（user_idフィルタではなくRLS任せ）
  await loadWorkspaces();
}

// ===== WORKSPACE =====
async function loadWorkspaces(){
  const SB=window._SB;
  if(!SB)return;
  try{
    const{data:wsList,error}=await SB.from('workspaces').select('*');
    if(error){console.error('loadWorkspaces select error',error);toast('WS取得エラー: '+(error.message||''));return;}
    S.workspaces=(wsList||[]).map(w=>({
      id:w.id,name:w.name,ownerId:w.owner_id,
      inviteToken:w.invite_token,
      owner_id:w.owner_id,invite_token:w.invite_token,
      createdAt:w.created_at,updatedAt:w.updated_at
    }));
    if(S.workspaces.length){
      const wsIds=S.workspaces.map(w=>w.id);
      const{data:members,error:e2}=await SB.from('workspace_members').select('*').in('workspace_id',wsIds);
      if(e2){console.error('loadWorkspaces members error',e2);return;}
      S.wsMembers={};
      (members||[]).forEach(m=>{
        if(!S.wsMembers[m.workspace_id])S.wsMembers[m.workspace_id]=[];
        S.wsMembers[m.workspace_id].push({
          id:m.id,workspaceId:m.workspace_id,workspace_id:m.workspace_id,
          userId:m.user_id,user_id:m.user_id,
          user_name:m.user_name,user_avatar:m.user_avatar,
          user_email:m.user_email,role:m.role,joinedAt:m.joined_at
        });
      });
    }
    console.log('loadWorkspaces ok',S.workspaces.length,'件');
  }catch(e){console.error('loadWorkspaces',e);}
}

async function createWorkspace(name){
  const SB=window._SB;const user=window._currentUser;
  if(!SB||!user){toast('ログインが必要です');return null;}
  const wsId=uid();
  const token=uid()+uid();
  const userId=String(user.id); // uuidをtextに変換
  const ws={id:wsId,name,owner_id:userId,invite_token:token,
    created_at:new Date().toISOString(),updated_at:new Date().toISOString()};
  const{error:e1}=await SB.from('workspaces').insert(ws);
  if(e1){console.error('createWorkspace error',e1);toast('作成に失敗: '+(e1.message||'不明なエラー'));return null;}
  const mem={id:uid(),workspace_id:wsId,user_id:userId,
    user_name:user.user_metadata?.full_name||user.email||'',
    user_avatar:user.user_metadata?.avatar_url||'',
    user_email:user.email||'',role:'owner',
    joined_at:new Date().toISOString()};
  const{error:e2}=await SB.from('workspace_members').insert(mem);
  if(e2){console.error('createWorkspace member error',e2);toast('メンバー追加に失敗: '+(e2.message||'不明なエラー'));return null;}
  await loadWorkspaces();
  render();
  return ws;
}

async function joinWorkspaceByToken(token){
  const SB=window._SB;const user=window._currentUser;
  if(!SB||!user)return false;
  // トークンからワークスペース検索
  const{data:ws}=await SB.from('workspaces').select('*').eq('invite_token',token).maybeSingle();
  if(!ws){toast('招待リンクが無効です');return false;}
  // 既にメンバーか確認
  const{data:existing}=await SB.from('workspace_members').select('id')
    .eq('workspace_id',ws.id).eq('user_id',user.id).maybeSingle();
  if(existing){toast('すでにメンバーです');await loadWorkspaces();render();return true;}
  const mem={id:uid(),workspace_id:ws.id,user_id:user.id,
    user_name:user.user_metadata?.full_name||user.email||'',
    user_avatar:user.user_metadata?.avatar_url||'',
    user_email:user.email||'',role:'member',
    joined_at:new Date().toISOString()};
  const{error}=await SB.from('workspace_members').insert(mem);
  if(error){toast('参加に失敗しました');return false;}
  await loadWorkspaces();
  render();
  toast('「'+ws.name+'」に参加しました！');
  return true;
}

async function setProjectWorkspace(projectId, workspaceId){
  const SB=window._SB;if(!SB)return;
  const{error}=await SB.from('projects').update({workspace_id:workspaceId}).eq('id',projectId);
  if(error){toast('更新に失敗しました');return;}
  const p=S.projects.find(x=>x.id===projectId);
  if(p)p.workspaceId=workspaceId;
  // 共有プロジェクト配下のタスクをリロード（他メンバーのタスクが見えるように）
  await loadAll();
  render();
}

function getInviteUrl(workspace){
  return location.origin+location.pathname+'#invite/'+workspace.invite_token;
}

// 招待トークンURLを起動時にチェック
function checkInviteToken(){
  const hash=location.hash;
  if(hash.startsWith('#invite/')){
    const token=hash.slice(8);
    history.replaceState(null,'',location.pathname);
    if(window._currentUser){
      joinWorkspaceByToken(token);
    }else{
      // OAuthリダイレクトでページがリロードされてもトークンを保持するためlocalStorageに保存
      localStorage.setItem('pendingInviteToken',token);
    }
  }
}

async function dupTask(task){
  const newId=uid();
  const d={...task,id:newId,title:task.title+' (コピー)',createdAt:now(),updatedAt:now(),completedAt:null,order:Date.now()};
  await saveTask(d);
  const children=S.tasks.filter(c=>c.parentTaskId===task.id).sort((a,b)=>(a.order||0)-(b.order||0));

function getTasks(){
  const t=today();
  let tasks=S.tasks.filter(x=>x.status!=='archived');
  if(S.view==='inbox')tasks=tasks.filter(x=>x.status==='inbox'||(S.showCompleted&&x.status==='completed'&&!x.projectId));
  else if(S.view==='today')tasks=tasks.filter(x=>(isToday(x.dueAt)||x.flagged)&&(S.showCompleted||x.status!=='completed'));
  else if(S.view==='upcoming')tasks=tasks.filter(x=>x.dueAt&&x.dueAt>t&&(S.showCompleted||x.status!=='completed'));
  else if(S.view==='flagged')tasks=tasks.filter(x=>x.flagged&&(S.showCompleted||x.status!=='completed'));
  else if(S.view==='completed')tasks=tasks.filter(x=>x.status==='completed');
  else if(S.view==='project')tasks=tasks.filter(x=>x.projectId===S.projId&&(S.showCompleted||x.status!=='completed'));
  else if(S.view==='tag')tasks=tasks.filter(x=>S.tagId==='__none__'?(!x.tagIds||x.tagIds.length===0)&&(S.showCompleted||x.status!=='completed'):x.tagIds&&x.tagIds.includes(S.tagId)&&(S.showCompleted||x.status!=='completed'));
  if(S.search){const q=S.search.toLowerCase();tasks=tasks.filter(x=>x.title.toLowerCase().includes(q)||(x.notes||'').toLowerCase().includes(q))}
  if(S.hideNotStarted){tasks=tasks.filter(x=>!isNotStartedTask(x))}
  if(S.filterTagIds&&S.filterTagIds.length&&S.view!=='tag')tasks=tasks.filter(x=>S.filterTagIds.every(id=>x.tagIds&&x.tagIds.includes(id)));
  if(S.sort==='updated') return tasks.sort((a,b)=>(b.updatedAt||'').localeCompare(a.updatedAt||''));
  if(S.sort==='startAt') return tasks.sort((a,b)=>{if(!a.startAt&&!b.startAt)return 0;if(!a.startAt)return 1;if(!b.startAt)return -1;return a.startAt.localeCompare(b.startAt);});
  if(S.sort==='priority') return tasks.sort((a,b)=>(a.priority||4)-(b.priority||4));
  if(S.sort==='dueAt') return tasks.sort((a,b)=>{if(!a.dueAt&&!b.dueAt)return 0;if(!a.dueAt)return 1;if(!b.dueAt)return-1;return a.dueAt.localeCompare(b.dueAt);});
  return tasks.sort((a,b)=>(a.order||0)-(b.order||0));
}
function counts(){
  const t=today();
  return{
    inbox:S.tasks.filter(x=>x.status==='inbox'&&!x.parentTaskId).length,
    today:S.tasks.filter(x=>x.status!=='completed'&&x.status!=='archived'&&(isToday(x.dueAt)||x.flagged)&&(!S.hideNotStarted||!isNotStartedTask(x))).length,
    flagged:S.tasks.filter(x=>x.status!=='completed'&&x.flagged).length,
  };
}

function toast(msg,undoFn){
  const c=document.getElementById('toasts');
  const el=document.createElement('div');
  el.className='toast';

  if(undoFn){const b=document.createElement('button');b.className='toast-undo';b.textContent='Undo';b.onclick=()=>{undoFn();el.remove()};el.appendChild(b)}
  c.appendChild(el);
  setTimeout(()=>el.remove(),3150);
}

// ===== SE SOUNDS =====
(function(){
  let _sCtx=null;
  function _ctx(){
    if(!_sCtx)_sCtx=new(window.AudioContext||window.webkitAudioContext)();
    return _sCtx;
  }
  function _gain(ctx,val,t){const g=ctx.createGain();g.gain.setValueAtTime(val,t);return g}

  window.playSE=function(type){
    if(!getSetting('soundFx',true))return;
    try{
      const ctx=_ctx();const t=ctx.currentTime;
      if(type==='add'){
        // 軽いポップ音 ↑
        const o=ctx.createOscillator();o.type='sine';
        o.frequency.setValueAtTime(520,t);o.frequency.exponentialRampToValueAtTime(780,t+0.06);
        const g=_gain(ctx,0,t);g.gain.linearRampToValueAtTime(0.18,t+0.01);g.gain.exponentialRampToValueAtTime(0.001,t+0.1);
        o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+0.12);
      } else if(type==='complete'){
        // スーパーマリオ コイン音: 短い高音 → 少し低めの余韻
        [[0,1319,0.045,'square'],[0.045,1760,0.18,'square']].forEach(([dt,freq,dur,wt])=>{
          const o=ctx.createOscillator();o.type=wt;o.frequency.value=freq;
          const g=ctx.createGain();
          g.gain.setValueAtTime(0,t+dt);
          g.gain.linearRampToValueAtTime(0.13,t+dt+0.004);
          g.gain.exponentialRampToValueAtTime(0.001,t+dt+dur);
          o.connect(g);g.connect(ctx.destination);o.start(t+dt);o.stop(t+dt+dur+0.01);
        });
      } else if(type==='delete'){
        // 下降する短音
        const o=ctx.createOscillator();o.type='sine';
        o.frequency.setValueAtTime(340,t);o.frequency.exponentialRampToValueAtTime(200,t+0.12);
        const g=_gain(ctx,0.12,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.14);
        o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+0.16);
      } else if(type==='toggle'){
        // 小さいクリック
        const sz=Math.floor(ctx.sampleRate*0.012);
        const buf=ctx.createBuffer(1,sz,ctx.sampleRate);
        const d=buf.getChannelData(0);
        for(let i=0;i<sz;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/(ctx.sampleRate*0.003));
        const src=ctx.createBufferSource();src.buffer=buf;
        const bp=ctx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=2200;bp.Q.value=2;
        const g=_gain(ctx,0.35,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.015);
        src.connect(bp);bp.connect(g);g.connect(ctx.destination);src.start(t);src.stop(t+0.02);
      } else if(type==='open'){
        // ドロワー開く – 短い上昇
        const o=ctx.createOscillator();o.type='sine';
        o.frequency.setValueAtTime(400,t);o.frequency.linearRampToValueAtTime(480,t+0.05);
        const g=_gain(ctx,0.08,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.08);
        o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+0.09);
      } else if(type==='error'){
        // エラー通知音
        const o=ctx.createOscillator();o.type='square';o.frequency.value=220;
        const g=_gain(ctx,0,t);g.gain.linearRampToValueAtTime(0.08,t+0.005);g.gain.exponentialRampToValueAtTime(0.001,t+0.18);
        o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+0.2);
      }
    }catch(e){}
  };
})();

// ===== TAG ORDER (localStorage) =====
function getTagOrder(){try{return JSON.parse(localStorage.getItem('tag_order')||'null')}catch(e){return null}}
async function saveTagOrder(tags){
  localStorage.setItem('tag_order',JSON.stringify(tags.map(t=>t.id)));
  tags.forEach((t,i)=>{
    const tag=S.tags.find(x=>x.id===t.id);
    if(tag){tag.order=i;dbPut('tags',tag).catch(e=>console.error('saveTagOrder',e));}
  });
}
function getSortedTags(){
  const order=getTagOrder();
  if(!order)return[...S.tags].sort((a,b)=>(a.order||0)-(b.order||0));
  return[...S.tags].sort((a,b)=>{
    const ai=order.indexOf(a.id),bi=order.indexOf(b.id);
    if(ai===-1&&bi===-1)return(a.order||0)-(b.order||0);if(ai===-1)return 1;if(bi===-1)return -1;return ai-bi;
  });
}
function startTagRename(span){
  const t=S.tags.find(x=>x.id===span.dataset.tagId);
  if(!t||span.querySelector('input'))return;
  const input=document.createElement('input');
  input.value=t.name;
  input.style.cssText='flex:1;min-width:0;width:100%;font:inherit;font-size:inherit;background:var(--bg2);border:1px solid var(--accent);border-radius:4px;padding:0 5px;color:var(--text);outline:none;';
  span.innerHTML='';span.appendChild(input);input.focus();input.select();
  let committed=false;
  async function commit(){
    if(committed)return;committed=true;
    const newName=input.value.trim();
    if(newName&&newName!==t.name){t.name=newName;await saveTag(t);}
    render();
  }
  input.addEventListener('blur',commit);
  input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();input.blur();}if(e.key==='Escape'){committed=true;render();}});
  input.addEventListener('click',e=>e.stopPropagation());
  input.addEventListener('touchstart',e=>e.stopPropagation(),{passive:true});
}

function attachTagDragListeners(){
  const nav=document.getElementById('sidenav');if(!nav)return;
  const items=[...nav.querySelectorAll('.tag-item[data-id]')];
  const dropLines=[...nav.querySelectorAll('.tag-drop-line')];
  function clearLines(){dropLines.forEach(l=>l.classList.remove('active'));}
  function showDropLine(beforeId){
    clearLines();
    const sel=beforeId==='last'?nav.querySelector('.tag-drop-line[data-tdrop-after="last"]'):nav.querySelector('.tag-drop-line[data-tdrop-before="'+beforeId+'"]');
    if(sel)sel.classList.add('active');
  }
  function doReorder(srcId,dstId,insertBefore){
    const tags=getSortedTags();
    const si=tags.findIndex(t=>t.id===srcId);if(si<0)return;
    const[moved]=tags.splice(si,1);
    if(dstId==='last'){tags.push(moved);}
    else{const di=tags.findIndex(t=>t.id===dstId);if(di<0)tags.push(moved);else tags.splice(insertBefore?di:di+1,0,moved);}
    saveTagOrder(tags);renderSidebar();attachProjRenameListeners();attachProjDragListeners();attachTagDragListeners();
  }
  let dragSrc=null;
  items.forEach(item=>{
    const handle=item.querySelector('.tag-drag-handle');
    if(handle)handle.addEventListener('mousedown',()=>item.setAttribute('draggable','true'),{passive:true});
    item.addEventListener('dragstart',e=>{dragSrc=item;e.dataTransfer.effectAllowed='move';setTimeout(()=>{item.style.opacity='0.45';},0);});
    item.addEventListener('dragend',()=>{item.style.opacity='';item.setAttribute('draggable','false');clearLines();dragSrc=null;});
    item.addEventListener('dragover',e=>{
      e.preventDefault();e.dataTransfer.dropEffect='move';if(dragSrc===item)return;
      const r=item.getBoundingClientRect();const mid=r.top+r.height/2;
      if(e.clientY<mid){showDropLine(item.dataset.id);}
      else{const ni=items[items.indexOf(item)+1];showDropLine(ni?ni.dataset.id:'last');}
    });
    item.addEventListener('drop',e=>{
      e.preventDefault();e.stopPropagation();if(!dragSrc||dragSrc===item)return;
      const r=item.getBoundingClientRect();const ib=e.clientY<r.top+r.height/2;
      const dstId=ib?item.dataset.id:(items[items.indexOf(item)+1]?.dataset.id||'last');
      doReorder(dragSrc.dataset.id,dstId,true);dragSrc=null;
    });
  });
  dropLines.forEach(line=>{
    line.addEventListener('dragover',e=>{e.preventDefault();e.dataTransfer.dropEffect='move';line.classList.add('active');});
    line.addEventListener('dragleave',()=>line.classList.remove('active'));
    line.addEventListener('drop',e=>{
      e.preventDefault();e.stopPropagation();if(!dragSrc)return;
      const bid=line.dataset.tdropBefore||'last';doReorder(dragSrc.dataset.id,bid,true);dragSrc=null;
    });
  });
  items.forEach(item=>{
    const handle=item.querySelector('.tag-drag-handle');if(!handle)return;
    handle.addEventListener('touchstart',e=>{
      e.stopPropagation();const srcId=item.dataset.id;let dropTargetId=null;
      item.style.opacity='0.6';
      const sb=document.querySelector('.sidebar-body');if(sb)sb.style.overflowY='hidden';
      const onMove=ev=>{
        ev.preventDefault();const touch=ev.touches[0];clearLines();
        const el=document.elementFromPoint(touch.clientX,touch.clientY);
        const hov=el?.closest('.tag-item[data-id]');
        if(hov&&hov!==item){
          const r=hov.getBoundingClientRect();const ib=touch.clientY<r.top+r.height/2;
          dropTargetId=ib?hov.dataset.id:(items[items.indexOf(hov)+1]?.dataset.id||'last');
          showDropLine(dropTargetId);
        }else dropTargetId=null;
      };
      const onEnd=()=>{
        item.style.opacity='';clearLines();if(sb)sb.style.overflowY='';
        document.removeEventListener('touchmove',onMove);document.removeEventListener('touchend',onEnd);
        if(dropTargetId)doReorder(srcId,dropTargetId,true);
      };
      document.addEventListener('touchmove',onMove,{passive:false});
      document.addEventListener('touchend',onEnd,{passive:true});
    },{passive:true});
  });
}

// ===== PROJECT ORDER (localStorage + Supabase) =====
function getProjectOrder(){try{return JSON.parse(localStorage.getItem('proj_order')||'null')}catch(e){return null}}
async function saveProjectOrder(projs){
  localStorage.setItem('proj_order',JSON.stringify(projs.map(p=>p.id)));
  projs.forEach((p,i)=>{
    const proj=S.projects.find(x=>x.id===p.id);
    if(proj){proj.order=i;dbPut('projects',proj).catch(e=>console.error('saveProjectOrder',e));}
  });
}
function getSortedProjects(status){
  const projs=S.projects.filter(p=>status?p.status===status:true);
  const order=getProjectOrder();
  if(!order)return[...projs].sort((a,b)=>(a.order||0)-(b.order||0));
  return[...projs].sort((a,b)=>{
    const ai=order.indexOf(a.id),bi=order.indexOf(b.id);
    if(ai===-1&&bi===-1)return(a.order||0)-(b.order||0);
    if(ai===-1)return 1;
    if(bi===-1)return -1;
    return ai-bi;
  });
}

// NOTE一覧スワイプ削除
function initNoteSwipe(container){
  container.querySelectorAll('.note-swipe-wrap').forEach(wrap=>{
    const inner=wrap.querySelector('.note-swipe-inner');
    const noteId=wrap.dataset.noteSwipeId;
    if(!inner||!noteId)return;
    const THRESH=72;// 削除実行の閾値px
    let sx=0,sy=0,dx=0,active=false,opened=false;

    inner.addEventListener('touchstart',e=>{
      if(e.touches.length>1)return;
      sx=e.touches[0].clientX;sy=e.touches[0].clientY;
      dx=0;active=true;
      inner.classList.add('swiping');
    },{passive:true});

    inner.addEventListener('touchmove',e=>{
      if(!active)return;
      dx=e.touches[0].clientX-sx;
      const dy=Math.abs(e.touches[0].clientY-sy);
      if(dy>Math.abs(dx)*1.5){active=false;inner.classList.remove('swiping');inner.style.transform='';return;}
      if(dx>0&&!opened){inner.style.transform='';return;}// 右スワイプは閉じるのみ
      const tx=Math.max(-THRESH-20,Math.min(0,dx+(opened?-THRESH:0)));
      inner.style.transform='translateX('+tx+'px)';
    },{passive:true});

    inner.addEventListener('touchend',async e=>{
      if(!active){active=false;return;}
      inner.classList.remove('swiping');
      active=false;
      const finalDx=dx+(opened?-THRESH:0);
      if(dx>10&&opened){
        // 右スワイプ → 閉じる
        opened=false;
        inner.style.transition='transform .2s cubic-bezier(.25,.1,.25,1)';
        inner.style.transform='';
        const bgEl2=wrap.querySelector('.note-swipe-del-bg');
        if(bgEl2){bgEl2.style.clipPath='inset(0 0 0 100%)';bgEl2.style.pointerEvents='none';}
      } else if(finalDx<-THRESH){
        // 閾値超え → 削除ボタン表示
        inner.style.transition='transform .2s cubic-bezier(.25,.1,.25,1)';
        inner.style.transform='translateX(-'+THRESH+'px)';
        const bgEl=wrap.querySelector('.note-swipe-del-bg');
        if(bgEl){bgEl.style.clipPath='inset(0 0 0 0)';bgEl.style.pointerEvents='auto';bgEl.style.cursor='pointer';}
        opened=true;
        if(bgEl&&!bgEl._bound){
          bgEl._bound=true;
          bgEl.addEventListener('click',()=>{
            openConfirmModal('メモを削除','"'+(S.notes.find(n=>n.id===noteId)?.title||'無題')+'" を削除しますか？',async()=>{
              await delNote(noteId);playSE('delete');
              if(S.noteId===noteId){S.noteOpen=false;S.noteId=null;}
              // アニメーションで消える
              wrap.style.transition='height .2s,opacity .2s';
              wrap.style.overflow='hidden';
              wrap.style.height=wrap.offsetHeight+'px';
              requestAnimationFrame(()=>{wrap.style.height='0';wrap.style.opacity='0';});
              setTimeout(()=>renderContent(),250);
            },'削除',true);
          });
        }
      } else {
        // 閾値未満 → 戻す
        inner.style.transition='transform .2s cubic-bezier(.25,.1,.25,1)';
        inner.style.transform=opened?'translateX(-'+THRESH+'px)':'';
      }
    },{passive:true});

    // 他のrowをスワイプしたら閉じる
    container.addEventListener('touchstart',e=>{
      if(opened&&!wrap.contains(e.target)){
        opened=false;
        inner.style.transition='transform .2s cubic-bezier(.25,.1,.25,1)';
        inner.style.transform='';
        const bgEl3=wrap.querySelector('.note-swipe-del-bg');
        if(bgEl3){bgEl3.style.clipPath='inset(0 0 0 100%)';bgEl3.style.pointerEvents='none';}
      }
    },{passive:true});
  });
}

      } else {

// ===== PROJ DRAG & DROP =====
let _projDragEndedAt=0; // スマホドラッグ後にサイドバーが閉じるのを防ぐ

function _clearDropLines(nav){
  nav.querySelectorAll('.proj-drop-line').forEach(l=>{l.classList.remove('active');});
}

function attachProjDragListeners(){
  const nav=document.getElementById('sidenav');
  if(!nav)return;

  // ===== Active projects =====
  function doReorder(srcId,dstId,insertBefore){
    const projs=getSortedProjects('active');
    const si=projs.findIndex(p=>p.id===srcId);
    if(si<0)return;
    const[moved]=projs.splice(si,1);
    if(dstId==='last'){projs.push(moved);}
    else{
      const di=projs.findIndex(p=>p.id===dstId);
      if(di<0){projs.push(moved);}
      else{projs.splice(insertBefore?di:di+1,0,moved);}
    }
    saveProjectOrder(projs);
    renderSidebar();attachProjRenameListeners();attachProjDragListeners();attachTagDragListeners();
  }

  const items=[...nav.querySelectorAll('.proj-section-inner .proj-item[data-id]:not(.hidden-proj-item)')];
  const dropLines=[...nav.querySelectorAll('.proj-section-inner .proj-drop-line:not(.hidden-drop-line)')];

  function showDropLine(beforeId){
    _clearDropLines(nav);
    const sel=beforeId==='last'
      ?nav.querySelector('.proj-section-inner .proj-drop-line[data-drop-after="last"]')
      :nav.querySelector('.proj-section-inner .proj-drop-line[data-drop-before="'+beforeId+'"]');
    if(sel)sel.classList.add('active');
  }

  // PC: HTML5 drag
  let dragSrc=null;
  items.forEach(item=>{
    const handle=item.querySelector('.proj-drag-handle:not(.hidden-drag-handle)');
    if(handle){handle.addEventListener('mousedown',()=>{item.setAttribute('draggable','true');},{passive:true});}
    item.addEventListener('dragstart',e=>{
      dragSrc=item;e.dataTransfer.effectAllowed='move';
      setTimeout(()=>{item.style.opacity='0.45';},0);
    });
    item.addEventListener('dragend',()=>{
      item.style.opacity='';item.setAttribute('draggable','false');
      _clearDropLines(nav);dragSrc=null;
    });
    item.addEventListener('dragover',e=>{
      e.preventDefault();e.dataTransfer.dropEffect='move';
      if(dragSrc===item)return;
      const r=item.getBoundingClientRect();
      const mid=r.top+r.height/2;
      if(e.clientY<mid){showDropLine(item.dataset.id);}
      else{
        const nextItem=items[items.indexOf(item)+1];
        showDropLine(nextItem?nextItem.dataset.id:'last');
      }
    });
    item.addEventListener('dragleave',e=>{
      if(!item.contains(e.relatedTarget)){}
    });
    item.addEventListener('drop',e=>{
      e.preventDefault();e.stopPropagation();
      if(!dragSrc||dragSrc===item)return;
      const r=item.getBoundingClientRect();
      const insertBefore=e.clientY<r.top+r.height/2;
      const dstId=insertBefore?item.dataset.id:(items[items.indexOf(item)+1]?.dataset.id||'last');
      doReorder(dragSrc.dataset.id,dstId,true);
      dragSrc=null;
    });
  });
  // drop on lines
  dropLines.forEach(line=>{
    line.addEventListener('dragover',e=>{e.preventDefault();e.dataTransfer.dropEffect='move';line.classList.add('active');});
    line.addEventListener('dragleave',()=>{line.classList.remove('active');});
    line.addEventListener('drop',e=>{
      e.preventDefault();e.stopPropagation();
      if(!dragSrc)return;
      const beforeId=line.dataset.dropBefore||'last';
      doReorder(dragSrc.dataset.id,beforeId,true);
      dragSrc=null;
    });
  });

  // Mobile: touch drag from handle
  items.forEach(item=>{
    const handle=item.querySelector('.proj-drag-handle:not(.hidden-drag-handle)');
    if(!handle)return;
    handle.addEventListener('touchstart',e=>{
      e.stopPropagation();
      const srcId=item.dataset.id;
      let dropTargetId=null;
      let dropBefore=true;
      item.style.opacity='0.6';
      const sidebarBody=document.querySelector('.sidebar-body');
      if(sidebarBody)sidebarBody.style.overflowY='hidden';
      const onMove=ev=>{
        ev.preventDefault();
        const touch=ev.touches[0];
        _clearDropLines(nav);
        const el=document.elementFromPoint(touch.clientX,touch.clientY);
        const hovered=el?.closest('.proj-section-inner .proj-item[data-id]:not(.hidden-proj-item)');
        if(hovered&&hovered!==item){
          const r=hovered.getBoundingClientRect();
          const isBefore=touch.clientY<r.top+r.height/2;
          dropTargetId=isBefore?hovered.dataset.id:(items[items.indexOf(hovered)+1]?.dataset.id||'last');
          dropBefore=true;
          showDropLine(dropTargetId);
        } else {
          dropTargetId=null;
        }
      };
      const onEnd=()=>{
        item.style.opacity='';
        _clearDropLines(nav);
        if(sidebarBody)sidebarBody.style.overflowY='';
        document.removeEventListener('touchmove',onMove);
        document.removeEventListener('touchend',onEnd);
        if(dropTargetId){
          _projDragEndedAt=Date.now();
          doReorder(srcId,dropTargetId,dropBefore);
        }
      };
      document.addEventListener('touchmove',onMove,{passive:false});
      document.addEventListener('touchend',onEnd,{passive:true});
    },{passive:true});
  });

  // ===== Hidden projects drag =====
  function doHiddenReorder(srcId,dstId){
    const projs=S.projects.filter(p=>p.status==='hidden').sort((a,b)=>(a.hiddenOrder||0)-(b.hiddenOrder||0));
    const si=projs.findIndex(p=>p.id===srcId);
    if(si<0)return;
    const[moved]=projs.splice(si,1);
    if(dstId==='last'){projs.push(moved);}
    else{const di=projs.findIndex(p=>p.id===dstId);if(di<0)projs.push(moved);else projs.splice(di,0,moved);}
    projs.forEach((p,i)=>{p.hiddenOrder=i;});
    Promise.all(projs.map(p=>saveProject(p))).then(()=>{renderSidebar();attachProjRenameListeners();attachProjDragListeners();attachTagDragListeners();});
  }

  const hItems=[...nav.querySelectorAll('.hidden-proj-item[data-id]')];
  const hDropLines=[...nav.querySelectorAll('.hidden-drop-line')];

  function showHDropLine(beforeId){
    hDropLines.forEach(l=>l.classList.remove('active'));
    const sel=beforeId==='last'
      ?nav.querySelector('.hidden-drop-line[data-hdrop-after="last"]')
      :nav.querySelector('.hidden-drop-line[data-hdrop-before="'+beforeId+'"]');
    if(sel)sel.classList.add('active');
  }

  let hDragSrc=null;
  hItems.forEach(item=>{
    const handle=item.querySelector('.hidden-drag-handle');
    if(handle){handle.addEventListener('mousedown',()=>{item.setAttribute('draggable','true');},{passive:true});}
    item.addEventListener('dragstart',e=>{hDragSrc=item;e.dataTransfer.effectAllowed='move';setTimeout(()=>{item.style.opacity='0.45';},0);});
    item.addEventListener('dragend',()=>{item.style.opacity='';item.setAttribute('draggable','false');hDropLines.forEach(l=>l.classList.remove('active'));hDragSrc=null;});
    item.addEventListener('dragover',e=>{
      e.preventDefault();e.dataTransfer.dropEffect='move';
      if(hDragSrc===item)return;
      const r=item.getBoundingClientRect();
      const dstId=e.clientY<r.top+r.height/2?item.dataset.id:(hItems[hItems.indexOf(item)+1]?.dataset.id||'last');
      showHDropLine(dstId);
    });
    item.addEventListener('drop',e=>{
      e.preventDefault();e.stopPropagation();
      if(!hDragSrc||hDragSrc===item)return;
      const r=item.getBoundingClientRect();
      const dstId=e.clientY<r.top+r.height/2?item.dataset.id:(hItems[hItems.indexOf(item)+1]?.dataset.id||'last');
      doHiddenReorder(hDragSrc.dataset.id,dstId);hDragSrc=null;
    });
  });
  hDropLines.forEach(line=>{
    line.addEventListener('dragover',e=>{e.preventDefault();line.classList.add('active');});
    line.addEventListener('dragleave',()=>{line.classList.remove('active');});
    line.addEventListener('drop',e=>{
      e.preventDefault();e.stopPropagation();
      if(!hDragSrc)return;
      doHiddenReorder(hDragSrc.dataset.id,line.dataset.hdropBefore||'last');hDragSrc=null;
    });
  });
  hItems.forEach(item=>{
    const handle=item.querySelector('.hidden-drag-handle');
    if(!handle)return;
    handle.addEventListener('touchstart',e=>{
      e.stopPropagation();
      const srcId=item.dataset.id;
      let dropTargetId=null;
      item.style.opacity='0.6';
      const sidebarBody=document.querySelector('.sidebar-body');
      if(sidebarBody)sidebarBody.style.overflowY='hidden';
      const onMove=ev=>{
        ev.preventDefault();
        const touch=ev.touches[0];
        hDropLines.forEach(l=>l.classList.remove('active'));
        const el=document.elementFromPoint(touch.clientX,touch.clientY);
        const hovered=el?.closest('.hidden-proj-item[data-id]');
        if(hovered&&hovered!==item){
          const r=hovered.getBoundingClientRect();
          dropTargetId=touch.clientY<r.top+r.height/2?hovered.dataset.id:(hItems[hItems.indexOf(hovered)+1]?.dataset.id||'last');
          showHDropLine(dropTargetId);
        } else {dropTargetId=null;}
      };
      const onEnd=()=>{
        item.style.opacity='';hDropLines.forEach(l=>l.classList.remove('active'));
        if(sidebarBody)sidebarBody.style.overflowY='';
        document.removeEventListener('touchmove',onMove);document.removeEventListener('touchend',onEnd);
        if(dropTargetId){_projDragEndedAt=Date.now();doHiddenReorder(srcId,dropTargetId);}
      };
      document.addEventListener('touchmove',onMove,{passive:false});
      document.addEventListener('touchend',onEnd,{passive:true});
    },{passive:true});
  });
}

function getNavOrder(){
  try{
    const saved=JSON.parse(localStorage.getItem('bnav_order')||'null');
    if(Array.isArray(saved)&&saved.length)return saved;
  }catch(e){}
  return['inbox','today','forecast','_sidebar','search','ai','_edit'];
}
async function loadNavOrder(){
  try{
    if(!window.sbGetSetting)return;
    const val=await window.sbGetSetting('bnav_order');
    if(val){
      const parsed=JSON.parse(val);
      if(Array.isArray(parsed)&&parsed.length){
        // 既存の保存順に 'gantt' がなければ forecast の直後に挿入
        if(!parsed.includes('gantt')){
          const fi=parsed.indexOf('forecast');
          fi>=0?parsed.splice(fi+1,0,'gantt'):parsed.unshift('gantt');
          window.sbSetSetting('bnav_order',JSON.stringify(parsed));
        }
        localStorage.setItem('bnav_order',JSON.stringify(parsed));
        renderBotNav();renderSidebar();
      }
    }
  }catch(e){console.error('loadNavOrder',e);}
}

function getNavSequence(){
  const SYS_VIEWS=['inbox','today','upcoming','forecast','flagged','review','nextview','search','notes'];
  const bnavOrder=getNavOrder().filter(v=>SYS_VIEWS.includes(v));
  const orderedSys=[...bnavOrder,...SYS_VIEWS.filter(v=>!bnavOrder.includes(v))];
  const views=orderedSys.map(v=>({type:'view',v}));
  const projs=getSortedProjects('active').map(p=>({type:'proj',id:p.id,name:p.name}));
  const noneTag={type:'tag',id:'__none__',name:'タグなし'};
  const tags=getSortedTags().map(t=>({type:'tag',id:t.id,name:t.name}));
  return [...views,...projs,noneTag,...tags];
}
function getCurrentNavIdx(seq){
  if(S.view==='project')return seq.findIndex(x=>x.type==='proj'&&x.id===S.projId);
  if(S.view==='tag')return seq.findIndex(x=>x.type==='tag'&&x.id===S.tagId);
  return seq.findIndex(x=>x.type==='view'&&x.v===S.view);
}

function renderBotNav(){
  const order=getNavOrder();
  const aiEnabled=getSetting('aiChat',true);
  const items=order.map(v=>ALL_NAV_ITEMS.find(x=>x.v===v)).filter(Boolean).filter(i=>i.special!=='ai'||aiEnabled).filter(i=>i.special!=='edit').filter(i=>i.v!=='gantt');
  const isMobile=window.innerWidth<=768;
  const inner=items.map(i=>{
    const isAI=i.special==='ai';
    const isEdit=i.special==='edit';
    const isSidebar=i.special==='sidebar';
    const on=(!isAI&&!isEdit&&!isSidebar&&S.view===i.v)||(isSidebar&&S.sidebarOpen);
    return'<div class="bnav'+(on?' on':'')+(isAI?' bnav-ai':'')+'" data-a="'+(isAI?'ai-open':isEdit?'nav-edit':isSidebar?'menu':'view')+'"'+((!isAI&&!isEdit&&!isSidebar)?(' data-v="'+i.v+'"'):'')+'>'+i.icon()+'<span>'+i.label+'</span></div>';

  document.getElementById('botnav').innerHTML=isMobile
    ?'<button class="bnav-step bnav-prev" data-a="nav-prev" aria-label="前へ">‹</button>'+'<div class="bot-nav-inner">'+inner+'</div>'+'<button class="bnav-step bnav-next" data-a="nav-next" aria-label="次へ">›</button>'

    el.innerHTML=avail.length?'<div style="margin-top:12px;border-top:1px solid var(--border);padding-top:10px"><div class="flabel">追加</div>'+avail.map(x=>'<button class="act-btn" data-add="'+x.v+'" style="margin:3px">+ '+x.label+'</button>').join('')+'</div>':'';
  }
  const list=document.getElementById('nav-edit-list');
  getNavOrder().forEach(v=>{const el=buildItemEl(v);if(el)list.appendChild(el)});
  refreshAvail();
  list.addEventListener('click',e=>{
    const item=e.target.closest('.nav-edit-item');if(!item)return;
    if(e.target.dataset.up){const prev=item.previousElementSibling;if(prev)list.insertBefore(item,prev);}
    else if(e.target.dataset.dn){const next=item.nextElementSibling;if(next)list.insertBefore(next,item);}
    else if(e.target.dataset.rm){item.remove();refreshAvail();}
  });
  document.getElementById('nav-edit-avail').addEventListener('click',e=>{
    if(e.target.dataset.add){
      const el=buildItemEl(e.target.dataset.add);if(!el)return;
      const editEl=list.querySelector('[data-v="_edit"]');
      list.insertBefore(el,editEl||null);
      refreshAvail();
    }
  });
  document.getElementById('ne-cancel').onclick=()=>ov.remove();
  document.getElementById('ne-ok').onclick=()=>{
    const newOrder=[...list.querySelectorAll('.nav-edit-item')].map(x=>x.dataset.v);
    if(!newOrder.includes('_edit'))newOrder.push('_edit');
    localStorage.setItem('bnav_order',JSON.stringify(newOrder));
    if(window.sbSetSetting)window.sbSetSetting('bnav_order',JSON.stringify(newOrder));
    ov.remove();renderBotNav();renderSidebar();
  };
}

// ===== GANTT VIEW =====
function buildGanttDividers(scale,minD,maxD,d2px,totalH){
  let html='';
  const vline=(x,w,op)=>`<div style="position:absolute;left:${Math.round(x)}px;top:0;width:${w}px;height:${totalH}px;background:var(--border);opacity:${op};z-index:0;pointer-events:none"></div>`;
  if(scale==='day'){
    // 月境界：太め、週境界（月曜）：細め
    const cur=new Date(minD);
    while(cur<=maxD){
      if(cur.getDate()===1) html+=vline(d2px(cur),2,1);
      else if(cur.getDay()===1) html+=vline(d2px(cur),1,.5);
      cur.setDate(cur.getDate()+1);
    }
  } else if(scale==='week'){
    // 月境界
    let cy=minD.getFullYear(),cm=minD.getMonth();
    for(;;){const d=new Date(cy,cm,1);if(d>maxD)break;html+=vline(d2px(d),2,1);cm++;if(cm>11){cm=0;cy++;}}
  } else if(scale==='month'){
    // 四半期境界：1/4/7/10月
    const qm=[0,3,6,9];
    for(let y=minD.getFullYear();y<=maxD.getFullYear()+1;y++){
      qm.forEach(m=>{const d=new Date(y,m,1);if(d>minD&&d<=maxD)html+=vline(d2px(d),2,1);});
    }
  } else {
    // 年境界
    for(let y=minD.getFullYear()+1;y<=maxD.getFullYear();y++) html+=vline(d2px(new Date(y,0,1)),2,1);
  }
  return html;
}
function renderGantt(){
  const isMobile=window.innerWidth<=768;
  if(isMobile){
    return '<div style="padding:32px 20px;text-align:center;color:var(--text2)">'
      +'<div style="font-size:36px;margin-bottom:12px">🖥</div>'
      +'<div style="font-size:15px;font-weight:600;margin-bottom:6px">PCブラウザでの閲覧を推奨します</div>'
      +'<div style="font-size:13px;color:var(--text3)">ガントチャートはPC向けに最適化されています。</div>'
      +'</div>';
  }
  const scale=S.ganttScale||'week';
  const PX_MAP={day:36,week:11.43,month:3.2,year:0.7};
  const pxPerDay=PX_MAP[scale];
  const NAMES_W=250;
  const ROW_H=40;
  const PROJ_H=36;

  // フィルタ適用（繰り返し除外 + 現在/完了/タグ）
  const todayD=new Date();todayD.setHours(0,0,0,0);
  let allT=S.tasks.filter(t=>!t.repeatRule);
  if(!S.showCompleted)allT=allT.filter(t=>t.status!=='completed');
  if(S.hideNotStarted)allT=allT.filter(t=>!t.startAt||new Date(t.startAt)<=todayD);
  if(S.filterTagIds&&S.filterTagIds.length)allT=allT.filter(t=>S.filterTagIds.every(id=>t.tagIds&&t.tagIds.includes(id)));
  const childMap={};
  allT.forEach(t=>{if(t.parentTaskId)(childMap[t.parentTaskId]||(childMap[t.parentTaskId]=[])).push(t);});
  // サブタスクを持たないタスクも含め、プロジェクト所属の親タスク（トップレベル）をすべて表示
  if(S.ganttProjFilter)allT=allT.filter(t=>t.projectId===S.ganttProjFilter);
  const parentsAll=allT.filter(t=>!t.parentTaskId&&t.projectId);

  if(!parentsAll.length){
    return '<div style="padding:48px 24px;text-align:center;color:var(--text3);font-size:14px">'
      +'表示できるタスクがありません。<br>'
      +'<span style="font-size:12px">タスクを追加するとガントに表示されます。</span>'
      +'</div>';
  }

  // プロジェクト別にグループ化
  const projGroups={};
  const projOrder=[];
  parentsAll.forEach(p=>{
    const pid=p.projectId||'__none__';
    if(!projGroups[pid]){
      projOrder.push(pid);
      const proj=S.projects.find(x=>x.id===pid)||{id:'__none__',name:'プロジェクトなし',color:'#9ca3af'};
      projGroups[pid]={proj,parents:[]};
    }
    projGroups[pid].parents.push(p);
  });

  const gc=S.ganttCollapsed||{};

  // フラットな行リスト構築
  const rows=[];
  projOrder.forEach(pid=>{
    const {proj,parents:ps}=projGroups[pid];
    const projKey='proj_'+pid;
    const projCol=!!gc[projKey];
    rows.push({type:'proj',proj,key:projKey,collapsed:projCol,h:PROJ_H,pid});
    if(!projCol){
      ps.forEach(p=>{
        const taskKey='task_'+p.id;
        const taskCol=!!gc[taskKey];
        const hasKids=!!(childMap[p.id]?.length);
        rows.push({type:'parent',task:p,key:taskKey,collapsed:taskCol,hasKids,done:p.status==='completed',h:ROW_H,pid});
        if(!taskCol){
          (childMap[p.id]||[]).sort((a,b)=>(a.order||0)-(b.order||0)).forEach(c=>{
            rows.push({type:'child',task:c,done:c.status==='completed',h:ROW_H,pid});
          });
        }
      });
    }
  });

  // 日付レンジ（折りたたまれていても全タスク対象）
  let minD=new Date(todayD),maxD=new Date(todayD);
  allT.forEach(t=>{
    if(t.plannedStartAt||t.startAt){const d=new Date(t.plannedStartAt||t.startAt);if(d<minD)minD=new Date(d);}
    if(t.dueAt){const d=new Date(t.dueAt);if(d>maxD)maxD=new Date(d);}
    if(t.completedAt){const d=new Date(t.completedAt.slice(0,10));if(d>maxD)maxD=new Date(d);}
  });
  const buf=scale==='day'?7:scale==='week'?21:scale==='month'?45:90;
  minD.setDate(minD.getDate()-buf);
  maxD.setDate(maxD.getDate()+buf);
  // ヘッダーセルと仕切り線の座標系を一致させるためスケール境界に揃える
  if(scale==='week') minD.setDate(minD.getDate()-((minD.getDay()+6)%7));
  else if(scale==='month') minD.setDate(1);
  else if(scale==='year'){minD.setDate(1);minD.setMonth(0);}
  S._ganttMinD=minD.toISOString().slice(0,10);
  const timelineW=Math.max(Math.ceil((maxD-minD)/86400000*pxPerDay),400);
  const d2px=d=>(new Date(d)-minD)/86400000*pxPerDay;
  const todayX=d2px(todayD);
  const totalH=rows.reduce((s,r)=>s+r.h,0);

  // ヘッダーセル
  const DAY=['日','月','火','水','木','金','土'];
  let headCells='';
  if(scale==='day'){
    const cur=new Date(minD);
    while(cur<=maxD){
      const dow=cur.getDay(),isWe=dow===0||dow===6;
      const isTod=cur.toISOString().slice(0,10)===todayD.toISOString().slice(0,10);
      headCells+=`<div class="gantt-date-cell${isWe?' gweekend':''}${isTod?' gtoday-cell':''}" style="width:${pxPerDay}px"><span style="font-size:11px">${cur.getDate()}</span><span style="font-size:9px">${DAY[dow]}</span></div>`;
      cur.setDate(cur.getDate()+1);
    }
  } else if(scale==='week'){
    const cw=Math.round(7*pxPerDay);
    const cur=new Date(minD);
    while(cur<=maxD){
      headCells+=`<div class="gantt-date-cell" style="width:${cw}px;font-size:11px">${cur.getMonth()+1}/${cur.getDate()}(${DAY[cur.getDay()]})</div>`;
      cur.setDate(cur.getDate()+7);
    }
  } else if(scale==='month'){
    let cy=minD.getFullYear(),cm=minD.getMonth();
    for(;;){if(new Date(cy,cm,1)>maxD)break;const days=new Date(cy,cm+1,0).getDate();headCells+=`<div class="gantt-date-cell" style="width:${Math.round(days*pxPerDay)}px;font-size:11px">${cy}/${cm+1}</div>`;cm++;if(cm>11){cm=0;cy++;}}
  } else {
    for(let y=minD.getFullYear();y<=maxD.getFullYear();y++){const days=((y%4===0&&y%100!==0)||y%400===0)?366:365;headCells+=`<div class="gantt-date-cell" style="width:${Math.round(days*pxPerDay)}px;font-size:12px;font-weight:600;color:var(--text2)">${y}</div>`;}
  }

  // 行レンダリング
  let nameRows='',barRows='';
  rows.forEach(r=>{
    if(r.type==='proj'){
      const proj=r.proj;
      const col=esc(proj.color||'#9ca3af');
      const chev=`<span class="gantt-chevron${r.collapsed?' gclosed':''}" style="margin:0 2px 0 4px">▼</span>`;
      const dot=`<span style="width:8px;height:8px;border-radius:50%;background:${col};flex-shrink:0;margin-right:6px"></span>`;
      nameRows+=`<div style="height:${r.h}px;display:flex;align-items:center;background:var(--bg2);border-bottom:1px solid var(--border);cursor:pointer;user-select:none;overflow:hidden" data-a="gantt-toggle" data-id="${r.key}">${chev}${dot}<span style="font-size:12px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;color:var(--text)">${esc(proj.name)}</span></div>`;
      // プロジェクトサマリーバー（全タスクのspan）
      const allProjTasks=[...projGroups[r.pid].parents,...projGroups[r.pid].parents.flatMap(p=>childMap[p.id]||[])];
      let pMin=null,pMax=null;
      allProjTasks.forEach(t=>{if(t.startAt){const d=new Date(t.startAt);if(!pMin||d<pMin)pMin=d;}if(t.dueAt){const d=new Date(t.dueAt);if(!pMax||d>pMax)pMax=d;}});
      let pBar='';
      if(pMin&&pMax){
        const bx=d2px(pMin),bw=Math.max(d2px(pMax)+pxPerDay-bx,6),bh=5,bt=(r.h-bh)/2;
        pBar=`<div style="position:absolute;left:${bx}px;width:${bw}px;height:${bh}px;top:${bt}px;background:${col};border-radius:3px;opacity:.5"></div>`;
      }
      barRows+=`<div style="position:relative;height:${r.h}px;border-bottom:1px solid var(--border);background:var(--bg2)">${pBar}</div>`;
    } else {
      const t=r.task,isP=r.type==='parent',done=r.done;
      const doneColor=done?'color:var(--text3);':'';
      let chev='';
      if(isP&&r.hasKids) chev=`<span class="gantt-chevron${r.collapsed?' gclosed':''}" style="margin-right:2px" data-a="gantt-toggle" data-id="${r.key}">▼</span>`;
      else if(isP) chev='<span style="width:18px;flex-shrink:0"></span>';
      let doneBadge='';
      if(done&&t.completedAt){const cd=new Date(t.completedAt);doneBadge=`<span class="gantt-done-badge">✓ ${cd.getMonth()+1}/${cd.getDate()}</span>`;}
      const pl=isP?'padding-left:8px':'padding-left:28px';
      nameRows+=`<div style="height:${r.h}px;display:flex;align-items:center;${pl};padding-right:6px;border-bottom:1px solid var(--border);overflow:hidden;cursor:pointer;${doneColor}" data-a="gantt-open" data-id="${t.id}" data-proj-id="${t.projectId||''}" title="${esc(t.title)}">`
        +(isP?`<span class="gantt-drag-handle" data-gantt-drag="${t.id}" data-proj-id="${t.projectId||''}" title="ドラッグで並び替え" style="cursor:grab;color:var(--text3);font-size:13px;padding:0 3px;flex-shrink:0;touch-action:none;user-select:none;-webkit-user-select:none">⠿</span>`:`<span style="width:19px;flex-shrink:0"></span>`)
        +(done?'<span style="color:var(--text3);font-size:12px;margin-right:4px;flex-shrink:0">✓</span>':'')
        +chev
        +`<span style="font-size:${isP?'13':'12'}px;font-weight:${isP?'600':'400'};overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1${done?';text-decoration:line-through':''}">${esc(t.title)||'（無題）'}</span>`
        +doneBadge
        +'</div>';
      let barHtml='';
      const planStart=t.plannedStartAt||t.startAt;
      if(planStart&&t.dueAt){
        const bx=d2px(planStart),bw=Math.max(d2px(t.dueAt)+pxPerDay-bx,8);
        const bh=isP?14:16,bt=(ROW_H-bh)/2;
        const proj=S.projects.find(p=>p.id===t.projectId);
        const barCol=done?'#9ca3af':(proj?.color||'var(--accent)');
        const op=done?'0.5':'1';
        barHtml=`<div class="gantt-bar-wrap" data-task-id="${t.id}" style="position:absolute;left:${bx}px;width:${bw}px;height:${ROW_H}px;top:0;z-index:1">`
          +`<div style="position:absolute;left:0;right:0;height:${bh}px;top:${bt}px;background:${barCol};opacity:${op};border-radius:3px;overflow:hidden${done?';background-image:repeating-linear-gradient(-45deg,rgba(255,255,255,.15) 0,rgba(255,255,255,.15) 4px,transparent 4px,transparent 8px)':''}" title="${esc(t.title)}">`
          +`<span class="gantt-bar-label">${done?'✓ ':''} ${esc(t.title)}</span>`
          +'</div>'
          
          
          +'</div>';
        // 完了日マーカー
        if(done&&t.completedAt){
          const cx=d2px(t.completedAt.slice(0,10));
          const cd=new Date(t.completedAt);
          const cdLabel=`${cd.getMonth()+1}/${cd.getDate()}`;
          barHtml+=`<div style="position:absolute;left:${cx}px;top:0;width:3px;height:${ROW_H}px;background:#10b981;opacity:.9;z-index:2;border-radius:1px" title="完了日: ${cdLabel}"></div>`;
          barHtml+=`<div style="position:absolute;left:${cx+5}px;top:50%;transform:translateY(-50%);font-size:10px;color:#10b981;font-weight:700;z-index:2;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.15)" title="完了日">✓${cdLabel}</div>`;
        }
      } else if(t.dueAt){
        // plannedStartAtもstartAtもない場合：期限日のみをひし形マーカーで表示
        const cx=d2px(t.dueAt)+pxPerDay/2;
        const proj=S.projects.find(p=>p.id===t.projectId);
        const col=proj?.color||'var(--accent)';
        barHtml=`<div style="position:absolute;left:${cx-8}px;top:${(ROW_H-16)/2}px;width:16px;height:16px;background:${col};transform:rotate(45deg);border-radius:2px;opacity:.8" title="${esc(t.title)}（期限のみ）"></div>`;
      }
      barRows+=`<div style="position:relative;height:${r.h}px;border-bottom:1px solid var(--border)${done?';background:rgba(0,0,0,.02)':''}">${barHtml}</div>`;
    }
  });

  const scales=[['day','日'],['week','週'],['month','月'],['year','年']];
  const scaleBtns=scales.map(([k,l])=>`<button class="gantt-scale-btn${scale===k?' on':''}" data-a="gantt-scale" data-scale="${k}">${l}</button>`).join('');

  return `<div class="gantt-outer">`
    +`<div class="gantt-toolbar"><div style="display:flex;gap:4px">${scaleBtns}</div>${S.ganttProjFilter?`<div style="display:flex;align-items:center;gap:4px;margin-left:8px;padding:2px 8px;background:var(--accent-bg);border-radius:6px;font-size:12px;color:var(--accent);border:1px solid var(--accent)">${esc(S.projects.find(p=>p.id===S.ganttProjFilter)?.name||'')} <button data-a="gantt-clear-proj-filter" style="background:none;border:none;cursor:pointer;color:var(--accent);font-size:14px;padding:0;line-height:1" title="絞り込み解除">×</button></div>`:''}<div style="display:flex;gap:4px;margin-left:auto"><button class="gantt-scale-btn" data-a="gantt-expand-all" title="全て展開">全開</button><button class="gantt-scale-btn" data-a="gantt-collapse-all" title="全て折りたたむ">全閉</button></div><button class="gantt-help-btn" data-a="gantt-help" style="margin-left:6px">？</button></div>`
    +`<div class="gantt-area" id="gantt-area">`
      +`<div class="gantt-names-col" style="width:${NAMES_W}px">`
        +`<div class="gantt-name-head">タスク</div>`
        +nameRows
      +`</div>`
      +`<div class="gantt-timeline-col" style="min-width:${timelineW}px">`
        +`<div class="gantt-date-head">${headCells}</div>`
        +`<div class="gantt-bars-area" style="width:${timelineW}px;height:${totalH}px">`
          +buildGanttDividers(scale,minD,maxD,d2px,totalH)
          +`<div class="gantt-today-line" id="gantt-today" style="left:${todayX}px;height:${totalH}px"></div>`
          +barRows
        +`</div>`
      +`</div>`
    +`</div>`
  +`</div>`;
}
function scrollGanttToToday(){
  requestAnimationFrame(()=>{
    const area=document.getElementById('gantt-area');
    const line=document.getElementById('gantt-today');
    if(area&&line){area.scrollLeft=Math.max(0,parseFloat(line.style.left)-300);}
  });
}

// ===== RENDER CONTENT =====
function renderContent(){
  const el=document.getElementById('content');
  const titles={inbox:'Inbox',today:'Today',upcoming:'Upcoming',forecast:'Forecast',flagged:'Flagged',review:'Review',search:'Search',completed:'Completed',notes:'Notes',nextview:'Next',gantt:'Gantt',
    project:S.projects.find(p=>p.id===S.projId)?.name||'',
    tag:S.tagId==='__none__'?'タグなし':S.tags.find(t=>t.id===S.tagId)?.name||''};
  document.getElementById('viewTitle').textContent=titles[S.view]||'';
  // global-srch の値をS.searchと同期
  const gs=document.getElementById('global-srch');
  if(gs&&gs.value!==S.search)gs.value=S.search;
  // モバイル: 検索ビュー以外ではsrch展開状態をリセットしてタイトルを復元
  if(S.view!=='search'&&window.innerWidth<=768){
    const wrap=document.getElementById('global-srch-wrap');
    const topbar=wrap?.closest('.topbar');
    if(wrap?.classList.contains('srch-expanded')){
      wrap.classList.remove('srch-expanded');
      topbar?.classList.remove('srch-active');
    }
  }

  // qabarを表示/非表示
  const qabar=document.getElementById('qabar');
  if(qabar){
    const qaHidden=['search','forecast','review','completed','notes','gantt'];
    if(qaHidden.includes(S.view)){qabar.style.display='none';}
    else if(window.innerWidth<=768){qabar.style.display='';}
    else{qabar.style.display='';}
  }

  // notes以外ではnoteドロワーを閉じる
  if(S.view!=='notes'){const dr=document.getElementById('drawer');if(dr&&S.noteOpen){dr.style.display='none';dr.classList.remove('open')}}

  renderTaskFilters();
  if(S.view==='forecast'){el.innerHTML=renderForecast();return}
  if(S.view==='review'){el.innerHTML=renderReview();return}
  if(S.view==='search'){el.innerHTML=renderSearch();return}
  if(S.view==='notes'){el.innerHTML=renderNoteList();renderNoteDrawer();
    const nc=document.getElementById('note-list-items');if(nc)initNoteSwipe(nc);
    return}
  if(S.view==='nextview'){el.innerHTML=renderNextView();renderTaskFilters();return}
  if(S.view==='gantt'){
    // スクロール位置を保持してGantt再描画（初回のみ今日へスクロール）
    const _ganttArea=document.getElementById('gantt-area');
    const _isFirstRender=!_ganttArea; // gantt-areaがまだなければ初回
    const _prevScrollLeft=_ganttArea?_ganttArea.scrollLeft:0;
    const _prevScrollTop=_ganttArea?_ganttArea.scrollTop:0;
    el.innerHTML=renderGantt();
    setupGanttDrag();
    requestAnimationFrame(()=>{
      const a=document.getElementById('gantt-area');
      if(!a)return;
      if(_isFirstRender){
        scrollGanttToToday();
      } else {
        a.scrollLeft=_prevScrollLeft;
        a.scrollTop=_prevScrollTop;
      }
    });
    return;
  }
  el.innerHTML=renderList();
  if(S.view==='project')setupSectionDrag();
  initTaskSwipe(el);
}


// ===== GANTT DRAG & DROP（同一プロジェクト内の親タスク並び替え）=====
function setupGanttDrag(){
  const namesCol=document.querySelector('.gantt-names-col');
  if(!namesCol)return;
  // iPadはinnerWidthが大きくてもタッチデバイスなのでontouchstartで判定
  const isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0;

  if(!isTouch){
    // ── PC(マウス): HTML5 D&D ──
    let dragId=null,dragProjId=null;
    namesCol.querySelectorAll('[data-gantt-drag]').forEach(handle=>{
      const row=handle.closest('[data-a="gantt-open"]');
      if(!row)return;
      handle.addEventListener('mousedown',()=>row.setAttribute('draggable','true'));
      row.addEventListener('dragend',()=>{row.removeAttribute('draggable');_clearGanttInd();dragId=null;});
    });
    namesCol.addEventListener('dragstart',e=>{
      const row=e.target.closest('[data-a="gantt-open"]');
      if(!row)return;
      dragId=row.dataset.id;dragProjId=row.dataset.projId;
      setTimeout(()=>row.classList.add('dragging'),0);
      e.dataTransfer.effectAllowed='move';
    });
    namesCol.addEventListener('dragover',e=>{
      if(!dragId)return;
      e.preventDefault();_clearGanttInd();
      const row=e.target.closest('[data-a="gantt-open"]');
      if(!row||row.dataset.id===dragId||row.dataset.projId!==dragProjId)return;
      const r=row.getBoundingClientRect();
      row.classList.add(e.clientY<r.top+r.height/2?'drop-before':'drop-after');
    });
    namesCol.addEventListener('drop',async e=>{
      e.preventDefault();
      const row=e.target.closest('[data-a="gantt-open"]');
      const id=dragId,projId=dragProjId;dragId=null;dragProjId=null;
      if(!row||row.dataset.id===id||row.dataset.projId!==projId)return;
      const r=row.getBoundingClientRect();
      await _applyGanttDrop(id,row.dataset.id,e.clientY<r.top+r.height/2?'before':'after',projId);
    });

  } else {
    // ── タッチ(iPad/iPhone): documentレベルでtouchを拾う ──
    let ghost=null,dragId=null,dragProjId=null,dragging=false,lpTimer=null,activeEl=null;
    let startX=0,startY=0;
    const LONG_MS=480,MOVE_LIM=10;

    function spawnGhostG(el,ty){
      const rect=el.getBoundingClientRect();
      ghost=el.cloneNode(true);
      Object.assign(ghost.style,{
        position:'fixed',zIndex:'9999',opacity:'.88',pointerEvents:'none',
        width:rect.width+'px',left:rect.left+'px',top:(ty-rect.height/2)+'px',
        boxShadow:'0 8px 28px rgba(0,0,0,.25)',borderRadius:'8px',
        background:'var(--bg)',transform:'scale(1.03)',transition:'none'
      });
      document.body.appendChild(ghost);
      el.style.opacity='.3';
      activeEl=el;
    }
    function cancelG(){
      clearTimeout(lpTimer);
      if(ghost){ghost.remove();ghost=null;}
      if(activeEl){activeEl.style.opacity='';activeEl=null;}
      _clearGanttInd();
      dragging=false;dragId=null;dragProjId=null;
    }

    // touchstartをdocumentで拾ってganstt-open行を判定
    function onTouchStart(e){
      if(e.touches.length>1){cancelG();return;}
      const t=e.touches[0];
      startX=t.clientX;startY=t.clientY;
      const handle=e.target.closest('[data-gantt-drag]');
      const row=e.target.closest('[data-a="gantt-open"]');
      if(!row)return;
      if(handle){
        // ハンドル直接タップ → 即ドラッグ
        e.preventDefault();
        dragId=row.dataset.id;dragProjId=row.dataset.projId;
        dragging=true;navigator.vibrate?.(30);
        spawnGhostG(row,t.clientY);
      } else {
        // 行長押し → ドラッグ
        lpTimer=setTimeout(()=>{
          if(dragging)return;
          _cancelLp();
          navigator.vibrate?.(40);
          dragId=row.dataset.id;dragProjId=row.dataset.projId;
          dragging=true;spawnGhostG(row,startY);
        },LONG_MS);
      }
    }
    function onTouchMove(e){
      const t=e.touches[0];
      if(!dragging){
        if(Math.abs(t.clientX-startX)>MOVE_LIM||Math.abs(t.clientY-startY)>MOVE_LIM)clearTimeout(lpTimer);
        return;
      }
      e.preventDefault();
      if(ghost)ghost.style.top=(t.clientY-ghost.offsetHeight/2)+'px';
      _clearGanttInd();
      // ghostをポインターイベント無効にして下の要素を取得
      const el=document.elementFromPoint(t.clientX,t.clientY);
      const target=el?.closest('[data-a="gantt-open"]');
      if(target&&target!==activeEl&&target.dataset.projId===dragProjId){
        const r=target.getBoundingClientRect();
        target.classList.add(t.clientY<r.top+r.height/2?'drop-before':'drop-after');
      }
    }
    async function onTouchEnd(e){
      clearTimeout(lpTimer);
      const was=dragging;
      const t=e.changedTouches[0];
      // ghostを先に非表示にしてからelementFromPointで正確な要素を取得
      if(ghost){ghost.style.display='none';}
      const el=document.elementFromPoint(t.clientX,t.clientY);
      if(ghost){ghost.remove();ghost=null;}
      if(activeEl){activeEl.style.opacity='';activeEl=null;}
      if(!was){dragging=false;dragId=null;dragProjId=null;_clearGanttInd();return;}
      dragging=false;
      const id=dragId,projId=dragProjId;dragId=null;dragProjId=null;
      // drop-before/drop-afterのついた行を優先して使う
      const marked=document.querySelector('[data-a="gantt-open"].drop-before,[data-a="gantt-open"].drop-after');
      const target=marked||el?.closest('[data-a="gantt-open"]');
      if(target&&target.dataset.id!==id&&target.dataset.projId===projId){
        const pos=target.classList.contains('drop-before')?'before':'after';
        _clearGanttInd();
        await _applyGanttDrop(id,target.dataset.id,pos,projId);
      } else _clearGanttInd();
    }

    // namesColにpassive:falseでまとめてバインド
    namesCol.addEventListener('touchstart',onTouchStart,{passive:false});
    namesCol.addEventListener('touchmove',onTouchMove,{passive:false});
    namesCol.addEventListener('touchend',onTouchEnd,{passive:true});
    // touchendがnamesCol外で起きた場合もdocumentで拾う
    document.addEventListener('touchend',async e=>{
      if(!dragging)return;
      await onTouchEnd(e);
    },{passive:true});
    namesCol.addEventListener('touchcancel',cancelG,{passive:true});
    document.addEventListener('touchcancel',cancelG,{passive:true});
  }
}

function _clearGanttInd(){
  document.querySelectorAll('.drop-before,.drop-after,.dragging').forEach(el=>{
    el.classList.remove('drop-before','drop-after','dragging');
  });
}

// ===== GANTT バードラッグ（計画開始日・期限日変更）=====
// ガントバードラッグ用グローバルAbortController（render()のたびに累積しないよう管理）

async function _applyGanttDrop(dragId,targetId,pos,projId){
  _clearGanttInd();
  const task=S.tasks.find(t=>t.id===dragId);
  const tt=S.tasks.find(t=>t.id===targetId);
  if(!task||!tt||task.projectId!==tt.projectId)return; // 安全チェック
  // 同プロジェクトの親タスクのみ対象
  const projTasks=S.tasks
    .filter(t=>t.projectId===projId&&!t.parentTaskId&&t.id!==dragId)
    .sort((a,b)=>(a.order||0)-(b.order||0));
  const ti=projTasks.findIndex(t=>t.id===targetId);
  if(ti<0)return;
  const idx=pos==='before'?ti:ti+1;
  projTasks.splice(idx,0,task);
  for(let i=0;i<projTasks.length;i++){
    projTasks[i].order=(i+1)*1000;
    await saveTask(projTasks[i]);
  }
  render();
}

// ===== SECTION DRAG & DROP =====
function setupSectionDrag(){
  const content=document.getElementById('content');
  if(!content)return;

  if(content._secDragAC)content._secDragAC.abort();
  const ac=new AbortController();
  content._secDragAC=ac;
  const sig=ac.signal;

  const isMobile=window.innerWidth<=768;

  // ── helpers ──────────────────────────────────────────
  function clearInd(){
    content.querySelectorAll('.drag-over,.drop-before,.drop-after,.drop-sec-before,.drop-sec-after,.sec-dragging,.dragging').forEach(el=>{
      el.classList.remove('drag-over','drop-before','drop-after','drop-sec-before','drop-sec-after','sec-dragging','dragging');
    });
  }
  // ── apply task drop (reorder) ─────────────────────────
  async function applyTaskDrop(taskId,targetEl,pos){
    clearInd();
    if(!taskId||!targetEl||pos==='sec')return;
    const task=S.tasks.find(t=>t.id===taskId);
    if(!task)return;
    const targetTaskId=targetEl.dataset.id;
    const tt=S.tasks.find(t=>t.id===targetTaskId);
    if(!tt)return;
    const allTasks=getTasks().filter(t=>!t.parentTaskId&&t.id!==taskId);
    const ti=allTasks.findIndex(t=>t.id===targetTaskId);
    let idx=pos==='before'?ti:ti+1;
    if(idx<0)idx=0;
    allTasks.splice(idx,0,task);
    for(let i=0;i<allTasks.length;i++){
      allTasks[i].order=(i+1)*1000;
      await saveTask(allTasks[i]);
    }
    renderContent();
  }

  // ════════════════════════════════════════════════════
  if(!isMobile){
    // ── PC: HTML5 Drag & Drop ──────────────────────────
    let dragId=null;

    content.querySelectorAll('.trow[data-id]').forEach(r=>{
      const h=r.querySelector('.task-drag-handle[data-drag-task]');
      if(h){
        h.addEventListener('mousedown',()=>r.setAttribute('draggable','true'));
        r.addEventListener('dragend',()=>r.removeAttribute('draggable'));
      } else {
        r.setAttribute('draggable','true');
      }
    });

    content.addEventListener('dragstart',e=>{
      const row=e.target.closest('.trow[data-id]');
      if(row){
        dragId=row.dataset.id;
        setTimeout(()=>row.classList.add('dragging'),0);
        e.dataTransfer.effectAllowed='move';
      } else {e.preventDefault();}
    },{signal:sig});

    content.addEventListener('dragend',()=>{clearInd();dragId=null;},{signal:sig});

    content.addEventListener('dragover',e=>{
      if(!dragId)return;
      e.preventDefault();clearInd();
      const row=e.target.closest('.trow[data-id]');
      if(row&&row.dataset.id!==dragId){
        const r=row.getBoundingClientRect();
        row.classList.add(e.clientY<r.top+r.height/2?'drop-before':'drop-after');
        e.dataTransfer.dropEffect='move';
      }
    },{signal:sig});

    content.addEventListener('drop',async e=>{
      e.preventDefault();
      const row=e.target.closest('.trow[data-id]');
      const id=dragId;dragId=null;
      if(row&&row.dataset.id!==id){
        const r=row.getBoundingClientRect();
        const pos=e.clientY<r.top+r.height/2?'before':'after';
        await applyTaskDrop(id,row,pos);
      }
    },{signal:sig});

  } else {
    // ── モバイル: 長押しタッチドラッグ ──────────────────────
    let ghost=null,dtype=null,dragId=null,dragSecId=null;
    let startX=0,startY=0,dragging=false,lpTimer=null,activeEl=null;
    const LONG_MS=480,MOVE_LIM=12;

    function spawnGhost(el,ty){
      window.__taskDragging=true;
      const rect=el.getBoundingClientRect();
      ghost=el.cloneNode(true);
      Object.assign(ghost.style,{
        position:'fixed',zIndex:'9999',opacity:'.85',pointerEvents:'none',
        width:rect.width+'px',left:rect.left+'px',top:(startY-rect.height/2)+'px',
        boxShadow:'0 8px 28px rgba(0,0,0,.25)',borderRadius:'8px',
        transform:'scale(1.03)',transition:'none',background:'var(--surface)'
      });
      ghost.classList.add('drag-ghost-fixed');
      document.body.appendChild(ghost);
      el.style.opacity='.3';
      activeEl=el;
      window.__activeDragEl=el;
      dtype=ty;
    }

    function cancelAll(){
      clearTimeout(lpTimer);
      window.__taskDragging=false;
      if(ghost){ghost.remove();ghost=null;}
      if(activeEl){activeEl.style.opacity='';activeEl=null;}
      if(window.__activeDragEl){window.__activeDragEl.style.opacity='';window.__activeDragEl=null;}
      clearInd();dragging=false;dtype=null;dragId=null;dragSecId=null;
    }

    // ドキュメントレベルのフォールバック（scroll等でtouchendが届かなかった場合のゴースト残留防止）
    document.addEventListener('touchend',()=>{if(ghost||dragging)cancelAll();},{signal:sig,passive:true});
    document.addEventListener('touchcancel',()=>cancelAll(),{signal:sig,passive:true});

    // task rows – ドラッグハンドル経由なら即ドラッグ開始、行直接タップは長押し維持（タイトル編集用）
    content.querySelectorAll('.trow[data-id]').forEach(row=>{
      // ── ハンドルタップ → 即ドラッグ（長押し不要） ──
      const handle=row.querySelector('.task-drag-handle[data-drag-task]');
      if(handle){
        handle.addEventListener('touchstart',e=>{
          if(e.touches.length>1){cancelAll();return;}
          e.preventDefault();e.stopPropagation();
          const t=e.touches[0];startX=t.clientX;startY=t.clientY;
          dragging=true;navigator.vibrate?.(30);
          dragId=row.dataset.id;spawnGhost(row,'task');
        },{signal:sig,passive:false});
      }
      // passive:false にして touchmove 内での e.preventDefault() を有効化（iOS scroll乗っ取り防止）
      row.addEventListener('touchstart',e=>{
        if(dragging)return;
        if(e.target.closest('.task-drag-handle'))return;// ハンドルはハンドル側で処理
        if(e.target.closest('.task-check,.task-flag,.cm-del'))return;// チェック・フラグ等は除外
        if(e.touches.length>1){cancelAll();return;}
        const t=e.touches[0];startX=t.clientX;startY=t.clientY;
        // 長押しでドラッグ開始
        lpTimer=setTimeout(()=>{
          if(dragging)return;
          _cancelLp(); // コンテキストメニューをキャンセル
          navigator.vibrate?.(40);
          dragId=row.dataset.id;
          dragging=true;
          spawnGhost(row,'task');
        },LONG_MS);
      },{signal:sig,passive:false});

      row.addEventListener('touchmove',e=>{
        const t=e.touches[0];
        if(!dragging){
          if(Math.abs(t.clientX-startX)>MOVE_LIM||Math.abs(t.clientY-startY)>MOVE_LIM)clearTimeout(lpTimer);
          return;
        }
        e.preventDefault();
        if(ghost)ghost.style.top=(t.clientY-ghost.offsetHeight/2)+'px';
        clearInd();ghost.style.pointerEvents='none';
        const el=document.elementFromPoint(t.clientX,t.clientY);
        const row2=el?.closest('.trow[data-id]');
        if(row2&&row2.dataset.id!==dragId){
          const r=row2.getBoundingClientRect();
          row2.classList.add(t.clientY<r.top+r.height/2?'drop-before':'drop-after');
        }
      },{signal:sig,passive:false});

      row.addEventListener('touchend',async e=>{
        clearTimeout(lpTimer);
        const wasDragging=dragging;
        if(ghost){ghost.remove();ghost=null;}
        if(activeEl){activeEl.style.opacity='';activeEl=null;}
        if(!wasDragging){dragging=false;dragId=null;dtype=null;return;}
        dragging=false;
        const t=e.changedTouches[0];
        const el=document.elementFromPoint(t.clientX,t.clientY);
        const row2=el?.closest('.trow[data-id]');
        const id=dragId;dragId=null;dtype=null;
        if(row2&&row2.dataset.id!==id){
          const r=row2.getBoundingClientRect();
          await applyTaskDrop(id,row2,t.clientY<r.top+r.height/2?'before':'after');
        }
      },{signal:sig});
      row.addEventListener('touchcancel',()=>cancelAll(),{signal:sig,passive:true});
    });
  }
}

// ノート検索時: 検索ボックスを再生成せずリスト部分だけ更新
function renderNoteListOnly(){
  const q=S.noteSearch.toLowerCase();
  const sortKey=S.noteSortUpdated!==false?'updatedAt':'createdAt';
  let notes=[...S.notes].filter(n=>!q||(n.title+n.body).toLowerCase().includes(q));
  if(S.filterTagIds&&S.filterTagIds.length){
    if(S.filterTagIds.includes('__none__'))notes=notes.filter(n=>!n.tagIds||n.tagIds.length===0);
    else notes=notes.filter(n=>S.filterTagIds.every(id=>n.tagIds&&n.tagIds.includes(id)));
  }
  notes.sort((a,b)=>b[sortKey].localeCompare(a[sortKey]));
  let h='';
  if(!notes.length){
    h='<div class="empty"><div class="empty-ico">📝</div><div class="empty-t">'+(q?'該当なし':'メモなし')+'</div></div>';
  } else {
    notes.forEach(n=>{h+=renderNoteRow(n);});
  }
  const container=document.getElementById('note-list-items');
  if(container){container.innerHTML=h;initNoteSwipe(container);}
}

function renderList(){
  const showSubsInView=['today','flagged'].includes(S.view);

  if(!tasks.length)return renderEmpty();
  let h='<div class="tlist">';
  tasks.forEach(t=>{h+=renderRow(t)});
  h+='</div>';
  return h;
}

function renderRow(task){
  const subs=S.tasks.filter(t=>t.parentTaskId===task.id).sort((a,b)=>(a.order||0)-(b.order||0));
  const done=task.status==='completed';
  const notStarted=!done&&isNotStartedTask(task);
  const pclass=task.priority<4?'p'+task.priority:'';
  const isSel=S.selectedIds.includes(task.id);
  const subsOpen=subs.length>0&&!!S.openSubs[task.id];
  let meta='';
  if(task.startAt&&task.startAt!==task.dueAt){
    const cls=isToday(task.startAt)?'td':isSoon(task.startAt)?'sn':'';
    const timeLabel=(task.startTime&&isToday(task.startAt))?' '+task.startTime:'';
    meta+='<span class="mc'+( cls?' '+cls:'')+'">🚀 '+fmtDate(task.startAt)+timeLabel+'</span>';
  }
  if(task.dueAt){
    const cls=isOv(task.dueAt)?'ov':isToday(task.dueAt)?'td':isSoon(task.dueAt)?'sn':'';
    meta+='<span class="mc'+( cls?' '+cls:'')+'">⏰ '+fmtDate(task.dueAt)+'</span>';
  }
  if(task.projectId&&S.view!=='project'){
    const p=S.projects.find(x=>x.id===task.projectId);
    if(p)meta+='<span class="mc proj-nav-chip" data-a="go-proj" data-id="'+p.id+'" style="background:'+p.color+'1a;color:'+p.color+';cursor:pointer" title="'+esc(p.name)+'に移動">'+esc(p.name)+'</span>';
  }
  if(task.tagIds&&task.tagIds.length){
    task.tagIds.slice(0,2).forEach(tid=>{
      const t=S.tags.find(x=>x.id===tid);
      if(t)meta+='<span class="mc" style="background:'+t.color+'1a;color:'+t.color+'">#'+esc(t.name)+'</span>';
    });
  }
  if(task.repeatRule){
    const _rl=task.repeatRule;
    const _DMAP={sun:'日',mon:'月',tue:'火',wed:'水',thu:'木',fri:'金',sat:'土'};
    const _rlLabel=_rl==='daily'?'毎日':_rl==='weekdays'?'平日':_rl==='weekly'?'毎週':_rl==='yearly'?'毎年'
      :_rl==='weekly:mon,tue,wed,thu,fri'?'平日'
      :(_rl==='weekly:sat,sun'||_rl==='weekly:sun,sat')?'休日'
      :_rl.startsWith('weekly:')?'毎週('+_rl.slice(7).split(',').map(d=>_DMAP[d]||d).join('・')+')'
      :_rl.startsWith('monthly:')?'毎月'+_rl.slice(8).split(',').join('・')+'日':'毎月';
    meta+='<span class="mc" title="'+_rlLabel+'">↻ '+_rlLabel+'</span>';
  }
  if(task.flagged)meta+='<span>🚩</span>';
  if(subs.length){
    const dc=subs.filter(s=>s.status==='completed').length;
    meta+='<button class="mc sub-toggle-btn" data-a="tog-subs" data-id="'+task.id+'" title="サブタスクを展開"><span class="sub-chev'+(subsOpen?' open':'')+'">▶</span>'+dc+'/'+subs.length+'</button>';
  }
  const updStr=task.updatedAt?'<span class="mc" style="margin-left:auto">✏️ '+fmtDate(task.updatedAt.slice(0,10))+'</span>':'';

  let html=(!S.selectMode?'<div class="note-swipe-wrap" data-task-swipe-id="'+task.id+'">'
    +'<div class="note-swipe-del-bg">🗑 削除</div>'
    +'<div class="note-swipe-inner">':'')
  +'<div class="trow'+(done?' done':'')+(S.taskId===task.id&&!S.selectMode?' sel':'')+(pclass?' '+pclass:'')+(isSel?' bulk-sel':'')+'" data-a="sel" data-id="'+task.id+'" data-order="'+(task.order||0)+'">'
    +(!S.selectMode?'<span class="task-drag-handle" data-drag-task="'+task.id+'" title="ドラッグで並び替え" ontouchstart="event.stopPropagation()">⠿</span>':'')
    +'<button class="chk'+(done?' done':'')+'" data-a="chk" data-id="'+task.id+'"'+(S.selectMode?' style="pointer-events:none"':'')+' >'+(done?'✓':'')+'</button>'
    +'<div class="tbody">'
      +(task.parentTaskId&&['today','flagged'].includes(S.view)?(()=>{const pt=S.tasks.find(t=>t.id===task.parentTaskId);return pt?'<div style="font-size:11px;color:var(--text3);margin-bottom:1px;display:flex;align-items:center;gap:3px"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>'+esc(pt.title||'無題')+'</div>':''})():'')
      +'<div class="ttitle'+(subs.length>0?' has-subs':'')+'" data-title-edit="'+task.id+'"'+(notStarted?' style="color:var(--text3)"':'')+'>'+( task.title?esc(task.title):'<span style="color:var(--text3)">無題</span>')+'</div>'
      +'<div class="tmeta">'+(meta||'')+updStr+'</div>'
    +'</div>'
    +(S.selectMode?'':
      '<button class="trow-expand-btn" data-a="task-expand" data-id="'+task.id+'" title="大きく表示">'
        +'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>'
      +'</button>'
      +'<button class="trow-edit-btn" data-a="sel-edit" data-id="'+task.id+'" title="詳細">'
        +'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>'
      +'</button>')
  +'</div>'
  +(!S.selectMode?'</div></div>':'');
  if(subs.length){
    html+='<div class="sub-rows'+(subsOpen?' open':'')+'" id="sub-rows-'+task.id+'">';
    html+=subs.map(s=>'<div style="padding-left:28px">'+renderRow(s)+'</div>').join('');
    html+='</div>';
  }
  return html;
}
