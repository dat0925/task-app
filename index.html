    +'</div>';
  document.body.appendChild(ov);requestAnimationFrame(()=>ov.classList.add('open'));
  function buildItemEl(v){
    const it=ALL_NAV_ITEMS.find(x=>x.v===v);if(!it)return null;
    const d=document.createElement('div');
    d.className='nav-edit-item';d.dataset.v=v;
    d.style.cssText='display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--border)';
    d.innerHTML=it.icon()
      +'<span style="flex:1;font-size:14px">'+it.label+'</span>'
      +'<div style="display:flex;gap:4px">'
        +(v!=='_edit'?'<button style="width:36px;height:36px;border-radius:8px;background:var(--bg2);border:1px solid var(--border);font-size:16px;cursor:pointer;touch-action:manipulation" data-up="1">↑</button>':'<div style="width:36px"></div>')
        +(v!=='_edit'?'<button style="width:36px;height:36px;border-radius:8px;background:var(--bg2);border:1px solid var(--border);font-size:16px;cursor:pointer;touch-action:manipulation" data-dn="1">↓</button>':'<div style="width:36px"></div>')
        +(v!=='_edit'?'<button style="width:36px;height:36px;border-radius:8px;background:none;border:none;font-size:20px;color:var(--text3);cursor:pointer;touch-action:manipulation" data-rm="'+v+'">×</button>':'<div style="width:36px"></div>')
      +'</div>';
    return d;
  }
  function refreshAvail(){
    const order=[...list.querySelectorAll('.nav-edit-item')].map(x=>x.dataset.v);
    const avail=ALL_NAV_ITEMS.filter(x=>!order.includes(x.v)&&x.v!=='gantt');
    const el=document.getElementById('nav-edit-avail');
    el.innerHTML=avail.length?'<div style="margin-top:12px;border-top:1px solid var(--border);padding-top:10px"><div class="flabel">追加</div>'+avail.map(x=>'<button class="act-btn" data-add="'+x.v+'" style="margin:3px">+ '+x.label+'</button>').join('')+'</div>':'';
  }
  const list=document.getElementById('nav-edit-list');
  getNavOrder().forEach(v=>{const el=buildItemEl(v);if(el)list.appendChild(el)});
  refreshAvail();
  list.addEventListener('click',e=>{
    const item=e.target.closest('.nav-edit-item');if(!item)return;
    if(e.target.dataset.up){const prev=item.previousElementSibling;if(prev)list.insertBefore(item,prev);}
    else if(e.target.dataset.dn){const next=item.nextElementSibling;if(next)list.insertBefore(next,item);}
    else if(e.target.dataset.rm){item.remove();refreshAvail();}
  });
  document.getElementById('nav-edit-avail').addEventListener('click',e=>{
    if(e.target.dataset.add){
      const el=buildItemEl(e.target.dataset.add);if(!el)return;
      const editEl=list.querySelector('[data-v="_edit"]');
      list.insertBefore(el,editEl||null);
      refreshAvail();
    }
  });
  document.getElementById('ne-cancel').onclick=()=>ov.remove();
  document.getElementById('ne-ok').onclick=()=>{
    const newOrder=[...list.querySelectorAll('.nav-edit-item')].map(x=>x.dataset.v);
    if(!newOrder.includes('_edit'))newOrder.push('_edit');
    localStorage.setItem('bnav_order',JSON.stringify(newOrder));
    if(window.sbSetSetting)window.sbSetSetting('bnav_order',JSON.stringify(newOrder));
    ov.remove();renderBotNav();renderSidebar();
  };
}

// ===== GANTT VIEW =====
function buildGanttDividers(scale,minD,maxD,d2px,totalH){
  let html='';
  const vline=(x,w,op)=>`<div style="position:absolute;left:${Math.round(x)}px;top:0;width:${w}px;height:${totalH}px;background:var(--border);opacity:${op};z-index:0;pointer-events:none"></div>`;
  if(scale==='day'){
    // 月境界：太め、週境界（月曜）：細め
    const cur=new Date(minD);
    while(cur<=maxD){
      if(cur.getDate()===1) html+=vline(d2px(cur),2,1);
      else if(cur.getDay()===1) html+=vline(d2px(cur),1,.5);
      cur.setDate(cur.getDate()+1);
    }
  } else if(scale==='week'){
    // 月境界
    let cy=minD.getFullYear(),cm=minD.getMonth();
    for(;;){const d=new Date(cy,cm,1);if(d>maxD)break;html+=vline(d2px(d),2,1);cm++;if(cm>11){cm=0;cy++;}}
  } else if(scale==='month'){
    // 四半期境界：1/4/7/10月
    const qm=[0,3,6,9];
    for(let y=minD.getFullYear();y<=maxD.getFullYear()+1;y++){
      qm.forEach(m=>{const d=new Date(y,m,1);if(d>minD&&d<=maxD)html+=vline(d2px(d),2,1);});
    }
  } else {
    // 年境界
    for(let y=minD.getFullYear()+1;y<=maxD.getFullYear();y++) html+=vline(d2px(new Date(y,0,1)),2,1);
  }
  return html;
}
function renderGantt(){
  const isMobile=window.innerWidth<=768;
  if(isMobile){
    return '<div style="padding:32px 20px;text-align:center;color:var(--text2)">'
      +'<div style="font-size:36px;margin-bottom:12px">🖥</div>'
      +'<div style="font-size:15px;font-weight:600;margin-bottom:6px">PCブラウザでの閲覧を推奨します</div>'
      +'<div style="font-size:13px;color:var(--text3)">ガントチャートはPC向けに最適化されています。</div>'
      +'</div>';
  }
  const scale=S.ganttScale||'week';
  const PX_MAP={day:36,week:11.43,month:3.2,year:0.7};
  const pxPerDay=PX_MAP[scale];
  const NAMES_W=250;
  const ROW_H=40;
  const PROJ_H=36;

  // フィルタ適用（繰り返し除外 + 現在/完了/タグ）
  const todayD=new Date();todayD.setHours(0,0,0,0);
  let allT=S.tasks.filter(t=>!t.repeatRule);
  if(!S.showCompleted)allT=allT.filter(t=>t.status!=='completed');
  if(S.hideNotStarted)allT=allT.filter(t=>!t.startAt||new Date(t.startAt)<=todayD);
  if(S.filterTagIds&&S.filterTagIds.length)allT=allT.filter(t=>S.filterTagIds.every(id=>t.tagIds&&t.tagIds.includes(id)));
  const childMap={};
  allT.forEach(t=>{if(t.parentTaskId)(childMap[t.parentTaskId]||(childMap[t.parentTaskId]=[])).push(t);});
  // サブタスクを持たないタスクも含め、プロジェクト所属の親タスク（トップレベル）をすべて表示
  if(S.ganttProjFilter)allT=allT.filter(t=>t.projectId===S.ganttProjFilter);
  const parentsAll=allT.filter(t=>!t.parentTaskId&&t.projectId);

  if(!parentsAll.length){
    return '<div style="padding:48px 24px;text-align:center;color:var(--text3);font-size:14px">'
      +'表示できるタスクがありません。<br>'
      +'<span style="font-size:12px">タスクを追加するとガントに表示されます。</span>'
      +'</div>';
  }
  // プロジェクト別にグループ化
  const projGroups={};
  const projOrder=[];
  parentsAll.forEach(p=>{
    const pid=p.projectId||'__none__';
    if(!projGroups[pid]){
      projOrder.push(pid);
      const proj=S.projects.find(x=>x.id===pid)||{id:'__none__',name:'プロジェクトなし',color:'#9ca3af'};
      projGroups[pid]={proj,parents:[]};
    }
    projGroups[pid].parents.push(p);
  });

  const gc=S.ganttCollapsed||{};

  // フラットな行リスト構築
  const rows=[];
  projOrder.forEach(pid=>{
    const {proj,parents:ps}=projGroups[pid];
    const projKey='proj_'+pid;
    const projCol=!!gc[projKey];
    rows.push({type:'proj',proj,key:projKey,collapsed:projCol,h:PROJ_H,pid});
    if(!projCol){
      ps.forEach(p=>{
        const taskKey='task_'+p.id;
        const taskCol=!!gc[taskKey];
        const hasKids=!!(childMap[p.id]?.length);
        rows.push({type:'parent',task:p,key:taskKey,collapsed:taskCol,hasKids,done:p.status==='completed',h:ROW_H,pid});
        if(!taskCol){
          (childMap[p.id]||[]).sort((a,b)=>(a.order||0)-(b.order||0)).forEach(c=>{
            rows.push({type:'child',task:c,done:c.status==='completed',h:ROW_H,pid});
          });
        }
      });
    }
  });

  // 日付レンジ（折りたたまれていても全タスク対象）
  let minD=new Date(todayD),maxD=new Date(todayD);
  allT.forEach(t=>{
    if(t.plannedStartAt||t.startAt){const d=new Date(t.plannedStartAt||t.startAt);if(d<minD)minD=new Date(d);}
    if(t.dueAt){const d=new Date(t.dueAt);if(d>maxD)maxD=new Date(d);}
    if(t.completedAt){const d=new Date(t.completedAt.slice(0,10));if(d>maxD)maxD=new Date(d);}
  });
  const buf=scale==='day'?7:scale==='week'?21:scale==='month'?45:90;
  minD.setDate(minD.getDate()-buf);
  maxD.setDate(maxD.getDate()+buf);
  // ヘッダーセルと仕切り線の座標系を一致させるためスケール境界に揃える
  if(scale==='week') minD.setDate(minD.getDate()-((minD.getDay()+6)%7));
  else if(scale==='month') minD.setDate(1);
  else if(scale==='year'){minD.setDate(1);minD.setMonth(0);}
  S._ganttMinD=minD.toISOString().slice(0,10);
  const timelineW=Math.max(Math.ceil((maxD-minD)/86400000*pxPerDay),400);
  const d2px=d=>(new Date(d)-minD)/86400000*pxPerDay;
  const todayX=d2px(todayD);
  const totalH=rows.reduce((s,r)=>s+r.h,0);

  // ヘッダーセル
  const DAY=['日','月','火','水','木','金','土'];
  let headCells='';
  if(scale==='day'){
    const cur=new Date(minD);
    while(cur<=maxD){
      const dow=cur.getDay(),isWe=dow===0||dow===6;
      const isTod=cur.toISOString().slice(0,10)===todayD.toISOString().slice(0,10);
      headCells+=`<div class="gantt-date-cell${isWe?' gweekend':''}${isTod?' gtoday-cell':''}" style="width:${pxPerDay}px"><span style="font-size:11px">${cur.getDate()}</span><span style="font-size:9px">${DAY[dow]}</span></div>`;
      cur.setDate(cur.getDate()+1);
    }
  } else if(scale==='week'){
    const cw=Math.round(7*pxPerDay);
    const cur=new Date(minD);
    while(cur<=maxD){
      headCells+=`<div class="gantt-date-cell" style="width:${cw}px;font-size:11px">${cur.getMonth()+1}/${cur.getDate()}(${DAY[cur.getDay()]})</div>`;
      cur.setDate(cur.getDate()+7);
    }
  } else if(scale==='month'){
    let cy=minD.getFullYear(),cm=minD.getMonth();
    for(;;){if(new Date(cy,cm,1)>maxD)break;const days=new Date(cy,cm+1,0).getDate();headCells+=`<div class="gantt-date-cell" style="width:${Math.round(days*pxPerDay)}px;font-size:11px">${cy}/${cm+1}</div>`;cm++;if(cm>11){cm=0;cy++;}}
  } else {
    for(let y=minD.getFullYear();y<=maxD.getFullYear();y++){const days=((y%4===0&&y%100!==0)||y%400===0)?366:365;headCells+=`<div class="gantt-date-cell" style="width:${Math.round(days*pxPerDay)}px;font-size:12px;font-weight:600;color:var(--text2)">${y}</div>`;}
  }

  // 行レンダリング
  let nameRows='',barRows='';
  rows.forEach(r=>{
    if(r.type==='proj'){
      const proj=r.proj;
      const col=esc(proj.color||'#9ca3af');
      const chev=`<span class="gantt-chevron${r.collapsed?' gclosed':''}" style="margin:0 2px 0 4px">▼</span>`;
      const dot=`<span style="width:8px;height:8px;border-radius:50%;background:${col};flex-shrink:0;margin-right:6px"></span>`;
      nameRows+=`<div style="height:${r.h}px;display:flex;align-items:center;background:var(--bg2);border-bottom:1px solid var(--border);cursor:pointer;user-select:none;overflow:hidden" data-a="gantt-toggle" data-id="${r.key}">${chev}${dot}<span style="font-size:12px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;color:var(--text)">${esc(proj.name)}</span></div>`;
      // プロジェクトサマリーバー（全タスクのspan）
      const allProjTasks=[...projGroups[r.pid].parents,...projGroups[r.pid].parents.flatMap(p=>childMap[p.id]||[])];
      let pMin=null,pMax=null;
      allProjTasks.forEach(t=>{if(t.startAt){const d=new Date(t.startAt);if(!pMin||d<pMin)pMin=d;}if(t.dueAt){const d=new Date(t.dueAt);if(!pMax||d>pMax)pMax=d;}});
      let pBar='';
      if(pMin&&pMax){
        const bx=d2px(pMin),bw=Math.max(d2px(pMax)+pxPerDay-bx,6),bh=5,bt=(r.h-bh)/2;
        pBar=`<div style="position:absolute;left:${bx}px;width:${bw}px;height:${bh}px;top:${bt}px;background:${col};border-radius:3px;opacity:.5"></div>`;
      }
      barRows+=`<div style="position:relative;height:${r.h}px;border-bottom:1px solid var(--border);background:var(--bg2)">${pBar}</div>`;
    } else {
      const t=r.task,isP=r.type==='parent',done=r.done;
      const doneColor=done?'color:var(--text3);':'';
      let chev='';
      if(isP&&r.hasKids) chev=`<span class="gantt-chevron${r.collapsed?' gclosed':''}" style="margin-right:2px" data-a="gantt-toggle" data-id="${r.key}">▼</span>`;
      else if(isP) chev='<span style="width:18px;flex-shrink:0"></span>';
      let doneBadge='';
      if(done&&t.completedAt){const cd=new Date(t.completedAt);doneBadge=`<span class="gantt-done-badge">✓ ${cd.getMonth()+1}/${cd.getDate()}</span>`;}
      const pl=isP?'padding-left:8px':'padding-left:28px';
      nameRows+=`<div style="height:${r.h}px;display:flex;align-items:center;${pl};padding-right:6px;border-bottom:1px solid var(--border);overflow:hidden;cursor:pointer;${doneColor}" data-a="gantt-open" data-id="${t.id}" data-proj-id="${t.projectId||''}" title="${esc(t.title)}">`
        +(isP?`<span class="gantt-drag-handle" data-gantt-drag="${t.id}" data-proj-id="${t.projectId||''}" title="ドラッグで並び替え" style="cursor:grab;color:var(--text3);font-size:13px;padding:0 3px;flex-shrink:0;touch-action:none;user-select:none;-webkit-user-select:none">⠿</span>`:`<span style="width:19px;flex-shrink:0"></span>`)
        +(done?'<span style="color:var(--text3);font-size:12px;margin-right:4px;flex-shrink:0">✓</span>':'')
        +chev
        +`<span style="font-size:${isP?'13':'12'}px;font-weight:${isP?'600':'400'};overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1${done?';text-decoration:line-through':''}">${esc(t.title)||'（無題）'}</span>`
        +doneBadge
        +'</div>';
      let barHtml='';
      const planStart=t.plannedStartAt||t.startAt;
      if(planStart&&t.dueAt){
        const bx=d2px(planStart),bw=Math.max(d2px(t.dueAt)+pxPerDay-bx,8);
        const bh=isP?14:16,bt=(ROW_H-bh)/2;
        const proj=S.projects.find(p=>p.id===t.projectId);
        const barCol=done?'#9ca3af':(proj?.color||'var(--accent)');
        const op=done?'0.5':'1';
        barHtml=`<div class="gantt-bar-wrap" data-task-id="${t.id}" style="position:absolute;left:${bx}px;width:${bw}px;height:${ROW_H}px;top:0;z-index:1">`
          +`<div style="position:absolute;left:0;right:0;height:${bh}px;top:${bt}px;background:${barCol};opacity:${op};border-radius:3px;overflow:hidden${done?';background-image:repeating-linear-gradient(-45deg,rgba(255,255,255,.15) 0,rgba(255,255,255,.15) 4px,transparent 4px,transparent 8px)':''}" title="${esc(t.title)}">`
          +`<span class="gantt-bar-label">${done?'✓ ':''} ${esc(t.title)}</span>`
          +'</div>'
          
          
          +'</div>';
        // 完了日マーカー
        if(done&&t.completedAt){
          const cx=d2px(t.completedAt.slice(0,10));
          const cd=new Date(t.completedAt);
          const cdLabel=`${cd.getMonth()+1}/${cd.getDate()}`;
          barHtml+=`<div style="position:absolute;left:${cx}px;top:0;width:3px;height:${ROW_H}px;background:#10b981;opacity:.9;z-index:2;border-radius:1px" title="完了日: ${cdLabel}"></div>`;
          barHtml+=`<div style="position:absolute;left:${cx+5}px;top:50%;transform:translateY(-50%);font-size:10px;color:#10b981;font-weight:700;z-index:2;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.15)" title="完了日">✓${cdLabel}</div>`;
        }
      } else if(t.dueAt){
        // plannedStartAtもstartAtもない場合：期限日のみをひし形マーカーで表示
        const cx=d2px(t.dueAt)+pxPerDay/2;
        const proj=S.projects.find(p=>p.id===t.projectId);
        const col=proj?.color||'var(--accent)';
        barHtml=`<div style="position:absolute;left:${cx-8}px;top:${(ROW_H-16)/2}px;width:16px;height:16px;background:${col};transform:rotate(45deg);border-radius:2px;opacity:.8" title="${esc(t.title)}（期限のみ）"></div>`;
      }
      barRows+=`<div style="position:relative;height:${r.h}px;border-bottom:1px solid var(--border)${done?';background:rgba(0,0,0,.02)':''}">${barHtml}</div>`;
    }
  });

  const scales=[['day','日'],['week','週'],['month','月'],['year','年']];
  const scaleBtns=scales.map(([k,l])=>`<button class="gantt-scale-btn${scale===k?' on':''}" data-a="gantt-scale" data-scale="${k}">${l}</button>`).join('');

  return `<div class="gantt-outer">`
    +`<div class="gantt-toolbar"><div style="display:flex;gap:4px">${scaleBtns}</div>${S.ganttProjFilter?`<div style="display:flex;align-items:center;gap:4px;margin-left:8px;padding:2px 8px;background:var(--accent-bg);border-radius:6px;font-size:12px;color:var(--accent);border:1px solid var(--accent)">${esc(S.projects.find(p=>p.id===S.ganttProjFilter)?.name||'')} <button data-a="gantt-clear-proj-filter" style="background:none;border:none;cursor:pointer;color:var(--accent);font-size:14px;padding:0;line-height:1" title="絞り込み解除">×</button></div>`:''}<div style="display:flex;gap:4px;margin-left:auto"><button class="gantt-scale-btn" data-a="gantt-expand-all" title="全て展開">全開</button><button class="gantt-scale-btn" data-a="gantt-collapse-all" title="全て折りたたむ">全閉</button></div><button class="gantt-help-btn" data-a="gantt-help" style="margin-left:6px">？</button></div>`
    +`<div class="gantt-area" id="gantt-area">`
      +`<div class="gantt-names-col" style="width:${NAMES_W}px">`
        +`<div class="gantt-name-head">タスク</div>`
        +nameRows
      +`</div>`
      +`<div class="gantt-timeline-col" style="min-width:${timelineW}px">`
        +`<div class="gantt-date-head">${headCells}</div>`
        +`<div class="gantt-bars-area" style="width:${timelineW}px;height:${totalH}px">`
          +buildGanttDividers(scale,minD,maxD,d2px,totalH)
          +`<div class="gantt-today-line" id="gantt-today" style="left:${todayX}px;height:${totalH}px"></div>`
          +barRows
        +`</div>`
      +`</div>`
    +`</div>`
  +`</div>`;
}
function scrollGanttToToday(){
  requestAnimationFrame(()=>{
    const area=document.getElementById('gantt-area');
    const line=document.getElementById('gantt-today');
    if(area&&line){area.scrollLeft=Math.max(0,parseFloat(line.style.left)-300);}
  });
}

// ===== VIEW別フィルタ既定値 =====
// Nextビューは「今やる次のアクション」を見るビューなので、開いた時点のフィルタ既定を
// 現在ON（開始前を除外）／共有OFF（共有PJを除外）にする。
// フィルタ状態（hideNotStarted / showShared）は全ビュー共通のグローバル状態なので、
// Nextに入る直前の値を退避し、Nextから離れたときに元へ戻す（他ビューへ副作用を残さない）。
let _vfLastView=null;
let _vfSavedFilter=null;
function applyViewFilterDefaults(v){
  if(v===_vfLastView)return;
  const prev=_vfLastView;
  _vfLastView=v;
  if(v==='nextview'){
    if(prev!=='nextview')_vfSavedFilter={hideNotStarted:S.hideNotStarted,showShared:S.showShared};
    S.hideNotStarted=true;
    S.showShared=false;
  }else if(prev==='nextview'&&_vfSavedFilter){
    S.hideNotStarted=_vfSavedFilter.hideNotStarted;
    S.showShared=_vfSavedFilter.showShared;
    _vfSavedFilter=null;
  }
}

// ===== RENDER CONTENT =====
function renderContent(){
  const el=document.getElementById('content');
  applyViewFilterDefaults(S.view);
  const titles={dashboard:'Dashboard',inbox:'Inbox',today:'Today',overdue:'Overdue',upcoming:'Upcoming',forecast:'Forecast',flagged:'Flagged',assigned:'Assigned',review:'Review',search:'Search',completed:'Logbook',notes:'Notes',nextview:'Next',gantt:'Gantt',
    project:S.projects.find(p=>p.id===S.projId)?.name||'',
    tag:S.tagId==='__none__'?'タグなし':S.tags.find(t=>t.id===S.tagId)?.name||'',
    'forecast-day':S.forecastDate?fmtDate(S.forecastDate)+'の予定':'Forecast'};
  document.getElementById('viewTitle').textContent=titles[S.view]||'';
  // global-srch の値をS.searchと同期
  const gs=document.getElementById('global-srch');
  if(gs&&gs.value!==S.search)gs.value=S.search;
  // モバイル: 検索ビュー以外ではsrch展開状態をリセットしてタイトルを復元
  if(S.view!=='search'&&window.innerWidth<=768){
    const wrap=document.getElementById('global-srch-wrap');
    const topbar=wrap?.closest('.topbar');
    if(wrap?.classList.contains('srch-expanded')){
      wrap.classList.remove('srch-expanded');
      topbar?.classList.remove('srch-active');
    }
  }

  // qabarを表示/非表示
  const qabar=document.getElementById('qabar');
  if(qabar){
    const qaHidden=['search','forecast','review','completed','notes','gantt'];
    if(qaHidden.includes(S.view)){qabar.style.display='none';}
    else if(window.innerWidth<=768){qabar.style.display='';}
    else{qabar.style.display='';}
  }

  // notes・search以外ではnoteドロワーを閉じる
  // ただしタスク詳細ドロワーが開いているべき状態（S.drawerOpen&&S.taskId）では隠さない。
  // NOTEを開いた後にタスク系ビューへ移動するとS.noteOpenがtrueのまま残留するため、
  // ここで無条件に隠すと、メモ自動保存後のrenderContent()単独呼び出し（renderDrawerなし）で
  // タスク詳細が消え、mainのmaxWidthだけ残って画面右側が真っ白になる（PCビュー）
  if(S.view!=='notes'&&S.view!=='search'){const dr=document.getElementById('drawer');if(dr&&S.noteOpen){const _ct3=document.getElementById('content');if(_ct3)_ct3.style.overflow='';if(!(S.drawerOpen&&S.taskId)){dr.style.display='none';dr.classList.remove('open');const _m3=document.querySelector('.main');if(_m3)_m3.style.maxWidth='';}}}

  if(S.view==='dashboard'){el.innerHTML=renderDashboard();attachDashboardEvents();return}
  renderTaskFilters();
  if(S.view==='forecast'){el.innerHTML=renderForecast();return}
  if(S.view==='forecast-day'){
    el.innerHTML='<div style="padding:10px 14px 0"><button data-a="view" data-v="forecast" style="font-size:13px;color:var(--accent);background:none;border:none;cursor:pointer;padding:4px 0;display:flex;align-items:center;gap:3px">‹ Forecastに戻る</button></div>'+renderList();
    initTaskSwipe(el);
    return;
  }
  if(S.view==='review'){el.innerHTML=renderReview();return}
  if(S.view==='search'){el.innerHTML=renderSearch();if(S.noteOpen)renderNoteDrawer();return}
  if(S.view==='notes'){el.innerHTML=renderNoteList();renderNoteDrawer();
    const nc=document.getElementById('note-list-items');if(nc)initNoteSwipe(nc);
    return}
  if(S.view==='nextview'){el.innerHTML=renderNextView();renderTaskFilters();initTaskSwipe(el);return}
  if(S.view==='gantt'){
    // ガントチャートはスタンダードプラン以上（LP記載通りにゲート）
    // ガントチャートは全プラン利用可能
    // スクロール位置を保持してGantt再描画（初回のみ今日へスクロール）
    const _ganttArea=document.getElementById('gantt-area');
    const _isFirstRender=!_ganttArea; // gantt-areaがまだなければ初回
    const _prevScrollLeft=_ganttArea?_ganttArea.scrollLeft:0;
    const _prevScrollTop=_ganttArea?_ganttArea.scrollTop:0;
    el.innerHTML=renderGantt();
    setupGanttDrag();
    requestAnimationFrame(()=>{
      const a=document.getElementById('gantt-area');
      if(!a)return;
      if(_isFirstRender){
        scrollGanttToToday();
      } else {
        a.scrollLeft=_prevScrollLeft;
        a.scrollTop=_prevScrollTop;
      }
    });
    return;
  }
  el.innerHTML=renderList();
  if(S.view==='project')setupSectionDrag();
  initTaskSwipe(el);
}


// ===== GANTT DRAG & DROP（同一プロジェクト内の親タスク並び替え）=====
function setupGanttDrag(){
  const namesCol=document.querySelector('.gantt-names-col');
  if(!namesCol)return;
  // iPadはinnerWidthが大きくてもタッチデバイスなのでontouchstartで判定
  const isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0;

  if(!isTouch){
    // ── PC(マウス): HTML5 D&D ──
    let dragId=null,dragProjId=null;
    namesCol.querySelectorAll('[data-gantt-drag]').forEach(handle=>{
      const row=handle.closest('[data-a="gantt-open"]');
      if(!row)return;
      handle.addEventListener('mousedown',()=>row.setAttribute('draggable','true'));
      row.addEventListener('dragend',()=>{row.removeAttribute('draggable');_clearGanttInd();dragId=null;});
    });
    namesCol.addEventListener('dragstart',e=>{
      const row=e.target.closest('[data-a="gantt-open"]');
      if(!row)return;
      dragId=row.dataset.id;dragProjId=row.dataset.projId;
      setTimeout(()=>row.classList.add('dragging'),0);
      e.dataTransfer.effectAllowed='move';
    });
    namesCol.addEventListener('dragover',e=>{
      if(!dragId)return;
      e.preventDefault();_clearGanttInd();
      const row=e.target.closest('[data-a="gantt-open"]');
      if(!row||row.dataset.id===dragId||row.dataset.projId!==dragProjId)return;
      const r=row.getBoundingClientRect();
      row.classList.add(e.clientY<r.top+r.height/2?'drop-before':'drop-after');
    });
    namesCol.addEventListener('drop',async e=>{
      e.preventDefault();
      const row=e.target.closest('[data-a="gantt-open"]');
      const id=dragId,projId=dragProjId;dragId=null;dragProjId=null;
      if(!row||row.dataset.id===id||row.dataset.projId!==projId)return;
      const r=row.getBoundingClientRect();
      await _applyGanttDrop(id,row.dataset.id,e.clientY<r.top+r.height/2?'before':'after',projId);
    });

  } else {
    // ── タッチ(iPad/iPhone): documentレベルでtouchを拾う ──
    let ghost=null,dragId=null,dragProjId=null,dragging=false,lpTimer=null,activeEl=null;
    let startX=0,startY=0;
    const LONG_MS=480,MOVE_LIM=10;

    function spawnGhostG(el,ty){
      const rect=el.getBoundingClientRect();
      ghost=el.cloneNode(true);
      Object.assign(ghost.style,{
        position:'fixed',zIndex:'9999',opacity:'.88',pointerEvents:'none',
        width:rect.width+'px',left:rect.left+'px',top:(ty-rect.height/2)+'px',
        boxShadow:'0 8px 28px rgba(0,0,0,.25)',borderRadius:'8px',
        background:'var(--bg)',transform:'scale(1.03)',transition:'none'
      });
      document.body.appendChild(ghost);
      el.style.opacity='.3';
      activeEl=el;
    }
    function cancelG(){
      clearTimeout(lpTimer);
      if(ghost){ghost.remove();ghost=null;}
      if(activeEl){activeEl.style.opacity='';activeEl=null;}
      _clearGanttInd();
      dragging=false;dragId=null;dragProjId=null;
    }

    // touchstartをdocumentで拾ってganstt-open行を判定
    function onTouchStart(e){
      if(e.touches.length>1){cancelG();return;}
      const t=e.touches[0];
      startX=t.clientX;startY=t.clientY;
      const handle=e.target.closest('[data-gantt-drag]');
      const row=e.target.closest('[data-a="gantt-open"]');
      if(!row)return;
      if(handle){
        // ハンドル直接タップ → 即ドラッグ
        e.preventDefault();
        dragId=row.dataset.id;dragProjId=row.dataset.projId;
        dragging=true;navigator.vibrate?.(30);
        spawnGhostG(row,t.clientY);
      } else {
        // 行長押し → ドラッグ
        lpTimer=setTimeout(()=>{
          if(dragging)return;
          _cancelLp();
          navigator.vibrate?.(40);
          dragId=row.dataset.id;dragProjId=row.dataset.projId;
          dragging=true;spawnGhostG(row,startY);
        },LONG_MS);
      }
    }
    function onTouchMove(e){
      const t=e.touches[0];
      if(!dragging){
        if(Math.abs(t.clientX-startX)>MOVE_LIM||Math.abs(t.clientY-startY)>MOVE_LIM)clearTimeout(lpTimer);
        return;
      }
      e.preventDefault();
      if(ghost)ghost.style.top=(t.clientY-ghost.offsetHeight/2)+'px';
      _clearGanttInd();
      // ghostをポインターイベント無効にして下の要素を取得
      const el=document.elementFromPoint(t.clientX,t.clientY);
      const target=el?.closest('[data-a="gantt-open"]');
      if(target&&target!==activeEl&&target.dataset.projId===dragProjId){
        const r=target.getBoundingClientRect();
        target.classList.add(t.clientY<r.top+r.height/2?'drop-before':'drop-after');
      }
    }
    async function onTouchEnd(e){
      clearTimeout(lpTimer);
      const was=dragging;
      const t=e.changedTouches[0];
      // ghostを先に非表示にしてからelementFromPointで正確な要素を取得
      if(ghost){ghost.style.display='none';}
      const el=document.elementFromPoint(t.clientX,t.clientY);
      if(ghost){ghost.remove();ghost=null;}
      if(activeEl){activeEl.style.opacity='';activeEl=null;}
      if(!was){dragging=false;dragId=null;dragProjId=null;_clearGanttInd();return;}
      dragging=false;
      const id=dragId,projId=dragProjId;dragId=null;dragProjId=null;
      // drop-before/drop-afterのついた行を優先して使う
      const marked=document.querySelector('[data-a="gantt-open"].drop-before,[data-a="gantt-open"].drop-after');
      const target=marked||el?.closest('[data-a="gantt-open"]');
      if(target&&target.dataset.id!==id&&target.dataset.projId===projId){
        const pos=target.classList.contains('drop-before')?'before':'after';
        _clearGanttInd();
        await _applyGanttDrop(id,target.dataset.id,pos,projId);
      } else _clearGanttInd();
    }

    // namesColにpassive:falseでまとめてバインド
    namesCol.addEventListener('touchstart',onTouchStart,{passive:false});
    namesCol.addEventListener('touchmove',onTouchMove,{passive:false});
    namesCol.addEventListener('touchend',onTouchEnd,{passive:true});
    // touchendがnamesCol外で起きた場合もdocumentで拾う
    document.addEventListener('touchend',async e=>{
      if(!dragging)return;
      await onTouchEnd(e);
    },{passive:true});
    namesCol.addEventListener('touchcancel',cancelG,{passive:true});
    document.addEventListener('touchcancel',cancelG,{passive:true});
  }
}

function _clearGanttInd(){
  document.querySelectorAll('.drop-before,.drop-after,.dragging').forEach(el=>{
    el.classList.remove('drop-before','drop-after','dragging');
  });
}

// ===== GANTT バードラッグ（計画開始日・期限日変更）=====
// ガントバードラッグ用グローバルAbortController（render()のたびに累積しないよう管理）

async function _applyGanttDrop(dragId,targetId,pos,projId){
  _clearGanttInd();
  const task=S.tasks.find(t=>t.id===dragId);
  const tt=S.tasks.find(t=>t.id===targetId);
  if(!task||!tt||task.projectId!==tt.projectId)return; // 安全チェック
  // 同プロジェクトの親タスクのみ対象
  const projTasks=S.tasks
    .filter(t=>t.projectId===projId&&!t.parentTaskId&&t.id!==dragId)
    .sort((a,b)=>(a.order||0)-(b.order||0));
  const ti=projTasks.findIndex(t=>t.id===targetId);
  if(ti<0)return;
  const idx=pos==='before'?ti:ti+1;
  projTasks.splice(idx,0,task);
  for(let i=0;i<projTasks.length;i++){
    projTasks[i].order=(i+1)*1000;
    await saveTask(projTasks[i]);
  }
  render();
}

// ===== SECTION DRAG & DROP =====
function setupSectionDrag(){
  const content=document.getElementById('content');
  if(!content)return;

  if(content._secDragAC)content._secDragAC.abort();
  const ac=new AbortController();
  content._secDragAC=ac;
  const sig=ac.signal;

  const isMobile=window.innerWidth<=768;

  // ── helpers ──────────────────────────────────────────
  function clearInd(){
    content.querySelectorAll('.drag-over,.drop-before,.drop-after,.drop-sec-before,.drop-sec-after,.sec-dragging,.dragging').forEach(el=>{
      el.classList.remove('drag-over','drop-before','drop-after','drop-sec-before','drop-sec-after','sec-dragging','dragging');
    });
  }
  // ── apply task drop (reorder) ─────────────────────────
  async function applyTaskDrop(taskId,targetEl,pos){
    clearInd();
    if(!taskId||!targetEl||pos==='sec')return;
    const task=S.tasks.find(t=>t.id===taskId);
    if(!task)return;
    const targetTaskId=targetEl.dataset.id;
    const tt=S.tasks.find(t=>t.id===targetTaskId);
    if(!tt)return;
    const allTasks=getTasks().filter(t=>!t.parentTaskId&&t.id!==taskId);
    const ti=allTasks.findIndex(t=>t.id===targetTaskId);
    let idx=pos==='before'?ti:ti+1;
    if(idx<0)idx=0;
    allTasks.splice(idx,0,task);
    for(let i=0;i<allTasks.length;i++){
      allTasks[i].order=(i+1)*1000;
      await saveTask(allTasks[i]);
    }
    renderContent();
  }

  // ════════════════════════════════════════════════════
  if(!isMobile){
    // ── PC: HTML5 Drag & Drop ──────────────────────────
    let dragId=null;

    content.querySelectorAll('.trow[data-id]').forEach(r=>{
      const h=r.querySelector('.task-drag-handle[data-drag-task]');
      if(h){
        h.addEventListener('mousedown',()=>r.setAttribute('draggable','true'));
        r.addEventListener('dragend',()=>r.removeAttribute('draggable'));
      } else {
        r.setAttribute('draggable','true');
      }
    });

    content.addEventListener('dragstart',e=>{
      const row=e.target.closest('.trow[data-id]');
      if(row){
        dragId=row.dataset.id;
        setTimeout(()=>row.classList.add('dragging'),0);
        e.dataTransfer.effectAllowed='move';
      } else {e.preventDefault();}
    },{signal:sig});

    content.addEventListener('dragend',()=>{clearInd();dragId=null;},{signal:sig});

    content.addEventListener('dragover',e=>{
      if(!dragId)return;
      e.preventDefault();clearInd();
      const row=e.target.closest('.trow[data-id]');
      if(row&&row.dataset.id!==dragId){
        const r=row.getBoundingClientRect();
        row.classList.add(e.clientY<r.top+r.height/2?'drop-before':'drop-after');
        e.dataTransfer.dropEffect='move';
      }
    },{signal:sig});

    content.addEventListener('drop',async e=>{
      e.preventDefault();
      const row=e.target.closest('.trow[data-id]');
      const id=dragId;dragId=null;
      if(row&&row.dataset.id!==id){
        const r=row.getBoundingClientRect();
        const pos=e.clientY<r.top+r.height/2?'before':'after';
        await applyTaskDrop(id,row,pos);
      }
    },{signal:sig});

  }

  // タッチ対応端末（iPadなど）かどうか。iPadは画面幅だけではisMobile=falseになるが、
  // 直接指でタッチ操作することも多いため、幅に関わらずタッチドラッグも併用できるようにする。
  // ※直接タッチ時はtouchstartでpreventDefault()するため、ブラウザが合成するmousedownは
  //   発火しなくなり、上のPC用ドラッグ(mousedown起点)とは競合しない。
  // ※トラックパッド/マウスのクリックは本物のmousedownなので、引き続き上のPC用ドラッグが
  //   機能する。
  const _touchCapable=('ontouchstart' in window)||navigator.maxTouchPoints>0;
  if(isMobile||_touchCapable){
    // ── モバイル/タッチ対応端末: 長押しタッチドラッグ ──────────────────────
    let ghost=null,dtype=null,dragId=null,dragSecId=null;
    let startX=0,startY=0,dragging=false,lpTimer=null,activeEl=null;
    const LONG_MS=480,MOVE_LIM=12;

    function spawnGhost(el,ty){
      window.__taskDragging=true;
      const rect=el.getBoundingClientRect();
      ghost=el.cloneNode(true);
      Object.assign(ghost.style,{
        position:'fixed',zIndex:'9999',opacity:'.85',pointerEvents:'none',
        width:rect.width+'px',left:rect.left+'px',top:(startY-rect.height/2)+'px',
        boxShadow:'0 8px 28px rgba(0,0,0,.25)',borderRadius:'8px',
        transform:'scale(1.03)',transition:'none',background:'var(--surface)'
      });
      ghost.classList.add('drag-ghost-fixed');
      document.body.appendChild(ghost);
      el.style.opacity='.3';
      activeEl=el;
      window.__activeDragEl=el;
      dtype=ty;
    }

    function cancelAll(){
      clearTimeout(lpTimer);
      window.__taskDragging=false;
      if(ghost){ghost.remove();ghost=null;}
      if(activeEl){activeEl.style.opacity='';activeEl=null;}
      if(window.__activeDragEl){window.__activeDragEl.style.opacity='';window.__activeDragEl=null;}
      clearInd();dragging=false;dtype=null;dragId=null;dragSecId=null;
    }

    // ドキュメントレベルのフォールバック（scroll等でtouchendが届かなかった場合のゴースト残留防止）
    document.addEventListener('touchend',()=>{if(ghost||dragging)cancelAll();},{signal:sig,passive:true});
    document.addEventListener('touchcancel',()=>cancelAll(),{signal:sig,passive:true});

    // task rows – ドラッグハンドル経由なら即ドラッグ開始、行直接タップは長押し維持（タイトル編集用）
    content.querySelectorAll('.trow[data-id]').forEach(row=>{
      // ── ハンドルタップ → 即ドラッグ（長押し不要） ──
      const handle=row.querySelector('.task-drag-handle[data-drag-task]');
      if(handle){
        handle.addEventListener('touchstart',e=>{
          if(e.touches.length>1){cancelAll();return;}
          e.preventDefault();e.stopPropagation();
          const t=e.touches[0];startX=t.clientX;startY=t.clientY;
          dragging=true;navigator.vibrate?.(30);
          dragId=row.dataset.id;spawnGhost(row,'task');
        },{signal:sig,passive:false});
      }
      // passive:false にして touchmove 内での e.preventDefault() を有効化（iOS scroll乗っ取り防止）
      row.addEventListener('touchstart',e=>{
        if(dragging)return;
        if(e.target.closest('.task-drag-handle'))return;// ハンドルはハンドル側で処理
        if(e.target.closest('.task-check,.task-flag,.cm-del'))return;// チェック・フラグ等は除外
        if(e.touches.length>1){cancelAll();return;}
        const t=e.touches[0];startX=t.clientX;startY=t.clientY;
        // 長押しでドラッグ開始
        lpTimer=setTimeout(()=>{
          if(dragging)return;
          _cancelLp(); // コンテキストメニューをキャンセル
          navigator.vibrate?.(40);
          dragId=row.dataset.id;
          dragging=true;
          spawnGhost(row,'task');
        },LONG_MS);
      },{signal:sig,passive:false});

      row.addEventListener('touchmove',e=>{
        const t=e.touches[0];
        if(!dragging){
          if(Math.abs(t.clientX-startX)>MOVE_LIM||Math.abs(t.clientY-startY)>MOVE_LIM)clearTimeout(lpTimer);
          return;
        }
        e.preventDefault();
        if(ghost)ghost.style.top=(t.clientY-ghost.offsetHeight/2)+'px';
        clearInd();ghost.style.pointerEvents='none';
        const el=document.elementFromPoint(t.clientX,t.clientY);
        const row2=el?.closest('.trow[data-id]');
        if(row2&&row2.dataset.id!==dragId){
          const r=row2.getBoundingClientRect();
          row2.classList.add(t.clientY<r.top+r.height/2?'drop-before':'drop-after');
        }
      },{signal:sig,passive:false});

      row.addEventListener('touchend',async e=>{
        clearTimeout(lpTimer);
        const wasDragging=dragging;
        if(ghost){ghost.remove();ghost=null;}
        if(activeEl){activeEl.style.opacity='';activeEl=null;}
        if(!wasDragging){dragging=false;dragId=null;dtype=null;return;}
        dragging=false;
        const t=e.changedTouches[0];
        const el=document.elementFromPoint(t.clientX,t.clientY);
        const row2=el?.closest('.trow[data-id]');
        const id=dragId;dragId=null;dtype=null;
        if(row2&&row2.dataset.id!==id){
          const r=row2.getBoundingClientRect();
          await applyTaskDrop(id,row2,t.clientY<r.top+r.height/2?'before':'after');
        }
      },{signal:sig});
      row.addEventListener('touchcancel',()=>cancelAll(),{signal:sig,passive:true});
    });
  }
}

function renderNoteListOnly(){
  const terms=searchTerms(S.noteSearch);
  const sortKey=S.noteSortUpdated!==false?'updatedAt':'createdAt';
  let notes=[...S.notes].filter(n=>!terms.length||matchesSearch(n.title+n.body,terms));
  if(S.filterTagIds&&S.filterTagIds.length){
    if(S.filterTagIds.includes('__none__'))notes=notes.filter(n=>!n.tagIds||n.tagIds.length===0);
    else notes=notes.filter(n=>S.filterTagIds.every(id=>n.tagIds&&n.tagIds.includes(id)));
  }
  notes.sort((a,b)=>b[sortKey].localeCompare(a[sortKey]));
  let h='';
  if(!notes.length){
    h='<div class="empty"><div class="empty-ico">📝</div><div class="empty-t">'+(terms.length?'該当なし':'メモなし')+'</div></div>';
  } else {
    notes.forEach(n=>{h+=renderNoteRow(n);});
  }
  const container=document.getElementById('note-list-items');
  if(container){container.innerHTML=h;initNoteSwipe(container);}
}

function renderRow(task){
  const subs=S.tasks.filter(t=>t.parentTaskId===task.id).sort((a,b)=>(a.order||0)-(b.order||0));
  const done=task.status==='completed';
  const notStarted=!done&&isNotStartedTask(task);
  const pclass=task.priority<4?'p'+task.priority:'';
  const isSel=S.selectedIds.includes(task.id);
  const subsOpen=subs.length>0&&!!S.openSubs[task.id];
  let meta='';
  if(task.startAt&&task.startAt!==task.dueAt){
    const cls=isToday(task.startAt)?'td':isSoon(task.startAt)?'sn':'';
    const timeLabel=(task.startTime&&isToday(task.startAt))?' '+task.startTime:'';
    meta+='<span class="mc'+( cls?' '+cls:'')+'">🚀 '+fmtDate(task.startAt)+timeLabel+'</span>';
  }
  if(task.dueAt){
    const cls=isOv(task.dueAt)?'ov':isToday(task.dueAt)?'td':isSoon(task.dueAt)?'sn':'';
    meta+='<span class="mc'+( cls?' '+cls:'')+'">⏰ '+fmtDate(task.dueAt)+'</span>';
  }
  if(task.projectId&&S.view!=='project'){
    const p=S.projects.find(x=>x.id===task.projectId);
    if(p)meta+='<span class="mc proj-nav-chip" data-a="go-proj" data-id="'+p.id+'" style="background:'+p.color+'1a;color:'+p.color+';cursor:pointer" title="'+esc(p.name)+'に移動">'+(p.workspaceId?'👥 ':'')+esc(p.name)+'</span>';
  }
  if(task.tagIds&&task.tagIds.length){
    task.tagIds.slice(0,2).forEach(tid=>{
      const t=S.tags.find(x=>x.id===tid);
      if(t)meta+='<span class="mc" style="background:'+t.color+'1a;color:'+t.color+'">#'+esc(t.name)+'</span>';
    });
  }
  if(task.repeatRule){
    const _rl=task.repeatRule;
    const _DMAP={sun:'日',mon:'月',tue:'火',wed:'水',thu:'木',fri:'金',sat:'土'};
    const _rlLabel=_rl==='daily'?'毎日':_rl==='weekdays'?'平日':_rl==='weekly'?'毎週':_rl==='yearly'?'毎年'
      :_rl==='weekly:mon,tue,wed,thu,fri'?'平日'
      :(_rl==='weekly:sat,sun'||_rl==='weekly:sun,sat')?'休日'
      :_rl.startsWith('weekly:')?'毎週('+_rl.slice(7).split(',').map(d=>_DMAP[d]||d).join('・')+')'
      :_rl.startsWith('monthly:')?'毎月'+_rl.slice(8).split(',').join('・')+'日':'毎月';
    meta+='<span class="mc" title="'+_rlLabel+'">↻ '+_rlLabel+'</span>';
  }
  if(task.flagged)meta+='<span>🚩</span>';
  if(S.commentCounts[task.id])meta+='<button class="mc" data-a="task-comment-jump" data-id="'+task.id+'" title="コメント'+S.commentCounts[task.id]+'件・最新コメントへ" style="background:none;border:none;cursor:pointer;color:var(--accent);font:inherit;font-size:11px">💬 '+S.commentCounts[task.id]+'</button>';
  if(task.assigneeId){
    const _aProj=S.projects.find(p=>p.id===task.projectId);
    const _aWsId=_aProj?.workspaceId;
    const _aMember=_aWsId?(S.wsMembers[_aWsId]||[]).find(m=>m.user_id===task.assigneeId):null;
    if(_aMember){
      const _aAv=_aMember.user_avatar
        ?`<img src="${esc(_aMember.user_avatar)}" style="width:16px;height:16px;border-radius:50%;object-fit:cover;vertical-align:middle">`
        :`<span style="display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:var(--accent);color:#fff;font-size:9px;font-weight:700">${esc((_aMember.user_name||'?').charAt(0).toUpperCase())}</span>`;

    }
  }
  if(subs.length){

    meta+='<button class="mc sub-toggle-btn" data-a="tog-subs" data-id="'+task.id+'" title="サブタスクを展開"><span class="sub-chev'+(subsOpen?' open':'')+'">▶</span>'+dc+'/'+subs.length+'</button>';
  }
  const updStr=task.updatedAt?'<span class="mc" style="margin-left:auto">✏️ '+fmtDate(task.updatedAt.slice(0,10))+'</span>':'';

  let html=(!S.selectMode?'<div class="note-swipe-wrap" data-task-swipe-id="'+task.id+'">'
    +'<div class="task-swipe-complete-bg">✓ 完了</div>'
    +'<div class="note-swipe-inner">':'')
  +'<div class="trow'+(done?' done':'')+(S.taskId===task.id&&!S.selectMode?' sel':'')+(pclass?' '+pclass:'')+(isSel?' bulk-sel':'')+'" data-a="sel" data-id="'+task.id+'" data-order="'+(task.order||0)+'">'
    +(!S.selectMode?'<span class="task-drag-handle" data-drag-task="'+task.id+'" title="ドラッグで並び替え" ontouchstart="event.stopPropagation()">⠿</span>':'')
    +'<button class="chk'+(done?' done':'')+'" data-a="chk" data-id="'+task.id+'"'+(S.selectMode?' style="pointer-events:none"':'')+' >'+(done?'✓':'')+'</button>'
    +'<div class="tbody">'
      +(task.parentTaskId&&['today','flagged','overdue'].includes(S.view)?(()=>{const pt=S.tasks.find(t=>t.id===task.parentTaskId);return pt?'<div style="font-size:11px;color:var(--text3);margin-bottom:1px;display:flex;align-items:center;gap:3px"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>'+esc(pt.title||'無題')+'</div>':''})():'')
      +'<div class="ttitle'+(subs.length>0?' has-subs':'')+'" data-title-edit="'+task.id+'"'+(notStarted?' style="color:var(--text3)"':'')+'>'+( task.title?esc(task.title):'<span style="color:var(--text3)">無題</span>')+'</div>'
      +'<div class="tmeta">'+(meta||'')+updStr+'</div>'
    +'</div>'
    +(S.selectMode?'':
      '<button class="trow-expand-btn" data-a="task-expand" data-id="'+task.id+'" title="大きく表示">'
        +'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>'
      +'</button>'
      +'<button class="trow-edit-btn" data-a="sel-edit" data-id="'+task.id+'" title="詳細">'
        +'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>'
      +'</button>')
  +'</div>'
  +(!S.selectMode?'</div></div>':'');
  if(subs.length){
    html+='<div class="sub-rows'+(subsOpen?' open':'')+'" id="sub-rows-'+task.id+'">';
    html+=subs.map(s=>'<div style="padding-left:28px">'+renderRow(s)+'</div>').join('');
    html+='</div>';
  }
  return html;
}

async function loadNotifications() {
  const SB = window._SB;
  const uid = window._currentUser?.id;
  if (!SB || !uid) return [];
  const { data, error } = await SB
    .from('notifications')
    .select('*')
    .eq('user_id', uid)
    .order('created_at', { ascending: false })
    .limit(50);
  if (error) { console.error('loadNotifications', error); return []; }
  _notifCache = data || [];
  return _notifCache;
}

async function markNotifRead(id) {
  const SB = window._SB;
  if (!SB) return;
  await SB.from('notifications').update({ read: true }).eq('id', id);
  if (_notifCache) {
    const n = _notifCache.find(x => x.id === id);
    if (n) n.read = true;
  }
}

function renderDashboard() {
  const today = new Date().toISOString().slice(0, 10);
  const uid = window._currentUser?.id;

  // 期限切れ
  const overdue = S.tasks.filter(t => t.status !== 'completed' && t.status !== 'archived' && t.dueAt && t.dueAt < today)
    .sort((a, b) => a.dueAt > b.dueAt ? 1 : -1);

  // 今日
  const todayTasks = S.tasks.filter(t => t.status !== 'completed' && t.status !== 'archived' && t.dueAt === today)
    .sort((a, b) => (a.order || 0) - (b.order || 0));

  // Inbox（status='inbox' かつ サブタスクでないもの）
  const inboxTasks = S.tasks.filter(t => t.status === 'inbox' && !t.parentTaskId)
    .sort((a, b) => (a.order || 0) - (b.order || 0));

  // 自分が担当のタスク
  const myTasks = uid ? S.tasks.filter(t => t.status !== 'completed' && t.status !== 'archived' && t.assigneeId === uid)
    .sort((a, b) => (a.dueAt || '9') > (b.dueAt || '9') ? 1 : -1) : [];

  // Flagged
  const flagged = S.tasks.filter(t => t.status !== 'completed' && t.status !== 'archived' && t.flagged)
    .sort((a, b) => (a.order || 0) - (b.order || 0));

  function taskChip(t) {
    const proj = S.projects.find(p => p.id === t.projectId);
    const isOv = t.dueAt && t.dueAt < today;
    const subs = S.tasks.filter(s => s.parentTaskId === t.id);
    const subsTotal = subs.length;
    const subsDone = subs.filter(s => s.status === 'completed').length;
    const isParent = subsTotal > 0;
    return `<div class="db-task-row" data-id="${t.id}" style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border)">
      <button class="chk" data-a="db-complete" data-id="${t.id}" style="flex-shrink:0;width:20px;height:20px;border-radius:50%;border:2px solid var(--border);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;touch-action:manipulation"></button>
      <div style="flex:1;min-width:0;cursor:pointer" data-a="db-open" data-id="${t.id}">
        <div style="font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;${isParent ? 'font-weight:700' : ''}">${esc(t.title || '無題')}</div>
        <div style="display:flex;gap:4px;flex-wrap:wrap;align-items:center;margin-top:2px">
          ${proj ? `<span style="font-size:11px;color:${proj.color};background:${proj.color}1a;border-radius:4px;padding:1px 5px">${proj.workspaceId ? '👥 ' : ''}${esc(proj.name)}</span>` : ''}
          ${t.dueAt ? `<span style="font-size:11px;color:${isOv ? 'var(--p1)' : 'var(--text3)'}">⏰ ${t.dueAt}</span>` : ''}
          ${isParent ? `<span style="font-size:11px;color:${subsDone===subsTotal?'var(--green)':'var(--text3)'};font-weight:600">▶ ${subsDone}/${subsTotal}</span>` : ''}
        </div>
      </div>
    </div>`;
  }

  function section(icon, title, color, items, maxShow, viewName, emptyMsg) {
    const shown = items.slice(0, maxShow);
    const more = items.length - maxShow;
    return `<div class="db-section" style="background:var(--surface);border-radius:12px;padding:14px 16px;margin-bottom:12px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
        <div style="display:flex;align-items:center;gap:6px">
          <span style="font-size:16px">${icon}</span>
          <span style="font-weight:700;font-size:14px;color:${color || 'var(--text)'}">${title}</span>
          ${items.length ? `<span style="font-size:11px;background:${color || 'var(--accent)'};color:#fff;border-radius:10px;padding:1px 7px;font-weight:700">${items.length}</span>` : ''}
        </div>
        ${viewName ? `<button class="db-more-btn" data-view="${viewName}" style="font-size:12px;color:var(--accent);background:none;border:none;cursor:pointer;padding:2px 6px">もっと見る →</button>` : ''}
      </div>
      ${shown.length ? shown.map(taskChip).join('') : `<div style="font-size:13px;color:var(--text3);padding:6px 0">${emptyMsg}</div>`}
      ${more > 0 ? `<div style="font-size:12px;color:var(--text3);padding-top:6px;text-align:center">他 ${more} 件</div>` : ''}
    </div>`;
  }

  // 通知セクション（DBキャッシュ or ロード中）
  const notifs = _notifCache || [];
  // 通知行のHTMLを生成する関数（attachDashboardEventsからも参照）
  window._buildNotifRow=function buildNotifRow(n){
    const dt=new Date(n.created_at);
    const dtStr=dt.toLocaleDateString('ja-JP',{month:'numeric',day:'numeric'})+' '+dt.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});
    return `<div class="db-notif-row" data-notif-id="${n.id}" data-task-id="${n.task_id||''}" style="display:grid;grid-template-columns:auto 1fr auto;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);cursor:pointer;align-items:center;opacity:${n.read?'0.5':'1'}">
      ${n.from_user_avatar?`<img src="${esc(n.from_user_avatar)}" style="width:32px;height:32px;border-radius:50%;object-fit:cover;flex-shrink:0">`:`<div style="width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0">${esc((n.from_user_name||'?').charAt(0))}</div>`}
      <div style="min-width:0">
        <div style="display:flex;align-items:center;gap:4px">
          <span style="font-size:12px;font-weight:600">${esc(n.from_user_name||'')}</span>
          ${n.read?'':'<span style="font-size:9px;background:var(--p1);color:#fff;border-radius:4px;padding:1px 4px">NEW</span>'}
        </div>
        <div style="font-size:12px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(n.body||'')}</div>
      </div>
      <div style="text-align:right;flex-shrink:0;min-width:0">
        <div style="font-size:10px;color:var(--text3);white-space:nowrap">${dtStr}</div>
        ${n.task_title?`<div style="font-size:11px;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100px">→ ${esc(n.task_title)}</div>`:''}
      </div>
    </div>`;
  }
  const _notifInitShow=3;
  const _notifStep=10;
  const unreadCount=notifs.filter(n=>!n.read).length;
  const notifHtml = `<div class="db-section db-notif-list-wrap" style="background:var(--surface);border-radius:12px;padding:14px 16px;margin-bottom:12px">
    <div style="display:flex;align-items:center;gap:6px;margin-bottom:8px">
      <span style="font-size:16px">💬</span>
      <span style="font-weight:700;font-size:14px">メンション通知</span>
      <span id="db-notif-badge" style="font-size:11px;background:var(--p1);color:#fff;border-radius:10px;padding:1px 7px;font-weight:700;display:${unreadCount?'':'none'}">${unreadCount||''}</span>
    </div>
    <div id="db-notif-list">
      ${notifs.length
        ? notifs.slice(0,_notifInitShow).map(window._buildNotifRow).join('')
        : `<div style="font-size:13px;color:var(--text3);padding:6px 0">読み込み中…</div>`}
    </div>
    <button id="db-notif-more" data-shown="${_notifInitShow}" style="width:100%;margin-top:8px;padding:7px 0;font-size:12px;color:var(--accent);background:none;border:1px solid var(--border);border-radius:8px;cursor:pointer;display:${notifs.length>_notifInitShow?'':'none'}">
      ${notifs.length>_notifInitShow?`もっと見る（残り ${notifs.length-_notifInitShow} 件）`:''}
    </button>
  </div>`;

  let h = `<div style="padding:12px 12px 80px">`;
  if (overdue.length) h += section('🔴', '期限切れ', 'var(--p1)', overdue, 3, 'overdue', 'なし');
  h += section('📅', '今日', 'var(--text)', todayTasks, 3, 'today', overdue.length ? '期限切れ以外のタスクはありません' : '今日のタスクはありません');
  h += notifHtml;
  if (myTasks.length) h += section('👤', '自分の担当', 'var(--text)', myTasks, 3, 'assigned', '');
  if (inboxTasks.length) h += section('📥', 'Inbox', 'var(--text)', inboxTasks, 3, 'inbox', 'Inboxにタスクはありません');
  if (flagged.length) h += section('🚩', 'フラグ付き', 'var(--text)', flagged, 3, 'flagged', '');
  h += '</div>';
  return h;
}

function attachDashboardEvents(){
  // db-more-btn: ビュー切替
  document.querySelectorAll('.db-more-btn').forEach(btn=>{
    btn.onclick=e=>{e.stopPropagation();S.view=btn.dataset.view;renderSidebar();renderContent();};
  });
  // 「もっと見る」ボタン
  const moreBtn=document.getElementById('db-notif-more');
  if(moreBtn){
    window._moreBtnHandler=e=>{
      e.stopPropagation();
      e.preventDefault();
      const _initShow=3;
      const notifs=_notifCache||[];
      const list=document.getElementById('db-notif-list');
      const moreBtn=document.getElementById('db-notif-more');
      if(!moreBtn)return;
      // 「閉じる」状態のとき
      if(moreBtn.dataset.state==='open'){
        if(list){
          const rows=[...list.querySelectorAll('.db-notif-row')];
          rows.slice(_initShow).forEach(r=>r.remove());
        }
        moreBtn.dataset.shown=_initShow;
        moreBtn.dataset.state='';
        moreBtn.textContent=`もっと見る（残り ${notifs.length-_initShow} 件）`;
        return;
      }
      // 「もっと見る」状態のとき
      const shown=parseInt(moreBtn.dataset.shown)||_initShow;
      const next=Math.min(shown+10,notifs.length);
      if(list){
        const frag=document.createDocumentFragment();
        notifs.slice(shown,next).forEach(n=>{
          const div=document.createElement('div');
          div.innerHTML=window._buildNotifRow(n);
          const row=div.firstElementChild;
          frag.appendChild(row);
        });
        list.appendChild(frag);
        _attachNotifHandlers();
      }
      if(next>=notifs.length){
        moreBtn.dataset.state='open';
        moreBtn.dataset.shown=next;
        moreBtn.textContent='閉じる ▲';
      } else {
        moreBtn.dataset.shown=next;
        moreBtn.textContent=`もっと見る（残り ${notifs.length-next} 件）`;
      }
    };
    const _mb=document.getElementById('db-notif-more');
    if(_mb){_mb.addEventListener('click',window._moreBtnHandler);
    _mb.addEventListener('touchend',window._moreBtnHandler,{passive:false});}
  }
  // 通知行クリックハンドラをアタッチ（初回＋もっと見る後も呼ばれる）
  function _attachNotifHandlers(){
    document.querySelectorAll('.db-notif-row').forEach(row=>{
      if(row._notifHandlerAttached)return;
      row._notifHandlerAttached=true;
      row.onclick=async e=>{
        e.stopPropagation();
        const nid=row.dataset.notifId;
        const tid=row.dataset.taskId;
        if(nid)await markNotifRead(nid);
        if(tid){
          const task=S.tasks.find(t=>t.id===tid);
          if(task){
            S.taskId=tid;S.drawerOpen=true;
            if(window.innerWidth<=768){
              if(task.projectId){S.view='project';S.projId=task.projectId;}
              else{S.view='inbox';}
              S.sidebarOpen=false;
            }
            playSE('open');
            renderContent();renderSidebar();renderDrawer();
            return;
          }
        }
        renderContent();
      };
    });
  }
  _attachNotifHandlers();
  // DBから通知を非同期ロード（初回のみ）
  if(_notifCache===null){
    loadNotifications().then(()=>{
      if(S.view!=='dashboard')return;
      // 通知セクションだけ差し替え（全体再描画しない）
      const sec=document.querySelector('.db-notif-list-wrap');
      if(!sec)return;
      const notifs=_notifCache||[];
      const _notifInitShow=3;
      const unreadCount=notifs.filter(n=>!n.read).length;
      // バッジ更新
      const badge=document.getElementById('db-notif-badge');
      if(badge){badge.textContent=unreadCount;badge.style.display=unreadCount?'':'none';}
      const listEl=document.getElementById('db-notif-list');
      if(listEl){
        listEl.innerHTML=notifs.length
          ?notifs.slice(0,_notifInitShow).map(window._buildNotifRow).join('')
          :'<div style="font-size:13px;color:var(--text3);padding:6px 0">メンション通知はありません</div>';
      }
      const moreBtn=document.getElementById('db-notif-more');
      if(moreBtn){
        if(notifs.length>_notifInitShow){
          moreBtn.style.display='';
          moreBtn.dataset.shown=_notifInitShow;
          moreBtn.textContent=`もっと見る（残り ${notifs.length-_notifInitShow} 件）`;
        } else {
          moreBtn.style.display='none';
        }
      }
      _attachNotifHandlers();
      // moreBtnのハンドラを再設定（DB読み込み後にDOMが差し替わるため）
      const _mbtn=document.getElementById('db-notif-more');
      if(_mbtn&&window._moreBtnHandler){
        _mbtn.removeEventListener('click',window._moreBtnHandler);
        _mbtn.removeEventListener('touchend',window._moreBtnHandler);
        _mbtn.addEventListener('click',window._moreBtnHandler);
        _mbtn.addEventListener('touchend',window._moreBtnHandler,{passive:false});
      }
    });
  }
}

// Forecastの「期限切れ」対象を、グリッドと同じフィルタ条件で取得（過去を1箇所に集約するため）
// 完了・アーカイブは除外。期限が過ぎた順（古い＝より緊急が上）に並べる。
function getForecastOverdue(){
  let tasks=S.tasks.filter(t=>t.status!=='archived'&&t.status!=='completed');
  if(S.hideNotStarted){tasks=tasks.filter(x=>!isNotStartedTask(x));}
  if(S.filterTagIds&&S.filterTagIds.length)tasks=tasks.filter(x=>S.filterTagIds.every(id=>x.tagIds&&x.tagIds.includes(id)));
  return tasks.filter(t=>isOv(t.dueAt)).sort((a,b)=>a.dueAt<b.dueAt?-1:(a.dueAt>b.dueAt?1:0));
}
function renderForecast(){
  // ローカル日付基準で生成（toISOStringはUTC変換で先頭が「昨日」にずれるため使わない）。先頭を確実に今日に固定する。
  const days=Array.from({length:14},(_,i)=>{const d=new Date(today()+'T00:00:00');d.setDate(d.getDate()+i);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')});
  let tasks=S.tasks.filter(t=>t.status!=='archived');
  if(!S.showCompleted)tasks=tasks.filter(t=>t.status!=='completed');
  if(S.hideNotStarted){tasks=tasks.filter(x=>!isNotStartedTask(x));}
  if(S.filterTagIds&&S.filterTagIds.length)tasks=tasks.filter(x=>S.filterTagIds.every(id=>x.tagIds&&x.tagIds.includes(id)));
  // ── 期限切れバー（未来グリッドの上に畳んで置く。件数＝痛みの総量は常に見せ、開くと清算モードへ）──
  const ov=getForecastOverdue();
  let ovBar='';
  if(ov.length){
    const open=!!S.fcOverdueOpen;
    ovBar='<div class="fc-ov-wrap"><div class="fc-overdue'+(open?' open':'')+'">'
      +'<button class="fc-ov-head" data-a="tog-fc-overdue">'
        +'<span class="fc-ov-icon">⚠️</span>'
        +'<span class="fc-ov-title">期限切れ</span>'
        +'<span class="fc-ov-badge">'+ov.length+'件</span>'
        +'<span class="fc-ov-hint">'+(open?'閉じる':'タップで整理')
          +'<svg class="fc-ov-chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>'
        +'</span>'
      +'</button>';
    if(open){
      const cap=15;
      ovBar+='<div class="fc-ov-body">';
      ov.slice(0,cap).forEach(t=>{
        ovBar+='<div class="fc-ov-item" data-a="sel-edit" data-id="'+t.id+'">'
          +'<span class="fc-ov-bang">!</span>'
          +'<span class="fc-ov-ttl">'+esc(t.title||'無題')+'</span>'
          +'<span class="fc-ov-date">'+fmtDate(t.dueAt)+'</span>'
        +'</div>';
      });
      if(ov.length>cap)ovBar+='<div class="fc-ov-more">他 '+(ov.length-cap)+' 件</div>';
      ovBar+='<div class="fc-ov-foot">'
        +'<button class="fc-ov-act primary" data-a="fc-overdue-today">まとめて今日へ（'+ov.length+'）</button>'
        +'<button class="fc-ov-act ghost" data-a="view" data-v="overdue">Overdueで整理 →</button>'
      +'</div>';
      ovBar+='</div>';
    }
    ovBar+='</div></div>';
  }
  let h=ovBar+'<div class="fc-grid">';
  days.forEach(day=>{
    const d=new Date(day+'T00:00:00');
    const wd=['日','月','火','水','木','金','土'][d.getDay()];
    const due=tasks.filter(t=>t.dueAt===day);
    const start=tasks.filter(t=>t.startAt===day&&t.dueAt!==day);
    const all=[...due,...start];
    h+='<div class="fc-day'+(day===today()?' today':'')+'">'
      +'<div class="fc-head"'+(all.length?' data-a="forecast-day" data-date="'+day+'" style="cursor:pointer"':'')+'><span class="fc-date">'+d.getDate()+'</span><span class="fc-wd">'+wd+'</span>'+(all.length?'<span style="margin-left:auto;font-size:11px;opacity:.6">'+all.length+'</span>':'')+'</div>'
      +'<div class="fc-tasks">'
      +due.slice(0,4).map(t=>'<div class="fc-task" data-a="sel-edit" data-id="'+t.id+'"><span>🗓</span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(t.title)+'</span></div>').join('')
      +start.slice(0,2).map(t=>'<div class="fc-task" data-a="sel-edit" data-id="'+t.id+'"><span style="color:var(--blue)">▶</span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(t.title)+'</span></div>').join('')
      +(all.length===0?'<div style="font-size:11px;color:var(--text3);padding:3px 4px">予定なし</div>':'')
      +'</div></div>';
  });
  return h+'</div>';
}

function renderReview(){
  const sevenAgo=new Date();sevenAgo.setDate(sevenAgo.getDate()-7);
  const stale=S.tasks.filter(t=>t.status!=='completed'&&t.status!=='archived'&&!t.dueAt&&new Date(t.updatedAt)<sevenAgo).slice(0,8);
  const overdue=S.tasks.filter(t=>t.status!=='completed'&&t.status!=='archived'&&isOv(t.dueAt)).slice(0,8);
  const rvProjs=S.projects.filter(p=>p.status==='active'&&(!p.nextReviewAt||p.nextReviewAt<=today())).slice(0,5);
  let h='<div class="rv-wrap">';
  h+='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px"><div><div style="font-size:17px;font-weight:700;margin-bottom:3px">週次レビュー</div><div style="font-size:13px;color:var(--text3)">見落としを確認しましょう</div></div><button class="rv-btn" data-a="rv-done">✓ 完了</button></div>';
  if(overdue.length){
    h+='<div class="rv-card"><div class="rv-card-head"><span class="rv-card-title">期限切れ</span><span class="rv-badge rv-red">'+overdue.length+'件</span><button data-a="view" data-v="overdue" style="margin-left:auto;font-size:12px;color:var(--accent);background:none;border:none;cursor:pointer;padding:2px 6px">すべて見る →</button></div>';
    overdue.forEach(t=>{h+='<div class="rv-item" data-a="sel-edit" data-id="'+t.id+'" style="cursor:pointer"><span style="color:var(--p1)">!</span><span style="flex:1">'+esc(t.title)+'</span><span class="xs muted">'+fmtDate(t.dueAt)+'</span></div>'});
    h+='</div>';
  }
  if(stale.length){
    h+='<div class="rv-card"><div class="rv-card-head"><span class="rv-card-title">停滞タスク（7日以上）</span><span class="rv-badge rv-yellow">'+stale.length+'件</span></div>';
    stale.forEach(t=>{h+='<div class="rv-item" data-a="sel-edit" data-id="'+t.id+'" style="cursor:pointer"><span>📌</span><span style="flex:1">'+esc(t.title)+'</span></div>'});
    h+='</div>';
  }
  if(rvProjs.length){
    h+='<div class="rv-card"><div class="rv-card-head"><span class="rv-card-title">レビュー必要なプロジェクト</span></div>';
    rvProjs.forEach(p=>{h+='<div class="rv-item"><span class="pdot" style="background:'+esc(p.color)+'"></span><span style="flex:1;cursor:pointer" data-a="goto-proj" data-id="'+p.id+'">'+esc(p.name)+'</span><button class="act-btn" data-a="rv-proj" data-id="'+p.id+'">完了</button></div>'});
    h+='</div>';
  }
  // 完了タスクが多いプロジェクトをアーカイブ候補として提案
  const archiveCandidates=S.projects.filter(p=>{
    if(p.status!=='active')return false;
    const tasks=S.tasks.filter(t=>t.projectId===p.id&&t.status!=='archived');
    const completed=tasks.filter(t=>t.status==='completed');
    return tasks.length>0&&completed.length===tasks.length;
  });
  if(archiveCandidates.length){
    h+='<div class="rv-card"><div class="rv-card-head"><span class="rv-card-title">💡 アーカイブ候補</span><span class="rv-badge" style="background:#e0f2fe;color:#0369a1">'+archiveCandidates.length+'件</span></div>';
    h+='<div style="font-size:12px;color:var(--text3);padding:0 12px 8px">全タスクが完了しています。アーカイブするとプロジェクト選択が整理されます。</div>';
    archiveCandidates.forEach(p=>{
      h+='<div class="rv-item"><span class="pdot" style="background:'+esc(p.color)+'"></span><span style="flex:1">'+esc(p.name)+'</span><button class="act-btn" data-a="proj-archive" data-id="'+p.id+'">アーカイブ</button></div>';
    });
    h+='</div>';
  }
  // 完了タスクの一括アーカイブ
  const completedCnt=S.tasks.filter(t=>t.status==='completed').length;
  if(completedCnt>0){
    const _def=(()=>{const d=new Date();d.setDate(d.getDate()-30);return d.toISOString().slice(0,10);})();
    h+='<div class="rv-card"><div class="rv-card-head"><span class="rv-card-title">📦 完了タスクのアーカイブ</span><span class="rv-badge" style="background:var(--bg2);color:var(--text2)">'+completedCnt+'件</span></div>'
      +'<div style="font-size:12px;color:var(--text3);padding:0 12px 8px">指定日より前に完了したタスクを非表示にします。削除ではないのでデータは残ります。</div>'
      +'<div style="display:flex;align-items:center;gap:8px;padding:4px 12px 12px;flex-wrap:wrap">'
        +'<span style="font-size:13px;color:var(--text2)">この日付より前:</span>'
        +'<input type="date" id="archive-date-input" value="'+_def+'" style="border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);padding:4px 8px;font-size:13px">'
        +'<button data-a="do-archive" style="padding:5px 14px;border-radius:6px;background:var(--p1);color:#fff;border:none;font-size:13px;font-weight:600;cursor:pointer">実行</button>'
      +'</div>'
      +'</div>';
  }
  if(!overdue.length&&!stale.length&&!rvProjs.length&&!archiveCandidates.length)h+='<div class="empty"><div class="empty-ico">🎉</div><div class="empty-t">完璧です！</div><div class="empty-d">期限切れも停滞タスクもありません</div></div>';
  return h+'</div>';
}

function renderNoteList(){
  const terms=searchTerms(S.noteSearch);
  const sortKey=S.noteSortUpdated!==false?'updatedAt':'createdAt';
  let notes=[...S.notes].filter(n=>!terms.length||matchesSearch(n.title+n.body,terms));
  if(S.filterTagIds&&S.filterTagIds.length){
    if(S.filterTagIds.includes('__none__'))notes=notes.filter(n=>!n.tagIds||n.tagIds.length===0);
    else notes=notes.filter(n=>S.filterTagIds.every(id=>n.tagIds&&n.tagIds.includes(id)));
  }
  notes.sort((a,b)=>b[sortKey].localeCompare(a[sortKey]));
  let h='<div class="tlist">';
  if(S.noteSelectMode){
    h+='<div style="padding:10px 0 6px;display:flex;gap:6px;align-items:center;flex-wrap:wrap">'
      +'<span style="font-size:12px;font-weight:600;color:var(--text);padding:0 2px">'+S.selectedNoteIds.length+'件選択</span>'
      +'<button class="toggle-completed-btn" data-a="note-bulk-sel-all">全選択</button>'
      +'<button class="toggle-completed-btn" data-a="note-bulk-desel-all">全解除</button>'
      +'<button class="toggle-completed-btn" data-a="note-bulk-tag">タグ</button>'
      +'<button class="toggle-completed-btn" data-a="note-bulk-del" style="color:var(--p1)">削除</button>'
      +'<button class="toggle-completed-btn" data-a="note-bulk-cancel" style="margin-left:auto">✕ 終了</button>'
    +'</div>';
  } else {
    const _isFiltered=!!(terms.length||(S.filterTagIds&&S.filterTagIds.length));
    const _countLabel=_isFiltered?(notes.length+'件 / 全'+S.notes.length+'件'):(S.notes.length+'件');
    h+='<div style="padding:10px 0 6px;display:flex;flex-direction:column;gap:4px">'
      +'<div style="display:flex;gap:6px;align-items:center">'
        +'<input class="finput" id="note-srch" type="search" value="'+esc(S.noteSearch)+'" placeholder="メモを検索…" style="font-size:14px;flex:1" autocomplete="off">'
        +'<button class="toggle-completed-btn'+(S.noteSortUpdated!==false?' active':'')+'" data-a="note-tog-sort" style="white-space:nowrap;flex-shrink:0">'+(S.noteSortUpdated!==false?'↓ 更新日':'↓ 作成日')+'</button>'
        +'<button class="toggle-completed-btn" data-a="note-tog-select-mode">一括</button>'
      +'</div>'
      +(S.tags.length?('<div style="display:flex;gap:6px;flex-wrap:wrap;padding:2px 2px 0">'
        +'<button class="toggle-completed-btn'+(!S.filterTagIds||!S.filterTagIds.length?' active':'')+'" data-a="notes-tag-chip" data-id="">すべて</button>'
        +'<button class="toggle-completed-btn'+(S.filterTagIds&&S.filterTagIds.includes('__none__')?' active':'')+'" data-a="notes-tag-chip" data-id="__none__" style="'+(S.filterTagIds&&S.filterTagIds.includes('__none__')?'border-color:var(--text3);color:var(--text2);background:var(--bg3)':'')+'"><span style="display:inline-flex;align-items:center;gap:4px"><span style="width:7px;height:7px;border-radius:50%;background:var(--text3);flex-shrink:0;display:inline-block"></span>タグなし</span></button>'
        +S.tags.map(t=>'<button class="toggle-completed-btn'+(S.filterTagIds&&S.filterTagIds.includes(t.id)?' active':'')+'" data-a="notes-tag-chip" data-id="'+t.id+'" style="'+(S.filterTagIds&&S.filterTagIds.includes(t.id)?'border-color:'+t.color+';color:'+t.color+';background:'+t.color+'22':'')+'"><span style="display:inline-flex;align-items:center;gap:4px"><span style="width:7px;height:7px;border-radius:50%;background:'+t.color+';flex-shrink:0;display:inline-block"></span>'+esc(t.name)+'</span></button>').join('')
      +'</div>'):'')
      +'<div style="font-size:11px;color:var(--text3);padding:0 2px">'+_countLabel+'</div>'
    +'</div>';
  }
  h+='<div id="note-list-items">';
  if(!notes.length){
    h+='<div class="empty"><div class="empty-ico">📝</div><div class="empty-t">'+(terms.length?'該当なし':'メモなし')+'</div></div>';
  } else {
    notes.forEach(n=>{h+=renderNoteRow(n);});
  }
  return h+'</div></div>';
}

      .replace(/\n/g,'<br>');
  }
  function ntEnterPreview(){renderNtPreview();bodyEl.style.display='none';ntPreviewArea.style.display='block';if(ntPreviewBtn)ntPreviewBtn.textContent='編集';ntPrevMode=true;}
  function ntExitPreview(){bodyEl.style.display='';ntPreviewArea.style.display='none';if(ntPreviewBtn)ntPreviewBtn.textContent='プレビュー';ntPrevMode=false;}
  if(ntPreviewBtn){ntPreviewBtn.addEventListener('click',()=>{ntPrevMode?ntExitPreview():ntEnterPreview();});}
  // デフォルトはプレビューモード
  ntEnterPreview();
  // 長押しで編集モードへ
  if(ntPreviewArea){(function(){let _t=null,_mv=false,_x=0,_y=0;ntPreviewArea.addEventListener('touchstart',e=>{if(_isCopyOnlyTarget(e.target))return;_mv=false;_x=e.touches[0].clientX;_y=e.touches[0].clientY;_t=setTimeout(()=>{if(_mv)return;ntExitPreview();},600);},{passive:true});ntPreviewArea.addEventListener('touchmove',e=>{if(Math.abs(e.touches[0].clientX-_x)>8||Math.abs(e.touches[0].clientY-_y)>8){_mv=true;clearTimeout(_t);_t=null;}},{passive:true});const end=()=>{if(_t){clearTimeout(_t);_t=null;}};ntPreviewArea.addEventListener('touchend',end,{passive:true});ntPreviewArea.addEventListener('touchcancel',end,{passive:true});})();}
  let nt;
  function schedSave(){
    clearTimeout(nt);
    nt=setTimeout(async()=>{
      note.title=titleEl?titleEl.value:'';
      note.body=bodyEl?bodyEl.value:'';
      await saveNote(note);
      // ドロワーヘッダーのタイトルを更新
      const hdrTitle=dr.querySelector('.drawer-head div div:last-child');
      if(hdrTitle)hdrTitle.textContent=note.title||'無題';
      // 一覧のタイトル・日付だけ更新（ドロワーは再描画しない）
      document.querySelectorAll('[data-a="note-sel"][data-id="'+note.id+'"] .ttitle')
        .forEach(el=>el.textContent=note.title||'無題');
    },600);
  }
  let composing=false;
  titleEl?.addEventListener('compositionstart',()=>{composing=true});
  titleEl?.addEventListener('compositionend',()=>{composing=false;schedSave()});
  titleEl?.addEventListener('input',()=>{if(!composing)schedSave()});
  bodyEl?.addEventListener('compositionstart',()=>{composing=true});
  bodyEl?.addEventListener('compositionend',()=>{composing=false;schedSave();});
  bodyEl?.addEventListener('input',()=>{if(!composing){schedSave();}});
  // 復元した下書きがまだ保存されていない場合は自動保存を予約
  if(_draft&&((bodyEl&&bodyEl.value!==(note.body||''))||(titleEl&&titleEl.value!==(note.title||''))))schedSave();
  dr.querySelectorAll('[data-ns]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      if(!bodyEl)return;
      if(ntPrevMode)ntExitPreview();
      const d=new Date(),pad=n=>String(n).padStart(2,'0');
      const days=['日','月','火','水','木','金','土'];
      const dateBase=d.getFullYear()+'/'+pad(d.getMonth()+1)+'/'+pad(d.getDate());
      const timeBase=pad(d.getHours())+':'+pad(d.getMinutes());
      const map={date:dateBase,time:timeBase,datetime:dateBase+' '+timeBase,datetimeweek:dateBase+'（'+days[d.getDay()]+'） '+timeBase+'\n',sep:'—————————————'};
      const ins=map[btn.dataset.ns]||'';
      if(!bodyEl._stampFocused){
        const sep=ins.endsWith('\n')?'':'\n';
        bodyEl.value=ins+sep+bodyEl.value;
        bodyEl.selectionStart=bodyEl.selectionEnd=ins.length+sep.length;
      }else{
        const s=bodyEl.selectionStart,e=bodyEl.selectionEnd;
        bodyEl.value=bodyEl.value.slice(0,s)+ins+bodyEl.value.slice(e);
        bodyEl.selectionStart=bodyEl.selectionEnd=s+ins.length;
      }
      bodyEl.focus();schedSave();renderNtPreview();
    });
  });
  renderNtPreview();
  // コメントセクションを非同期ロード
  initNoteComments(note.id);
  // 添付セクションを非同期ロード
  initAttachments('note',note.id);
}

function getNextViewRows(){
  // プロジェクト毎に最初の未完了タスクを1件ずつ取得
  const projs=getSortedProjects('active').filter(p=>S.showShared||!p.workspaceId);
  const rows=[];
  for(const proj of projs){
    const tasks=S.tasks
      .filter(t=>{
        if(t.projectId!==proj.id||t.parentTaskId)return false;
        if(t.status==='archived')return false; // archivedはNextビューに出さない（getTasks()と同様）
        if(!S.showCompleted&&t.status==='completed')return false;
        if(S.hideNotStarted&&isNotStartedTask(t))return false;
        if(S.filterTagIds&&S.filterTagIds.length&&!S.filterTagIds.every(id=>t.tagIds&&t.tagIds.includes(id)))return false;
        return true;
      })
      .sort((a,b)=>{
        if(S.sort==='priority')return (a.priority||4)-(b.priority||4);
        if(S.sort==='dueAt'){if(!a.dueAt&&!b.dueAt)return 0;if(!a.dueAt)return 1;if(!b.dueAt)return-1;return a.dueAt.localeCompare(b.dueAt);}
        return (a.order||0)-(b.order||0);
      });
    if(tasks.length===0)continue;
    rows.push({proj,task:tasks[0]});
  }
  return rows;
}
function renderNextView(){
  const rows=getNextViewRows();
  if(rows.length===0){
    const hasProjs=getSortedProjects('active').length>0;
    if(!hasProjs){
      return `<div class="empty">
        <div class="empty-ico">📂</div>
        <div class="empty-t">Nextビューへようこそ</div>
        <div class="empty-sub" style="font-size:13px;color:var(--text3);margin-top:8px;line-height:1.7;max-width:280px;text-align:center">
          各プロジェクトの<b>次にやるべきタスク（先頭の1件）</b>がここに集まります。<br>
          プロジェクトを作ってタスクを追加すると、自動的に表示されます。
        </div>
      </div>`;
    }
    return '<div class="empty"><div class="empty-ico">✅</div><div class="empty-t">すべてのプロジェクトは完了しています</div></div>';
  }

  // サブタスクを持つタスクIDを収集
  const nvTasksWithSubs=rows.filter(({task})=>S.tasks.some(t=>t.parentTaskId===task.id)).map(({task})=>task.id);
  const hasAnySubs=nvTasksWithSubs.length>0;
  window._nvHasSubs=hasAnySubs; // フィルターバーの全開/全閉ボタン表示用

  let h='';
  h+='<div class="tlist">';
  for(const{proj,task} of rows){
    h+=renderRow(task);
  }
  h+='</div>';
  return h;
}

function renderSearchResults(q){
  const tagActive=!!(S.filterTagIds&&S.filterTagIds.length);
  if(!q||!q.trim()){
    if(tagActive)return'<div class="empty"><div class="empty-ico">🔍</div><div class="empty-t">キーワードを入力</div><div class="empty-d">タグフィルタが適用された状態で検索されます</div></div>';
    return'<div class="empty"><div class="empty-ico">🔍</div><div class="empty-t">キーワードを入力</div></div>';
  }
  const terms=searchTerms(q);
  const matchTask=t=>t.status!=='archived'&&(S.showCompleted||t.status!=='completed')&&matchesSearch(t.title+' '+(t.notes||''),terms);
  const matchNote=n=>matchesSearch(n.title+' '+n.body,terms);
  const tasksAll=S.tasks.filter(matchTask);
  const notesAll=S.notes.filter(matchNote);
  let tasks=tasksAll,notes=notesAll;
  if(tagActive){
    tasks=tasksAll.filter(t=>S.filterTagIds.every(id=>t.tagIds&&t.tagIds.includes(id)));
    if(S.filterTagIds.includes('__none__'))notes=notesAll.filter(n=>!n.tagIds||n.tagIds.length===0);
    else notes=notesAll.filter(n=>S.filterTagIds.every(id=>n.tagIds&&n.tagIds.includes(id)));
  }
  const totalAll=tasksAll.length+notesAll.length;
  const totalFiltered=tasks.length+notes.length;
  if(!tasks.length&&!notes.length){
    if(tagActive&&totalAll>0){
      // フィルタのせいで0件になっているケース：キーワード自体はヒットしているので明示する
      return'<div class="empty"><div class="empty-ico">🏷</div><div class="empty-t">フィルタ適用中のため0件です</div>'
        +'<div class="empty-d">「'+esc(q)+'」自体は'+totalAll+'件ヒットしています。タグフィルタを解除すると表示されます。</div>'
        +'<button class="toggle-completed-btn" data-a="notes-tag-chip" data-id="" style="margin-top:8px">フィルタを解除</button>'
      +'</div>';
    }
    return renderEmpty();
  }
  let h='';
  if(tagActive)h+='<div style="font-size:11px;color:var(--text3);padding:0 0 6px">'+totalFiltered+'件 / フィルタなしなら'+totalAll+'件</div>';
  if(tasks.length)h+='<div class="nav-label">タスク</div><div>'+tasks.map(t=>renderRow(t)).join('')+'</div>';
  if(notes.length){
    h+='<div class="nav-label" style="margin-top:12px">メモ</div>';
    notes.forEach(n=>{
      h+='<div class="trow" data-a="note-from-search" data-id="'+n.id+'" style="touch-action:pan-y">'
        +'<div class="tbody">'
          +'<div class="ttitle">📝 '+esc(n.title||'無題')+'</div>'
          +'<div class="tmeta" style="font-size:11px;color:var(--text3)">更新: '+fmtDate(n.updatedAt.slice(0,10))+'</div>'
        +'</div>'
      +'</div>';
    });
  }
  return h;
}
