      if(hDragSrc===item)return;
      const r=item.getBoundingClientRect();
      const dstId=e.clientY<r.top+r.height/2?item.dataset.id:(hItems[hItems.indexOf(item)+1]?.dataset.id||'last');
      showHDropLine(dstId);
    });
    item.addEventListener('drop',e=>{
      e.preventDefault();e.stopPropagation();
      if(!hDragSrc||hDragSrc===item)return;
      const r=item.getBoundingClientRect();
      const dstId=e.clientY<r.top+r.height/2?item.dataset.id:(hItems[hItems.indexOf(item)+1]?.dataset.id||'last');
      doHiddenReorder(hDragSrc.dataset.id,dstId);hDragSrc=null;
    });
  });
  hDropLines.forEach(line=>{
    line.addEventListener('dragover',e=>{e.preventDefault();line.classList.add('active');});
    line.addEventListener('dragleave',()=>{line.classList.remove('active');});
    line.addEventListener('drop',e=>{
      e.preventDefault();e.stopPropagation();
      if(!hDragSrc)return;
      doHiddenReorder(hDragSrc.dataset.id,line.dataset.hdropBefore||'last');hDragSrc=null;
    });
  });
  hItems.forEach(item=>{
    const handle=item.querySelector('.hidden-drag-handle');
    if(!handle)return;
    handle.addEventListener('touchstart',e=>{
      e.stopPropagation();
      const srcId=item.dataset.id;
      let dropTargetId=null;
      item.style.opacity='0.6';
      const sidebarBody=document.querySelector('.sidebar-body');
      if(sidebarBody)sidebarBody.style.overflowY='hidden';
      const onMove=ev=>{
        ev.preventDefault();
        const touch=ev.touches[0];
        hDropLines.forEach(l=>l.classList.remove('active'));
        const el=document.elementFromPoint(touch.clientX,touch.clientY);
        const hovered=el?.closest('.hidden-proj-item[data-id]');
        if(hovered&&hovered!==item){
          const r=hovered.getBoundingClientRect();
          dropTargetId=touch.clientY<r.top+r.height/2?hovered.dataset.id:(hItems[hItems.indexOf(hovered)+1]?.dataset.id||'last');
          showHDropLine(dropTargetId);
        } else {dropTargetId=null;}
      };
      const onEnd=()=>{
        item.style.opacity='';hDropLines.forEach(l=>l.classList.remove('active'));
        if(sidebarBody)sidebarBody.style.overflowY='';
        document.removeEventListener('touchmove',onMove);document.removeEventListener('touchend',onEnd);
        if(dropTargetId){_projDragEndedAt=Date.now();doHiddenReorder(srcId,dropTargetId);}
      };
      document.addEventListener('touchmove',onMove,{passive:false});
      document.addEventListener('touchend',onEnd,{passive:true});
    },{passive:true});
  });
}

function openNavEdit(){
  const ov=document.createElement('div');ov.className='overlay';
  ov.innerHTML='<div class="modal" style="max-height:90vh;overflow-y:auto"><div class="modal-title">ナビ並び替え</div>'
    +'<div id="nav-edit-list"></div>'
    +'<div id="nav-edit-avail"></div>'
    +'<div class="modal-foot"><button class="btn btn-ghost" id="ne-cancel">キャンセル</button><button class="btn btn-primary" id="ne-ok">保存</button></div>'
    +'</div>';
  document.body.appendChild(ov);requestAnimationFrame(()=>ov.classList.add('open'));
  function buildItemEl(v){
    const it=ALL_NAV_ITEMS.find(x=>x.v===v);if(!it)return null;
    const d=document.createElement('div');
    d.className='nav-edit-item';d.dataset.v=v;
    d.style.cssText='display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--border)';
    d.innerHTML=it.icon()
      +'<span style="flex:1;font-size:14px">'+it.label+'</span>'
      +'<div style="display:flex;gap:4px">'
        +(v!=='_edit'?'<button style="width:36px;height:36px;border-radius:8px;background:var(--bg2);border:1px solid var(--border);font-size:16px;cursor:pointer;touch-action:manipulation" data-up="1">↑</button>':'<div style="width:36px"></div>')
        +(v!=='_edit'?'<button style="width:36px;height:36px;border-radius:8px;background:var(--bg2);border:1px solid var(--border);font-size:16px;cursor:pointer;touch-action:manipulation" data-dn="1">↓</button>':'<div style="width:36px"></div>')
        +(v!=='_edit'?'<button style="width:36px;height:36px;border-radius:8px;background:none;border:none;font-size:20px;color:var(--text3);cursor:pointer;touch-action:manipulation" data-rm="'+v+'">×</button>':'<div style="width:36px"></div>')
      +'</div>';
    return d;
  }
  function refreshAvail(){
    const order=[...list.querySelectorAll('.nav-edit-item')].map(x=>x.dataset.v);
    const avail=ALL_NAV_ITEMS.filter(x=>!order.includes(x.v));
    const el=document.getElementById('nav-edit-avail');
    el.innerHTML=avail.length?'<div style="margin-top:12px;border-top:1px solid var(--border);padding-top:10px"><div class="flabel">追加</div>'+avail.map(x=>'<button class="act-btn" data-add="'+x.v+'" style="margin:3px">+ '+x.label+'</button>').join('')+'</div>':'';
  }
  const list=document.getElementById('nav-edit-list');
  getNavOrder().forEach(v=>{const el=buildItemEl(v);if(el)list.appendChild(el)});
  refreshAvail();
  list.addEventListener('click',e=>{
    const item=e.target.closest('.nav-edit-item');if(!item)return;
    if(e.target.dataset.up){const prev=item.previousElementSibling;if(prev)list.insertBefore(item,prev);}
    else if(e.target.dataset.dn){const next=item.nextElementSibling;if(next)list.insertBefore(next,item);}
    else if(e.target.dataset.rm){item.remove();refreshAvail();}
  });
  document.getElementById('nav-edit-avail').addEventListener('click',e=>{
    if(e.target.dataset.add){
      const el=buildItemEl(e.target.dataset.add);if(!el)return;
      const editEl=list.querySelector('[data-v="_edit"]');
      list.insertBefore(el,editEl||null);
      refreshAvail();
    }
  });
  document.getElementById('ne-cancel').onclick=()=>ov.remove();
  document.getElementById('ne-ok').onclick=()=>{
    const newOrder=[...list.querySelectorAll('.nav-edit-item')].map(x=>x.dataset.v);
    if(!newOrder.includes('_edit'))newOrder.push('_edit');
    localStorage.setItem('bnav_order',JSON.stringify(newOrder));
    ov.remove();renderBotNav();
  };
}

// ===== RENDER CONTENT =====
function renderContent(){
  const el=document.getElementById('content');
  const titles={inbox:'Inbox',today:'Today',upcoming:'Upcoming',forecast:'Forecast',flagged:'Flagged',review:'Review',search:'Search',completed:'Completed',notes:'Notes',
    project:S.projects.find(p=>p.id===S.projId)?.name||'',
    tag:S.tagId==='__none__'?'タグなし':S.tags.find(t=>t.id===S.tagId)?.name||''};
  const isSearchPC=S.view==='search'&&window.innerWidth>768;
  document.getElementById('viewTitle').textContent=isSearchPC?'':titles[S.view]||'';
  // global-srch の値をS.searchと同期
  const gs=document.getElementById('global-srch');
  if(gs&&gs.value!==S.search)gs.value=S.search;
  // モバイル: 検索ビュー以外ではsrch展開状態をリセットしてタイトルを復元
  if(S.view!=='search'&&window.innerWidth<=768){
    const wrap=document.getElementById('global-srch-wrap');
    const topbar=wrap?.closest('.topbar');
    if(wrap?.classList.contains('srch-expanded')){
      wrap.classList.remove('srch-expanded');
      topbar?.classList.remove('srch-active');
    }
  }

  // qabarを表示/非表示
  const qabar=document.getElementById('qabar');
  if(qabar){
    const qaHidden=['search','forecast','review','completed','notes'];
    if(qaHidden.includes(S.view)){qabar.style.display='none';}
    else if(window.innerWidth<=768){qabar.style.display='';}
    else{qabar.style.display='';}
  }

  // notes以外ではnoteドロワーを閉じる
  if(S.view!=='notes'){const dr=document.getElementById('drawer');if(dr&&S.noteOpen){dr.style.display='none';dr.classList.remove('open')}}

  renderTaskFilters();
  if(S.view==='forecast'){el.innerHTML=renderForecast();return}
  if(S.view==='review'){el.innerHTML=renderReview();return}
  if(S.view==='search'){el.innerHTML=renderSearch();return}
  if(S.view==='notes'){el.innerHTML=renderNoteList();renderNoteDrawer();return}
  el.innerHTML=renderList();
  if(S.view==='project')setupSectionDrag();
}

// ===== SECTION DRAG & DROP =====
function setupSectionDrag(){
  const content=document.getElementById('content');
  if(!content)return;

  if(content._secDragAC)content._secDragAC.abort();
  const ac=new AbortController();
  content._secDragAC=ac;
  const sig=ac.signal;

  const isMobile=window.innerWidth<=768;

  // ── helpers ──────────────────────────────────────────
  function clearInd(){
    content.querySelectorAll('.drag-over,.drop-before,.drop-after,.drop-sec-before,.drop-sec-after,.sec-dragging,.dragging').forEach(el=>{
      el.classList.remove('drag-over','drop-before','drop-after','drop-sec-before','drop-sec-after','sec-dragging','dragging');
    });
  }
  function getSortedSecs(){
    return S.sections.filter(s=>s.projectId===S.projId).sort((a,b)=>a.order-b.order);
  }
  function getSortedTasksForSec(secId){
    // secId===null → unsectioned tasks
    const all=getTasks().filter(t=>!t.parentTaskId);
    return secId===null?all.filter(t=>!t.sectionId):all.filter(t=>t.sectionId===secId);
  }

  // ── apply section reorder ─────────────────────────────
  async function applySecReorder(dragSecId,targetSecId,pos){
    clearInd();
    if(!dragSecId||!targetSecId||dragSecId===targetSecId)return;
    const secs=getSortedSecs();
    const from=secs.findIndex(s=>s.id===dragSecId);
    if(from===-1)return;
    const [moved]=secs.splice(from,1);
    let to=secs.findIndex(s=>s.id===targetSecId);
    if(to===-1)return;
    if(pos==='after')to++;
    secs.splice(to,0,moved);
    for(let i=0;i<secs.length;i++){secs[i].order=(i+1)*1000;await saveSec(secs[i]);}
    renderContent();
  }

  // ── apply task drop (cross-section + reorder) ─────────
  async function applyTaskDrop(taskId,targetEl,pos){
    // pos: 'before'|'after'|'sec'
    clearInd();
    if(!taskId||!targetEl)return;
    const task=S.tasks.find(t=>t.id===taskId);
    if(!task)return;

    let newSecId,targetTaskId=null;
    if(pos==='sec'){
      newSecId=targetEl.dataset.dropSec==='null'?null:targetEl.dataset.dropSec;
    } else {
      targetTaskId=targetEl.dataset.id;
      const tt=S.tasks.find(t=>t.id===targetTaskId);
      if(!tt)return;
      newSecId=tt.sectionId||null;
    }

    // build new order for target section
    const secTasks=getSortedTasksForSec(newSecId).filter(t=>t.id!==taskId);
    let idx=secTasks.length;
    if(targetTaskId){
      const ti=secTasks.findIndex(t=>t.id===targetTaskId);
      idx=pos==='before'?ti:ti+1;
      if(idx<0)idx=0;
    }
    secTasks.splice(idx,0,task);

    // if sectionId changed, also reorder old section
    const oldSecId=task.sectionId||null;
    const secChanged=oldSecId!==newSecId;
    task.sectionId=newSecId;

    for(let i=0;i<secTasks.length;i++){
      secTasks[i].order=(i+1)*1000;
      await saveTask(secTasks[i]);
    }
    if(secChanged&&oldSecId!==null){
      const oldTasks=getSortedTasksForSec(oldSecId).filter(t=>t.id!==taskId);
      for(let i=0;i<oldTasks.length;i++){oldTasks[i].order=(i+1)*1000;await saveTask(oldTasks[i]);}
    }
    renderContent();
  }

  // ════════════════════════════════════════════════════
  if(!isMobile){
    // ── PC: HTML5 Drag & Drop ──────────────────────────
    let dtype=null,dragId=null,dragSecId=null;

    content.querySelectorAll('.trow[data-id]').forEach(r=>r.setAttribute('draggable','true'));
    content.querySelectorAll('[data-drag-sec]').forEach(h=>h.setAttribute('draggable','true'));

    content.addEventListener('dragstart',e=>{
      const sh=e.target.closest('[data-drag-sec]');
      const row=e.target.closest('.trow[data-id]');
      if(sh){
        dtype='sec';dragSecId=sh.dataset.dragSec;
        const head=sh.closest('.sec-head');
        setTimeout(()=>head?.classList.add('sec-dragging'),0);
        e.dataTransfer.effectAllowed='move';
      } else if(row){
        dtype='task';dragId=row.dataset.id;
        setTimeout(()=>row.classList.add('dragging'),0);
        e.dataTransfer.effectAllowed='move';
      } else {e.preventDefault();}
    },{signal:sig});

    content.addEventListener('dragend',()=>{clearInd();dtype=null;dragId=null;dragSecId=null;},{signal:sig});

    content.addEventListener('dragover',e=>{
      if(!dtype)return;
      e.preventDefault();clearInd();
      if(dtype==='sec'){
        const sh=e.target.closest('.sec-head[data-sec-id]');
        if(sh&&sh.dataset.secId!==dragSecId){
          const r=sh.getBoundingClientRect();
          sh.classList.add(e.clientY<r.top+r.height/2?'drop-sec-before':'drop-sec-after');
        }
      } else {
        const row=e.target.closest('.trow[data-id]');
        if(row&&row.dataset.id!==dragId){
          const r=row.getBoundingClientRect();
          row.classList.add(e.clientY<r.top+r.height/2?'drop-before':'drop-after');
          e.dataTransfer.dropEffect='move';
        } else {
          const zone=e.target.closest('[data-drop-sec]');
          if(zone){zone.classList.add('drag-over');e.dataTransfer.dropEffect='move';}
        }
      }
    },{signal:sig});

    content.addEventListener('drop',async e=>{
      e.preventDefault();
      if(dtype==='sec'){
        const sh=e.target.closest('.sec-head[data-sec-id]');
        if(sh&&sh.dataset.secId!==dragSecId){
          const r=sh.getBoundingClientRect();
          const pos=e.clientY<r.top+r.height/2?'before':'after';
          const id=dragSecId;dtype=null;dragSecId=null;
          await applySecReorder(id,sh.dataset.secId,pos);
        }
      } else if(dtype==='task'){
        const row=e.target.closest('.trow[data-id]');
        const id=dragId;dtype=null;dragId=null;
        if(row&&row.dataset.id!==id){
          const r=row.getBoundingClientRect();
          const pos=e.clientY<r.top+r.height/2?'before':'after';
          await applyTaskDrop(id,row,pos);
        } else {
          const zone=e.target.closest('[data-drop-sec]');
          if(zone)await applyTaskDrop(id,zone,'sec');
        }
      }
    },{signal:sig});

  } else {
    // ── モバイル: 長押しタッチドラッグ ──────────────────────
    let ghost=null,dtype=null,dragId=null,dragSecId=null;
    let startX=0,startY=0,dragging=false,lpTimer=null,activeEl=null;
    const LONG_MS=480,MOVE_LIM=12;

    function spawnGhost(el,ty){
      const rect=el.getBoundingClientRect();
      ghost=el.cloneNode(true);
      Object.assign(ghost.style,{
        position:'fixed',zIndex:'9999',opacity:'.85',pointerEvents:'none',
        width:rect.width+'px',left:rect.left+'px',top:(startY-rect.height/2)+'px',
        boxShadow:'0 8px 28px rgba(0,0,0,.25)',borderRadius:'8px',
        transform:'scale(1.03)',transition:'none',background:'var(--surface)'
      });
      ghost.classList.add('drag-ghost-fixed');
      document.body.appendChild(ghost);
      el.style.opacity='.3';
      activeEl=el;
      window.__activeDragEl=el;
      dtype=ty;
    }

    function cancelAll(){
      clearTimeout(lpTimer);
      if(ghost){ghost.remove();ghost=null;}
      if(activeEl){activeEl.style.opacity='';activeEl=null;}
      if(window.__activeDragEl){window.__activeDragEl.style.opacity='';window.__activeDragEl=null;}
      clearInd();dragging=false;dtype=null;dragId=null;dragSecId=null;
    }

    // ドキュメントレベルのフォールバック（scroll等でtouchendが届かなかった場合のゴースト残留防止）
    document.addEventListener('touchend',()=>{if(ghost||dragging)cancelAll();},{signal:sig,passive:true});
    document.addEventListener('touchcancel',()=>cancelAll(),{signal:sig,passive:true});

    // task rows
    content.querySelectorAll('.trow[data-id]').forEach(row=>{
      // passive:false にして touchmove 内での e.preventDefault() を有効化（iOS scroll乗っ取り防止）
      row.addEventListener('touchstart',e=>{
        if(e.touches.length>1){cancelAll();return;}
        const t=e.touches[0];startX=t.clientX;startY=t.clientY;
        lpTimer=setTimeout(()=>{
          dragging=true;navigator.vibrate?.(40);
          dragId=row.dataset.id;spawnGhost(row,'task');
        },LONG_MS);
      },{signal:sig,passive:false});

      row.addEventListener('touchmove',e=>{
        const t=e.touches[0];
        if(!dragging){
          if(Math.abs(t.clientX-startX)>MOVE_LIM||Math.abs(t.clientY-startY)>MOVE_LIM)clearTimeout(lpTimer);
          return;
        }
        e.preventDefault();// dragging中はスクロール禁止
        if(ghost)ghost.style.top=(t.clientY-ghost.offsetHeight/2)+'px';
        clearInd();ghost.style.pointerEvents='none';
        const el=document.elementFromPoint(t.clientX,t.clientY);
        const row2=el?.closest('.trow[data-id]');
        if(row2&&row2.dataset.id!==dragId){
          const r=row2.getBoundingClientRect();
          row2.classList.add(t.clientY<r.top+r.height/2?'drop-before':'drop-after');
        } else {
          const zone=el?.closest('[data-drop-sec]');
          if(zone)zone.classList.add('drag-over');
        }
      },{signal:sig,passive:false});

      row.addEventListener('touchend',async e=>{
        clearTimeout(lpTimer);
        const wasDragging=dragging;
        if(ghost){ghost.remove();ghost=null;}
        if(activeEl){activeEl.style.opacity='';activeEl=null;}
        if(!wasDragging){dragging=false;dragId=null;dtype=null;return;}
        dragging=false;
        const t=e.changedTouches[0];
        const el=document.elementFromPoint(t.clientX,t.clientY);
        const row2=el?.closest('.trow[data-id]');
        const id=dragId;dragId=null;dtype=null;
        if(row2&&row2.dataset.id!==id){
          const r=row2.getBoundingClientRect();
          await applyTaskDrop(id,row2,t.clientY<r.top+r.height/2?'before':'after');
        } else {
          const zone=el?.closest('[data-drop-sec]');
          await applyTaskDrop(id,zone,'sec');
        }
      },{signal:sig});
      row.addEventListener('touchcancel',()=>cancelAll(),{signal:sig,passive:true});
    });

    // section drag handles
    content.querySelectorAll('[data-drag-sec]').forEach(handle=>{
      const secHead=handle.closest('.sec-head');
      handle.addEventListener('touchstart',e=>{
        if(e.touches.length>1){cancelAll();return;}
        const t=e.touches[0];startX=t.clientX;startY=t.clientY;
        lpTimer=setTimeout(()=>{
          dragging=true;navigator.vibrate?.(40);
          dragSecId=handle.dataset.dragSec;spawnGhost(secHead||handle,'sec');
        },LONG_MS);
      },{signal:sig,passive:false});

      handle.addEventListener('touchmove',e=>{
        const t=e.touches[0];
        if(!dragging){
          if(Math.abs(t.clientX-startX)>MOVE_LIM||Math.abs(t.clientY-startY)>MOVE_LIM)clearTimeout(lpTimer);
          return;
        }
        e.preventDefault();
        if(ghost)ghost.style.top=(t.clientY-ghost.offsetHeight/2)+'px';
        clearInd();ghost.style.pointerEvents='none';
        const el=document.elementFromPoint(t.clientX,t.clientY);
        const sh=el?.closest('.sec-head[data-sec-id]');
        if(sh&&sh.dataset.secId!==dragSecId){
          const r=sh.getBoundingClientRect();
          sh.classList.add(t.clientY<r.top+r.height/2?'drop-sec-before':'drop-sec-after');
        }
      },{signal:sig,passive:false});

      handle.addEventListener('touchend',async e=>{
        clearTimeout(lpTimer);
        const wasDragging=dragging;
        if(ghost){ghost.remove();ghost=null;}
        if(activeEl){activeEl.style.opacity='';activeEl=null;}
        if(!wasDragging){dragging=false;dragSecId=null;dtype=null;return;}
        dragging=false;
        const t=e.changedTouches[0];
        const el=document.elementFromPoint(t.clientX,t.clientY);
        const sh=el?.closest('.sec-head[data-sec-id]');
        const id=dragSecId;dragSecId=null;dtype=null;
        if(sh&&sh.dataset.secId!==id){
          const r=sh.getBoundingClientRect();
          await applySecReorder(id,sh.dataset.secId,t.clientY<r.top+r.height/2?'before':'after');
        }
      },{signal:sig});
      handle.addEventListener('touchcancel',()=>cancelAll(),{signal:sig,passive:true});
    });
  }
}

function renderNoteListOnly(){
  const q=S.noteSearch.toLowerCase();
  const sortKey=S.noteSortUpdated!==false?'updatedAt':'createdAt';
  const notes=[...S.notes].filter(n=>!q||(n.title+n.body).toLowerCase().includes(q)).sort((a,b)=>b[sortKey].localeCompare(a[sortKey]));

}

function renderList(){
  const tasks=getTasks().filter(t=>!t.parentTaskId);
  if(S.view==='project'){
    const projSecs=S.sections.filter(s=>s.projectId===S.projId).sort((a,b)=>a.order-b.order);
    if(!tasks.length&&!projSecs.length)return renderEmpty();
    const unsectioned=tasks.filter(t=>!t.sectionId);
    let h='<div class="tlist">';
    if(projSecs.length){
      h+='<div class="sec-actions-row">'

        +'<button class="sec-ac-btn" data-a="sec-expand-all">▾ 全て開く</button>'

    if(projSecs.length){
      const uc=S.secCollapsed['__null__'];

      unsectioned.forEach(t=>{h+=renderRow(t)});

        +'<span class="sec-chevron">▼</span>'
        +'<span class="sec-head-name" data-a="sec-toggle" data-sec-id="'+sec.id+'" style="cursor:pointer">'+esc(sec.name)+'</span>'
        +(secTasks.length?'<span class="badge" style="margin-right:2px">'+secTasks.length+'</span>':'')
        +'<button class="sec-act-btn" data-a="sec-rename" data-id="'+sec.id+'" data-name="'+esc(sec.name)+'" title="名前変更">'
          +'<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>'
          +' 名前変更</button>'
        +'<button class="sec-act-btn del" data-a="sec-del" data-id="'+sec.id+'" data-name="'+esc(sec.name)+'" title="削除">'
          +'<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>'
          +' 削除</button>'
      +'</div>';
      h+='<div class="sec-body'+(collapsed?' sec-hidden':'')+'" id="sec-body-'+sec.id+'" data-drop-sec="'+sec.id+'">';
      if(secTasks.length){secTasks.forEach(t=>{h+=renderRow(t)});}
      else{h+='<div class="sec-drop-zone" data-drop-sec="'+sec.id+'" style="height:40px;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--text3)">ここにドラッグ</div>';}
      h+='</div>';
    });
    h+='<div class="nav-item muted" data-a="addsec" style="margin-top:10px;font-size:13px"><span style="font-size:16px">+</span> セクション追加</div>';
    h+='</div>';
    return h;
  }
  if(!tasks.length)return renderEmpty();
  let h='<div class="tlist">';
  tasks.forEach(t=>{h+=renderRow(t)});
  h+='</div>';
  return h;
}

function _tfPopupPos(pop,btn){
  const r=btn.getBoundingClientRect();

function _tfBackdrop(){

function renderRow(task){
  const subs=S.tasks.filter(t=>t.parentTaskId===task.id);
  const done=task.status==='completed';
  const notStarted=!done&&task.startAt&&task.startAt>today();
  const pclass=task.priority<4?'p'+task.priority:'';
  const isSel=S.selectedIds.includes(task.id);
  const subsOpen=subs.length>0&&!!S.openSubs[task.id];
  let meta='';
  if(task.startAt&&task.startAt!==task.dueAt){
    const cls=isToday(task.startAt)?'td':isSoon(task.startAt)?'sn':'';
    meta+='<span class="mc'+( cls?' '+cls:'')+'">▶ '+fmtDate(task.startAt)+'</span>';
  }
  if(task.dueAt){
    const cls=isOv(task.dueAt)?'ov':isToday(task.dueAt)?'td':isSoon(task.dueAt)?'sn':'';
    meta+='<span class="mc'+( cls?' '+cls:'')+'">📅 '+fmtDate(task.dueAt)+'</span>';
  }
  if(task.projectId&&S.view!=='project'){
    const p=S.projects.find(x=>x.id===task.projectId);
    if(p)meta+='<span class="mc" style="background:'+p.color+'1a;color:'+p.color+'">'+esc(p.name)+'</span>';
  }
  if(task.tagIds&&task.tagIds.length){
    task.tagIds.slice(0,2).forEach(tid=>{
      const t=S.tags.find(x=>x.id===tid);
      if(t)meta+='<span class="mc" style="background:'+t.color+'1a;color:'+t.color+'">#'+esc(t.name)+'</span>';
    });
  }
  if(task.repeatRule)meta+='<span class="mc">↻</span>';
  if(task.flagged)meta+='<span>🚩</span>';
  if(subs.length){
    const dc=subs.filter(s=>s.status==='completed').length;
    meta+='<button class="mc sub-toggle-btn" data-a="tog-subs" data-id="'+task.id+'" title="サブタスクを展開"><span class="sub-chev'+(subsOpen?' open':'')+'">▶</span>'+dc+'/'+subs.length+'</button>';
  }
  const updStr=task.updatedAt?'<span class="mc" style="margin-left:auto">'+fmtDate(task.updatedAt.slice(0,10))+'</span>':'';

  let html='<div class="trow'+(done?' done':'')+(S.taskId===task.id&&!S.selectMode?' sel':'')+(pclass?' '+pclass:'')+(isSel?' bulk-sel':'')+'" data-a="sel" data-id="'+task.id+'" data-order="'+(task.order||0)+'">'
    +(S.view==='project'&&!S.selectMode?'<span class="task-drag-handle" title="ドラッグで並び替え">⠿</span>':'')
    +'<button class="chk'+(done?' done':'')+'" data-a="chk" data-id="'+task.id+'"'+(S.selectMode?' style="pointer-events:none"':'')+' >'+(done?'✓':'')+'</button>'
    +'<div class="tbody">'
      +'<div class="ttitle" data-title-edit="'+task.id+'"'+(notStarted?' style="color:var(--text3)"':'')+'>'+( task.title?esc(task.title):'<span style="color:var(--text3)">無題</span>')+'</div>'
      +'<div class="tmeta">'+(meta||'')+updStr+'</div>'
    +'</div>'
    +(S.selectMode?'':
      '<button class="trow-expand-btn" data-a="task-expand" data-id="'+task.id+'" title="大きく表示">'
        +'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>'
      +'</button>'
      +'<button class="trow-edit-btn" data-a="sel-edit" data-id="'+task.id+'" title="詳細">'
        +'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>'
      +'</button>')
  +'</div>';
  if(subs.length){
    html+='<div class="sub-rows'+(subsOpen?' open':'')+'" id="sub-rows-'+task.id+'">';
    html+=subs.map(s=>'<div style="padding-left:28px">'+renderRow(s)+'</div>').join('');
    html+='</div>';
  }
  return html;
}

function renderForecast(){
  const days=Array.from({length:14},(_,i)=>{const d=new Date(today()+'T00:00:00');d.setDate(d.getDate()+i);return d.toISOString().slice(0,10)});
  let tasks=S.tasks.filter(t=>t.status!=='archived');
  if(!S.showCompleted)tasks=tasks.filter(t=>t.status!=='completed');
  if(S.hideNotStarted){const t2=today();tasks=tasks.filter(x=>!x.startAt||x.startAt<=t2||x.status==='completed');}
  if(S.filterTagIds&&S.filterTagIds.length)tasks=tasks.filter(x=>S.filterTagIds.every(id=>x.tagIds&&x.tagIds.includes(id)));
  let h='<div class="fc-grid">';
  days.forEach(day=>{
    const d=new Date(day+'T00:00:00');
    const wd=['日','月','火','水','木','金','土'][d.getDay()];
    const due=tasks.filter(t=>t.dueAt===day);
    const start=tasks.filter(t=>t.startAt===day&&t.dueAt!==day);
    const all=[...due,...start];
    h+='<div class="fc-day'+(day===today()?' today':'')+'">'
      +'<div class="fc-head"><span class="fc-date">'+d.getDate()+'</span><span class="fc-wd">'+wd+'</span>'+(all.length?'<span style="margin-left:auto;font-size:11px;opacity:.6">'+all.length+'</span>':'')+'</div>'
      +'<div class="fc-tasks">'
      +due.slice(0,4).map(t=>'<div class="fc-task" data-a="sel-edit" data-id="'+t.id+'"><span>🗓</span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(t.title)+'</span></div>').join('')
      +start.slice(0,2).map(t=>'<div class="fc-task" data-a="sel-edit" data-id="'+t.id+'"><span style="color:var(--blue)">▶</span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(t.title)+'</span></div>').join('')
      +(all.length===0?'<div style="font-size:11px;color:var(--text3);padding:3px 4px">予定なし</div>':'')
      +'</div></div>';
  });
  return h+'</div>';
}

function renderReview(){
  const sevenAgo=new Date();sevenAgo.setDate(sevenAgo.getDate()-7);
  const stale=S.tasks.filter(t=>t.status!=='completed'&&t.status!=='archived'&&!t.dueAt&&new Date(t.updatedAt)<sevenAgo).slice(0,8);
  const overdue=S.tasks.filter(t=>t.status!=='completed'&&t.status!=='archived'&&isOv(t.dueAt)).slice(0,8);
  const rvProjs=S.projects.filter(p=>p.status==='active'&&(!p.nextReviewAt||p.nextReviewAt<=today())).slice(0,5);
  let h='<div class="rv-wrap">';
  h+='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px"><div><div style="font-size:17px;font-weight:700;margin-bottom:3px">週次レビュー</div><div style="font-size:13px;color:var(--text3)">見落としを確認しましょう</div></div><button class="rv-btn" data-a="rv-done">✓ 完了</button></div>';
  if(overdue.length){
    h+='<div class="rv-card"><div class="rv-card-head"><span class="rv-card-title">期限切れ</span><span class="rv-badge rv-red">'+overdue.length+'件</span></div>';
    overdue.forEach(t=>{h+='<div class="rv-item" data-a="sel-edit" data-id="'+t.id+'" style="cursor:pointer"><span style="color:var(--p1)">!</span><span style="flex:1">'+esc(t.title)+'</span><span class="xs muted">'+fmtDate(t.dueAt)+'</span></div>'});
    h+='</div>';
  }
  if(stale.length){
    h+='<div class="rv-card"><div class="rv-card-head"><span class="rv-card-title">停滞タスク（7日以上）</span><span class="rv-badge rv-yellow">'+stale.length+'件</span></div>';
    stale.forEach(t=>{h+='<div class="rv-item" data-a="sel-edit" data-id="'+t.id+'" style="cursor:pointer"><span>📌</span><span style="flex:1">'+esc(t.title)+'</span></div>'});
    h+='</div>';
  }
  if(rvProjs.length){
    h+='<div class="rv-card"><div class="rv-card-head"><span class="rv-card-title">レビュー必要なプロジェクト</span></div>';
    rvProjs.forEach(p=>{h+='<div class="rv-item"><span class="pdot" style="background:'+esc(p.color)+'"></span><span style="flex:1;cursor:pointer" data-a="goto-proj" data-id="'+p.id+'">'+esc(p.name)+'</span><button class="act-btn" data-a="rv-proj" data-id="'+p.id+'">完了</button></div>'});
    h+='</div>';
  }
  if(!overdue.length&&!stale.length&&!rvProjs.length)h+='<div class="empty"><div class="empty-ico">🎉</div><div class="empty-t">完璧です！</div><div class="empty-d">期限切れも停滞タスクもありません</div></div>';
  return h+'</div>';
}

    clearTimeout(nt);
    nt=setTimeout(async()=>{
      note.title=titleEl?titleEl.value:'';
      note.body=bodyEl?bodyEl.value:'';
      await saveNote(note);
      // ドロワーヘッダーのタイトルを更新
      const hdrTitle=dr.querySelector('.drawer-head div div:last-child');
      if(hdrTitle)hdrTitle.textContent=note.title||'無題';
      // 一覧のタイトル・日付だけ更新（ドロワーは再描画しない）
      document.querySelectorAll('[data-a="note-sel"][data-id="'+note.id+'"] .ttitle')
        .forEach(el=>el.textContent=note.title||'無題');
    },600);
  }
  let composing=false;
  titleEl?.addEventListener('compositionstart',()=>{composing=true});
  titleEl?.addEventListener('compositionend',()=>{composing=false;schedSave()});
  titleEl?.addEventListener('input',()=>{if(!composing)schedSave()});
  bodyEl?.addEventListener('compositionstart',()=>{composing=true});
  bodyEl?.addEventListener('compositionend',()=>{composing=false;schedSave();});
  bodyEl?.addEventListener('input',()=>{if(!composing){schedSave();}});
  dr.querySelectorAll('[data-ns]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      if(!bodyEl)return;
      if(ntPrevMode)ntExitPreview();
      const d=new Date(),pad=n=>String(n).padStart(2,'0');
      const days=['日','月','火','水','木','金','土'];
      const dateBase=d.getFullYear()+'/'+pad(d.getMonth()+1)+'/'+pad(d.getDate());
      const timeBase=pad(d.getHours())+':'+pad(d.getMinutes());
      const map={date:dateBase,time:timeBase,datetime:dateBase+' '+timeBase,datetimeweek:dateBase+'（'+days[d.getDay()]+'） '+timeBase,sep:'—————————————'};
      const ins=map[btn.dataset.ns]||'';
      if(!bodyEl._stampFocused){
        bodyEl.value=ins+'\n'+bodyEl.value;
        bodyEl.selectionStart=bodyEl.selectionEnd=ins.length+1;
      }else{
        const s=bodyEl.selectionStart,e=bodyEl.selectionEnd;
        bodyEl.value=bodyEl.value.slice(0,s)+ins+bodyEl.value.slice(e);
        bodyEl.selectionStart=bodyEl.selectionEnd=s+ins.length;
      }
      bodyEl.focus();schedSave();renderNtPreview();
    });
  });
  renderNtPreview();
}

function renderSearch(){
  const q=S.search;
  let h='<div class="tlist">';
  h+='<div style="padding:10px 0 8px"><input class="finput" id="srch" type="search" value="'+esc(q)+'" placeholder="タスク・メモを検索…" style="font-size:14px"></div>';
  h+='<div id="srch-results">'+renderSearchResults(q)+'</div>';
  return h+'</div>';
}
function renderSearchResults(q){
  if(!q)return'<div class="empty"><div class="empty-ico">🔍</div><div class="empty-t">キーワードを入力</div></div>';
  const ql=q.toLowerCase();
  const tasks=S.tasks.filter(t=>t.status!=='archived'&&(t.title.toLowerCase().includes(ql)||(t.notes||'').toLowerCase().includes(ql)));
  const notes=S.notes.filter(n=>(n.title+n.body).toLowerCase().includes(ql));
  if(!tasks.length&&!notes.length)return renderEmpty();
  let h='';
  if(tasks.length)h+='<div class="nav-label">タスク</div><div>'+tasks.map(t=>renderRow(t)).join('')+'</div>';
  if(notes.length){
    h+='<div class="nav-label" style="margin-top:12px">メモ</div>';
    notes.forEach(n=>{
      h+='<div class="trow" data-a="note-from-search" data-id="'+n.id+'">'
        +'<div class="tbody">'
          +'<div class="ttitle">📝 '+esc(n.title||'無題')+'</div>'
          +'<div class="tmeta" style="font-size:11px;color:var(--text3)">更新: '+fmtDate(n.updatedAt.slice(0,10))+'</div>'
        +'</div>'
      +'</div>';
    });
  }
  return h;
}

  }

  const setInd=(s)=>{const el=document.getElementById('autosave-ind');if(!el)return;el.className='autosave-ind '+s;el.textContent=s==='saving'?'保存中…':s==='saved'?'保存済み ✓':'自動保存 ✓'};
  let _composing=false;
  const autosave=(force)=>{
    if(_composing&&!force)return;
    setInd('saving');
    clearTimeout(autosave._t);
    autosave._t=setTimeout(async()=>{
      const t2=S.tasks.find(x=>x.id===S.taskId);if(!t2)return;
      const prevStatus=t2.status;
      t2.title=document.getElementById('dt-title')?.value||'';
      t2.notes=document.getElementById('dt-notes')?.value||'';
      t2.dueAt=document.getElementById('dt-due')?.value||null;
      t2.startAt=document.getElementById('dt-start')?.value||null;

      await saveTask(t2);

      const drawerInputIds=['dt-title','dt-notes','dt-due','dt-start','dt-proj','dt-sec','dt-repeat','sub-inp','lp-text','lp-url','nt-title','nt-body'];
      if(t2.status!==prevStatus||!drawerInputIds.includes(activeId)){

  const dtPreviewArea=document.getElementById('dt-preview-area');
  const dtNotesEl=document.getElementById('dt-notes');
  let dtPrevMode=false;
  function renderDtPreview(){
    if(!dtNotesEl||!dtPreviewArea)return;
    dtPreviewArea.innerHTML=esc(dtNotesEl.value).replace(/\[([^\]]+)\]\((https?:\/\/[^\)]+)\)/g,'<a href="$2" target="_blank" style="color:var(--accent);text-decoration:underline">$1</a>').replace(/\n/g,'<br>');
  }
  function dtEnterPreview(){renderDtPreview();dtNotesEl.style.display='none';dtPreviewArea.style.display='block';if(dtPreviewBtn)dtPreviewBtn.textContent='編集';dtPrevMode=true;}
  function dtExitPreview(){dtNotesEl.style.display='';dtPreviewArea.style.display='none';if(dtPreviewBtn)dtPreviewBtn.textContent='プレビュー';dtPrevMode=false;}
  if(dtPreviewBtn){dtPreviewBtn.addEventListener('click',()=>{dtPrevMode?dtExitPreview():dtEnterPreview();});}
  // デフォルトは編集モード (dt-link-btnはフォーカス追跡付きで上部に登録済み)
  ['dt-title','dt-notes'].forEach(id=>{
    const el=document.getElementById(id);
    if(!el)return;
    el.addEventListener('compositionstart',()=>{_composing=true});
    el.addEventListener('compositionend',()=>{_composing=false;autosave(true);});
    el.addEventListener('input',()=>{autosave();});
  });
  // 日付・セレクトはcomposition不要
  ['dt-due','dt-start','dt-proj','dt-sec','dt-repeat'].forEach(id=>{
    const el=document.getElementById(id);
    if(el)el.addEventListener('change',()=>{
      autosave(true);
      if(id==='dt-due'||id==='dt-start'){
        const wd=document.getElementById('dt-'+( id==='dt-due'?'due':'start')+'-wd');
        if(wd)wd.textContent=wdStr(el.value);
      }
    });
  });
  const si=document.getElementById('sub-inp');
  if(si)si.addEventListener('keydown',async e=>{
    if(e.key==='Enter'&&si.value.trim()){
      const s=mkTask({title:si.value.trim(),parentTaskId:S.taskId,status:'active'});
      const drBody=document.getElementById('drawer-body');
      const scrollY=drBody?drBody.scrollTop:0;
      await saveTask(s);si.value='';renderDrawer();
      const drBody2=document.getElementById('drawer-body');
      if(drBody2){drBody2.scrollTop=scrollY;drBody2.querySelector('#sub-inp')?.focus();}
    }
  });
}

    dueInp.addEventListener('change',()=>{dueWd.textContent=wdStr(dueInp.value);dueCleared=false;});

    // 日付調整ヘルパー（タスク詳細と同じロジック）
    function adjBulkDate(inp,wdEl,days,months){
      let base;
      if(inp.value){
        const[y,m,d]=inp.value.split('-').map(Number);
        base=new Date(Date.UTC(y,m-1,d));
        if(days)base.setUTCDate(base.getUTCDate()+days);
        if(months)base.setUTCMonth(base.getUTCMonth()+months);
      }else{
        const n=new Date();
        base=new Date(Date.UTC(n.getFullYear(),n.getMonth(),n.getDate()));
        if(months)base.setUTCMonth(base.getUTCMonth()+months);
      }
      const v=base.toISOString().slice(0,10);
      inp.value=v;wdEl.textContent=wdStr(v);
    }
    ov.querySelector('#bulk-sadj-d1').onclick=()=>adjBulkDate(startInp,startWd,1,0);
    ov.querySelector('#bulk-sadj-d7').onclick=()=>adjBulkDate(startInp,startWd,7,0);
    ov.querySelector('#bulk-sadj-m1').onclick=()=>adjBulkDate(startInp,startWd,0,1);
    ov.querySelector('#bulk-dadj-d1').onclick=()=>adjBulkDate(dueInp,dueWd,1,0);
    ov.querySelector('#bulk-dadj-d7').onclick=()=>adjBulkDate(dueInp,dueWd,7,0);
    ov.querySelector('#bulk-dadj-m1').onclick=()=>adjBulkDate(dueInp,dueWd,0,1);

    // クリアボタン：フィールドを空にして「クリア確定」フラグを立てる
    ov.querySelector('#bulk-start-clr').onclick=()=>{startInp.value='';startWd.textContent='';startCleared=true;};
    ov.querySelector('#bulk-due-clr').onclick=()=>{dueInp.value='';dueWd.textContent='';dueCleared=true;};

    ov.querySelector('#bulk-dates-cancel').onclick=()=>ov.remove();
    ov.querySelector('#bulk-dates-ok').onclick=async()=>{
      const sv=startInp.value,dv=dueInp.value;
      ov.remove();
      for(const t of tasks){
        if(sv)t.startAt=sv;
        else if(startCleared)t.startAt=null;
        if(dv)t.dueAt=dv;
        else if(dueCleared)t.dueAt=null;
        await saveTask(t);
      }
      toast(tasks.length+'件を更新しました');render();
    };
  } else if(field==='tags'){
    const ov=document.createElement('div');ov.className='overlay';
    ov.innerHTML='<div class="modal"><div class="modal-title">タグを一括追加</div>'
      +'<div style="max-height:220px;overflow-y:auto;margin-bottom:12px">'
      +S.tags.map(t=>'<label style="display:flex;align-items:center;gap:8px;padding:5px 0;cursor:pointer"><input type="checkbox" data-tag="'+t.id+'"><span style="color:'+t.color+'">#'+esc(t.name)+'</span></label>').join('')
      +'</div>'
      +'<div style="display:flex;gap:8px">'
        +'<button class="btn btn-primary" id="bulk-tag-ok">追加</button>'
        +'<button class="btn btn-ghost" id="bulk-tag-cancel">キャンセル</button>'
      +'</div></div>';
    document.body.appendChild(ov);requestAnimationFrame(()=>ov.classList.add('open'));
    ov.addEventListener('click',e=>{if(e.target===ov)ov.remove();});
    ov.querySelector('#bulk-tag-cancel').onclick=()=>ov.remove();
    ov.querySelector('#bulk-tag-ok').onclick=async()=>{
      const checked=[...ov.querySelectorAll('input[data-tag]:checked')].map(i=>i.dataset.tag);
      ov.remove();if(!checked.length)return;
      for(const t of tasks){if(!t.tagIds)t.tagIds=[];checked.forEach(tid=>{if(!t.tagIds.includes(tid))t.tagIds.push(tid);});await saveTask(t);}
      toast(tasks.length+'件にタグを追加しました');render();
    };
  } else if(field==='project'){
    const ov=document.createElement('div');ov.className='overlay';
    ov.innerHTML='<div class="modal"><div class="modal-title">プロジェクトを一括設定</div>'
      +'<select id="bulk-proj-sel" class="finput fselect" style="margin-bottom:12px"><option value="">なし</option>'
      +S.projects.filter(p=>p.status==='active').map(p=>'<option value="'+p.id+'">'+esc(p.name)+'</option>').join('')
      +'</select>'
      +'<div style="display:flex;gap:8px">'
        +'<button class="btn btn-primary" id="bulk-proj-ok">設定する</button>'
        +'<button class="btn btn-ghost" id="bulk-proj-cancel">キャンセル</button>'
      +'</div></div>';
    document.body.appendChild(ov);requestAnimationFrame(()=>ov.classList.add('open'));
    ov.addEventListener('click',e=>{if(e.target===ov)ov.remove();});
    ov.querySelector('#bulk-proj-cancel').onclick=()=>ov.remove();
    ov.querySelector('#bulk-proj-ok').onclick=async()=>{
      const val=ov.querySelector('#bulk-proj-sel').value||null;ov.remove();
      for(const t of tasks){
        t.projectId=val;
        if(!val)t.sectionId=null;
        if(val&&t.status==='inbox')t.status='active'; // Inboxから移動
      await saveTask(t);}
      toast(tasks.length+'件を更新しました');render();
    };
  } else if(field==='repeat'){
    const ov=document.createElement('div');ov.className='overlay';
    ov.innerHTML='<div class="modal"><div class="modal-title">繰り返しを一括設定</div>'
      +'<select id="bulk-rep-sel" class="finput fselect" style="margin-bottom:12px"><option value="">なし</option>'
      +['daily:毎日','weekdays:平日','weekly:毎週','monthly:毎月','yearly:毎年'].map(x=>{const[v,l]=x.split(':');return'<option value="'+v+'">'+l+'</option>'}).join('')
      +'</select>'
      +'<div style="display:flex;gap:8px">'
        +'<button class="btn btn-primary" id="bulk-rep-ok">設定する</button>'
        +'<button class="btn btn-ghost" id="bulk-rep-cancel">キャンセル</button>'
      +'</div></div>';
    document.body.appendChild(ov);requestAnimationFrame(()=>ov.classList.add('open'));
    ov.addEventListener('click',e=>{if(e.target===ov)ov.remove();});
    ov.querySelector('#bulk-rep-cancel').onclick=()=>ov.remove();
    ov.querySelector('#bulk-rep-ok').onclick=async()=>{
      const val=ov.querySelector('#bulk-rep-sel').value||null;ov.remove();
      for(const t of tasks){t.repeatRule=val;await saveTask(t);}
      toast(tasks.length+'件を更新しました');render();
    };
  } else if(field==='flag'){
    const anyUnflagged=tasks.some(t=>!t.flagged);
    for(const t of tasks){t.flagged=anyUnflagged;await saveTask(t);}
    toast(tasks.length+'件を'+(anyUnflagged?'フラグ付き':'フラグなし')+'に設定しました');render();
  } else if(field==='complete'){
    openConfirmModal(tasks.length+'件を完了にする',tasks.length+'件のタスクを完了にしますか？',async()=>{
      for(const t of tasks){t.status='completed';t.completedAt=now();await saveTask(t);}
      S.selectMode=false;S.selectedIds=[];
      toast(tasks.length+'件を完了にしました');render();
    },'完了にする',false);
  } else if(field==='delete'){
    openConfirmModal(tasks.length+'件を削除',tasks.length+'件のタスクを削除しますか？この操作は取り消せません。',async()=>{
      for(const t of tasks)await delTask(t.id);
      S.selectMode=false;S.selectedIds=[];
      toast(tasks.length+'件を削除しました');render();
    });
  }
}

// ===== RENDER APP =====
function render(){
  localStorage.setItem('focus_view_state',JSON.stringify({view:S.view,projId:S.projId||null,tagId:S.tagId||null}));
  if(S.dark)document.documentElement.setAttribute('data-dark','');
  else document.documentElement.removeAttribute('data-dark');
  // sidebar open/close
  const sb=document.getElementById('sidebar');
  const sov=document.getElementById('sov');
  if(S.sidebarOpen){sb.classList.add('open');sov.classList.add('open');if(window.innerWidth<=768)document.body.style.overflow='hidden';}
  else{sb.classList.remove('open');sov.classList.remove('open');document.body.style.overflow='';}
  renderSidebar();
  attachProjRenameListeners();
  attachProjDragListeners();
  attachTagDragListeners();
  renderBotNav();
  renderContent();
  renderDrawer();
  setupQA();
}
function renderInstant(){
  const sb=document.getElementById('sidebar');
  if(sb)sb.style.transition='none';
  render();
  requestAnimationFrame(()=>requestAnimationFrame(()=>{const sb=document.getElementById('sidebar');if(sb)sb.style.transition='';}));
}

// ===== QUICK ADD =====
function setupQA(){
  const inp=document.getElementById('qainput');
  const btn=document.getElementById('qabtn');
  const chips=document.getElementById('qachips');
  if(!inp)return;
  if(inp.dataset.qaReady)return;
  inp.dataset.qaReady='1';
  // モバイルで即座にキーボードを出す
  const wrap=document.getElementById('qawrap');
  if(wrap){
    wrap.addEventListener('touchend',e=>{
      if(!e.target.matches('button,input'))inp.focus();
    },{passive:true});
  }
  inp.addEventListener('input',()=>{
    const p=parseQA(inp.value);
    let h='';
    if(p.dueAt)h+='<span class="chip chip-date">📅 '+fmtDate(p.dueAt)+'</span>';
    if(p.priority<4)h+='<span class="chip chip-pri">P'+p.priority+'</span>';
    p.tagIds.forEach(id=>{const t=S.tags.find(x=>x.id===id);if(t)h+='<span class="chip chip-tag">#'+esc(t.name)+'</span>'});
    chips.innerHTML=h;
    btn.style.display=inp.value.trim()?'':'none';
  });
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();submitQA()}});
}

async function submitQA(){
  const inp=document.getElementById('qainput');
  if(!inp||!inp.value.trim())return;
  const p=parseQA(inp.value);
  if(!p.title){toast('タイトルを入力してください');return}
  // 未登録タグを自動作成
  if(p._newTagNames&&p._newTagNames.length){
    for(const name of p._newTagNames){
      const nt=mkTag({name,color:'#7c3aed'});
      await saveTag(nt);
      p.tagIds.push(nt.id);
    }
  }
  const status=S.view==='project'?'active':'inbox';
  const task=mkTask({...p,status,projectId:p.projectId||(S.view==='project'?S.projId:null)});
  await saveTask(task);
  inp.value='';
  document.getElementById('qachips').innerHTML='';
  document.getElementById('qabtn').style.display='none';
  playSE('add');
  toast('"'+task.title+'" を追加しました');
  render();
}

// ===== EVENTS =====
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-a]');
  if(!el)return;
  const a=el.dataset.a;

  if(a==='view'){if(_touchMoved)return;closeViewHelp();if(el.dataset.v!=='search')S.search='';S.view=el.dataset.v;S.projId=null;S.tagId=null;if(window.innerWidth<=768){playSE('toggle');if(Date.now()-_projDragEndedAt>400)S.sidebarOpen=false;}if(el.dataset.v==='search'&&window.innerWidth<=768){const _gs=document.getElementById('global-srch');if(_gs)_gs.focus();}render();if(el.dataset.v==='search')setTimeout(()=>document.getElementById('srch')?.focus(),80);}
  else if(a==='proj'||a==='goto-proj'){if(_touchMoved)return;S.search='';S.view='project';S.projId=el.dataset.id;if(window.innerWidth<=768){playSE('toggle');if(Date.now()-_projDragEndedAt>400)S.sidebarOpen=false;}render()}
  else if(a==='tag'){if(_touchMoved)return;S.search='';S.view='tag';S.tagId=el.dataset.id;if(window.innerWidth<=768){playSE('toggle');if(Date.now()-_projDragEndedAt>400)S.sidebarOpen=false;}render()}
  else if(a==='hidden-proj-noop'){/* no-op: clicking hidden project area does nothing */}
  else if(a==='proj-toggle'){S.projsOpen=!S.projsOpen;renderSidebar();attachProjRenameListeners();attachProjDragListeners();attachTagDragListeners();}
  else if(a==='hidden-proj-toggle'){S.hiddenProjsOpen=!S.hiddenProjsOpen;renderSidebar();attachProjRenameListeners();attachProjDragListeners();attachTagDragListeners();}
  else if(a==='hidden-proj-edit'){e.stopPropagation();showHiddenProjEditPopup(el,el.dataset.id,el.dataset.name);}
  
  else if(a==='menu'){if(Date.now()-_drawerClosedAt<400)return;playSE('toggle');S.sidebarOpen=!S.sidebarOpen;render()}

  else if(a==='nav-prev'||a==='nav-next'){playSE('toggle');
    const seq=getNavSequence();
    if(!seq.length)return;
    const cur=getCurrentNavIdx(seq);
    const len=seq.length;
    // curが-1（未知のビュー）のときは先頭/末尾へ
    let ni;
    if(a==='nav-prev') ni=cur<=0?len-1:cur-1;
    else ni=cur>=len-1?0:cur+1;
    const item=seq[ni];
    if(!item)return;
    S.taskId=null;S.drawerOpen=false;
    if(item.type==='view'){S.view=item.v;}
    else if(item.type==='proj'){S.view='project';S.projId=item.id;}
    else if(item.type==='tag'){S.view='tag';S.tagId=item.id;}
    render();
  }
  
  else if(a==='dark'){S.dark=!S.dark;localStorage.setItem('dark',S.dark?'1':'0');render()}
  else if(a==='newtask'){
    if(S.view==='notes'){S.view='inbox';S.noteOpen=false;}
    const task=mkTask({status:S.view==='project'?'active':'inbox',projectId:S.view==='project'?S.projId:null});
    await saveTask(task);S.taskId=task.id;S.drawerOpen=true;render();
    setTimeout(()=>document.getElementById('dt-title')?.focus(),50);
  }
  else if(a==='newnote'){
    if(window._noteNewRunning)return;
    window._noteNewRunning=true;
    try{
      S.view='notes';S.search='';
      const n=mkNote();await saveNote(n);
      S.noteId=n.id;S.noteOpen=true;render();
      setTimeout(()=>document.getElementById('nt-title')?.focus(),50);
    }finally{setTimeout(()=>{window._noteNewRunning=false},500);}
  }
  else if(a==='qa-submit'){await submitQA()}
  
else if(a==='sel'){
  if(_touchMoved) return;
  if(e.target.closest('#drawer')) return;
  if(S.selectMode){
    const id=el.dataset.id;
    const idx=S.selectedIds.indexOf(id);
    if(idx>=0)S.selectedIds.splice(idx,1);else S.selectedIds.push(id);
    renderContent();
    return;
  }
  if(window.innerWidth<=768) return; // スマホはsel-editボタンで開く
  const id=el.dataset.id;
  if(S.taskId===id&&S.drawerOpen){S.drawerOpen=false;S.taskId=null}
  else{S.taskId=id;S.drawerOpen=true;playSE('open');}
  renderContent();renderSidebar();renderDrawer();
}
else if(a==='sel-edit'){
  e.stopPropagation();
  if(_touchMoved) return;
  const id=el.dataset.id;
  if(S.taskId===id&&S.drawerOpen){S.drawerOpen=false;S.taskId=null}
  else{S.taskId=id;S.drawerOpen=true;playSE('open');}
  renderContent();renderSidebar();renderDrawer();
}

  
  else if(a==='chk'){
    e.stopPropagation();
    const task=S.tasks.find(t=>t.id===el.dataset.id);
    if(!task)return;
    if(task.status==='completed'){
      task.status=task.projectId?'active':'inbox';task.completedAt=null;
      await saveTask(task);render();
    } else {
      const snap=JSON.stringify(task);
      task.status='completed';task.completedAt=now();
      await saveTask(task);
      playSE('complete');
      if(task.repeatRule&&task.dueAt){
        const next=nextRepeat(task);
        if(next){await saveTask(next);toast('"'+task.title+'" 完了。次回: '+fmtDate(next.dueAt))}
        else toast('"'+task.title+'" 完了 ✓');
      } else {
        toast('"'+(task.title||'無題')+'" 完了 ✓',async()=>{
          const r=JSON.parse(snap);await saveTask(r);render();
        });
      }
      if(S.taskId===task.id){S.drawerOpen=false;S.taskId=null}
      render();
    }
  }
  
  else if(a==='view-help'){e.stopPropagation();openViewHelp(el);}
  else if(a==='close-vhelp'){closeViewHelp();}
  else if(a==='close-drawer'){S.drawerOpen=false;S.taskId=null;_drawerClosedAt=Date.now();renderDrawer();renderContent()}
  
  else if(a==='note-new'){
    if(window._noteNewRunning)return;
    window._noteNewRunning=true;
    try{
      const n=mkNote();await saveNote(n);
      playSE('add');
      S.noteId=n.id;S.noteOpen=true;renderContent();
      setTimeout(()=>document.getElementById('nt-title')?.focus(),50);
    }finally{setTimeout(()=>{window._noteNewRunning=false},500);}
  }
  else if(a==='note-sel'){
    if(_touchMoved)return;
    if(window.innerWidth<=768)return; // モバイルはnote-sel-editで開く
    const id=el.dataset.id;
    if(S.noteId===id&&S.noteOpen){S.noteOpen=false;S.noteId=null;}
    else{S.noteId=id;S.noteOpen=true;}
    renderContent();
  }
  else if(a==='note-sel-edit'){
    e.stopPropagation();
    if(_touchMoved)return;
    const id=el.dataset.id;
    if(S.noteId===id&&S.noteOpen){S.noteOpen=false;S.noteId=null;}
    else{S.noteId=id;S.noteOpen=true;}
    renderContent();
  }
  else if(a==='note-from-search'){
    const id=el.dataset.id;
    S.view='notes';S.search='';S.noteId=id;S.noteOpen=true;
    render();
  }
  else if(a==='close-note'){S.noteOpen=false;S.noteId=null;renderContent();}
  else if(a==='note-del'){
    const id=el.dataset.id;
    openConfirmModal('メモを削除','このメモを削除しますか？',async()=>{
      await delNote(id);playSE('delete');S.noteOpen=false;S.noteId=null;renderContent();
    },'削除',true);
  }
  else if(a==='note-copy-url'){
    const id=el.dataset.id;
    const url=location.origin+location.pathname+'?note='+id;
    navigator.clipboard?.writeText(url).then(()=>toast('URLをコピーしました')).catch(()=>toast(url));
  }
  else if(a==='note-copy-body'||a==='copy-note-body-inline'){
    const bodyEl=document.getElementById('nt-body');
    const text=bodyEl?bodyEl.value:(S.notes.find(n=>n.id===S.noteId)||{}).body||'';
    navigator.clipboard?.writeText(text).then(()=>toast('メモをコピーしました 📋')).catch(()=>{
      const inp=document.createElement('textarea');inp.value=text;document.body.appendChild(inp);inp.select();document.execCommand('copy');inp.remove();toast('メモをコピーしました 📋');
    });
  }
  else if(a==='note-dup'){
    const note=S.notes.find(n=>n.id===el.dataset.id);
    if(note){
      openConfirmModal(
        'メモを複製',
        '"'+(note.title||'無題')+'" を複製しますか？',
        async()=>{
          const d={...note,id:uid(),title:(note.title||'無題')+' (コピー)',createdAt:now(),updatedAt:now()};
          await saveNote(d);S.noteId=d.id;S.noteOpen=true;renderContent();toast('"'+(d.title)+'" を複製しました');
        },
        '複製',false
      );
    }
  }
  else if(a==='copy-task-notes'){
    const ta=document.getElementById('dt-notes');
    const text=ta?ta.value:'';
    navigator.clipboard?.writeText(text).then(()=>toast('メモをコピーしました 📋')).catch(()=>{
      const inp=document.createElement('textarea');inp.value=text;document.body.appendChild(inp);inp.select();document.execCommand('copy');inp.remove();toast('メモをコピーしました 📋');
    });
  }
  else if(a==='paste-to-field'||a==='paste-newline-field'){
    const targetId=el.dataset.target;
    const ctx=el.closest('.expand-modal,#drawer');
    const ta=(ctx&&ctx.querySelector('#'+targetId))||document.getElementById(targetId);
    if(!ta)return;
    // プレビューモード中なら編集モードへ切替
    if(ta.style.display==='none'){
      const toggleBtn=ctx?.querySelector('#dt-preview-btn,#nt-preview-btn');
      if(toggleBtn)toggleBtn.click();
    }
    const newline=a==='paste-newline-field';
    const hasFocus=!!ta._stampFocused;
    if(navigator.clipboard&&navigator.clipboard.readText){
      navigator.clipboard.readText().then(text=>{
        if(!hasFocus){
          ta.value=text+'\n'+ta.value;
          ta.selectionStart=ta.selectionEnd=text.length+1;
          ta.dispatchEvent(new Event('input'));ta.focus();toast('先頭に貼り付けました');
        }else if(newline){
          const base=ta.value===''?'':(ta.value.endsWith('\n')?ta.value:ta.value+'\n');
          ta.value=base+text;
          ta.selectionStart=ta.selectionEnd=ta.value.length;
          ta.dispatchEvent(new Event('input'));ta.focus();toast('最終行に改行して貼り付けました');
        }else{
          const s=ta.selectionStart??ta.value.length,e2=ta.selectionEnd??ta.value.length;
          ta.value=ta.value.slice(0,s)+text+ta.value.slice(e2);
          ta.selectionStart=ta.selectionEnd=s+text.length;
          ta.dispatchEvent(new Event('input'));ta.focus();toast('貼り付けました');
        }
      }).catch(()=>toast('クリップボードへのアクセスを許可してください'));
    } else {toast('お使いのブラウザでは貼り付けをサポートしていません');}
  }
  else if(a==='date-adj'){
    const field=el.dataset.field;
    const days=parseInt(el.dataset.days||'0');
    const months=parseInt(el.dataset.months||'0');
    const inputId=field==='start'?'dt-start':'dt-due';
    const input=el.closest('.expand-modal')?.querySelector('#'+inputId)||document.getElementById(inputId);
    if(!input)return;
    let base;
    if(input.value){
      const[y,m,d]=input.value.split('-').map(Number);
      base=new Date(Date.UTC(y,m-1,d));
      if(days)base.setUTCDate(base.getUTCDate()+days);
      if(months)base.setUTCMonth(base.getUTCMonth()+months);
    }else{
      // 空欄の場合は「今日」を初期値にする（+1日は次のクリックから）
      const n=new Date();
      base=new Date(Date.UTC(n.getFullYear(),n.getMonth(),n.getDate()));
      // 月単位の調整は空欄からでも適用
      if(months)base.setUTCMonth(base.getUTCMonth()+months);
    }
    const newVal=base.toISOString().slice(0,10);
    input.value=newVal;
    document.querySelectorAll('#dt-'+field+'-wd').forEach(s=>s.textContent=wdStr(newVal));
    const task=S.tasks.find(t=>t.id===S.taskId);

// ===== GLOBAL CALCULATOR DRAWER =====
let _calcState={expr:'',result:'',history:[],justEvaled:false};
let _calcBuilt=false;

function openCalcDrawer(){
  const ov=document.getElementById('calc-drawer-ov');
  const dr=document.getElementById('calc-drawer-global');
  if(!ov||!dr)return;
  if(!_calcBuilt){_buildCalcInDrawer();_calcBuilt=true;}
  // スマホではキーボードを閉じる
  if(document.activeElement&&(document.activeElement.tagName==='INPUT'||document.activeElement.tagName==='TEXTAREA')){
    document.activeElement.blur();
  }
  ov.classList.add('open');
  dr.classList.add('open');
}

function closeCalcDrawer(){
  const ov=document.getElementById('calc-drawer-ov');
  const dr=document.getElementById('calc-drawer-global');
  if(ov)ov.classList.remove('open');
  if(dr)dr.classList.remove('open');
}

function toggleCalcDrawer(){
  const dr=document.getElementById('calc-drawer-global');
  if(dr&&dr.classList.contains('open'))closeCalcDrawer();
  else openCalcDrawer();
}

// close on overlay click
document.getElementById('calc-drawer-ov')?.addEventListener('click',closeCalcDrawer);
document.getElementById('calc-drawer-close-btn')?.addEventListener('click',closeCalcDrawer);

// calc drawer の newtask/newnote ボタンは閉じてから実行
document.getElementById('calc-drawer-global')?.addEventListener('click',e=>{

  if(btn)closeCalcDrawer();
},true);

// Right-edge swipe (≤22px from right) → open calc drawer
(function(){
  let _sx=null,_sy=null;
  document.addEventListener('touchstart',e=>{
    const t=e.touches[0];
    if(window.innerWidth-t.clientX<=22){_sx=t.clientX;_sy=t.clientY;}
    else _sx=null;
  },{passive:true});
  document.addEventListener('touchmove',e=>{
    if(_sx===null)return;
    const t=e.touches[0];
    const dx=_sx-t.clientX;
    const dy=Math.abs(t.clientY-_sy);
    if(dx>36&&dy<80){_sx=null;openCalcDrawer();}
  },{passive:true});
})();

// Left-to-right swipe on calc drawer → close
(function(){
  const dr=document.getElementById('calc-drawer-global');
  if(!dr)return;
  let _sx=null,_sy=null;
  dr.addEventListener('touchstart',e=>{
    const t=e.touches[0];_sx=t.clientX;_sy=t.clientY;
  },{passive:true});
  dr.addEventListener('touchmove',e=>{
    if(_sx===null)return;
    const t=e.touches[0];
    const dx=t.clientX-_sx; // positive = right swipe
    const dy=Math.abs(t.clientY-_sy);
    if(dx>60&&dy<80){_sx=null;closeCalcDrawer();}
  },{passive:true});
  dr.addEventListener('touchend',()=>{_sx=null;},{passive:true});
  dr.addEventListener('touchcancel',()=>{_sx=null;},{passive:true});
})();

function _buildCalcInDrawer(){
  const container=document.getElementById('calc-drawer-body');
  if(!container)return;

  let expr=_calcState.expr,result=_calcState.result,calcHistory=_calcState.history,justEvaled=_calcState.justEvaled;

  function saveState(){_calcState={expr,result,history:calcHistory,justEvaled};}

  function safeCalc(s){
    try{
      if(!s||!/^[0-9+\-*/.() ]+$/.test(s))return null;
      const r=new Function('return('+s+')')();
      if(typeof r!=='number'||!isFinite(r))return null;
      return String(Math.round(r*1e10)/1e10);
    }catch(e){return null;}
  }

  function fmtComma(s){
    if(s===''||s==null)return s;
    const neg=s[0]==='-';const abs=neg?s.slice(1):s;
    const[intPart,decPart]=abs.split('.');
    const fmt=intPart.replace(/\B(?=(\d{3})+(?!\d))/g,',');
    return(neg?'-':'')+fmt+(decPart!=null?'.'+decPart:'');
  }

  function fmtOkuMan(s){
    const num=parseFloat(s);if(isNaN(num)||!isFinite(num))return '';
    const abs=Math.abs(num);if(abs<10000)return '';
    const sign=num<0?'-':'';
    const cho=Math.floor(abs/1000000000000);
    const oku=Math.floor((abs%1000000000000)/100000000);
    const man=Math.floor((abs%100000000)/10000);
    if(cho>0&&oku>0&&man>0)return sign+fmtComma(String(cho))+'兆'+fmtComma(String(oku))+'億'+fmtComma(String(man))+'万';
    if(cho>0&&oku>0)return sign+fmtComma(String(cho))+'兆'+fmtComma(String(oku))+'億';
    if(cho>0&&man>0)return sign+fmtComma(String(cho))+'兆'+fmtComma(String(man))+'万';
    if(cho>0)return sign+fmtComma(String(cho))+'兆';
    if(oku>0&&man>0)return sign+fmtComma(String(oku))+'億'+fmtComma(String(man))+'万';
    if(oku>0)return sign+fmtComma(String(oku))+'億';
    return sign+fmtComma(String(man))+'万';
  }

  function fmtExpr(s){
    return s.replace(/(\d+\.?\d*)/g,m=>fmtComma(m)).replace(/\*/g,'×').replace(/\//g,'÷');
  }

  function doCopy(text,doneCb){
    if(!text)return;
    navigator.clipboard?.writeText(text).then(doneCb).catch(()=>{
      const t=document.createElement('textarea');t.value=text;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();doneCb?.();
    });
  }

  // Button press animation + sound
  function pressAnimate(btn){
    if(!btn)return;
    btn.classList.add('pressed');
    window.playClick?.();
    setTimeout(()=>btn.classList.remove('pressed'),160);
  }

  // Utility button feedback
  function showCopied(btn,label){
    btn.innerHTML='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20,6 9,17 4,12"/></svg> コピー済';
    btn.classList.add('copied');
    setTimeout(()=>{btn.textContent=label;btn.classList.remove('copied');},1400);
  }
  function showCleared(btn){
    btn.innerHTML='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20,6 9,17 4,12"/></svg> クリア済';
    btn.classList.add('cleared');
    setTimeout(()=>{btn.textContent='式をクリア';btn.classList.remove('cleared');},1200);
  }

  const wrap=document.createElement('div');
  wrap.className='inline-calc';
  wrap.innerHTML=
      '<div class="calc-top-scroll">'
        +'<div class="calc-hist" style="display:none"></div>'
      +'</div>'
      +'<div class="calc-mid-section">'
        +'<div class="calc-display">'
          +'<div class="calc-expr-inline"></div>'
          +'<div class="calc-result-wrap">'
            +'<div style="flex:1">'
              +'<div class="calc-result">0</div>'
              +'<div class="calc-okuMan"></div>'
            +'</div>'
          +'</div>'
        +'</div>'
      +'</div>'
      +'<div class="calc-pad-wrap">'
        +'<div class="calc-action-row">'
          +'<button class="calc-paren-btn" data-cv="(">(</button>'
          +'<button class="calc-paren-btn" data-cv=")">)</button>'
          +'<button class="calc-paren-btn calc-tax-in" style="font-size:13px">税込</button>'
          +'<button class="calc-paren-btn calc-tax-out" style="font-size:13px">税抜</button>'
        +'</div>'
        +'<div class="calc-grid">'
          +'<button class="calc-btn cac" data-cv="AC">AC</button>'
          +'<button class="calc-btn cfn" data-cv="±">±</button>'
          +'<button class="calc-btn cfn" data-cv="BS">⌫</button>'
          +'<button class="calc-btn cop" data-cv="/">÷</button>'
          +'<button class="calc-btn" data-cv="7">7</button>'
          +'<button class="calc-btn" data-cv="8">8</button>'
          +'<button class="calc-btn" data-cv="9">9</button>'
          +'<button class="calc-btn cop" data-cv="*">×</button>'
          +'<button class="calc-btn" data-cv="4">4</button>'
          +'<button class="calc-btn" data-cv="5">5</button>'
          +'<button class="calc-btn" data-cv="6">6</button>'
          +'<button class="calc-btn cop" data-cv="-">−</button>'
          +'<button class="calc-btn" data-cv="1">1</button>'
          +'<button class="calc-btn" data-cv="2">2</button>'
          +'<button class="calc-btn" data-cv="3">3</button>'
          +'<button class="calc-btn cop" data-cv="+">+</button>'
          +'<button class="calc-btn" data-cv="0" style="grid-column:span 2">0</button>'
          +'<button class="calc-btn cfn" data-cv=".">.</button>'
          +'<button class="calc-btn ceq" data-cv="=">=</button>'
        +'</div>'

          +'<button class="calc-util-btn" data-cv="000">000</button>'
