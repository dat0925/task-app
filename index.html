async function extractPptxText(file){
  await loadJSZip();
  const zip=await window.JSZip.loadAsync(await file.arrayBuffer());
  const slidePaths=Object.keys(zip.files)
    .filter(p=>/^ppt\/slides\/slide\d+\.xml$/.test(p))
    .sort((a,b)=>{
      const na=parseInt(a.match(/slide(\d+)\.xml/)[1],10);
      const nb=parseInt(b.match(/slide(\d+)\.xml/)[1],10);
      return na-nb;
    });
  const parser=new DOMParser();
  const slideTexts=[];
  for(const p of slidePaths){
    const xml=await zip.files[p].async('text');
    const doc=parser.parseFromString(xml,'application/xml');
    const runs=Array.from(doc.getElementsByTagName('a:t')).map(n=>n.textContent).filter(Boolean);
    if(runs.length)slideTexts.push(runs.join(' '));
  }
  return slideTexts.map((t,i)=>'[スライド'+(i+1)+'] '+t).join('\n');
}

async function extractXlsxText(file){
  await loadXLSX();
  const buf=await file.arrayBuffer();
  const wb=window.XLSX.read(buf,{type:'array'});
  const parts=[];
  for(const sheetName of wb.SheetNames){
    const csv=window.XLSX.utils.sheet_to_csv(wb.Sheets[sheetName]).trim();
    if(csv)parts.push('[シート: '+sheetName+']\n'+csv);
  }
  return parts.join('\n\n');
}

async function handleExtractFile(ov,file){
  const ext=(file.name.split('.').pop()||'').toLowerCase();
  const btn=ov.querySelector('#extract-attach-btn');
  const setLoading=(on)=>{if(btn){btn.disabled=on;btn.textContent=on?'…':'📎';}};

  if(ext==='pdf'){
    if(file.size>20*1024*1024){toast('PDFは20MB以内にしてください');return;}
    try{
      const base64=await fileToBase64Raw(file);
      _extractAttachment={kind:'pdf',mediaType:'application/pdf',base64,fileName:file.name};
      renderExtractAttachmentChip(ov);
    }catch(e){toast('PDFの読み込みに失敗しました: '+e.message);}
    return;
  }
  if(file.type&&file.type.startsWith('image/')){
    if(file.size>15*1024*1024){toast('画像サイズは15MB以内にしてください');return;}
    try{
      const base64=await fileToBase64Raw(file);
      _extractAttachment={kind:'image',mediaType:file.type,base64,fileName:file.name||'photo.jpg'};
      renderExtractAttachmentChip(ov);
    }catch(e){toast('画像の読み込みに失敗しました: '+e.message);}
    return;
  }
  if(ext==='doc'){toast('.doc形式には対応していません。.docx形式で保存し直してください');return;}
  if(ext==='ppt'){toast('.ppt形式には対応していません。.pptx形式で保存し直してください');return;}
  if(ext==='xls'){toast('.xls形式には対応していません。.xlsx形式で保存し直してください');return;}
  if(ext==='docx'){
    setLoading(true);
    try{
      await loadMammoth();
      const buf=await file.arrayBuffer();
      const result=await window.mammoth.extractRawText({arrayBuffer:buf});
      const extractedText=(result.value||'').trim();
      if(!extractedText){toast('文書からテキストを抽出できませんでした');return;}
      _extractAttachment={kind:'docx',mediaType:null,base64:null,fileName:file.name,text:extractedText};
      renderExtractAttachmentChip(ov);
    }catch(e){toast('Wordファイルの読み込みに失敗しました: '+e.message);}
    finally{setLoading(false);}
    return;
  }
  if(ext==='pptx'){
    setLoading(true);
    try{
      const extractedText=(await extractPptxText(file)).trim();
      if(!extractedText){toast('スライドからテキストを抽出できませんでした');return;}
      _extractAttachment={kind:'pptx',mediaType:null,base64:null,fileName:file.name,text:extractedText};
      renderExtractAttachmentChip(ov);
    }catch(e){toast('PowerPointファイルの読み込みに失敗しました: '+e.message);}
    finally{setLoading(false);}
    return;
  }
  if(ext==='xlsx'){
    setLoading(true);
    try{
      const extractedText=(await extractXlsxText(file)).trim();
      if(!extractedText){toast('シートからテキストを抽出できませんでした');return;}
      _extractAttachment={kind:'xlsx',mediaType:null,base64:null,fileName:file.name,text:extractedText};
      renderExtractAttachmentChip(ov);
    }catch(e){toast('Excelファイルの読み込みに失敗しました: '+e.message);}
    finally{setLoading(false);}
    return;
  }
  toast('対応していないファイル形式です（Word・Excel・PowerPoint・PDF・画像のみ）');
}

    +'<span>'+icon+'</span><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(a.fileName)+'</span>'

    +'</div>';

async function extractAnalyze(ov){
  const ta=ov.querySelector('#extract-input');
  const text=(ta?.value||'').trim();
  const attachment=_extractAttachment;
  const usingAttachment=!!attachment;

  if(usingAttachment&&!isPlanPremium()){
    // 念のためのフロント側ガード（サーバー側でも判定するが二重チェック）
    ov.remove();showUpgradeModal('fileExtract');return;
  }
  if(!text&&!usingAttachment){toast('テキストを貼り付けるか、ファイル・写真を添付してください');return;}
  if(text.length>8000){toast('本文は8000文字以内にしてください');return;}

  const btn=ov.querySelector('#extract-analyze');
  const cancelBtn=ov.querySelector('#extract-cancel');
  btn.disabled=true;btn.textContent='解析中…';cancelBtn.disabled=true;
  try{
    const { data: { session } } = await window._SB.auth.getSession();
    if(!session?.access_token){toast('ログインが必要です');btn.disabled=false;btn.textContent='解析する';cancelBtn.disabled=false;return;}
    const t=today();
    const systemPrompt='あなたはメール本文・Teamsのやり取り・会議メモ・口頭伝達メモ、および添付されたWord/Excel/PowerPoint/PDF文書や写真から'
      +'「行動が必要なタスク」だけを抽出するアシスタントです。今日の日付は'+t+'です。\n'
      +'ルール:\n'
      +'- 挨拶・世間話・FYI共有・すでに完了済みの報告・単なる情報連携など、行動を要さない内容は無視する\n'
      +'- 1つの行動項目につき1タスク。無理に細かく分割しない\n'
      +'- タイトルは「誰が」「何をするか」が一目で分かるよう簡潔に（20〜30文字目安）\n'
      +'- 期限らしき日付・曜日・相対表現（明日/来週金曜/月末等）があればYYYY-MM-DD形式のdue_atに変換する。無ければ省略する\n'
      +'- 元文から要点を1〜2文でnotesに補足してもよい（本文をそのまま長く引用しない）\n'
      +'- 添付が写真の場合、写っている文書・ホワイトボード・手書きメモ等の文字を読み取ってから同様に判断する\n'
      +'- 添付がExcelの場合、表の各行を単純に転記せず、対応が必要な行（未対応・期限あり等）だけを拾う\n'
      +'- 添付がPowerPointの場合、スライドのタイトルや箇条書きから決定事項・宿題事項を拾う\n'
      +'- 確信が持てる項目だけを拾う。該当する行動項目が無ければ空配列を返してよい\n'
      +'- 必ずextract_tasksツールを1回だけ呼び出し、結果はそのツール呼び出しのみで返す';
    const tools=[{
      name:'extract_tasks',
      description:'貼り付けられたテキストや添付ファイルから抽出した行動項目の一覧を返す',
      input_schema:{
        type:'object',
        properties:{
          tasks:{
            type:'array',
            items:{
              type:'object',
              properties:{
                title:{type:'string',description:'タスクのタイトル'},
                due_at:{type:'string',description:'期限日 YYYY-MM-DD。不明なら省略'},
                notes:{type:'string',description:'補足メモ。不要なら省略'},
              },
              required:['title'],
            },
          },
        },
        required:['tasks'],
      },
    }];

    // 添付の種類に応じてメッセージ内容を組み立てる
    let content;
    if(attachment?.kind==='image'){
      content=[
        {type:'image',source:{type:'base64',media_type:attachment.mediaType,data:attachment.base64}},
        {type:'text',text:text||'この写真に写っている内容から、行動が必要なタスクを抽出してください。'},
      ];
    }else if(attachment?.kind==='pdf'){
      content=[
        {type:'document',source:{type:'base64',media_type:'application/pdf',data:attachment.base64}},
        {type:'text',text:text||'この添付PDFの内容から、行動が必要なタスクを抽出してください。'},
      ];
    }else if(attachment?.kind==='docx'||attachment?.kind==='xlsx'||attachment?.kind==='pptx'){
      const labelMap={docx:'添付Word文書',xlsx:'添付Excelブック',pptx:'添付PowerPoint'};
      const combined=(text?text+'\n\n':'')+'【'+labelMap[attachment.kind]+': '+attachment.fileName+'】\n'+attachment.text.slice(0,20000);
      content=combined;
    }else{
      content=text;
    }

    const body={
      model:'claude-haiku-4-5-20251001',
      max_tokens:1536,
      system:systemPrompt,
      messages:[{role:'user',content}],
      tools,
      tool_choice:{type:'tool',name:'extract_tasks'},
    };
    if(usingAttachment)body.feature='file_extract'; // サーバー側でプレミアム判定・月30回の別枠上限をチェック

    const res=await fetch(AI_ENDPOINT,{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},
      body:JSON.stringify(body),
    });
    const data=await res.json();
    if(data.error==='premium_required'){ov.remove();showUpgradeModal('fileExtract');return;}
    if(res.status===429&&data.error==='file_limit_exceeded'){toast(data.message||'今月のファイル解析回数の上限に達しました。');btn.disabled=false;btn.textContent='解析する';cancelBtn.disabled=false;return;}
    if(res.status===429){toast(data.message||'今月のAI利用回数が上限に達しました。');ov.remove();showUpgradeModal('ai');return;}
    if(data.error)throw new Error(data.error);
    const toolBlock=(data.content||[]).find(b=>b.type==='tool_use'&&b.name==='extract_tasks');
    const rawTasks=toolBlock?.input?.tasks||[];
    _extractCandidates=rawTasks.filter(x=>x&&x.title).map(x=>({
      id:uid(),title:String(x.title).slice(0,CHAR_LIMITS.taskTitle),
      dueAt:x.due_at||null,notes:x.notes||'',selected:true,
    }));
    _extractAttachment=null;
    renderExtractResults(ov);
  }catch(e){
    toast('解析でエラーが発生しました: '+e.message);
    btn.disabled=false;btn.textContent='解析する';cancelBtn.disabled=false;
  }
}

function renderExtractResults(ov){
  const body=ov.querySelector('#extract-body');
  const foot=ov.querySelector('.modal-foot');
  if(_extractCandidates.length===0){
    body.innerHTML='<div style="text-align:center;padding:30px 10px;color:var(--text3);font-size:13.5px">行動が必要そうな項目は見つかりませんでした。<br>別の文章で試すか、通常のタスク追加をご利用ください。</div>';
    foot.innerHTML='<button class="btn btn-ghost" id="extract-cancel2">閉じる</button>';
    foot.querySelector('#extract-cancel2').onclick=()=>ov.remove();
    return;
  }
  const rowHtml=c=>
    '<div class="extract-row" data-id="'+c.id+'" style="display:flex;gap:8px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--border)">'
      +'<input type="checkbox" data-extract-chk="'+c.id+'" '+(c.selected?'checked':'')+' style="margin-top:11px;width:17px;height:17px;flex-shrink:0">'
      +'<div style="flex:1;min-width:0">'
        +'<textarea class="finput" data-extract-title="'+c.id+'" maxlength="'+CHAR_LIMITS.taskTitle+'" rows="1" style="font-size:14px;font-weight:500;margin-bottom:4px;resize:none;overflow:hidden;line-height:1.4;white-space:pre-wrap;word-break:break-word">'+esc(c.title)+'</textarea>'
        +'<div style="display:flex;align-items:center;gap:6px">'
          +'<span style="font-size:11px;color:var(--text3)">📅</span>'
          +'<input type="date" data-extract-due="'+c.id+'" value="'+(c.dueAt||'')+'" style="font-size:12px;border:1px solid var(--border);border-radius:6px;padding:2px 6px;background:var(--bg)">'
        +'</div>'
      +'</div>'
    +'</div>';
  body.innerHTML='<div style="font-size:12px;color:var(--text3);margin-bottom:4px">'+_extractCandidates.length+'件見つかりました。内容を確認して、Inboxに追加してください</div>'
    +_extractCandidates.map(rowHtml).join('');
  const autoGrow=el=>{el.style.height='auto';el.style.height=el.scrollHeight+'px';};
  body.querySelectorAll('[data-extract-chk]').forEach(el=>{
    el.addEventListener('change',()=>{
      const c=_extractCandidates.find(x=>x.id===el.dataset.extractChk);
      if(c)c.selected=el.checked;
      updateExtractConfirmLabel(ov);
    });
  });
  body.querySelectorAll('[data-extract-title]').forEach(el=>{
    autoGrow(el);
    el.addEventListener('input',()=>{
      const c=_extractCandidates.find(x=>x.id===el.dataset.extractTitle);
      if(c)c.title=el.value;
      autoGrow(el);
    });
  });
  body.querySelectorAll('[data-extract-due]').forEach(el=>{
    el.addEventListener('change',()=>{
      const c=_extractCandidates.find(x=>x.id===el.dataset.extractDue);
      if(c)c.dueAt=el.value||null;
    });
  });
  foot.innerHTML='<button class="btn btn-ghost" id="extract-cancel2">キャンセル</button>'
    +'<button class="btn btn-primary" id="extract-confirm">選択した'+_extractCandidates.filter(c=>c.selected).length+'件をInboxに追加</button>';
  foot.querySelector('#extract-cancel2').onclick=()=>ov.remove();
  foot.querySelector('#extract-confirm').onclick=()=>extractConfirm(ov);
}

function updateExtractConfirmLabel(ov){
  const b=ov.querySelector('#extract-confirm');
  if(b)b.textContent='選択した'+_extractCandidates.filter(c=>c.selected).length+'件をInboxに追加';
}

async function extractConfirm(ov){
  const picked=_extractCandidates.filter(c=>c.selected&&c.title.trim());
  if(picked.length===0){toast('追加する項目を選択してください');return;}
  const btn=ov.querySelector('#extract-confirm');
  btn.disabled=true;btn.textContent='追加中…';
  try{
    for(const c of picked){
      const o={title:c.title.trim(),notes:c.notes||''};
      if(c.dueAt)o.dueAt=c.dueAt;
      await saveTask(mkTask(o));
    }
    toast(picked.length+'件をInboxに追加しました');
    ov.remove();
    _extractCandidates=[];
    S.view='inbox';
    render();
  }catch(e){
    toast('追加でエラーが発生しました: '+e.message);
    btn.disabled=false;btn.textContent='選択した'+picked.length+'件をInboxに追加';
  }
}

(function(){
  let _audioCtx=null;
  window.playClick=function(){
    if(!getSetting('soundFx',true))return;
    try{
      if(!_audioCtx)_audioCtx=new(window.AudioContext||window.webkitAudioContext)();
      const ctx=_audioCtx;
      const t=ctx.currentTime;
      const sr=ctx.sampleRate;
      const master=ctx.createGain();
      master.gain.value=1.0;
      const masterLP=ctx.createBiquadFilter();
      masterLP.type='lowpass';masterLP.frequency.value=1800;masterLP.Q.value=0.5;
      master.connect(masterLP);masterLP.connect(ctx.destination);
      const clickSize=Math.floor(sr*0.008);
      const clickBuf=ctx.createBuffer(1,clickSize,sr);
      const cData=clickBuf.getChannelData(0);
      for(let i=0;i<clickSize;i++){const env=Math.exp(-i/(sr*0.0018));cData[i]=(Math.random()*2-1)*env;}
      const clickSrc=ctx.createBufferSource();clickSrc.buffer=clickBuf;
      const clickBP=ctx.createBiquadFilter();clickBP.type='bandpass';clickBP.frequency.value=2800;clickBP.Q.value=1.8;
      const gClick=ctx.createGain();gClick.gain.setValueAtTime(0.9,t);gClick.gain.exponentialRampToValueAtTime(0.001,t+0.01);
      clickSrc.connect(clickBP);clickBP.connect(gClick);gClick.connect(master);
      clickSrc.start(t);clickSrc.stop(t+0.012);
      const bodyOsc=ctx.createOscillator();bodyOsc.type='triangle';
      bodyOsc.frequency.setValueAtTime(130,t);bodyOsc.frequency.exponentialRampToValueAtTime(75,t+0.08);
      const gBody=ctx.createGain();gBody.gain.setValueAtTime(0.0,t);gBody.gain.linearRampToValueAtTime(0.45,t+0.003);gBody.gain.exponentialRampToValueAtTime(0.001,t+0.11);
      bodyOsc.connect(gBody);gBody.connect(master);bodyOsc.start(t);bodyOsc.stop(t+0.12);
      const impSize=Math.floor(sr*0.015);const impBuf=ctx.createBuffer(1,impSize,sr);const impData=impBuf.getChannelData(0);
      for(let i=0;i<impSize;i++){const env=Math.exp(-i/(sr*0.004));impData[i]=(Math.random()*2-1)*env;}
      const impSrc=ctx.createBufferSource();impSrc.buffer=impBuf;
      const impBP=ctx.createBiquadFilter();impBP.type='bandpass';impBP.frequency.value=650;impBP.Q.value=1.2;
      const gImp=ctx.createGain();gImp.gain.setValueAtTime(0.0,t);gImp.gain.linearRampToValueAtTime(0.55,t+0.001);gImp.gain.exponentialRampToValueAtTime(0.001,t+0.018);
      impSrc.connect(impBP);impBP.connect(gImp);gImp.connect(master);impSrc.start(t+0.003);impSrc.stop(t+0.02);
      const resSize=Math.floor(sr*0.07);const resBuf=ctx.createBuffer(1,resSize,sr);const rData=resBuf.getChannelData(0);const rf=320;
      for(let i=0;i<resSize;i++){const env=Math.exp(-i/(sr*0.022));rData[i]=(Math.sin(2*Math.PI*rf*i/sr)+Math.sin(2*Math.PI*rf*1.98*i/sr)*0.3)*env;}
      const resSrc=ctx.createBufferSource();resSrc.buffer=resBuf;
      const gRes=ctx.createGain();gRes.gain.setValueAtTime(0.0,t);gRes.gain.linearRampToValueAtTime(0.18,t+0.005);gRes.gain.exponentialRampToValueAtTime(0.001,t+0.08);
      resSrc.connect(gRes);gRes.connect(master);resSrc.start(t+0.002);resSrc.stop(t+0.09);
    }catch(e){}
  };

  // AC: 低くて鈍い音（リセット感）
  window.playClickAC=function(){
    if(!getSetting('soundFx',true))return;
    try{
      if(!_audioCtx)_audioCtx=new(window.AudioContext||window.webkitAudioContext)();
      const ctx=_audioCtx;const t=ctx.currentTime;const sr=ctx.sampleRate;
      const master=ctx.createGain();master.gain.value=1.0;
      master.connect(ctx.destination);
      const osc=ctx.createOscillator();osc.type='sawtooth';
      osc.frequency.setValueAtTime(80,t);osc.frequency.exponentialRampToValueAtTime(40,t+0.12);
      const g=ctx.createGain();g.gain.setValueAtTime(0.0,t);g.gain.linearRampToValueAtTime(0.5,t+0.005);g.gain.exponentialRampToValueAtTime(0.001,t+0.15);
      const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=400;
      osc.connect(lp);lp.connect(g);g.connect(master);osc.start(t);osc.stop(t+0.16);
      const ns=Math.floor(sr*0.02);const nb=ctx.createBuffer(1,ns,sr);const nd=nb.getChannelData(0);
      for(let i=0;i<ns;i++){nd[i]=(Math.random()*2-1)*Math.exp(-i/(sr*0.005));}
      const nsrc=ctx.createBufferSource();nsrc.buffer=nb;
      const ng=ctx.createGain();ng.gain.setValueAtTime(0.4,t);ng.gain.exponentialRampToValueAtTime(0.001,t+0.025);
      nsrc.connect(ng);ng.connect(master);nsrc.start(t);nsrc.stop(t+0.025);
    }catch(e){}
  };

  // イコール: 明るく上昇する2音（確定感）
  window.playClickEq=function(){

      master.connect(lp);lp.connect(ctx.destination);
      [[0,520,0.06],[0.055,780,0.07]].forEach(([delay,freq,dur])=>{

        const g=ctx.createGain();g.gain.setValueAtTime(0.0,t+delay);g.gain.linearRampToValueAtTime(0.5,t+delay+0.008);g.gain.exponentialRampToValueAtTime(0.001,t+delay+dur);
        o.connect(g);g.connect(master);o.start(t+delay);o.stop(t+delay+dur+0.01);
      });

  };

  // NG: 短い下降音（無効入力）
  window.playClickNG=function(){
    if(!getSetting('soundFx',true))return;
    try{
      if(!_audioCtx)_audioCtx=new(window.AudioContext||window.webkitAudioContext)();

      const g=ctx.createGain();g.gain.setValueAtTime(0.0,t);g.gain.linearRampToValueAtTime(0.07,t+0.005);g.gain.exponentialRampToValueAtTime(0.001,t+0.12);
      o.connect(lp);lp.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+0.13);
    }catch(e){}
  };
})();



// ===== Supabase接続エラー表示・自動復旧 =====
// 背景: 以前はSupabase接続待ちが5秒でタイムアウトすると、未接続のまま
// ローカル限定IndexedDBのdbAll/dbPut/dbDelにフォールバックして起動していた。
// この間に保存したデータはSupabaseに一切送信されず、次回の同期(loadAll)で

// 対策として、未接続のまま絶対にデータの読み書きを行わず、接続できるまで待つ。

  const el=document.createElement('div');
  el.id='sb-conn-error';

// ===== iOS/iPadOS: ソフトウェアキーボード表示時のレイアウト崩れ対策 =====
// 【背景】
// 本アプリは .layout が height:100dvh / overflow:hidden の「シェル固定・内部だけ
// スクロール」設計（スクロールは .drawer-body 等の内部要素が担い、window/body
// レベルのスクロール位置は常に0であるべき）。
// ところが iPadOS はソフトウェアキーボードが出てもレイアウトビューポート
// （window.innerHeight / 100dvh）を縮めない。アプリは「まだ画面いっぱい使える」と
// 思ったまま、実際の可視領域（visualViewport）だけが縮む。その状態で WebKit が
// キャレットを見せようとページ全体を上へずらすため、ドロワーのヘッダごと画面外へ
// 押し上げられる。これが「iPadでコメント入力時に入力欄が右上最上部へ飛ぶ」正体。
//
// 【方針】
// 「見えている高さの真実は visualViewport ただ一つ」と決め、シェルの高さを
// CSS変数 --app-h 経由でそれに従属させる。最初からキーボードの上に正しく収まって
// いれば、WebKit がページをずらす動機自体がなくなる。
//
// 【撤去したもの】
// 以前はフォーカスのたびに .drawer-body へ 480px のスペーサーを差し込み、
// 150/350/600ms のタイマーで scrollTop を押し返していた。しかし
// getBoundingClientRect()（レイアウトビューポート基準）と visualViewport
// （ビジュアルビューポート基準）は座標系が異なるため、ページがずれている状態では
// 「まだ隠れている」と誤判定して押し続け、スペーサーが常に押せる余白を供給する
// せいで止まらなかった。イベント駆動の高さ制御に一本化してすべて撤去した。
// あわせて入力欄自体を position:sticky でスクロール下端に固定した（CSS .cm-composer）。
//
// 【スクロール補正を最小構成で復活させた理由（2026-08-17）】
// 上記だけでは足りなかった。シェルが縮んでも「スクロールコンテナの中身の位置」は
// そのままなので、キーボード出現前は見えていた入力欄が、縮んだ分だけ下へはみ出して
// 隠れる。スマホは可視領域が300px前後しか残らないため実害が大きい
// （タスク詳細のコメント・日時・メモが軒並みキーボードの裏に入って入力できない）。
// sticky が効くのはコメント入力欄だけで、しかもコメントセクション自体が可視領域の
// 下に出てしまえば止まらない。日時・メモにはそもそも効かない。
// そこで ensureFocusedVisible() を追加する。旧実装の暴走要因は取り除いてある：
//   - スペーサーを入れない（＝押せる余白を無限供給しない）
//   - スクロール量を実際のスクロール可能範囲でクランプする
//   - --app-h でシェル高＝visualViewport高、resetOuterScroll でページオフセット0を
//     保証しているので、getBoundingClientRect だけで判定でき座標系の食い違いが起きない
(function(){
  const vv=window.visualViewport;
  const root=document.documentElement;
  // キーボードとみなす最小の縮み量。iPadのフローティング/最小化キーボードでも
  // 100px程度は縮むので、ツールバー等の微小な変動とは区別できる。
  const KB_MIN=90;
  // キーボード表示中かどうか。CSS（html.kb-open）とスクロール補正の実行条件を兼ねる。
  let kbOpen=false;

  function isEditable(el){
    return !!el&&(el.tagName==='INPUT'||el.tagName==='TEXTAREA'||el.isContentEditable);
  }
  // WebKitが誤ってページ全体をずらした場合に備えた保険。
  // 外部キーボード接続時（オンスクリーンキーボードが出ないケース）にも効く。
  function resetOuterScroll(){
    if(window.scrollY!==0)window.scrollTo(0,0);
    if(root.scrollTop!==0)root.scrollTop=0;
    if(document.body.scrollTop!==0)document.body.scrollTop=0;
  }
  // 実際にスクロールを担っている最も近い祖先を返す。
  // クラス名（.drawer-body 等）を列挙すると、拡大モーダルや将来追加される
  // スクロール領域を取りこぼすため、計算済みスタイルから判定する。
  function scrollParent(el){
    let n=el.parentElement;
    while(n&&n!==document.body){
      const ov=getComputedStyle(n).overflowY;
      if((ov==='auto'||ov==='scroll')&&n.scrollHeight>n.clientHeight+1)return n;
      n=n.parentElement;
    }
    return null;
  }
  // フォーカス中の入力欄がキーボードの裏に隠れていたら、そのスクロールコンテナを
  // 必要な分だけ動かして可視領域に入れる。キーボード表示中のみ実行する。
  function ensureFocusedVisible(){
    if(!kbOpen)return;
    const el=document.activeElement;
    if(!isEditable(el))return;
    const box=scrollParent(el);
    if(!box)return;
    const br=box.getBoundingClientRect();
    const er=el.getBoundingClientRect();
    const GAP=8;
    let d=0;
    if(er.bottom+GAP>br.bottom){
      // 下にはみ出している分だけ下へスクロール。ただし入力欄の上端がコンテナ上端より
      // 上へ抜けない範囲までに制限する（メモのような背の高いtextareaで
      // 書き出し位置ごと画面外へ送ってしまわないため）。
      d=Math.min(er.bottom+GAP-br.bottom,Math.max(0,er.top-br.top-GAP));
    }else if(er.top<br.top){
      d=er.top-br.top-GAP; // 上にはみ出している場合は上へ戻す
    }
    if(!d)return;
    // 実際にスクロールできる範囲へクランプ。これがあるため、旧実装のように
    // 「隠れている」と誤判定し続けても際限なく動くことはない。
    const lo=-box.scrollTop;
    const hi=box.scrollHeight-box.clientHeight-box.scrollTop;
    box.scrollTop+=Math.max(lo,Math.min(d,hi));
  }
  function apply(){
    if(!vv)return;
    const hidden=window.innerHeight-vv.height;
    kbOpen=hidden>KB_MIN&&isEditable(document.activeElement);
    if(kbOpen){
      // キーボード表示中：シェルの高さを実際の可視領域に合わせる
      root.style.setProperty('--app-h',Math.round(vv.height)+'px');
    }else{
      // 通常時：CSS側の 100dvh / 100vh フォールバックへ戻す
      root.style.removeProperty('--app-h');
    }
    // CSS側で下部アクションバーの一時退避などに使う（.mob-action-bar / #dt-notes）
    root.classList.toggle('kb-open',kbOpen);
    resetOuterScroll();
  }
  // 高さ確定（--app-h の反映）を待ってからスクロール補正する。
  function applyThenReveal(){
    apply();
    requestAnimationFrame(ensureFocusedVisible);
  }
  if(vv){
    vv.addEventListener('resize',applyThenReveal);
    vv.addEventListener('scroll',apply);
  }
  document.addEventListener('focusin',e=>{
    if(!isEditable(e.target))return;
    resetOuterScroll();
    apply();
    requestAnimationFrame(ensureFocusedVisible);
    // キーボードが既に出ている状態で別の入力欄へ移った場合は visualViewport の
    // resize が発生しないため、focusin 側でも遅延して一度だけ補正する。
    // （キーボードのせり上がりアニメーションと、下部アクションバーが消えて
    //   レイアウトが変わるのを待つ）
    setTimeout(ensureFocusedVisible,300);
  },true);
  document.addEventListener('focusout',()=>{
    // フォーカスが別の入力欄へ移る場合は縮めたままにしたいので、次tickで判定する
    setTimeout(apply,0);
  },true);
  window.addEventListener('orientationchange',()=>setTimeout(applyThenReveal,0));
})();


// iOS慣性スクロールの「止めタップ」でアコーディオンが誤作動する問題の対策。
// drawer-bodyのスクロールを監視し、停止直後300ms以内のタップをガードする関数を公開。
(function(){
  let _t=0;
  document.addEventListener('scroll',()=>{
    if(document.querySelector('.drawer-body'))_t=Date.now();
  },{passive:true,capture:true});
  window._drawerScrolledRecently=()=>Date.now()-_t<300;
})();
async function init(){
  try{
    renderBotNav(); // ボトムナビを即時描画（データロード前）
    // openDB と Supabase待機を並列で開始（どちらも独立して実行可能）
    const dbPromise = openDB();
    // Supabase接続待ち：最大20秒（モバイル回線の低速時を考慮し5秒から延長）
    const sbPromise = new Promise(res=>{
      if(window._sbReady)return res();
      const t=Date.now();
      const iv=setInterval(()=>{
        if(window._sbReady||Date.now()-t>20000){clearInterval(iv);res()}
      },50);
    });
    await Promise.all([dbPromise, sbPromise]);

    // _sbReady かつ _SB（Supabaseクライアント）が揃って初めて「接続できた」とみなす。
    // どちらか欠けている状態でloadAll/seed等を実行すると、ローカル限定の
    // dbAll/dbPut/dbDelやuid未確定のSupabase関数が静かに失敗し、データ消失につながるため、
    // 接続できるまでは一切データの読み書きを行わない。
    const sbOk = !!(window._sbReady && window._SB);
    if(sbOk){
      hideConnError();
      // loadUserPlan・loadAll・loadNavOrder を並列実行（互いに依存しない）
      // seed は新規ユーザー用の初期データ挿入で軽量のため先行チェックのみ並列化
      await Promise.all([
        loadUserPlan(),
        loadAll(),
        loadNavOrder(),
      ]);
      // seed は loadAll 後（タスク存在確認が必要なため）、ただし非ブロッキング
      seed().catch(()=>{});
      // 招待トークンチェック（ログイン済みの場合はここで即処理）
      checkInviteToken();
      const _storedToken=localStorage.getItem('pendingInviteToken');
      if(_storedToken){
        localStorage.removeItem('pendingInviteToken');
        await joinWorkspaceByToken(_storedToken);
      }
      // 保存済みビューの有効性を検証（削除済みプロジェクト/タグへの参照を除去）
      if(S.view==='project'&&!S.projects.find(p=>p.id===S.projId)){S.view='inbox';S.projId=null;}
      if(S.view==='tag'&&S.tagId!=='__none__'&&!S.tags.find(t=>t.id===S.tagId)){S.view='inbox';S.tagId=null;}
      // 孤立サブタスクの自動修復（親タスクが存在しないparentTaskIdをnullに）
      (async()=>{
        const taskIds=new Set(S.tasks.map(t=>t.id));
        const orphans=S.tasks.filter(t=>t.parentTaskId&&!taskIds.has(t.parentTaskId));
        for(const t of orphans){
          t.parentTaskId=null;
          await dbPut('tasks',t);
        }
        if(orphans.length>0){
          console.log('[Taskra] 孤立サブタスクを修復:',orphans.length,'件');
          render();
        }
      })().catch(()=>{});
    } else {
      // サーバーに接続できない：データを読み書きせず、エラー表示＋自動再接続待ちに切り替える
      console.warn('[Taskra] Supabase未接続のためデータ読み込みを保留し、再接続を待ちます');
      showConnError();
      waitForSBAndRecover();
    }
    // ?note= URLパラメータからノートを開く
    const urlP=new URLSearchParams(location.search);
    const noteP=urlP.get('note');
    if(noteP&&S.notes.find(n=>n.id===noteP)){
      S.view='notes';S.noteId=noteP;S.noteOpen=true;
      history.replaceState(null,'',location.pathname);
      renderInstant();
      applySettings();
      setTimeout(()=>renderNoteDrawer(),150);
      if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
      return;
    }
    // ?task= URLパラメータからタスクを開く（プッシュ通知から起動した場合）
    const taskP=urlP.get('task');
    if(taskP){
      const found=S.tasks.find(t=>t.id===taskP);
      if(found){S.taskId=taskP;S.drawerOpen=true;}
      // ?view=today などと併用可能。historyだけ綺麗にする
      const _u=new URL(location.href);_u.searchParams.delete('task');
      history.replaceState(null,'',_u.pathname+(_u.search?'?'+_u.searchParams.toString():''));
    }
    // URLハッシュからタスクを開く
    const hash=location.hash.match(/^#task\/(.+)$/);
    if(hash){
      const id=hash[1];
      const found=S.tasks.find(t=>t.id===id);
      if(found){S.taskId=id;S.drawerOpen=true}
      else{
        // ハッシュをリセットしてトーストで通知
        history.replaceState(null,'',location.pathname);
        renderInstant();
        applySettings();
        setTimeout(()=>toast('タスクが見つかりませんでした'),500);
        if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
        return;
      }
    }
    renderInstant();
    applySettings();
    if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});

    // ===== アプリ起動中に #task/{id} ハッシュが変わったときの処理 =====
    // （LINEリンクなどでアプリが既に開いている場合に対応）
    window.addEventListener('hashchange',()=>{
      const h=location.hash.match(/^#task\/(.+)$/);
      if(h){
        const id=h[1];
        const t=(S.tasks||[]).find(x=>x.id===id);
        if(t){
          if(S.view==='notes'||S.view==='gantt'||S.view==='dashboard'||S.view==='forecast'||S.view==='review'||S.view==='search'){
            S.noteOpen=false;
            if(t.projectId){S.view='project';S.projId=t.projectId;}
            else{S.view='inbox';}
          }
          S.taskId=id;S.drawerOpen=true;
          history.replaceState(null,'',location.pathname);
          render();
        } else {
          history.replaceState(null,'',location.pathname);
          toast('タスクが見つかりませんでした');
        }
      }
    });

    // ===== BNAV 左右ボタン 長押し → 特殊アクション =====
    (()=>{
      const botnav=document.getElementById('botnav');
      if(!botnav)return;
      let _lpt=null,_lpmoved=false,_lpsx=0,_lpsy=0,_lptarget=null;
      const lockSel=()=>{document.documentElement.style.webkitUserSelect='none';document.documentElement.style.userSelect='none';};
      const unlockSel=()=>{document.documentElement.style.webkitUserSelect='';document.documentElement.style.userSelect='';};
      const _preventCtx=e=>{if(_lpt!=null)e.preventDefault();};
      document.addEventListener('contextmenu',_preventCtx,{passive:false});
      document.addEventListener('selectstart',e=>{if(_lpt!=null)e.preventDefault();},{passive:false});
      botnav.addEventListener('touchstart',e=>{
        const isPrev=e.target.closest('.bnav-prev');
        const isNext=e.target.closest('.bnav-next');
        if(!isPrev&&!isNext)return;
        _lptarget=isPrev?'prev':'next';
        _lpmoved=false;_lpsx=e.touches[0].clientX;_lpsy=e.touches[0].clientY;
        lockSel();
        _lpt=setTimeout(()=>{
          if(_lpmoved){unlockSel();return;}
          _lpt=null;unlockSel();
          playSE('toggle');
          if(_lptarget==='prev'){S.sidebarOpen=true;render();}
        },500);
      },{passive:true});
      botnav.addEventListener('touchmove',e=>{
        if(_lpt==null)return;
        if(Math.abs(e.touches[0].clientX-_lpsx)>8||Math.abs(e.touches[0].clientY-_lpsy)>8){
          _lpmoved=true;clearTimeout(_lpt);_lpt=null;unlockSel();
        }
      },{passive:true});
      const endLp=()=>{if(_lpt!=null){clearTimeout(_lpt);_lpt=null;}unlockSel();};
      botnav.addEventListener('touchend',endLp,{passive:true});
      botnav.addEventListener('touchcancel',endLp,{passive:true});
    })();

    // ===== BNAV 左右ボタン 長押しリピート =====
    (()=>{
      const doNavStep=(dir)=>{
        const seq=getNavSequence();
        if(!seq.length)return;
        const cur=getCurrentNavIdx(seq);
        const len=seq.length;
        let ni;
        if(dir==='prev') ni=cur<=0?len-1:cur-1;
        else ni=cur>=len-1?0:cur+1;
        const item=seq[ni];
        if(!item)return;
        S.taskId=null;S.drawerOpen=false;
        if(item.type==='view'){S.view=item.v;}
        else if(item.type==='proj'){S.view='project';S.projId=item.id;}
        else if(item.type==='tag'){S.view='tag';S.tagId=item.id;}
        playSE('toggle');render();
      };
      const prevBtn=botnav.querySelector('.bnav-prev');
      const nextBtn=botnav.querySelector('.bnav-next');
      attachLongPressRepeat(prevBtn, ()=>doNavStep('prev'));
      // ナビnext長押し：ナビ編集を開く
      attachLongPressRepeat(nextBtn, ()=>{playSE('toggle');openNavEdit();});
    })();

    // ===== BNAV アイコン長押し：現在フィルタ ON/OFF =====
    (()=>{
      let _lt=null,_lmoved=false,_lsx=0,_lsy=0;
      botnav.addEventListener('touchstart',e=>{
        const btn=e.target.closest('.bnav');
        if(!btn||e.target.closest('.bnav-prev')||e.target.closest('.bnav-next'))return;
        _lmoved=false;_lsx=e.touches[0].clientX;_lsy=e.touches[0].clientY;
        _lt=setTimeout(()=>{
          if(_lmoved)return;
          _lt=null;
          if(S.view==='inbox')return; // Inboxでは「現在」フィルタは無効。長押しでの誤作動（タスクが消えたように見える）を防止
          playSE('toggle');
          S.hideNotStarted=!S.hideNotStarted;
          renderTaskFilters();renderContent();
          toastTop(S.hideNotStarted?'現在フィルタ ON（開始前を除外）':'現在フィルタ OFF');
        },500);
      },{passive:true});
      botnav.addEventListener('touchmove',e=>{
        if(_lt==null)return;
        if(Math.abs(e.touches[0].clientX-_lsx)>8||Math.abs(e.touches[0].clientY-_lsy)>8){
          _lmoved=true;clearTimeout(_lt);_lt=null;
        }
      },{passive:true});
      const _end=()=>{if(_lt!=null){clearTimeout(_lt);_lt=null;}};
      botnav.addEventListener('touchend',_end,{passive:true});
      botnav.addEventListener('touchcancel',_end,{passive:true});
    })();
  }catch(err){
    console.error(err);
    document.getElementById('layout').innerHTML=
      '<div style="padding:40px;font-family:sans-serif"><h2 style="color:#4f46e5">エラーが発生しました</h2>'
      +'<pre style="font-size:12px;color:#666;margin-top:10px">'+esc(err&&err.message||String(err))+'</pre></div>';
  }
}
init();
</script>

    let _lastErrMsg='',_lastErrTs=0;
    // PostgRESTは1リクエストあたり最大1000行で打ち切られる。タスクが1000件を超えると
    // 超過分が読み込まれず、検索にも出ず「消えた」ように見える。.range()で全行をページ取得する。
    const _PAGE=1000;
    const _pageAll=async(makeQuery)=>{
      let from=0,out=[];
      for(;;){
        const{data,error}=await makeQuery().range(from,from+_PAGE-1);
        if(error){console.error('SB._pageAll',error);return from===0?null:out;}
        out=out.concat(data||[]);
        if(!data||data.length<_PAGE)break;
        from+=_PAGE;
      }
      return out;
    };
    window.dbAll=async s=>{
      const uid=window._currentUser?.id;
      if(!uid)return[];
      const rows=await _pageAll(()=>SB.from(s).select('*').eq('user_id',uid).order('id',{ascending:true}));
      if(rows===null){console.error('SB.dbAll',s,'page fetch failed');return[]}
      return rows.map(frDB);
    };
    window.dbAllNoFilter=async s=>{
      if(!window._currentUser?.id)return[];
      const rows=await _pageAll(()=>SB.from(s).select('*').order('id',{ascending:true}));
      if(rows===null){console.error('SB.dbAllNoFilter',s,'page fetch failed');return[]}
      return rows.map(frDB);
    };
    window.dbPut=async(s,i)=>{
      const uid=window._currentUser?.id;
      if(!uid)return;
      const row=toDB(i);
      row.user_id=uid;
      const{error}=await SB.from(s).upsert(row,{onConflict:'id'});
      if(error){
        console.error('SB.dbPut error',s,error);
        const msg='⚠ 同期エラー('+s+'): '+(error.message||JSON.stringify(error)).slice(0,60);
        const now2=Date.now();
        if(typeof toast==='function'&&(msg!==_lastErrMsg||now2-_lastErrTs>5000)){
          toast(msg);_lastErrMsg=msg;_lastErrTs=now2;
        }
      }
    };
    window.dbDel=async(s,id)=>{
      const{error}=await SB.from(s).delete().eq('id',id);
      if(error){console.error('SB.dbDel',s,error);if(typeof toast==='function')toast('⚠ 削除エラー: '+(error.message||'').slice(0,60));}
    };
    window._lastSelfSave=0;

    // app_settings: key-value同期（user_idでユーザーごとに分離）
    window.sbGetSetting=async(key)=>{
      const uid=window._currentUser?.id;
      if(!uid)return null;
      const{data}=await SB.from('app_settings').select('value').eq('user_id',uid).eq('key',key).maybeSingle();
      return data?data.value:null;
    };
    window.sbSetSetting=async(key,value)=>{
      const uid=window._currentUser?.id;
      if(!uid)return;
      await SB.from('app_settings').upsert({user_id:uid,key,value,updated_at:new Date().toISOString()},{onConflict:'user_id,key'});
    };

    // ===== 認証状態の管理 =====
    const loginScreen=document.getElementById('loginScreen');
    const showLogin=()=>{if(loginScreen)loginScreen.style.display='flex';};
    const hideLogin=()=>{if(loginScreen)loginScreen.style.display='none';};

    // Googleサインインボタン
    const signinBtn=document.getElementById('google-signin-btn');
    const loadingEl=document.getElementById('login-loading');
    const switchBtn=document.getElementById('google-switch-btn');
    const _doSignIn=async(selectAccount)=>{
      if(signinBtn)signinBtn.disabled=true;
      if(switchBtn)switchBtn.disabled=true;
      if(loadingEl)loadingEl.style.display='flex';
      const opts={redirectTo:location.origin+location.pathname};
      if(selectAccount)opts.queryParams={prompt:'select_account'};
      await SB.auth.signInWithOAuth({provider:'google',options:opts});
    };
    if(signinBtn)signinBtn.addEventListener('click',()=>_doSignIn(false));
    if(switchBtn)switchBtn.addEventListener('click',()=>_doSignIn(true));

    // 初回セッション確認（getSession()を正とする。onAuthStateChangeのINITIAL_SESSIONは使わない）
    const{data:{session}}=await SB.auth.getSession();
    window._currentUser=session?.user||null;
    if(window._currentUser){hideLogin();}else{showLogin();}
    window._sbReady=true;

    // 認証状態変化の監視（初回以降の変化のみ対応）
    SB.auth.onAuthStateChange((event,session)=>{
      if(event==='INITIAL_SESSION')return; // 初回はgetSession()で処理済み
      const prevUser=window._currentUser;
      window._currentUser=session?.user||null;
      if(event==='SIGNED_IN'){
        // supabase-jsはタブ復帰・トークン更新時にも SIGNED_IN を再発火することがある。
        // 同一ユーザーで既にロード済みならフルリロード＆全画面再描画をスキップ
        // （入力途中のコメント・メモが再描画で消えるのを防ぐ。データ同期は
        //  120秒ポーリング＋visibilitychange側の _syncNow が担う）
        if(prevUser&&session?.user&&prevUser.id===session.user.id)return;
        hideLogin();
        if(typeof loadUserPlan==='function')loadUserPlan().then(()=>{if(typeof renderSidebar==='function')renderSidebar();}).catch(()=>{});
        if(typeof loadAll==='function'&&typeof render==='function'){
          loadAll().then(async()=>{
            // 招待リンク経由でOAuth後にリロードされた場合はlocalStorageから復元して参加
            const _pt=localStorage.getItem('pendingInviteToken');
            if(_pt){
              localStorage.removeItem('pendingInviteToken');
              await joinWorkspaceByToken(_pt);
            } else {
              render();
            }
          }).catch(()=>{});
        }
      } else if(event==='SIGNED_OUT'){
        window._currentUser=null;
        showLogin();
      }
    });

    // ===== Realtimeサブスクリプション =====
    window._lastSync=0;
    const _syncNow=(force)=>{
      if(!window._currentUser)return;
      if(Date.now()-window._lastSelfSave<5000)return;
      if(!force&&Date.now()-window._lastSync<60000)return;
      // 入力途中の内容（コメント・メモ・タイトル等）がある間は再描画で消えるためスキップ。
      // フォーカス有無だけでなく「未保存の下書きの存在」で判定する（スクロールやアプリ切替で
      // フォーカスが外れた直後でも入力内容を守る）。次回周期で自動再試行される
      if(typeof hasUnsavedDraft==='function'&&hasUnsavedDraft())return;
      if(typeof loadAll==='function'&&typeof render==='function'){
        loadAll().then(()=>{window._lastSync=Date.now();render();}).catch(()=>{});
      }
    };
    // Realtimeサブスクリプションは無効化（Disk IO削減のため）
    // 120秒ポーリング＋visibilitychangeで同期を維持（60秒以内の再取得はスキップ）
    document.addEventListener('visibilitychange',()=>{
      if(document.visibilityState==='visible')_syncNow();
    });
    setInterval(()=>_syncNow(true),120000);

    // ===== IndexedDBからSupabaseへのインポート =====
    window.importFromIndexedDB=async()=>{
      const uid=window._currentUser?.id;
      if(!uid){toast('先にサインインしてください');return 0;}
      const stores=['tasks','projects','sections','tags'];
      let done=0;

      // 1. localStorage（f_tasks, f_projects…）から読み込み
      for(const s of stores){
        let items=[];
        try{items=JSON.parse(localStorage.getItem('f_'+s)||'[]')}catch(e){}
        console.log('localStorage '+s+':',items.length,'件');
        for(const item of items){
          const row=toDB(item);
          row.user_id=uid;
          const{error}=await SB.from(s).upsert(row,{onConflict:'id'});
          if(error){console.error('ls import error',s,error);}
          else done++;
        }
      }

      // 2. IndexedDB（focus-db）から読み込み
      await new Promise(resolve=>{
        const req=indexedDB.open('focus-db');
        req.onerror=()=>{console.warn('IndexedDB open failed');resolve();};
        req.onsuccess=async e=>{
          const db=e.target.result;
          for(const s of stores){
            if(!db.objectStoreNames.contains(s))continue;
            const items=await new Promise(r=>{
              const tx=db.transaction(s,'readonly');
              const req2=tx.objectStore(s).getAll();
              req2.onsuccess=()=>r(req2.result);
              req2.onerror=()=>r([]);
            });
            console.log('IndexedDB '+s+':',items.length,'件');
            for(const item of items){
              const row=toDB(item);
              row.user_id=uid;
              const{error}=await SB.from(s).upsert(row,{onConflict:'id'});
              if(error){console.error('idb import error',s,error);}
              else done++;
            }
          }
          db.close();
          resolve();
        };
      }).catch(()=>{});

      // 3. Supabaseに既にある未割当データ（user_id=null）をこのユーザーに帰属
      for(const s of stores){
        const{error}=await SB.from(s).update({user_id:uid}).is('user_id',null);
        if(error){console.log('claim null user_id error',s,error.message);}
        else console.log('claimed null rows in',s);
      }

      return done;
    };

    window._sbSetupDone=true; // ここまで到達したら正常に初期化完了

  }catch(e){
    console.error('Supabase init failed',e);
    // 以前はここで window._sbReady=true としていたが、初期化が失敗しているのに
    // 「準備完了」と偽の合図を出してしまい、init()側がdbAll/dbPut/dbDelが
    // Supabaseに繋がっていないまま処理を進めてデータ消失につながっていた。
    // 失敗時はreadyにせず、数秒後に自動で再試行する（CDN読み込み失敗・回線断などの一時的要因に対応）。
    setTimeout(setupSB,4000);
  }
}
setupSB();
})();
</script>
